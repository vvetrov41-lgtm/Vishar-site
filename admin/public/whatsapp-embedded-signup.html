<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Vishar CRM WhatsApp Setup</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #f6f6f6; }
    main { width: min(92vw, 560px); padding: 28px; border: 1px solid #333; border-radius: 18px; background: #1a1a1a; }
    h1 { margin-top: 0; font-size: 1.45rem; }
    p { line-height: 1.5; color: #ccc; }
    button { width: 100%; padding: 14px 18px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; background: #fff; color: #111; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 18px; min-height: 1.5em; color: #ddd; }
    .note { font-size: .9rem; color: #999; }
  </style>
</head>
<body>
  <main>
    <h1>Vishar CRM · WhatsApp Coexistence</h1>
    <p>This staging-only page launches Meta Embedded Signup for an existing WhatsApp Business app number.</p>
    <button id="connect" type="button" disabled>Loading Meta…</button>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="note">No authorization code, access token, WABA ID or phone-number ID is displayed, logged or persisted by this page.</p>
  </main>
  <script src="/whatsapp-embedded-signup.js" defer></script>
</body>
</html>
