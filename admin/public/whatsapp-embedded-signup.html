<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Vishar CRM WhatsApp Setup</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #f6f6f6; }
    main { width: min(92vw, 560px); padding: 28px; border: 1px solid #333; border-radius: 18px; background: #1a1a1a; }
    h1 { margin-top: 0; font-size: 1.45rem; }
    p { line-height: 1.5; color: #ccc; }
    button { width: 100%; padding: 14px 18px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; background: #fff; color: #111; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 18px; min-height: 1.5em; color: #ddd; }
    .note { font-size: .9rem; color: #999; }
  </style>
</head>
<body>
  <main>
    <h1>Vishar CRM · WhatsApp Coexistence</h1>
    <p>This staging-only page launches Meta Embedded Signup for an existing WhatsApp Business app number.</p>
    <button id="connect" type="button" disabled>Loading Meta…</button>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="note">No authorization code, access token, WABA ID or phone-number ID is displayed, logged or persisted by this page.</p>
  </main>

  <script>
    (() => {
      'use strict';
      const APP_ID = '1481226093843982';
      const CONFIG_ID = '4468652066715473';
      const button = document.getElementById('connect');
      const status = document.getElementById('status');
      const allowedOrigins = new Set(['https://www.facebook.com', 'https://web.facebook.com']);
      let embeddedEvent = null;

      function setStatus(message) {
        status.textContent = message;
      }

      window.addEventListener('message', (event) => {
        if (!allowedOrigins.has(event.origin)) return;
        let payload = event.data;
        if (typeof payload === 'string') {
          try { payload = JSON.parse(payload); } catch { return; }
        }
        if (!payload || typeof payload !== 'object' || payload.type !== 'WA_EMBEDDED_SIGNUP') return;
        embeddedEvent = typeof payload.event === 'string' ? payload.event : null;
        if (embeddedEvent === 'FINISH') setStatus('Meta onboarding finished. You can return to ChatGPT.');
        if (embeddedEvent === 'CANCEL') setStatus('Meta onboarding was cancelled.');
        if (embeddedEvent === 'ERROR') setStatus('Meta reported an onboarding error.');
      });

      window.fbAsyncInit = function () {
        if (!window.FB) {
          setStatus('Meta SDK did not initialise.');
          return;
        }
        window.FB.init({ appId: APP_ID, autoLogAppEvents: false, xfbml: false, version: 'v25.0' });
        button.disabled = false;
        button.textContent = 'Connect existing WhatsApp Business';
      };

      button.addEventListener('click', () => {
        if (!window.FB) {
          setStatus('Meta SDK is not ready yet.');
          return;
        }
        button.disabled = true;
        setStatus('Opening Meta…');
        window.FB.login((response) => {
          button.disabled = false;
          if (!response || !response.authResponse || !response.authResponse.code) {
            setStatus('Meta authorization was cancelled or did not return a code.');
            return;
          }
          // Deliberately do not print, store, transmit or persist the authorization code.
          if (embeddedEvent === 'FINISH') {
            setStatus('Meta onboarding finished. You can return to ChatGPT.');
          } else {
            setStatus('Meta authorization completed. Finish the WhatsApp onboarding window if it is still open.');
          }
        }, {
          config_id: CONFIG_ID,
          response_type: 'code',
          override_default_response_type: true,
          extras: {
            setup: {},
            featureType: 'whatsapp_business_app_onboarding',
            sessionInfoVersion: '3'
          }
        });
      });

      const script = document.createElement('script');
      script.async = true;
      script.defer = true;
      script.crossOrigin = 'anonymous';
      script.src = 'https://connect.facebook.net/en_US/sdk.js';
      script.onerror = () => setStatus('Could not load Meta SDK.');
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
