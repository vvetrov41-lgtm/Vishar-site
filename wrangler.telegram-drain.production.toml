name = "vishar-telegram-drain-production"
main = "workers/telegram-drain-worker.js"
compatibility_date = "2026-08-22"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "telegram.vishartattoo.com", zone_name = "vishartattoo.com", custom_domain = true, enabled = true, previews_enabled = false }
]

# One Worker owns Telegram delivery, the bounded Gmail shared scheduler dispatch,
# the generic automation-engine heartbeat, bounded enquiry AI dispatch, and the
# Telegram linking callback. The tracked production template is deliberately inert:
#   * Telegram scheduled delivery is disabled;
#   * Gmail shared scheduler dispatch is disabled;
#   * automation-engine ticks are disabled;
#   * enquiry AI shared dispatch is disabled;
#   * self-service linking is disabled;
#   * no cron or Service Binding exists in this file.
# The guarded production release generates the active scheduler config from this
# template. It preserves the already-live Gmail shared-cron contract, enables
# the backend-only automation heartbeat, and dispatches bounded enquiry AI to
# TattooAI through a production-only Service Binding on the same existing cron.
# No second cron is introduced.
# GMAIL_SERVICE -> vishar-gmail-production plus GMAIL_SHARED_DRAIN_ENABLED=true.
# TATTOOAI_SERVICE -> tattooai (EnquiryAiService) plus
# ENQUIRY_AI_SHARED_DRAIN_ENABLED=true. AI/Supabase model credentials remain on
# TattooAI and are never copied into this scheduler Worker.
#
# With TELEGRAM_LINKING_ENABLED=false every HTTP request returns 404, including
# the pre-provisioned Custom Domain. Linking can only be enabled by the separate
# explicit release gate; webhook registration remains a later, separate action.
#
# When linking is eventually activated, Telegram is configured to call only:
#   https://telegram.vishartattoo.com/webhook
# The Worker itself accepts only the exact /webhook path and verifies Telegram's
# X-Telegram-Bot-Api-Secret-Token header before parsing an update. Cloudflare
# Access must not be placed in front of that provider callback.


# Workers Logs: console output only. Every console line in this Worker is a
# task name with bounded codes and counts. Invocation logs stay off because
# they record request URLs and metadata, and the Telegram webhook path carries
# a secret.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false

[vars]
VISHAR_ENVIRONMENT = "production"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
CRM_ORIGIN = "https://crm.vishartattoo.com"
TELEGRAM_DRAIN_ENABLED = "false"
GMAIL_SHARED_DRAIN_ENABLED = "false"
AUTOMATION_TICK_ENABLED = "false"
ENQUIRY_AI_SHARED_DRAIN_ENABLED = "false"
# Derived client AI state rides the same existing cron and the same TattooAI
# Service Binding as the enquiry AI drain. It is switched separately so it can
# be turned on and off without disturbing enquiry intake, and so a failure in
# one is reported on its own rather than as an opaque scheduler error.
CRM_AGENT_SHARED_DRAIN_ENABLED = "false"
# Audit follow-up: WhatsApp outbound drain dispatched on this cron through
# WHATSAPP_SERVICE (the account has no spare cron trigger).
WHATSAPP_SHARED_DRAIN_ENABLED = "false"
# Instagram webhook subscription + token renewal, dispatched on this cron
# through INSTAGRAM_SERVICE (the Instagram Worker has no cron trigger).
INSTAGRAM_SHARED_MAINTENANCE_ENABLED = "false"
# Explicitly opt in to the separate Meta Ads CAPI outbox drain only after
# provisioning the artist-scoped production token and validating consent.
# This is not related to WhatsApp's meta_cloud_api integration.
META_ADS_DRAIN_ENABLED = "false"
# The read-only /needsme and /today digest. It sends nothing to a client, holds
# no date and moves no money; it requires TELEGRAM_LINKING_ENABLED as well,
# because it answers on the same webhook.
CRM_AGENT_TELEGRAM_DIGEST_ENABLED = "false"
# Telegram /today reads the deterministic Today pulse (service_telegram_today_pulse).
# Stays off until the pulse has production acceptance; /needsme is unaffected.
CRM_TODAY_PULSE_ENABLED = "false"
TELEGRAM_LINKING_ENABLED = "false"

# Required encrypted production Worker secrets are deliberately absent here.
# The automation heartbeat reuses SUPABASE_SECRET_KEY and adds no credential.
# Phase G keeps both legacy Artist bindings until the DB-backed shared-bot path
# has been proved in production, so rollback never depends on rewriting a chat:
#   SUPABASE_SECRET_KEY
#   ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION
#   ARTIST_TELEGRAM_KRISTINA_HPRODUCTION
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#
# GMAIL_SERVICE and TATTOOAI_SERVICE are Cloudflare Service Bindings, not
# secrets. They are generated only in the active deploy config. No Gmail
# OAuth/client/token/KV credential and no TattooAI model credential may be
# copied into this Worker.
#
# TELEGRAM_BOT_TOKEN is the one shared bot credential used only by DB-resolved
# destinations. TELEGRAM_WEBHOOK_SECRET authenticates the future /webhook
# callback. There is still no TELEGRAM_CHAT_ID global fallback: chat ids are
# resolved from crm_private.telegram_destinations or, during rollback, from the
# existing Artist-scoped encrypted bindings.
