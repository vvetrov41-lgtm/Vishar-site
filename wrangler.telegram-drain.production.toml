name = "vishar-telegram-drain-production"
main = "workers/telegram-drain-worker.js"
compatibility_date = "2026-05-25"
workers_dev = false
preview_urls = false

# Scheduled-only connector: no public route or Custom Domain is required.
# The tracked template is deliberately inert. The guarded production deploy
# generates an ephemeral config that enables Telegram plus the Gmail shared
# scheduler dispatch, adds one Service Binding, and preserves the existing exact
# five-minute cron. Gmail credentials and KV bindings stay on the Gmail Worker.

[vars]
VISHAR_ENVIRONMENT = "production"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
TELEGRAM_DRAIN_ENABLED = "false"
GMAIL_SHARED_DRAIN_ENABLED = "false"

# Required encrypted production Worker secrets are deliberately absent here.
# The deploy gate verifies the exact secret-name set before enabling the cron:
#   SUPABASE_SECRET_KEY
#   ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION
#   ARTIST_TELEGRAM_KRISTINA_HPRODUCTION
#
# Gmail adds no secret to this Worker. The generated production config binds
# GMAIL_SERVICE to vishar-gmail-production and calls only its bounded RPC drain.
# The two ARTIST_* names are derived deterministically from integration keys
# `vladimir-production` and `kristina-production`. There is no global Telegram
# fallback and no TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID binding on this Worker.
