name = "tattooai"
main = "workers/tattooai-entry.js"
compatibility_date = "2026-05-25"
workers_dev = true

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://vishartattoo.com,https://booking.vishartattoo.com,https://www.kristinavishar.com"
BOOKING_SOURCE_KEY = "vladimir-website"
BOOKING_FORM_VERSION = "booking-v1"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
VISHAR_ENVIRONMENT = "production"

# Model routing. Provider order per task and the model identifier per provider
# are configuration, not code: change them here (or override them as Worker
# variables) without touching the router. API keys are Worker SECRETS and are
# never declared in this file.
#
# Both live public chains end at `workers_ai`, the existing Cloudflare AI
# binding, so the site keeps working unchanged while DEEPSEEK_API_KEY is absent.
AI_ROUTE_CONCEPT_CONSULT = "deepseek,workers_ai"
AI_ROUTE_AFTERCARE_SUPPORT = "deepseek,workers_ai"
AI_ROUTE_TEXT_SUMMARIZATION = "deepseek,workers_ai"
AI_ROUTE_TEXT_CLASSIFICATION = "deepseek,openai"
AI_ROUTE_TEXT_EXTRACTION = "deepseek,openai"
AI_ROUTE_HIGH_QUALITY_REASONING = "openai,deepseek"
AI_ROUTE_VISION_REFERENCE_UNDERSTANDING = "qwen,openai"
AI_ROUTE_VISION_DOCUMENT_EXTRACTION = "qwen,openai"
AI_MODEL_DEEPSEEK_TEXT = "deepseek-chat"
AI_MODEL_QWEN_VISION = "qwen-vl-plus"
AI_MODEL_QWEN_TEXT = "qwen-plus"
AI_MODEL_OPENAI_TEXT = "gpt-4o-mini"
AI_MODEL_OPENAI_VISION = "gpt-4o-mini"
AI_MODEL_WORKERS_AI_TEXT = "@cf/meta/llama-3.1-8b-instruct-fast"

# A preview deploy is a separate Worker (`tattooai-preview`). Bindings are not
# inherited by Wrangler environments, so the existing AI routes are declared
# again rather than disappearing from a staging build. The preview workers.dev
# route is disabled so staging traffic can only enter through the reviewed
# Custom Domain protected by the vishartattoo.com zone controls.
[env.preview]
workers_dev = false

[env.preview.ai]
binding = "AI"

[env.preview.vars]
VISHAR_ENVIRONMENT = "preview"
