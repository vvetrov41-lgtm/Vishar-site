name = "tattooai"
main = "workers/tattooai-entry.js"
compatibility_date = "2026-05-25"
workers_dev = true

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://vishartattoo.com,https://booking.vishartattoo.com,https://www.kristinavishar.com"
BOOKING_SOURCE_KEY = "vladimir-website"
BOOKING_FORM_VERSION = "booking-v1"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
VISHAR_ENVIRONMENT = "production"

# Model routing. Provider order per task and the model identifier per tier are
# configuration, not code: change them here (or override them as Worker
# variables) without touching the router.
#
# The DeepSeek, Qwen and Llama tiers all execute on the `AI` binding declared
# above, so none of them needs an API key or an account outside Cloudflare. The
# only key in this system is the optional OPENAI_API_KEY, which is a Worker
# SECRET and is never declared in this file.
#
# Order reflects Workers AI pricing: Llama 8B is the cheap tier, DeepSeek V4
# Flash is the reasoning/long-context tier at roughly 3x the cost and requires
# the Workers Paid plan.
AI_ROUTE_CONCEPT_CONSULT = "workers_ai,deepseek"
AI_ROUTE_AFTERCARE_SUPPORT = "workers_ai,deepseek"
AI_ROUTE_TEXT_SUMMARIZATION = "deepseek,workers_ai"
AI_ROUTE_TEXT_CLASSIFICATION = "deepseek,workers_ai"
AI_ROUTE_TEXT_EXTRACTION = "deepseek,workers_ai"
AI_ROUTE_HIGH_QUALITY_REASONING = "deepseek,qwen"
AI_ROUTE_VISION_REFERENCE_UNDERSTANDING = "qwen,openai"
AI_ROUTE_VISION_DOCUMENT_EXTRACTION = "qwen,openai"
AI_MODEL_DEEPSEEK_TEXT = "@cf/deepseek-ai/deepseek-v4-flash-0731"
AI_MODEL_QWEN_VISION = "@cf/qwen/qwen3.8-27b"
AI_MODEL_QWEN_TEXT = "@cf/qwen/qwen3.8-27b"
AI_MODEL_OPENAI_TEXT = "gpt-4o-mini"
AI_MODEL_OPENAI_VISION = "gpt-4o-mini"
AI_MODEL_WORKERS_AI_TEXT = "@cf/meta/llama-3.1-8b-instruct-fast"

# Marks this build as willing to serve the operator probe at /internal/ai-router.
# It is NOT what opens the route: the route stays 404 until an
# AI_ROUTER_PROBE_TOKEN secret of at least 32 characters exists, and that secret
# is absent in steady state. The production probe workflow provisions an
# ephemeral one, reads it back, and deletes it in the same run.
AI_ROUTER_PROBE_ENABLED = "true"

# A preview deploy is a separate Worker (`tattooai-preview`). Bindings are not
# inherited by Wrangler environments, so the existing AI routes are declared
# again rather than disappearing from a staging build. The preview workers.dev
# route is disabled so staging traffic can only enter through the reviewed
# Custom Domain protected by the vishartattoo.com zone controls.
[env.preview]
workers_dev = false

[env.preview.ai]
binding = "AI"

[env.preview.vars]
VISHAR_ENVIRONMENT = "preview"
