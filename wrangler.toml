name = "tattooai"
main = "workers/tattooai-entry.js"
compatibility_date = "2026-05-25"
workers_dev = true

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://vishartattoo.com,https://booking.vishartattoo.com"
BOOKING_SOURCE_KEY = "vladimir-website"
BOOKING_FORM_VERSION = "booking-v1"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
VISHAR_ENVIRONMENT = "production"
CRM_AI_INTAKE_ENABLED = "true"
CRM_AI_IMAGES_ENABLED = "false"
AI_ROUTE_ENQUIRY_INTAKE = "qwen,workers_ai"

# Derived client AI state is enabled in production by explicit operator decision.
# The database carries its own switch in crm_private.crm_agent_config, so jobs
# still fail closed until the production schema and database switch are ready.
# Vision remains separately guarded by the database vision_enabled switch.
CRM_AGENT_ENABLED = "true"
CRM_AGENT_VISION_ENABLED = "true"
AI_ROUTE_CRM_CLIENT_STATE = "qwen,workers_ai"
AI_ROUTE_VISION_REFERENCE_EXTRACTION = "qwen,workers_ai"

# Model routing. Provider order per task and the model identifier per tier are
# configuration, not code: change them here (or override them as Worker
# variables) without touching the router.
#
# The deployed plan intentionally uses Qwen plus the Workers AI Llama/Gemma
# tier only. DeepSeek is not part of the production or preview route plan.
# The optional OpenAI adapter remains available for an explicitly configured
# future route, but is not required by the current production AI path.
#
# Llama handles short, high-volume text work. Qwen leads structured extraction,
# reasoning and vision work; Llama or Gemma on Workers AI provides the bounded
# fallback depending on modality.
AI_ROUTE_CONCEPT_CONSULT = "workers_ai,qwen"
AI_ROUTE_AFTERCARE_SUPPORT = "workers_ai,qwen"
AI_ROUTE_TEXT_SUMMARIZATION = "qwen,workers_ai"
AI_ROUTE_TEXT_CLASSIFICATION = "qwen,workers_ai"
AI_ROUTE_TEXT_EXTRACTION = "qwen,workers_ai"
AI_ROUTE_HIGH_QUALITY_REASONING = "qwen,workers_ai"
AI_ROUTE_VISION_REFERENCE_UNDERSTANDING = "qwen,workers_ai"
AI_ROUTE_VISION_DOCUMENT_EXTRACTION = "qwen,workers_ai"
AI_MODEL_QWEN_VISION = "@cf/qwen/qwen3.8-27b"
AI_MODEL_QWEN_TEXT = "@cf/qwen/qwen3.8-27b"
AI_MODEL_OPENAI_TEXT = "gpt-4o-mini"
AI_MODEL_OPENAI_VISION = "gpt-4o-mini"
AI_MODEL_WORKERS_AI_TEXT = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_MODEL_WORKERS_AI_VISION = "@cf/google/gemma-4-26b-a4b-it"

# Marks this build as willing to serve the operator probe at /internal/ai-router.
# It is NOT what opens the route: the route stays 404 until an
# AI_ROUTER_PROBE_TOKEN secret of at least 32 characters exists, and that secret
# is absent in steady state. The production probe workflow provisions an
# ephemeral one, reads it back, and deletes it in the same run.
AI_ROUTER_PROBE_ENABLED = "true"

# A preview deploy is a separate Worker (`tattooai-preview`). Bindings are not
# inherited by Wrangler environments, so the active AI routes are declared
# again rather than falling back to library defaults. The preview workers.dev
# route is disabled so staging traffic can only enter through the reviewed
# Custom Domain protected by the vishartattoo.com zone controls.
[env.preview]
workers_dev = false

[env.preview.ai]
binding = "AI"

[env.preview.vars]
VISHAR_ENVIRONMENT = "preview"
AI_ROUTE_ENQUIRY_INTAKE = "qwen,workers_ai"
AI_ROUTE_CRM_CLIENT_STATE = "qwen,workers_ai"
AI_ROUTE_VISION_REFERENCE_EXTRACTION = "qwen,workers_ai"
AI_ROUTE_CONCEPT_CONSULT = "workers_ai,qwen"
AI_ROUTE_AFTERCARE_SUPPORT = "workers_ai,qwen"
AI_ROUTE_TEXT_SUMMARIZATION = "qwen,workers_ai"
AI_ROUTE_TEXT_CLASSIFICATION = "qwen,workers_ai"
AI_ROUTE_TEXT_EXTRACTION = "qwen,workers_ai"
AI_ROUTE_HIGH_QUALITY_REASONING = "qwen,workers_ai"
AI_ROUTE_VISION_REFERENCE_UNDERSTANDING = "qwen,workers_ai"
AI_ROUTE_VISION_DOCUMENT_EXTRACTION = "qwen,workers_ai"
