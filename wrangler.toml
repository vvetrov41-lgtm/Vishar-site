name = "tattooai"
main = "workers/tattooai-entry.js"
compatibility_date = "2026-05-25"
workers_dev = true

# First-party public API host (audit M-8). The browser-facing booking form and
# AI tools call https://api.vishartattoo.com/. workers.dev stays enabled as the
# compatibility path for the server-side booking edges and cached pages until
# no legitimate caller depends on it.
routes = [
  { pattern = "api.vishartattoo.com", custom_domain = true }
]

# Per-IP public rate limits (audit M-8). namespace_id is a developer-chosen
# account-unique integer; it is not a Cloudflare object id.
[[ratelimits]]
name = "PUBLIC_WRITE_RATE_LIMIT"
namespace_id = "1007"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PUBLIC_READ_RATE_LIMIT"
namespace_id = "1008"
simple = { limit = 300, period = 60 }

# Direct browser semantic preflight is stricter than normal public writes.
# First-party booking proxies also limit per client; all Worker egress shares
# one "worker-egress" key here, because that address is common to every Worker.
[[ratelimits]]
name = "INTAKE_PREFLIGHT_RATE_LIMIT"
namespace_id = "1012"
simple = { limit = 10, period = 60 }

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://vishartattoo.com,https://booking.vishartattoo.com,https://www.kristinavishar.com"
BOOKING_SOURCE_KEY = "vladimir-website"
BOOKING_FORM_VERSION = "booking-v1"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
VISHAR_ENVIRONMENT = "production"
CRM_AI_INTAKE_ENABLED = "true"
CRM_AI_IMAGES_ENABLED = "false"
AI_ROUTE_ENQUIRY_INTAKE = "workers_ai,qwen"

# Derived client AI state is enabled in production by explicit operator decision.
# The database carries its own switch in crm_private.crm_agent_config, so jobs
# still fail closed until the production schema and database switch are ready.
# Vision remains separately guarded by the database vision_enabled switch.
CRM_AGENT_ENABLED = "true"
CRM_AGENT_VISION_ENABLED = "true"
# Phase 3 narrow client-state contract (20260924040000): the model returns
# semantic fields and one action from allowed_actions; stage and waiting side
# come from the deterministic layer. To roll back, set it to "v1" in a release:
# deploys use --keep-vars, so removing the line would leave "v2" in place.
CRM_AGENT_CONTRACT = "v2"
# Intake semantic preflight (optional clarity check before submit). On after
# the privacy gate (ZDR, data_collection deny, updated notice, approval on
# 2026-09-26) and the rate-limited edges (#905). It sends only the minimal
# project payload to the decision provider and fails open. Set explicitly
# because releases deploy with --keep-vars; "false" is the kill switch.
INTAKE_PREFLIGHT_ENABLED = "true"
INTAKE_PREFLIGHT_PROVIDER = "jev"
# Stale-brief convergence (Phase 6a), enabled after the Llama routing passed
# post-deploy acceptance. A refresh costs ~15-30 Neurons on Llama; the
# database dedupes to one sweep per client per day and caps the batch, so this
# bounds the extra spend. Unset (or 0) turns the sweep off.
CRM_BRIEF_CONVERGE_PER_HOUR = "8"
AI_ROUTE_CRM_CLIENT_STATE = "workers_ai,qwen"
AI_ROUTE_VISION_REFERENCE_EXTRACTION = "qwen,workers_ai"

# Model routing. Provider order per task and the model identifier per tier are
# configuration, not code: change them here (or override them as Worker
# variables) without touching the router.
#
# The deployed plan intentionally uses Qwen plus the Workers AI Llama/Gemma
# tier only. DeepSeek is not part of the production or preview route plan.
# The optional OpenAI adapter remains available for an explicitly configured
# future route, but is not required by the current production AI path.
#
# Chosen per task from the 2026-09-25 live eval (quality, failure rate, latency,
# Neurons): Llama leads enquiry intake and CRM client state with Qwen as the
# fallback; Qwen leads vision with Gemma (thinking off) as the fallback.
AI_ROUTE_CONCEPT_CONSULT = "workers_ai,qwen"
AI_ROUTE_AFTERCARE_SUPPORT = "workers_ai,qwen"
AI_ROUTE_TEXT_SUMMARIZATION = "qwen,workers_ai"
AI_ROUTE_TEXT_CLASSIFICATION = "qwen,workers_ai"
AI_ROUTE_TEXT_EXTRACTION = "qwen,workers_ai"
AI_ROUTE_HIGH_QUALITY_REASONING = "qwen,workers_ai"
AI_ROUTE_VISION_REFERENCE_UNDERSTANDING = "qwen,workers_ai"
AI_ROUTE_VISION_DOCUMENT_EXTRACTION = "qwen,workers_ai"
AI_MODEL_QWEN_VISION = "@cf/qwen/qwen3.8-27b"
# Qwen rejects the full enquiry JSON Schema (Workers AI 8007); the transport
# schema passed every intake check in the 2026-09-25 eval.
AI_QWEN_ENQUIRY_SCHEMA = "transport"
AI_MODEL_QWEN_TEXT = "@cf/qwen/qwen3.8-27b"
AI_MODEL_OPENAI_TEXT = "gpt-4o-mini"
AI_MODEL_OPENAI_VISION = "gpt-4o-mini"
AI_MODEL_WORKERS_AI_TEXT = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_MODEL_WORKERS_AI_VISION = "@cf/google/gemma-4-26b-a4b-it"

# Marks this build as willing to serve the operator probe at /internal/ai-router.
# It is NOT what opens the route: the route stays 404 until an
# AI_ROUTER_PROBE_TOKEN secret of at least 32 characters exists, and that secret
# is absent in steady state. The production probe workflow provisions an
# ephemeral one, reads it back, and deletes it in the same run.
AI_ROUTER_PROBE_ENABLED = "true"

# A preview deploy is a separate Worker (`tattooai-preview`). Bindings are not
# inherited by Wrangler environments, so the active AI routes are declared
# again rather than falling back to library defaults. The preview workers.dev
# route is disabled so staging traffic can only enter through the reviewed
# Custom Domain protected by the vishartattoo.com zone controls.
[env.preview]
workers_dev = false
# routes are inherited by environments; preview must never claim the
# production api.vishartattoo.com Custom Domain.
routes = []

[env.preview.ai]
binding = "AI"

[env.preview.vars]
VISHAR_ENVIRONMENT = "preview"
AI_ROUTE_ENQUIRY_INTAKE = "workers_ai,qwen"
AI_ROUTE_CRM_CLIENT_STATE = "workers_ai,qwen"
AI_QWEN_ENQUIRY_SCHEMA = "transport"
AI_ROUTE_VISION_REFERENCE_EXTRACTION = "qwen,workers_ai"
AI_ROUTE_CONCEPT_CONSULT = "workers_ai,qwen"
AI_ROUTE_AFTERCARE_SUPPORT = "workers_ai,qwen"
AI_ROUTE_TEXT_SUMMARIZATION = "qwen,workers_ai"
AI_ROUTE_TEXT_CLASSIFICATION = "qwen,workers_ai"
AI_ROUTE_TEXT_EXTRACTION = "qwen,workers_ai"
AI_ROUTE_HIGH_QUALITY_REASONING = "qwen,workers_ai"
AI_ROUTE_VISION_REFERENCE_UNDERSTANDING = "qwen,workers_ai"
AI_ROUTE_VISION_DOCUMENT_EXTRACTION = "qwen,workers_ai"
