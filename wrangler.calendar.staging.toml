name = "vishar-calendar-staging"
main = "workers/calendar-oauth.js"
compatibility_date = "2026-05-25"
workers_dev = false
routes = [
  { pattern = "calendar-staging.vishartattoo.com", custom_domain = true }
]

[vars]
VISHAR_ENVIRONMENT = "staging"
GOOGLE_OAUTH_REDIRECT_URI = "https://calendar-staging.vishartattoo.com/oauth/google/callback"
CRM_RETURN_URL = "https://vishar-crm-staging.pages.dev/#/appointments"
CRM_APPOINTMENTS_URL = "https://vishar-crm-staging.pages.dev/#/appointments"
CALENDAR_DRAIN_ENABLED = "false"

# Required encrypted secrets / environment bindings:
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# CALENDAR_TOKEN_ENCRYPTION_KEY (32 random bytes, base64url encoded)
# CALENDAR_OWNER_EMAILS
# CALENDAR_ACCESS_TEAM_DOMAIN (exact https://<team>.cloudflareaccess.com origin)
# CALENDAR_ACCESS_AUD (Calendar Access application AUD tag)
# VLADIMIR_ARTIST_ID
# VLADIMIR_GOOGLE_EMAIL
# KRISTINA_ARTIST_ID
# KRISTINA_GOOGLE_EMAIL
# SUPABASE_URL
# Exactly one of SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY
#
# Required KV bindings, supplied after the namespaces are created:
# CALENDAR_OAUTH_STATE  - short-lived PKCE, OAuth state and disconnect nonce records
# CALENDAR_OAUTH_TOKENS - AES-GCM encrypted refresh-token envelopes
