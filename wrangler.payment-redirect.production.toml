name = "vishar-payment-redirect-production"
main = "workers/payment-redirect.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

# Public personalized deposit links live on the existing first-party public
# origin. Only this exact path prefix is intercepted; the rest of the Pages site
# is not routed to this Worker.
routes = [
  { pattern = "vishartattoo.com/pay-by-bank-transfer/*", zone_name = "vishartattoo.com" }
]

[[ratelimits]]
name = "PAYMENT_REDIRECT_RATE_LIMIT"
namespace_id = "1201"
simple = { limit = 120, period = 60 }

[vars]
VISHAR_ENVIRONMENT = "production"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"

# Required encrypted secret, never tracked:
#   SUPABASE_SECRET_KEY
#
# The Worker exposes no generic Supabase table API. Its client can call only
# resolve_monzo_deposit_redirect, which is backend-only and returns a validated
# monzo.com reusable Easy Bank Transfer destination for an opaque public UUID.
