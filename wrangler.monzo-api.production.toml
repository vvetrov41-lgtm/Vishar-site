name = "vishar-monzo-api-production"
main = "workers/monzo-api-gateway.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "monzo.vishartattoo.com", zone_name = "vishartattoo.com", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "vishartattoo.com/pay-by-bank-transfer/*", zone_name = "vishartattoo.com" }
]

# Deliberately no [triggers] block. Nothing about this connector is scheduled;
# every code path is driven by an owner request, a provider callback, or a
# visitor opening one opaque personalized deposit link.
#
# Public surfaces are bounded to:
#   POST /webhooks/monzo/<43-128 char opaque key> on monzo.vishartattoo.com
#   GET  /pay-by-bank-transfer/<opaque UUID> on vishartattoo.com
# Everything else on the Monzo hostname — /health and every /oauth/monzo/*
# management, setup, status, account and disconnect route — remains owner-
# protected by Cloudflare Access and independently re-verified inside the
# Worker against MONZO_ACCESS_TEAM_DOMAIN, MONZO_ACCESS_AUD and
# MONZO_OWNER_EMAILS. The first-party payment route bypasses Monzo management
# handling and can only reach resolve_monzo_deposit_redirect through the narrow
# payment Supabase client.

[[kv_namespaces]]
binding = "MONZO_OAUTH_STATE"
id = "d169a7a09514481985ef5a2c85a641bc"

[[kv_namespaces]]
binding = "MONZO_OAUTH_TOKENS"
id = "f0a905f38e544139ac2f4bd8d7444c61"

[[kv_namespaces]]
binding = "MONZO_WEBHOOK_ROUTES"
id = "09a94dba732f41bbac401c7491a694be"

# KV namespace ids are account-scoped object identifiers, not credentials. The
# production namespaces above already exist and remain unchanged.

[[ratelimits]]
name = "MONZO_WEBHOOK_RATE_LIMIT"
namespace_id = "1102"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PAYMENT_REDIRECT_RATE_LIMIT"
namespace_id = "1201"
simple = { limit = 120, period = 60 }

# The webhook and payment redirect use separate counters. Both fail closed when
# their binding is unavailable. `namespace_id` values are developer-chosen
# limiter identifiers, not Cloudflare object ids or credentials.

[vars]
VISHAR_ENVIRONMENT = "production"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
MONZO_ACCESS_TEAM_DOMAIN = "https://vishar-site-pages.cloudflareaccess.com"
MONZO_ACCESS_AUD = "a5398f7b94c4b67846e9a5dbcf80bbbe138f1869786c08060f3466228d0718e1"
MONZO_OWNER_EMAILS = "vvetrov41@gmail.com"
MONZO_OAUTH_REDIRECT_URI = "https://monzo.vishartattoo.com/oauth/monzo/callback"
MONZO_CRM_RETURN_URL = "https://crm.vishartattoo.com/#/payments"
MONZO_WEBHOOK_BASE_URL = "https://monzo.vishartattoo.com"
MONZO_RECONCILIATION_ENABLED = "true"
VLADIMIR_ARTIST_ID = "a1111111-1111-4111-8111-111111111111"
KRISTINA_ARTIST_ID = "a2222222-2222-4222-8222-222222222222"

# Production reconciliation remains candidate-only. Incoming Monzo webhook
# bodies are untrusted hints and are re-fetched from Monzo before candidate
# creation. The payment redirect is navigation-only: it resolves a pending CRM
# request to a validated reusable Monzo URL and never writes the payment ledger
# or changes a request to paid.

# Required encrypted secrets, intentionally absent from this tracked file and
# already installed on the existing production Worker:
#   MONZO_OAUTH_CLIENT_ID
#   MONZO_OAUTH_CLIENT_SECRET
#   MONZO_TOKEN_ENCRYPTION_KEY
#   SUPABASE_SECRET_KEY
