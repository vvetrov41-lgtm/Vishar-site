name = "vishar-monzo-api-production"
main = "workers/monzo-api-gateway.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "monzo.vishartattoo.com", zone_name = "vishartattoo.com", custom_domain = true, enabled = true, previews_enabled = false }
]

# Deliberately no [triggers] block. Nothing about this connector is scheduled;
# every code path is driven by an owner request or a provider callback.
#
# The public surface of this Worker is exactly one path shape:
#   POST /webhooks/monzo/<43-128 char opaque key>
# Everything else — /health, and every /oauth/monzo/* management, setup, status,
# account and disconnect route — is owner-protected by the Cloudflare Access
# application on the bare hostname, and independently re-verified inside the
# Worker against MONZO_ACCESS_TEAM_DOMAIN, MONZO_ACCESS_AUD and
# MONZO_OWNER_EMAILS. Access bypass is scoped to the exact webhook path only;
# there is no host-wide bypass.

[[kv_namespaces]]
binding = "MONZO_OAUTH_STATE"
id = "d169a7a09514481985ef5a2c85a641bc"

[[kv_namespaces]]
binding = "MONZO_OAUTH_TOKENS"
id = "f0a905f38e544139ac2f4bd8d7444c61"

[[kv_namespaces]]
binding = "MONZO_WEBHOOK_ROUTES"
id = "09a94dba732f41bbac401c7491a694be"

# KV namespace ids are account-scoped object identifiers, not credentials, and
# the production namespaces above already exist. They are tracked here — rather
# than injected from the deployment environment as the Calendar connector does —
# so `wrangler deploy --strict` compares the complete intended production
# binding set, and so a release can never silently rebind the encrypted token
# store to a different namespace. `scripts/test-monzo-production-config.mjs`
# refuses the retained-staging namespace ids.
#
# MONZO_OAUTH_TOKENS holds AES-256-GCM envelopes keyed per artist. The
# encryption key itself is an encrypted Worker secret and is never tracked.

[[ratelimits]]
name = "MONZO_WEBHOOK_RATE_LIMIT"
namespace_id = "1102"
simple = { limit = 60, period = 60 }

# `namespace_id` is a developer-chosen positive integer naming this limiter
# within the account. It is not a Cloudflare object id and requires no
# provisioning. It is deliberately distinct from the Monzo staging limiter
# (1101) and the Calendar limiter (1001) so production webhook traffic never
# shares a counter with another surface.
#
# The gateway applies this limiter to every request on the webhook path,
# including while MONZO_RECONCILIATION_ENABLED is "false", and fails closed with
# 503 when the binding is missing or the limiter errors. One stable limiter key
# covers all opaque webhook routes, so rotating or probing webhook paths cannot
# buy a fresh budget.
#
# A Workers binding is used rather than a zone WAF rate-limiting rule because
# the Cloudflare Free zone allows exactly one such rule and it already protects
# unrelated booking, GPT Actions and Team admin surfaces.

[vars]
VISHAR_ENVIRONMENT = "production"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
MONZO_ACCESS_TEAM_DOMAIN = "https://vishar-site-pages.cloudflareaccess.com"
MONZO_ACCESS_AUD = "a5398f7b94c4b67846e9a5dbcf80bbbe138f1869786c08060f3466228d0718e1"
MONZO_OWNER_EMAILS = "vvetrov41@gmail.com"
MONZO_OAUTH_REDIRECT_URI = "https://monzo.vishartattoo.com/oauth/monzo/callback"
MONZO_CRM_RETURN_URL = "https://crm.vishartattoo.com/#/payments"
MONZO_WEBHOOK_BASE_URL = "https://monzo.vishartattoo.com"
MONZO_RECONCILIATION_ENABLED = "false"
VLADIMIR_ARTIST_ID = "a1111111-1111-4111-8111-111111111111"
KRISTINA_ARTIST_ID = "a2222222-2222-4222-8222-222222222222"

# MONZO_RECONCILIATION_ENABLED stays "false" for the initial production rollout.
# While it is not exactly "true" the webhook path is still rate limited and
# still resolves its route, but returns 503 `reconciliation_disabled` before
# reading the body. Turning it on only ever produces reconciliation
# *candidates*; no code path in this Worker marks a payment request or session
# paid, and manual payment recording remains authoritative.
#
# MONZO_ACCESS_AUD is the audience tag of the "Vishar Monzo production owner
# access" application. It is a public claim present in every Access JWT, not a
# secret, and pinning it here is what stops a token minted for another Access
# application from being replayed at this Worker.

# Required encrypted secrets, intentionally absent from this tracked file and
# installed directly on the Worker:
#   MONZO_OAUTH_CLIENT_ID          production Monzo confidential OAuth client
#   MONZO_OAUTH_CLIENT_SECRET
#   MONZO_TOKEN_ENCRYPTION_KEY     32 random bytes, base64url, distinct from staging
#   SUPABASE_SECRET_KEY            production Supabase service credential
#
# Monzo issues refresh tokens only to confidential clients, and permits exactly
# one active access token per user per client, so the production client must be
# registered as confidential and must not be shared with the staging Worker.
