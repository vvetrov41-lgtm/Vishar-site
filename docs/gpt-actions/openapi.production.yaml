openapi: 3.1.0
info:
  title: Vishar CRM Private Artist Actions
  version: 2.1.0-production
  description: >-
    Private OAuth-authenticated operational CRM actions for one artist. The artist
    is fixed by the OAuth client binding and cannot be selected in a request.
    CRM, finance and communications management are independently owner-enabled.
servers:
  - url: https://gpt-actions.vishartattoo.com
    description: Vishar CRM production action edge.
security:
  - supabaseOAuth: [email]
paths: {}
components:
  securitySchemes:
    supabaseOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://gpt-actions.vishartattoo.com/oauth/authorize
          tokenUrl: https://gpt-actions.vishartattoo.com/oauth/token
          scopes:
            email: Authenticate the CRM user. CRM membership, fixed OAuth artist binding and operation capabilities remain authoritative.
