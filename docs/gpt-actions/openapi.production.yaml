components:
  securitySchemes:
    supabaseOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://gpt-actions.vishartattoo.com/oauth/authorize
          tokenUrl: https://gpt-actions.vishartattoo.com/oauth/token
          scopes:
            email: Authenticate the CRM user. CRM membership, fixed OAuth artist binding and operation capabilities remain authoritative.
  schemas:
    ClientEditableFields:
      type: object
      additionalProperties: false
      properties:
        full_name: {type: string, maxLength: 160}
        email: {type: string, maxLength: 320}
        phone: {type: string, maxLength: 80}
        instagram: {type: string, maxLength: 80}
        preferred_contact: {type: string, maxLength: 40}
        travelling_from: {type: string, maxLength: 160}
    EnquiryStatus:
      type: string
      enum: [new, reviewing, waiting_for_client, accepted, declined, quote_sent, deposit_requested, deposit_paid, converted, closed]
    ProjectStatus:
      type: string
      enum: [draft, active, on_hold, completed, cancelled]
    DepositStatus:
      type: string
      enum: [not_required, requested, paid, refunded, forfeited]
    FollowUpStatus:
      type: string
      enum: [open, done, cancelled]
    AppointmentStatus:
      type: string
      enum: [draft, proposed, confirmed, completed, cancelled, no_show]
    PaymentRequestStatus:
      type: string
      enum: [pending, partially_paid, paid, cancelled, expired]
    EnquiryEditableFields:
      type: object
      additionalProperties: false
      properties:
        project_type: {type: string, maxLength: 100}
        placement: {type: string, maxLength: 160}
        approximate_size: {type: string, maxLength: 120}
        cover_up: {type: string, maxLength: 40}
        preferred_timing: {type: string, maxLength: 160}
        idea: {type: string, maxLength: 4000}
    ScheduleAppointmentRequest:
      type: object
      additionalProperties: false
      required: [request_id, client_id, appointment_type, start_at, end_at]
      properties:
        request_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        appointment_type: {type: string, enum: [tattoo_session, in_person_consultation, video_consultation, touch_up]}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        status: {type: string, enum: [draft, proposed, confirmed], default: proposed}
        enquiry_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        notes: {type: string, maxLength: 4000}
    AvailabilityRequest:
      type: object
      additionalProperties: false
      required: [block_kind, start_at, end_at]
      properties:
        block_kind: {type: string, enum: [day_off, holiday, personal, other]}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        is_all_day: {type: boolean, default: false}
        note: {type: string, maxLength: 500}
