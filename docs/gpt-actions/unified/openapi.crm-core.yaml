        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artist_id]
              properties: {artist_id: {type: string, format: uuid}}
      responses: {'200': {description: Updated active artist context}, '403': {description: The CRM user is not authorized for that artist}}
