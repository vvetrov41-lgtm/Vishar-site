        For a GPT bound to one artist this always returns that artist. For the
        shared Vishar GPT it returns exactly the artists the signed-in CRM user
        currently has access to, and asks for a choice when there is more than
        one.
      responses: {'200': {description: Available artists and the active artist context}}
