name = "vishar-gpt-actions-staging"
main = "workers/gpt-actions-staging.js"
compatibility_date = "2026-08-07"
workers_dev = false

# Retained staging stays fail-closed by default. OAuth relay and PKCE bridge are
# independently enabled only by guarded staging workflows. Appointment actions
# remain disabled in source defaults and production is not targeted here.
[vars]
GPT_ACTIONS_ENABLED = "false"
GPT_OAUTH_RELAY_ENABLED = "false"
GPT_OAUTH_PKCE_BRIDGE_ENABLED = "false"
SUPABASE_URL = "https://gwaliusblwrzisrwnsvs.supabase.co"

[secrets]
required = ["GPT_OAUTH_BRIDGE_KEY"]
