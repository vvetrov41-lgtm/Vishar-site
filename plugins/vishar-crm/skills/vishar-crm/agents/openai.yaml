interface:
  display_name: "Vishar CRM"
  short_description: "Review and manage Vishar CRM."
  default_prompt: "Show me what needs my attention in Vishar CRM today."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "vishar-crm"
      description: "Read and manage Vishar CRM through the signed-in user's bounded permissions."
      transport: "streamable_http"
      url: "https://mcp.vishartattoo.com/mcp"