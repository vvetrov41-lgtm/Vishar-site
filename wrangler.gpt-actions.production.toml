name = "vishar-gpt-actions-production"
main = "workers/gpt-actions-production-full.js"
compatibility_date = "2026-08-16"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "gpt-actions.vishartattoo.com", custom_domain = true },
  { pattern = "gpt-operations.vishartattoo.com", custom_domain = true },
  { pattern = "gpt-communications.vishartattoo.com", custom_domain = true }
]

[[services]]
binding = "GMAIL_SERVICE"
service = "vishar-gmail-production"

[[services]]
binding = "CLOUDFLARE_GATEWAY"
service = "vishar-cloudflare-gateway"

[[ratelimits]]
name = "GPT_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Tracked production configuration is deliberately inert. The guarded production
# workflow supplies the production publishable key and may enable the OAuth relay
# first. Operational CRM capabilities are database-gated independently per artist.
# Web Research and Cloudflare control have additional fail-closed switches; every
# tracked feature default remains off until the separate reviewed rollout stage.
[vars]
VISHAR_ENVIRONMENT = "production"
GPT_ACTIONS_ENABLED = "false"
GPT_OAUTH_RELAY_ENABLED = "false"
WEB_RESEARCH_ENABLED = "false"
WEB_RESEARCH_SEARCH_ENABLED = "false"
WEB_RESEARCH_SCRAPE_ENABLED = "false"
CLOUDFLARE_CONTROL_ENABLED = "false"
CLOUDFLARE_CONTROL_READ_ENABLED = "false"
CLOUDFLARE_CONTROL_WRITE_ENABLED = "false"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
