name = "vishar-booking-host-production"
main = "workers/booking-host-production.js"
compatibility_date = "2026-05-25"
workers_dev = false
preview_urls = false

# Public, credential-free booking frontend. The Worker mirrors only the booking
# and privacy pages plus their required static assets, relays the exact current
# multipart booking payload to the canonical production intake, and exposes the
# branded appointment client-action path through a fixed first-party proxy.
#
# The production Custom Domain is intentionally NOT declared as a Wrangler
# route. It is an existing account-level Workers Custom Domain:
#   booking.vishartattoo.com -> vishar-booking-host-production
# Keeping domain ownership out of routine code deploys prevents a source update
# from mutating DNS or routing.

# Optional semantic preflight is rate-limited at the originating client edge.
# Limiter failure disables only the semantic check; the real enquiry still submits.
[[ratelimits]]
name = "HOSTED_FORM_PREFLIGHT_RATE_LIMIT"
namespace_id = "1009"
simple = { limit = 10, period = 60 }
