name = "vishar-team-admin-production"
main = "workers/team-admin.js"
compatibility_date = "2026-05-25"
workers_dev = false
preview_urls = false

routes = [
  {
    pattern = "team.vishartattoo.com"
    zone_name = "vishartattoo.com"
    custom_domain = true
    enabled = true
    previews_enabled = false
  }
]

# Dedicated production configuration for the narrow Team admin Worker.
#
# It exists because the gated production workflow deploys with `--strict`, and
# `--strict` compares the generated local configuration against the deployed
# Worker. Reusing `wrangler.team-admin.toml` and overriding only `--name`
# produced a permanent conflict: the local config still declared the
# non-production `name`, and omitting `preview_urls` made the local config
# default to `true` while the deployed Worker correctly had it disabled.
#
# The Worker's production Custom Domain (team.vishartattoo.com) was
# provisioned once, outside this workflow, directly against the Cloudflare
# dashboard. That created route-level `--strict` conflicts: the deployed Worker
# carries the route plus dashboard-owned route flags, so omitting either the
# route or its flags made every deploy read as "change the production route"
# and abort. The route and its flags are declared here, matching the
# pre-provisioned Custom Domain exactly, so `--strict` stays enabled and a
# future accidental route change is still caught instead of silently applied.
#
# Deliberately no environment values. The deployment must supply
# CRM_ALLOWED_ORIGIN, CRM_INVITE_REDIRECT_URL, SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY as plain vars plus an encrypted SUPABASE_SECRET_KEY
# that already exists on the Worker.
