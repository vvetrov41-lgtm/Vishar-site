name = "vishar-mcp-production"
main = "workers/vishar-mcp.js"
compatibility_date = "2026-08-22"
workers_dev = false
preview_urls = false

# Production MCP resource server. Unlike the dormant config this one carries a
# dedicated custom domain, a per-actor rate limit and the publishable Supabase
# key needed for actor-scoped RLS reads.
#
# Activation flags stay "false" in tracked config. The guarded rollout turns
# them on at deploy time only after fail-closed validation, so a plain
# `wrangler deploy` from this file can never enable MCP by itself.
routes = [
  { pattern = "mcp.vishartattoo.com", custom_domain = true }
]

[[ratelimits]]
name = "MCP_RATE_LIMIT"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# The full Plugin MCP surface reuses the already-audited GPT Action worker via
# a Cloudflare service binding. No provider secret or Supabase service role is
# copied into the MCP worker. The binding is inert while the Plugin flag is off.
[[services]]
binding = "GPT_ACTIONS_SERVICE"
service = "vishar-gpt-actions-production"

[vars]
VISHAR_ENVIRONMENT = "production"
MCP_PUBLIC_HOST = "mcp.vishartattoo.com"
MCP_ENABLED = "false"
MCP_PLUGIN_TOOLS_ENABLED = "false"
MCP_GMAIL_TOOLS_ENABLED = "false"
MCP_META_TOOLS_ENABLED = "false"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"