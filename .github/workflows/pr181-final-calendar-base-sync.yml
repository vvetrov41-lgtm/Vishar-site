name: PR181 final Calendar base sync

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.number == 181 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/calendar-connections-ui' &&
      contains(github.event.pull_request.body || '', '[run-pr181-final-calendar-base-sync]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Merge the exact current PR180 head
        run: |
          set -euo pipefail
          start_sha="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$start_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=200 origin \
            agent/calendar-connections-ui \
            agent/google-calendar-oauth-connector
          test "$(git rev-parse origin/agent/calendar-connections-ui)" = "$start_sha"
          base_sha="$(git rev-parse origin/agent/google-calendar-oauth-connector)"
          test "$base_sha" = "bfc1c6ef85f0bc672864a0daaf6baaafe246a6be"

          set +e
          git merge --no-ff --no-commit "$base_sha"
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v '^wrangler.calendar.staging.toml$' || true)"
          test -z "$unexpected"
          if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
            exit 1
          fi
          if printf '%s\n' "$conflicts" | grep -qx 'wrangler.calendar.staging.toml'; then
            git checkout --ours wrangler.calendar.staging.toml
            git add wrangler.calendar.staging.toml
          fi

          grep -Fq 'CRM_RETURN_URL = "https://vishar-crm-staging.pages.dev/#/integrations/calendar"' wrangler.calendar.staging.toml
          grep -Fq 'CRM_APPOINTMENTS_URL = "https://vishar-crm-staging.pages.dev/#/appointments"' wrangler.calendar.staging.toml
          rm .github/workflows/pr181-final-calendar-base-sync.yml
          git add .github/workflows/pr181-final-calendar-base-sync.yml
          git commit -m "Sync Calendar Connections with final OAuth connector head"
          git push --force-with-lease=refs/heads/agent/calendar-connections-ui:"$start_sha" origin HEAD:agent/calendar-connections-ui
