name: PR 185 fix nanoid lockfiles

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pr185-fix-nanoid-lockfiles
  cancel-in-progress: false

jobs:
  fix-nanoid-lockfiles:
    if: >-
      github.event.pull_request.number == 185 &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, '<!-- FIX_PR185_NANOID_LOCKFILES -->')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      BRANCH: agent/gpt-appointment-actions

    steps:
      - name: Fail-closed PR guard
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$APPROVED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .action == "edited"
            and (.pull_request.body | contains("<!-- FIX_PR185_NANOID_LOCKFILES -->"))
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.number == 185
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == "agent/appointment-five-minute-step"
            and .pull_request.head.ref == "agent/gpt-appointment-actions"
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
          ' "$GITHUB_EVENT_PATH" >/dev/null

      - name: Checkout exact PR branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git branch --show-current)" = "$BRANCH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Update only vulnerable nanoid lock entries
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/root-lock-before.json"
          cp admin/package-lock.json "$RUNNER_TEMP/admin-lock-before.json"

          test "$(jq -r '.packages["node_modules/nanoid"].version' package-lock.json)" = "3.3.16"
          test "$(jq -r '.packages["node_modules/nanoid"].version' admin/package-lock.json)" = "3.3.16"

          npm update nanoid --package-lock-only --ignore-scripts
          (
            cd admin
            npm update nanoid --package-lock-only --ignore-scripts
          )

          git diff --exit-code -- package.json admin/package.json

          echo "root_nanoid=$(jq -r '.packages["node_modules/nanoid"].version' package-lock.json)"
          echo "admin_nanoid=$(jq -r '.packages["node_modules/nanoid"].version' admin/package-lock.json)"
          echo "root_changed_package_entries:"
          jq -nr --slurpfile b "$RUNNER_TEMP/root-lock-before.json" --slurpfile a package-lock.json '
            ($b[0].packages) as $bp
            | ($a[0].packages) as $ap
            | (($bp | keys) + ($ap | keys) | unique)[] as $k
            | select($bp[$k] != $ap[$k])
            | "\($k)\t\($bp[$k].version // "<missing>") -> \($ap[$k].version // "<missing>")"
          '
          echo "admin_changed_package_entries:"
          jq -nr --slurpfile b "$RUNNER_TEMP/admin-lock-before.json" --slurpfile a admin/package-lock.json '
            ($b[0].packages) as $bp
            | ($a[0].packages) as $ap
            | (($bp | keys) + ($ap | keys) | unique)[] as $k
            | select($bp[$k] != $ap[$k])
            | "\($k)\t\($bp[$k].version // "<missing>") -> \($ap[$k].version // "<missing>")"
          '

          jq 'del(.packages["node_modules/nanoid"])' "$RUNNER_TEMP/root-lock-before.json" > "$RUNNER_TEMP/root-before-without-nanoid.json"
          jq 'del(.packages["node_modules/nanoid"])' package-lock.json > "$RUNNER_TEMP/root-after-without-nanoid.json"
          cmp "$RUNNER_TEMP/root-before-without-nanoid.json" "$RUNNER_TEMP/root-after-without-nanoid.json"

          jq 'del(.packages["node_modules/nanoid"])' "$RUNNER_TEMP/admin-lock-before.json" > "$RUNNER_TEMP/admin-before-without-nanoid.json"
          jq 'del(.packages["node_modules/nanoid"])' admin/package-lock.json > "$RUNNER_TEMP/admin-after-without-nanoid.json"
          cmp "$RUNNER_TEMP/admin-before-without-nanoid.json" "$RUNNER_TEMP/admin-after-without-nanoid.json"

          test "$(jq -r '.packages["node_modules/nanoid"].version' package-lock.json)" = "3.3.18"
          test "$(jq -r '.packages["node_modules/nanoid"].version' admin/package-lock.json)" = "3.3.18"

          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "admin/package-lock.json"
          test "${changed[1]}" = "package-lock.json"

      - name: Verify clean audits and focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run validate:site
          npm run test:booking
          npm run test:worker
          npm run scan:secrets

          cd admin
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run typecheck
          npm run build

      - name: Commit only lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "admin/package-lock.json"
          test "${changed[1]}" = "package-lock.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json admin/package-lock.json
          git commit -m "chore: update nanoid lockfiles"
          git push origin "HEAD:$BRANCH"
