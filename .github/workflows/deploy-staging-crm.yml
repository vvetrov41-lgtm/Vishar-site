name: Deploy staging CRM preview
# Triggered after staging Supabase browser credentials were provisioned.

on:
  push:
    branches:
      - claude/vishar-crm-booking-infra-c188bx
    paths:
      - .github/workflows/deploy-staging-crm.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-staging-crm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved application commit
        uses: actions/checkout@v4
        with:
          ref: 2961452472d099aab75ca3522a7a2f8c3615e360

      - name: Verify staging-only configuration exists
        id: config
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -u

          url_present=false
          url_shape=missing
          key_present=false
          key_kind=missing

          if [ -n "$VITE_SUPABASE_URL" ]; then
            url_present=true
            case "$VITE_SUPABASE_URL" in
              https://*.supabase.co) url_shape=hosted_root ;;
              https://*.supabase.co/) url_shape=hosted_root_with_trailing_slash ;;
              https://*.supabase.co/*) url_shape=hosted_with_path ;;
              *) url_shape=invalid ;;
            esac
          fi

          if [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            key_present=true
            case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
              sb_publishable_*) key_kind=publishable ;;
              sb_secret_*) key_kind=secret ;;
              eyJ*) key_kind=jwt_like ;;
              *) key_kind=other ;;
            esac
          fi

          {
            echo "url_present=$url_present"
            echo "url_shape=$url_shape"
            echo "key_present=$key_present"
            echo "key_kind=$key_kind"
          } >> "$GITHUB_OUTPUT"

          if [ "$url_shape" != hosted_root ]; then
            echo 'STAGING_SUPABASE_URL must be the hosted staging project root URL without a trailing slash or path.' >&2
            exit 1
          fi

          if [ "$key_kind" != publishable ]; then
            echo 'STAGING_SUPABASE_PUBLISHABLE_KEY must be a publishable key and must not be a secret or JWT-like key.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install pinned CRM dependencies
        working-directory: admin
        run: npm ci

      - name: Build isolated CRM artifact
        id: build
        working-directory: admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify private staging artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f admin/dist/index.html
          test -f admin/dist/_headers
          grep -Fq 'noindex' admin/dist/index.html
          if grep -R -Fq 'sb_secret_' admin/dist; then
            echo 'Privileged Supabase key marker found in browser artifact' >&2
            exit 1
          fi
          if grep -R -Fq 'service_role' admin/dist; then
            echo 'Service-role marker found in browser artifact' >&2
            exit 1
          fi

      - name: Deploy CRM artifact to staging Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy admin/dist
          --project-name vishar-crm-staging
          --branch main
          --commit-dirty=true

      - name: Record staging deployment result on PR #176
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          CONFIG_STATUS: ${{ steps.config.outcome }}
          URL_PRESENT: ${{ steps.config.outputs.url_present }}
          URL_SHAPE: ${{ steps.config.outputs.url_shape }}
          KEY_PRESENT: ${{ steps.config.outputs.key_present }}
          KEY_KIND: ${{ steps.config.outputs.key_kind }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          ARTIFACT_STATUS: ${{ steps.artifact.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
        run: |
          gh pr comment 176 --repo "$GH_REPO" --body "<!-- staging-crm-deploy-result -->
          ### Staging CRM deployment

          - Job: **${JOB_STATUS}**
          - Staging configuration check: \`${CONFIG_STATUS}\`
          - Supabase URL present: \`${URL_PRESENT:-unknown}\`
          - Supabase URL shape: \`${URL_SHAPE:-unknown}\`
          - Publishable key present: \`${KEY_PRESENT:-unknown}\`
          - Key classification: \`${KEY_KIND:-unknown}\`
          - CRM build: \`${BUILD_STATUS}\`
          - Browser artifact safety check: \`${ARTIFACT_STATUS}\`
          - Cloudflare Pages deployment: \`${DEPLOY_STATUS}\`
          - Approved application SHA: \`2961452472d099aab75ca3522a7a2f8c3615e360\`

          No secret value is included in this diagnostic. The workflow targets only \`vishar-crm-staging\`."
