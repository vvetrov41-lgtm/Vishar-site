name: Patch known Russian values

on:
  push:
    branches:
      - claude/vishar-crm-booking-infra-c188bx
    paths:
      - .github/workflows/patch-known-russian-values.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/vishar-crm-booking-infra-c188bx
          fetch-depth: 0

      - name: Localise known submitted and system values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          format_path = Path('admin/src/lib/format.ts')
          text = format_path.read_text()
          marker = "export function initials(name: string | null | undefined): string {"
          helper = """export function localiseKnownValue(\n  value: string | null | undefined,\n  language: Language = 'en'\n): string {\n  if (!value) return '—';\n  const normalised = value.trim().toLocaleLowerCase(language === 'ru' ? 'ru-RU' : 'en-GB');\n  const values: Record<Language, Record<string, string>> = {\n    en: {\n      email: 'Email',\n      'электронная почта': 'Email',\n      phone: 'Phone',\n      telephone: 'Phone',\n      телефон: 'Phone',\n      yes: 'Yes',\n      да: 'Yes',\n      true: 'Yes',\n      no: 'No',\n      нет: 'No',\n      false: 'No',\n    },\n    ru: {\n      email: 'Электронная почта',\n      'электронная почта': 'Электронная почта',\n      phone: 'Телефон',\n      telephone: 'Телефон',\n      телефон: 'Телефон',\n      yes: 'Да',\n      да: 'Да',\n      true: 'Да',\n      no: 'Нет',\n      нет: 'Нет',\n      false: 'Нет',\n    },\n  };\n  return values[language][normalised] ?? value;\n}\n\nexport function localiseSystemSubject(value: string, language: Language = 'en'): string {\n  if (value === 'Chase this enquiry' || value === 'Связаться по этой заявке') {\n    return language === 'ru' ? 'Связаться по этой заявке' : 'Chase this enquiry';\n  }\n  return value;\n}\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('format insertion point missing')
          if 'export function localiseKnownValue' in text:
              raise SystemExit('format helpers already exist')
          format_path.write_text(text.replace(marker, helper + marker))

          enquiry_path = Path('admin/src/pages/EnquiryDetailPage.tsx')
          text = enquiry_path.read_text()
          replacements = [
            (
              "import { formatDateTime, relativeDue } from '../lib/format';",
              "import { formatDateTime, localiseKnownValue, localiseSystemSubject, relativeDue } from '../lib/format';"
            ),
            (
              "<dt>{t('enquiry.prefers')}</dt><dd>{enquiry.submitted_preferred_contact ?? '—'}</dd>",
              "<dt>{t('enquiry.prefers')}</dt><dd>{localiseKnownValue(enquiry.submitted_preferred_contact, language)}</dd>"
            ),
            (
              "<dt>{t('enquiry.prefers')}</dt><dd>{client.preferred_contact ?? '—'}</dd>",
              "<dt>{t('enquiry.prefers')}</dt><dd>{localiseKnownValue(client.preferred_contact, language)}</dd>"
            ),
            (
              "<dt>{t('enquiry.coverUp')}</dt><dd>{enquiry.cover_up ?? '—'}</dd>",
              "<dt>{t('enquiry.coverUp')}</dt><dd>{localiseKnownValue(enquiry.cover_up, language)}</dd>"
            ),
            (
              '<div className="title">{followUp.subject}</div>',
              '<div className="title">{localiseSystemSubject(followUp.subject, language)}</div>'
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Enquiry replacement count {count}: {old}')
              text = text.replace(old, new)
          enquiry_path.write_text(text)

          client_path = Path('admin/src/pages/ClientDetailPage.tsx')
          text = client_path.read_text()
          replacements = [
            (
              "import { formatDate, formatDateTime } from '../lib/format';",
              "import { formatDate, formatDateTime, localiseKnownValue } from '../lib/format';"
            ),
            (
              "<dt>{t('enquiry.prefers')}</dt><dd>{client.preferred_contact ?? '—'}</dd>",
              "<dt>{t('enquiry.prefers')}</dt><dd>{localiseKnownValue(client.preferred_contact, language)}</dd>"
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Client replacement count {count}: {old}')
              text = text.replace(old, new)
          client_path.write_text(text)
          PY

          cat > admin/src/test/known-value-localisation.test.ts <<'TEST'
          import { describe, expect, it } from 'vitest';
          import { localiseKnownValue, localiseSystemSubject } from '../lib/format';

          describe('known submitted and system values', () => {
            it('localises controlled booking values without translating client prose', () => {
              expect(localiseKnownValue('Email', 'ru')).toBe('Электронная почта');
              expect(localiseKnownValue('No', 'ru')).toBe('Нет');
              expect(localiseKnownValue('Black and grey realism', 'ru')).toBe('Black and grey realism');
            });

            it('localises the standard follow-up subject in either stored language', () => {
              expect(localiseSystemSubject('Chase this enquiry', 'ru')).toBe('Связаться по этой заявке');
              expect(localiseSystemSubject('Связаться по этой заявке', 'en')).toBe('Chase this enquiry');
            });
          });
          TEST

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            admin/src/lib/format.ts \
            admin/src/pages/EnquiryDetailPage.tsx \
            admin/src/pages/ClientDetailPage.tsx \
            admin/src/test/known-value-localisation.test.ts
          git commit -m 'fix: localise controlled booking values'
          git push origin HEAD:claude/vishar-crm-booking-infra-c188bx
