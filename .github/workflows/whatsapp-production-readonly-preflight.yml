name: WhatsApp production read-only preflight

on:
  pull_request:
    branches:
      - release/private-crm-rc30-whatsapp-onboarding
    paths:
      - .github/workflows/whatsapp-production-readonly-preflight.yml

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.ref == 'agent/rc30-whatsapp-production-preflight' &&
      github.event.pull_request.base.ref == 'release/private-crm-rc30-whatsapp-onboarding' &&
      github.event.pull_request.base.sha == 'c8a8d631580f9ec675e47ad039de5500fc9ebc69'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RC30 release head
        uses: actions/checkout@v4
        with:
          ref: c8a8d631580f9ec675e47ad039de5500fc9ebc69

      - name: Verify exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c8a8d631580f9ec675e47ad039de5500fc9ebc69'
          test -z "$(git status --short)"
          echo 'release_sha=c8a8d631580f9ec675e47ad039de5500fc9ebc69'

      - name: Require production CRM Cloudflare Access
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --silent --show-error --max-time 20 --output /dev/null --dump-header "$headers" \
            https://vishar-crm-production.pages.dev/ || true
          status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' "$headers")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")"
          rm -f "$headers"
          case "$location" in
            https://*.cloudflareaccess.com/*) echo "production_access_redirect=true status=${status:-unknown}" ;;
            *) echo "Production CRM is not proven behind Cloudflare Access (status=${status:-unknown})." >&2; exit 1 ;;
          esac

      - name: Inspect production Cloudflare metadata read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$1"
          }

          inspect_optional() {
            local url="$1"
            local output="$2"
            curl --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --output "$output" \
              --write-out '%{http_code}' \
              "$url"
          }

          account="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          pages="$(api "$account/pages/projects/vishar-crm-production")"
          echo "$pages" | jq -e '.success == true' >/dev/null
          echo "pages_project=vishar-crm-production"
          echo "pages_latest_commit=$(echo "$pages" | jq -r '.result.latest_deployment.deployment_trigger.metadata.commit_hash // "missing"')"
          echo "pages_latest_id=$(echo "$pages" | jq -r '.result.latest_deployment.id // "missing"')"
          echo "pages_production_branch=$(echo "$pages" | jq -r '.result.production_branch // "missing"')"
          echo "pages_domains=$(echo "$pages" | jq -c '.result.domains // [] | sort')"
          echo "pages_production_env_names=$(echo "$pages" | jq -r '(.result.deployment_configs.production.env_vars // {}) | keys | sort | join(",")')"

          scripts="$(api "$account/workers/scripts")"
          echo "$scripts" | jq -e '.success == true' >/dev/null
          for worker in vishar-whatsapp-drain-production vishar-whatsapp-webhook-production; do
            present="$(echo "$scripts" | jq -r --arg worker "$worker" '[.result[] | select(.id == $worker)] | length')"
            echo "worker_${worker}_present=$present"
            if [ "$present" != '1' ]; then
              continue
            fi
            echo "worker_${worker}_metadata=$(echo "$scripts" | jq -c --arg worker "$worker" '[.result[] | select(.id == $worker) | {id,modified_on,created_on,handlers}] | first')"

            secrets="$(api "$account/workers/scripts/$worker/secrets")"
            echo "$secrets" | jq -e '.success == true' >/dev/null
            echo "worker_${worker}_secret_names=$(echo "$secrets" | jq -r '[.result[].name] | sort | join(",")')"

            deployments_file="$(mktemp)"
            deployments_status="$(inspect_optional "$account/workers/scripts/$worker/deployments" "$deployments_file")"
            echo "worker_${worker}_deployments_status=$deployments_status"
            if [ "$deployments_status" = '200' ]; then
              echo "worker_${worker}_latest_deployment=$(jq -c '.result.deployments // .result // [] | if type == "array" then (sort_by(.created_on // "") | last | {id,created_on,versions}) else {} end' "$deployments_file")"
            fi
            rm -f "$deployments_file"

            schedules_file="$(mktemp)"
            schedules_status="$(inspect_optional "$account/workers/scripts/$worker/schedules" "$schedules_file")"
            echo "worker_${worker}_schedules_status=$schedules_status"
            if [ "$schedules_status" = '200' ]; then
              echo "worker_${worker}_schedules=$(jq -c '[.result[]? | {cron,created_on,modified_on}]' "$schedules_file")"
            fi
            rm -f "$schedules_file"

            settings_file="$(mktemp)"
            settings_status="$(inspect_optional "$account/workers/scripts/$worker/settings" "$settings_file")"
            echo "worker_${worker}_settings_status=$settings_status"
            if [ "$settings_status" = '200' ]; then
              echo "worker_${worker}_binding_names=$(jq -r '[.result.bindings[]? | (.name // empty)] | unique | sort | join(",")' "$settings_file")"
              echo "worker_${worker}_binding_types=$(jq -c '[.result.bindings[]? | {name:(.name // null),type:(.type // null)}] | sort_by(.name // "")' "$settings_file")"
            fi
            rm -f "$settings_file"
          done

          domains="$(api "$account/workers/domains")"
          echo "$domains" | jq -e '.success == true' >/dev/null
          echo "whatsapp_custom_domain=$(echo "$domains" | jq -r '[.result[] | select(.hostname == "whatsapp.vishartattoo.com") | {hostname,service,environment}] | @json')"

      - name: Confirm preflight remains read-only
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/whatsapp-production-readonly-preflight.yml'
          ! grep -Eq 'wrangler (deploy|secret put)|curl[^\n]*(--request|-X)[ =]*(POST|PUT|PATCH|DELETE)|supabase (db push|migration|functions deploy)' "$file"
