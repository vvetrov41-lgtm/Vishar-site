name: Monzo staging dormant Worker deploy

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: monzo-staging-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dormant Monzo staging Worker
    if: >-
      github.event.action == 'edited' &&
      github.event.sender.login == 'vvetrov41-lgtm' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'agent/monzo-staging-worker-deploy-operator' &&
      github.event.pull_request.head.ref == 'agent/monzo-staging-worker-deploy-validation' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, format('<!-- RUN_MONZO_STAGING_WORKER_DEPLOY:{0} -->', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      OPERATOR_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_PARENT_SHA: 11c00bd00f839fe64fd9dcfffa2188420c2ced6b
      EXPECTED_OPERATOR_BRANCH: agent/monzo-staging-worker-deploy-operator
      EXPECTED_VALIDATION_BRANCH: agent/monzo-staging-worker-deploy-validation
      STAGING_PROJECT_REF: gwaliusblwrzisrwnsvs
      HOST_DOMAIN: monzo-staging.vishartattoo.com
      WEBHOOK_DOMAIN: monzo-staging.vishartattoo.com/webhooks/monzo/*
      WORKER_NAME: vishar-monzo-api-staging
      PRODUCTION_TARGETED: 'false'

    steps:
      - name: Fail closed before checkout
        shell: bash
        env:
          MONZO_OAUTH_CLIENT_ID_PRESENT: ${{ secrets.MONZO_OAUTH_CLIENT_ID != '' }}
          MONZO_OAUTH_CLIENT_SECRET_PRESENT: ${{ secrets.MONZO_OAUTH_CLIENT_SECRET != '' }}
          MONZO_TOKEN_ENCRYPTION_KEY_PRESENT: ${{ secrets.MONZO_TOKEN_ENCRYPTION_KEY != '' }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATOR_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$PRODUCTION_TARGETED" = 'false' ]
          [ "$HOST_DOMAIN" = 'monzo-staging.vishartattoo.com' ]
          [ "$WEBHOOK_DOMAIN" = 'monzo-staging.vishartattoo.com/webhooks/monzo/*' ]
          [ "$WORKER_NAME" = 'vishar-monzo-api-staging' ]
          [ "${MONZO_OAUTH_CLIENT_ID_PRESENT:-false}" = 'false' ]
          [ "${MONZO_OAUTH_CLIENT_SECRET_PRESENT:-false}" = 'false' ]
          [ "${MONZO_TOKEN_ENCRYPTION_KEY_PRESENT:-false}" = 'false' ]

          marker="<!-- RUN_MONZO_STAGING_WORKER_DEPLOY:${APPROVED_SHA} -->"
          jq -e \
            --arg sha "$APPROVED_SHA" \
            --arg operator_sha "$OPERATOR_SHA" \
            --arg base "$EXPECTED_OPERATOR_BRANCH" \
            --arg head "$EXPECTED_VALIDATION_BRANCH" \
            --arg marker "$marker" \
            --arg repo "$GITHUB_REPOSITORY" '
            .action == "edited"
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == $base
            and .pull_request.base.sha == $operator_sha
            and .pull_request.head.ref == $head
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
            and (.pull_request.body | contains($marker))
          ' "$GITHUB_EVENT_PATH" >/dev/null

      - name: Check out exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify exact stack and successful normal CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ "$(git rev-parse "${EXPECTED_PARENT_SHA}^{commit}")" = "$EXPECTED_PARENT_SHA" ]
          [ "$(git rev-parse "${OPERATOR_SHA}^{commit}")" = "$OPERATOR_SHA" ]
          git merge-base --is-ancestor "$EXPECTED_PARENT_SHA" "$OPERATOR_SHA"
          git merge-base --is-ancestor "$OPERATOR_SHA" "$APPROVED_SHA"

          gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_PARENT_SHA...$OPERATOR_SHA" > "$RUNNER_TEMP/operator.json"
          jq -e '
            .status == "ahead" and .behind_by == 0
            and ([.files[].filename] | sort) == ([".github/workflows/monzo-staging-worker-deploy.yml"] | sort)
          ' "$RUNNER_TEMP/operator.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/compare/$OPERATOR_SHA...$APPROVED_SHA" > "$RUNNER_TEMP/validation.json"
          jq -e '
            .status == "ahead" and .behind_by == 0
            and ([.files[].filename] | sort) == (["docs/ai/monzo-staging-worker-deploy-validation.md"] | sort)
          ' "$RUNNER_TEMP/validation.json" >/dev/null

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {id,name,event,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in 'Static Validation' 'CRM and booking validation'; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              [.[] | select(.name == $name and .event == "pull_request" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length >= 1
            ' "$RUNNER_TEMP/runs.json" >/dev/null
          done
          crm_run_id="$(jq -r --arg sha "$APPROVED_SHA" '[.[] | select(.name == "CRM and booking validation" and .event == "pull_request" and .head_sha == $sha and .conclusion == "success")] | sort_by(.id) | last | .id' "$RUNNER_TEMP/runs.json")"
          [[ "$crm_run_id" =~ ^[0-9]+$ ]]
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$crm_run_id/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {name,status,conclusion}' | jq -s . > "$RUNNER_TEMP/jobs.json"
          for job in 'Public site and Worker' 'Private CRM' 'Supabase migrations and pgTAP'; do
            jq -e --arg name "$job" '[.[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length == 1' "$RUNNER_TEMP/jobs.json" >/dev/null
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate dormant Monzo product contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:monzo-staging
          npm run validate:monzo-staging
          npm run check:monzo-staging-bundle
          npm run scan:secrets
          grep -Fx 'name = "vishar-monzo-api-staging"' wrangler.monzo-api.staging.toml
          grep -Fx 'main = "workers/monzo-api-gateway.js"' wrangler.monzo-api.staging.toml
          grep -Fx 'workers_dev = false' wrangler.monzo-api.staging.toml
          grep -Fx 'preview_urls = false' wrangler.monzo-api.staging.toml
          grep -Fx 'MONZO_RECONCILIATION_ENABLED = "false"' wrangler.monzo-api.staging.toml
          grep -Fx 'MONZO_OAUTH_REDIRECT_URI = "https://monzo-staging.vishartattoo.com/oauth/monzo/callback"' wrangler.monzo-api.staging.toml
          grep -Fx 'SUPABASE_URL = "https://gwaliusblwrzisrwnsvs.supabase.co"' wrangler.monzo-api.staging.toml
          ! grep -Eq '^routes\s*=|^\[\[routes\]\]|^\[\[kv_namespaces\]\]' wrangler.monzo-api.staging.toml

      - name: Fresh-check retained Supabase staging read-only
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]
          [ "$PRODUCTION_TARGETED" = 'false' ]
          evidence="$RUNNER_TEMP/monzo-staging-worker-deploy"
          mkdir -p "$evidence"

          project="$RUNNER_TEMP/project.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF" > "$project"
          jq -e --arg ref "$STAGING_PROJECT_REF" '.id == $ref and .status == "ACTIVE_HEALTHY" and .region == "eu-west-2"' "$project" >/dev/null

          sql="$RUNNER_TEMP/state.sql"
          query="$RUNNER_TEMP/query.json"
          cat > "$sql" <<'SQL'
          select jsonb_build_object(
            'latest_migration', (select max(version) from supabase_migrations.schema_migrations),
            'payment_requests', (select count(*)::integer from public.payment_requests),
            'payment_transactions', (select count(*)::integer from public.payment_transactions),
            'reconciliation_candidates', (select count(*)::integer from public.payment_reconciliation_candidates),
            'outbox_pending', (select count(*)::integer from public.integration_outbox where status = 'pending'),
            'outbox_leased', (select count(*)::integer from public.integration_outbox where status = 'leased'),
            'candidates_force_rls', (select relrowsecurity and relforcerowsecurity from pg_class where oid = 'public.payment_reconciliation_candidates'::regclass),
            'authenticated_reconcile_execute', has_function_privilege('authenticated', 'public.register_monzo_reconciliation_candidate(text,text,text,numeric,text,timestamptz)', 'EXECUTE'),
            'service_reconcile_execute', has_function_privilege('service_role', 'public.register_monzo_reconciliation_candidate(text,text,text,numeric,text,timestamptz)', 'EXECUTE')
          ) as state;
          SQL
          jq -Rs '{query:.}' < "$sql" > "$query"
          raw="$RUNNER_TEMP/state.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$query" \
            "https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF/database/query" > "$raw"
          jq -e 'length == 1 and (.[0].state | type == "object")' "$raw" >/dev/null
          jq -S '.[0].state' "$raw" > "$evidence/supabase-state.json"
          jq -e '
            (.latest_migration | tonumber) >= 44
            and .candidates_force_rls == true
            and .authenticated_reconcile_execute == false
            and .service_reconcile_execute == true
          ' "$evidence/supabase-state.json" >/dev/null
          rm -f "$project" "$sql" "$query" "$raw"

      - name: Verify Cloudflare boundary and deploy dormant Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-f]{32}$ ]]
          [ "$PRODUCTION_TARGETED" = 'false' ]
          evidence="$RUNNER_TEMP/monzo-staging-worker-deploy"
          mkdir -p "$evidence"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          token="$RUNNER_TEMP/token.json"
          [ "$(curl --silent --show-error --output "$token" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)" = '200' ]
          jq -e '.success == true and .result.status == "active"' "$token" >/dev/null
          rm -f "$token"

          kv="$RUNNER_TEMP/kv.json"
          [ "$(curl --silent --show-error --output "$kv" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/storage/kv/namespaces?per_page=100" || true)" = '200' ]
          jq -e '.success == true and (.result | type == "array")' "$kv" >/dev/null
          state_title='vishar-monzo-oauth-state-staging'
          tokens_title='vishar-monzo-oauth-tokens-staging'
          routes_title='vishar-monzo-webhook-routes-staging'
          for title in "$state_title" "$tokens_title" "$routes_title"; do
            [ "$(jq --arg title "$title" '[.result[] | select(.title == $title)] | length' "$kv")" = '1' ]
          done
          state_id="$(jq -r --arg title "$state_title" '.result[] | select(.title == $title) | .id' "$kv")"
          tokens_id="$(jq -r --arg title "$tokens_title" '.result[] | select(.title == $title) | .id' "$kv")"
          routes_id="$(jq -r --arg title "$routes_title" '.result[] | select(.title == $title) | .id' "$kv")"
          for id in "$state_id" "$tokens_id" "$routes_id"; do [[ "$id" =~ ^[0-9a-f]{32}$ ]]; done
          [ "$state_id" != "$tokens_id" ] && [ "$state_id" != "$routes_id" ] && [ "$tokens_id" != "$routes_id" ]
          rm -f "$kv"

          workers="$RUNNER_TEMP/workers.json"
          [ "$(curl --silent --show-error --output "$workers" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts" || true)" = '200' ]
          jq -e '.success == true and (.result | type == "array")' "$workers" >/dev/null
          jq -e --arg worker "$WORKER_NAME" '[.result[] | .id // empty] | index($worker) == null' "$workers" >/dev/null || {
            echo 'Initial dormant deploy refuses to overwrite an existing Monzo staging Worker.' >&2
            exit 1
          }
          rm -f "$workers"

          apps="$RUNNER_TEMP/apps.json"
          [ "$(curl --silent --show-error --output "$apps" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/access/apps?per_page=100" || true)" = '200' ]
          jq -e '.success == true and (.result | type == "array")' "$apps" >/dev/null
          unexpected="$(jq -r --arg host "$HOST_DOMAIN" --arg webhook "$WEBHOOK_DOMAIN" '.result[] | select(((.domain // "") | startswith("monzo-staging.vishartattoo.com")) and .domain != $host and .domain != $webhook) | .domain' "$apps")"
          [ -z "$unexpected" ]
          jq -e --arg domain "$HOST_DOMAIN" '[.result[] | select((.domain // "") == $domain)] as $a | ($a|length)==1 and $a[0].type=="self_hosted" and $a[0].name=="Vishar Monzo staging owner access" and (($a[0].aud // "")|test("^[0-9a-f]{64}$"))' "$apps" >/dev/null
          jq -e --arg domain "$WEBHOOK_DOMAIN" '[.result[] | select((.domain // "") == $domain)] as $a | ($a|length)==1 and $a[0].type=="self_hosted" and $a[0].name=="Vishar Monzo staging public webhook"' "$apps" >/dev/null
          host_id="$(jq -r --arg domain "$HOST_DOMAIN" '.result[] | select((.domain // "") == $domain) | .id' "$apps")"
          webhook_id="$(jq -r --arg domain "$WEBHOOK_DOMAIN" '.result[] | select((.domain // "") == $domain) | .id' "$apps")"
          host_aud="$(jq -r --arg domain "$HOST_DOMAIN" '.result[] | select((.domain // "") == $domain) | .aud' "$apps")"
          [[ "$host_aud" =~ ^[0-9a-f]{64}$ ]]
          rm -f "$apps"

          host_p="$RUNNER_TEMP/host-policies.json"
          webhook_p="$RUNNER_TEMP/webhook-policies.json"
          [ "$(curl --silent --show-error --output "$host_p" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/access/apps/$host_id/policies?per_page=100" || true)" = '200' ]
          [ "$(curl --silent --show-error --output "$webhook_p" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/access/apps/$webhook_id/policies?per_page=100" || true)" = '200' ]
          jq -e '.success==true and (.result|length)==1 and .result[0].name=="Vishar Monzo staging owner only" and .result[0].decision=="allow" and ((.result[0].include//[])|length)==1 and ((.result[0].include[0].email.email//"")=="vvetrov41@gmail.com") and ((.result[0].exclude//[])|length)==0 and ((.result[0].require//[])|length)==0' "$host_p" >/dev/null
          jq -e '.success==true and (.result|length)==1 and .result[0].name=="Vishar Monzo staging webhook bypass" and .result[0].decision=="bypass" and ((.result[0].include//[])|length)==1 and ((.result[0].include[0]|has("everyone"))==true) and ((.result[0].exclude//[])|length)==0 and ((.result[0].require//[])|length)==0' "$webhook_p" >/dev/null
          rm -f "$host_p" "$webhook_p"

          MONZO_ACCESS_AUD="$host_aud" MONZO_KV_STATE_ID="$state_id" MONZO_KV_TOKENS_ID="$tokens_id" MONZO_KV_WEBHOOK_ROUTES_ID="$routes_id" npm run validate:monzo-staging:deploy-ready

          deploy_config="$GITHUB_WORKSPACE/.wrangler.monzo-api.staging.deploy.toml"
          secrets_file="$RUNNER_TEMP/monzo-staging-worker-secrets.json"
          cp wrangler.monzo-api.staging.toml "$deploy_config"
          cat >> "$deploy_config" <<EOF
          MONZO_ACCESS_AUD = "$host_aud"

          [[kv_namespaces]]
          binding = "MONZO_OAUTH_STATE"
          id = "$state_id"

          [[kv_namespaces]]
          binding = "MONZO_OAUTH_TOKENS"
          id = "$tokens_id"

          [[kv_namespaces]]
          binding = "MONZO_WEBHOOK_ROUTES"
          id = "$routes_id"

          [[routes]]
          pattern = "monzo-staging.vishartattoo.com"
          custom_domain = true
          EOF
          export secrets_file
          python - <<'PY'
          import base64, json, os, secrets
          from pathlib import Path
          key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode('ascii').rstrip('=')
          if len(key) != 43 or '=' in key:
              raise SystemExit('Generated Monzo encryption key is not canonical base64url')
          path = Path(os.environ['secrets_file'])
          path.write_text(json.dumps({'MONZO_TOKEN_ENCRYPTION_KEY': key}), encoding='utf-8')
          path.chmod(0o600)
          PY
          chmod 600 "$deploy_config"
          trap 'rm -f "$deploy_config" "$secrets_file"' EXIT

          grep -Fx 'workers_dev = false' "$deploy_config"
          grep -Fx 'preview_urls = false' "$deploy_config"
          grep -Fx 'MONZO_RECONCILIATION_ENABLED = "false"' "$deploy_config"
          grep -Fx 'pattern = "monzo-staging.vishartattoo.com"' "$deploy_config"
          grep -Fx 'custom_domain = true' "$deploy_config"
          [ "$(grep -c '^\[\[kv_namespaces\]\]$' "$deploy_config")" = '3' ]
          ! grep -Eq '^[[:space:]]*(MONZO_OAUTH_CLIENT_ID|MONZO_OAUTH_CLIENT_SECRET|SUPABASE_SECRET_KEY)[[:space:]]*=' "$deploy_config"

          npx wrangler deploy --config "$deploy_config" --keep-vars --secrets-file "$secrets_file"
          rm -f "$deploy_config" "$secrets_file"
          trap - EXIT
          jq -n '{worker_deployed:true,encryption_secret_installed:true,provider_called:false,production_targeted:false}' > "$evidence/deploy-state.json"

      - name: Verify deployed Worker remains dormant and edge-isolated
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ "$PRODUCTION_TARGETED" = 'false' ]
          evidence="$RUNNER_TEMP/monzo-staging-worker-deploy"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          settings="$RUNNER_TEMP/settings.json"
          [ "$(curl --silent --show-error --output "$settings" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts/$WORKER_NAME/settings" || true)" = '200' ]
          jq -e '.success == true and (.result.bindings | type == "array")' "$settings" >/dev/null
          names="$RUNNER_TEMP/bindings.json"
          jq -c '[.result.bindings[] | .name // empty] | sort | unique' "$settings" > "$names"
          for required in MONZO_OAUTH_STATE MONZO_OAUTH_TOKENS MONZO_WEBHOOK_ROUTES MONZO_WEBHOOK_RATE_LIMIT MONZO_TOKEN_ENCRYPTION_KEY; do jq -e --arg name "$required" 'index($name) != null' "$names" >/dev/null; done
          for forbidden in MONZO_OAUTH_CLIENT_ID MONZO_OAUTH_CLIENT_SECRET SUPABASE_SECRET_KEY; do jq -e --arg name "$forbidden" 'index($name) == null' "$names" >/dev/null; done
          rm -f "$settings" "$names"

          host_gated=false
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://$HOST_DOMAIN/health" || true)"
            case "$status" in
              302|303|307|401|403) host_gated=true; break ;;
              200) echo 'Owner-only Access is not gating /health.' >&2; exit 1 ;;
            esac
            sleep 6
          done
          [ "$host_gated" = 'true' ]

          webhook_key="$(printf 'A%.0s' {1..43})"
          webhook_ok=false
          for attempt in $(seq 1 20); do
            body="$RUNNER_TEMP/webhook-probe.json"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/json' --data '{}' "https://$HOST_DOMAIN/webhooks/monzo/$webhook_key" || true)"
            if [ "$status" = '503' ] && jq -e '.ok == false and .code == "reconciliation_disabled"' "$body" >/dev/null 2>&1; then webhook_ok=true; rm -f "$body"; break; fi
            rm -f "$body"
            sleep 6
          done
          [ "$webhook_ok" = 'true' ]

          jq -n '{settings_verified:true,oauth_credentials_installed:false,supabase_backend_secret_installed:false,reconciliation_enabled:false,owner_host_access_gated:true,webhook_bypass_reaches_dormant_worker:true,provider_called:false,production_targeted:false,dns_changed:true,waf_changed:false,kv_written:false}' > "$evidence/postdeploy-state.json"

      - name: Publish safe dormant deploy evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/monzo-staging-worker-deploy"
          mkdir -p "$evidence"
          worker_deployed=false
          postdeploy_verified=false
          [ -f "$evidence/deploy-state.json" ] && worker_deployed=true
          [ -f "$evidence/postdeploy-state.json" ] && postdeploy_verified=true
          supabase='null'
          [ -f "$evidence/supabase-state.json" ] && supabase="$(cat "$evidence/supabase-state.json")"
          jq -n --arg exact_head "$APPROVED_SHA" --arg operator_head "$OPERATOR_SHA" --argjson worker_deployed "$worker_deployed" --argjson postdeploy_verified "$postdeploy_verified" --argjson supabase "$supabase" '{exact_head:$exact_head,operator_head:$operator_head,production_targeted:false,provider_called:false,worker_deployed:$worker_deployed,postdeploy_verified:$postdeploy_verified,generated_encryption_secret_installed:$worker_deployed,oauth_credentials_installed:false,supabase_backend_secret_installed:false,reconciliation_enabled:false,custom_domain_dns_expected_from_deploy:$worker_deployed,waf_changed:false,retained_staging_read_only_preflight:$supabase}' > "$evidence/summary.json"
          {
            echo '### Dormant Monzo staging Worker deploy'
            echo '```json'
            jq . "$evidence/summary.json"
            echo '```'
            echo ''
            echo 'No Monzo OAuth credentials or Supabase backend secret are installed by this deploy. Reconciliation stays disabled. The generated AES key is sent only as a Cloudflare Worker secret and is never emitted in evidence.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-sensitive dormant deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monzo-staging-worker-deploy-${{ env.APPROVED_SHA }}
          path: ${{ runner.temp }}/monzo-staging-worker-deploy/summary.json
          if-no-files-found: ignore
