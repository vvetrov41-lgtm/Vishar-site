name: Diagnose RC25 WhatsApp production secret binding

on:
  push:
    branches:
      - release/private-crm-rc25-whatsapp-webhook-operator
    paths:
      - .github/workflows/diagnose-rc25-whatsapp-secret.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only WhatsApp secret binding check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crm-production
    env:
      RELEASE_SHA: 2729bf08ed206a0d6d42f6d055ded8489d0858e4
      WORKER_NAME: vishar-whatsapp-webhook-production
      WEBHOOK_URL: https://whatsapp.vishartattoo.com/webhook
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RC25 ancestry and operator-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          unexpected="$(git diff --name-only "$RELEASE_SHA"...HEAD | grep -vE '^\.github/workflows/(bootstrap-rc25-whatsapp-webhook|inspect-rc25-whatsapp-production|verify-rc25-whatsapp-public|diagnose-rc25-whatsapp-secret)\.yml$' || true)"
          [ -z "$unexpected" ] || { echo 'Unexpected non-operator changes:' >&2; printf '%s\n' "$unexpected" >&2; exit 1; }

      - name: Verify protected Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify active Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions list --name "$WORKER_NAME" --json > "$RUNNER_TEMP/versions.json"
          npx wrangler secret list --config wrangler.whatsapp-webhook.production.toml --name "$WORKER_NAME" --format json > "$RUNNER_TEMP/secrets.json"
          node - "$RUNNER_TEMP/secrets.json" <<'NODE'
          const fs = require('fs');
          const values = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const names = values.map((x) => x.name).filter(Boolean).sort();
          console.log(`SECRET_NAMES=${JSON.stringify(names)}`);
          if (!names.includes('WHATSAPP_WEBHOOK_VERIFY_TOKEN')) {
            throw new Error('Active Worker does not expose WHATSAPP_WEBHOOK_VERIFY_TOKEN');
          }
          console.log('VERIFY_TOKEN_BINDING_PRESENT=true');
          NODE

      - name: Probe public handshake boundary with a dummy token
        shell: bash
        run: |
          set -euo pipefail
          base="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$WEBHOOK_URL" || true)"
          dummy="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$WEBHOOK_URL?hub.mode=subscribe&hub.verify_token=definitely-wrong-diagnostic-token&hub.challenge=123456" || true)"
          echo "WEBHOOK_HTTP_NO_QUERY=$base"
          echo "WEBHOOK_HTTP_DUMMY_TOKEN=$dummy"
          [ "$base" = '403' ]
          [ "$dummy" = '403' ]

      - name: Safe diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RC25 WhatsApp verification-token diagnostic'
            echo
            echo '- Read-only Cloudflare inspection only'
            echo '- Secret values were never requested or printed'
            echo '- No deploy, secret mutation, database mutation, Meta call, drain activation, or message send command exists in this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
