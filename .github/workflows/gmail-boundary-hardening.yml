name: Gmail boundary hardening

on:
  push:
    branches:
      - agent/gmail-crm-production-integration
    paths:
      - scripts/harden-gmail-boundaries.mjs
      - .github/workflows/gmail-boundary-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gmail-crm-production-integration
          fetch-depth: 0
      - name: Apply bounded hardening patch
        run: node scripts/harden-gmail-boundaries.mjs
      - name: Verify exact diff
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = $'workers/gmail-production.js\nworkers/lib/google-gmail.js'
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workers/gmail-production.js workers/lib/google-gmail.js
          git commit -m 'Harden Gmail token and service host boundaries'
          git push origin HEAD:agent/gmail-crm-production-integration
