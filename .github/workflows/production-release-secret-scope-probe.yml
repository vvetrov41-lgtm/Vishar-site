name: Production release secret scope probe

on:
  push:
    branches:
      - agent/production-release-secret-scope-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S_SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      S_SUPABASE_DB_PASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      V_PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      V_PROJECT_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      V_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      V_TEAM_INVITE_URL: ${{ vars.CRM_PRODUCTION_TEAM_INVITE_URL }}
      V_PAGES_PROJECT: ${{ vars.CRM_PRODUCTION_PAGES_PROJECT }}
      V_CRM_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN }}
      V_DB_DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DB_DEPLOY_ENABLED }}
      V_CRM_DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Report repository-scope availability only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            S_SUPABASE_ACCESS_TOKEN \
            S_SUPABASE_DB_PASSWORD \
            S_CLOUDFLARE_API_TOKEN \
            S_CLOUDFLARE_ACCOUNT_ID \
            V_PROJECT_REF \
            V_PROJECT_URL \
            V_PUBLISHABLE_KEY \
            V_TEAM_INVITE_URL \
            V_PAGES_PROJECT \
            V_CRM_ORIGIN \
            V_DB_DEPLOY_ENABLED \
            V_CRM_DEPLOY_ENABLED
          do
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=missing\n' "$name"
            fi
          done

          # Intentional failure so the connector receives a deterministic run notification.
          exit 1
