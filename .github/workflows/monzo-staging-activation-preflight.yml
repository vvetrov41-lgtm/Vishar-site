name: Monzo staging activation preflight

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: monzo-staging-activation-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Monzo staging activation prerequisites
    if: >-
      github.event.action == 'edited' &&
      github.event.sender.login == 'vvetrov41-lgtm' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'agent/monzo-staging-activation-operator' &&
      github.event.pull_request.head.ref == 'agent/monzo-staging-activation-validation' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, format('<!-- RUN_MONZO_STAGING_ACTIVATION_PREFLIGHT:{0} -->', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      OPERATOR_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_PRODUCT_SHA: 505ca4dc29c9b2f40f3388ec0a33d9243b7aa24f
      EXPECTED_PRODUCT_BRANCH: agent/monzo-crm-launcher
      EXPECTED_OPERATOR_BRANCH: agent/monzo-staging-activation-operator
      EXPECTED_VALIDATION_BRANCH: agent/monzo-staging-activation-validation
      PRODUCTION_TARGETED: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MONZO_OAUTH_CLIENT_ID: ${{ secrets.MONZO_OAUTH_CLIENT_ID }}
      MONZO_OAUTH_CLIENT_SECRET: ${{ secrets.MONZO_OAUTH_CLIENT_SECRET }}
      MONZO_TOKEN_ENCRYPTION_KEY: ${{ secrets.MONZO_TOKEN_ENCRYPTION_KEY }}

    steps:
      - name: Fail closed before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATOR_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$PRODUCTION_TARGETED" = 'false' ]
          marker="<!-- RUN_MONZO_STAGING_ACTIVATION_PREFLIGHT:${APPROVED_SHA} -->"
          jq -e \
            --arg sha "$APPROVED_SHA" \
            --arg operator_sha "$OPERATOR_SHA" \
            --arg base "$EXPECTED_OPERATOR_BRANCH" \
            --arg head "$EXPECTED_VALIDATION_BRANCH" \
            --arg marker "$marker" \
            --arg repo "$GITHUB_REPOSITORY" '
            .action == "edited"
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == $base
            and .pull_request.base.sha == $operator_sha
            and .pull_request.head.ref == $head
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
            and (.pull_request.body | contains($marker))
          ' "$GITHUB_EVENT_PATH" >/dev/null

      - name: Check out exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify exact stack and successful normal CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ "$(git rev-parse "${EXPECTED_PRODUCT_SHA}^{commit}")" = "$EXPECTED_PRODUCT_SHA" ]
          [ "$(git rev-parse "${OPERATOR_SHA}^{commit}")" = "$OPERATOR_SHA" ]
          git merge-base --is-ancestor "$EXPECTED_PRODUCT_SHA" "$OPERATOR_SHA"
          git merge-base --is-ancestor "$OPERATOR_SHA" "$APPROVED_SHA"
          [ "$PRODUCTION_TARGETED" = 'false' ]

          gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_PRODUCT_SHA...$OPERATOR_SHA" > "$RUNNER_TEMP/operator-compare.json"
          jq -e '
            .status == "ahead"
            and .behind_by == 0
            and ([.files[].filename] | sort) == ([
              ".github/workflows/monzo-staging-activation-preflight.yml"
            ] | sort)
          ' "$RUNNER_TEMP/operator-compare.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/compare/$OPERATOR_SHA...$APPROVED_SHA" > "$RUNNER_TEMP/validation-compare.json"
          jq -e '
            .status == "ahead"
            and .behind_by == 0
            and ([.files[].filename] | sort) == ([
              "docs/ai/monzo-staging-activation-validation.md"
            ] | sort)
          ' "$RUNNER_TEMP/validation-compare.json" >/dev/null

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {id,name,event,status,conclusion,head_sha}' \
            | jq -s . > "$RUNNER_TEMP/runs.json"

          jq -n --slurpfile runs "$RUNNER_TEMP/runs.json" --arg sha "$APPROVED_SHA" '
            ["Static Validation", "CRM and booking validation"] as $required
            | reduce $required[] as $name ({};
                ($runs[0] | map(select(
                  .name == $name
                  and .event == "pull_request"
                  and .head_sha == $sha
                  and .status == "completed"
                  and .conclusion == "success"
                )) | sort_by(.id) | last) as $run
                | if $run == null then error("missing exact-head normal CI: " + $name)
                  else .[$name] = $run end
              )
          ' > "$RUNNER_TEMP/normal-ci-runs.json"

          crm_run_id="$(jq -r '.["CRM and booking validation"].id' "$RUNNER_TEMP/normal-ci-runs.json")"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$crm_run_id/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {id,name,status,conclusion}' \
            | jq -s . > "$RUNNER_TEMP/normal-ci-jobs.json"
          for job in "Public site and Worker" "Private CRM" "Supabase migrations and pgTAP"; do
            jq -e --arg name "$job" '
              [.[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length == 1
            ' "$RUNNER_TEMP/normal-ci-jobs.json" >/dev/null
          done

      - name: Verify canonical Monzo Worker remains dormant
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'name = "vishar-monzo-api"' wrangler.monzo-api.toml
          grep -Fx 'main = "workers/monzo-api.js"' wrangler.monzo-api.toml
          grep -Fx 'workers_dev = false' wrangler.monzo-api.toml
          ! grep -Eq '^routes\s*=|^route\s*=|^\[\[kv_namespaces\]\]|^\[triggers\]|^crons\s*=' wrangler.monzo-api.toml
          ! grep -Eq '^MONZO_RECONCILIATION_ENABLED\s*=\s*"true"' wrangler.monzo-api.toml
          grep -F 'MONZO_OAUTH_STATE' wrangler.monzo-api.toml >/dev/null
          grep -F 'MONZO_OAUTH_TOKENS' wrangler.monzo-api.toml >/dev/null
          grep -F 'MONZO_WEBHOOK_ROUTES' wrangler.monzo-api.toml >/dev/null
          [ "$PRODUCTION_TARGETED" = 'false' ]

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-run Monzo contract and dormant compile checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-monzo-api-worker.mjs
          node scripts/test-monzo-api-hardening.mjs
          node scripts/test-monzo-api-activation.mjs
          node scripts/test-monzo-connection-lifecycle.mjs
          node scripts/test-monzo-setup-flow.mjs
          npm run scan:secrets
          out="$RUNNER_TEMP/monzo-dry-run"
          mkdir -p "$out"
          npx wrangler deploy --dry-run --config wrangler.monzo-api.toml --outdir "$out" >/dev/null
          [ "$PRODUCTION_TARGETED" = 'false' ]

      - name: Inspect encrypted configuration names and Cloudflare read capability
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/monzo-staging-preflight"
          mkdir -p "$evidence"

          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MONZO_OAUTH_CLIENT_ID MONZO_OAUTH_CLIENT_SECRET MONZO_TOKEN_ENCRYPTION_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          token_verify_http="not_attempted"
          kv_list_http="not_attempted"
          workers_list_http="not_attempted"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_verify_http="$(curl --silent --show-error --output "$evidence/token-verify.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            kv_list_http="$(curl --silent --show-error --output "$evidence/kv-list.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" || true)"
            workers_list_http="$(curl --silent --show-error --output "$evidence/workers-list.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" || true)"
          fi

          jq -n \
            --arg sha "$APPROVED_SHA" \
            --arg operator_sha "$OPERATOR_SHA" \
            --argjson missing "$(printf '%s\n' "${missing[@]:-}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            --arg token_verify_http "$token_verify_http" \
            --arg kv_list_http "$kv_list_http" \
            --arg workers_list_http "$workers_list_http" '
            {
              exact_head: $sha,
              operator_head: $operator_sha,
              production_targeted: false,
              canonical_worker_dormant: true,
              provider_called: false,
              staging_mutated: false,
              encrypted_configuration: {
                missing_names: $missing,
                ready: ($missing | length == 0)
              },
              cloudflare_read_only: {
                token_verify_http: $token_verify_http,
                kv_namespaces_http: $kv_list_http,
                workers_scripts_http: $workers_list_http
              },
              activation_ready: (
                ($missing | length == 0)
                and $token_verify_http == "200"
                and $kv_list_http == "200"
                and $workers_list_http == "200"
              )
            }
          ' > "$evidence/summary.json"

          # Provider/API bodies can contain account metadata. Keep only HTTP
          # status codes in evidence and delete raw Cloudflare responses too.
          rm -f "$evidence/token-verify.json" "$evidence/kv-list.json" "$evidence/workers-list.json"
          jq . "$evidence/summary.json"

      - name: Publish safe preflight summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Monzo staging activation preflight'
            echo '```json'
            jq . "$RUNNER_TEMP/monzo-staging-preflight/summary.json"
            echo '```'
            echo ''
            echo 'Read-only preflight only. No Worker deploy, KV creation, secret write, Supabase mutation or Monzo provider call occurred.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-sensitive preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monzo-staging-activation-preflight-${{ env.APPROVED_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/monzo-staging-preflight/summary.json
