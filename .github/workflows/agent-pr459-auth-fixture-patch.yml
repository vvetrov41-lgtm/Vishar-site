name: Temporary PR459 auth fixture patch

on:
  push:
    branches:
      - agent/lifecycle-execution-history-foundation

permissions:
  contents: write

concurrency:
  group: temporary-pr459-auth-fixture-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace removed auth helper with canonical pg_temp claims helper
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/250_lifecycle_execution_history.sql')
          text = path.read_text()
          needle = "select test_set_auth_claims('f5100000-0000-4000-8000-000000000001'::uuid, 'booking_manager');\nset local role authenticated;"
          replacement = """create function pg_temp.as_profile(p_profile uuid) returns void language sql as $$
            select set_config(
              'request.jwt.claims',
              json_build_object('sub', p_profile, 'role', 'authenticated')::text,
              true
            )::void;
          $$;
          grant execute on function pg_temp.as_profile(uuid) to authenticated;

          reset role;
          select pg_temp.as_profile('f5100000-0000-4000-8000-000000000001'::uuid);
          set local role authenticated;"""
          if text.count(needle) != 1:
              raise SystemExit('Expected exact removed auth-helper call once; refusing to patch')
          path.write_text(text.replace(needle, replacement))
          PY
          git rm .github/workflows/agent-pr459-auth-fixture-patch.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/250_lifecycle_execution_history.sql
          git commit -m 'Use canonical auth claims fixture for lifecycle history'
          git push origin HEAD:${GITHUB_REF_NAME}
