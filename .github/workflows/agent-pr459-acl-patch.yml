name: Temporary PR459 ACL patch

on:
  push:
    branches:
      - agent/lifecycle-execution-history-foundation

permissions:
  contents: write

concurrency:
  group: temporary-pr459-acl-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch explicit lifecycle RPC allow-list and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/050_rls_roles.sql')
          text = path.read_text()
          needle = """  ('public.preview_client_lifecycle_rule(uuid,uuid,uuid)', false, true, false),\n\n  -- Templates and the consent/suppression gate (migration 0082)."""
          replacement = """  ('public.preview_client_lifecycle_rule(uuid,uuid,uuid)', false, true, false),\n\n  -- Lifecycle Studio execution history foundation (migration 0105). This is a\n  -- bounded authenticated read that re-checks the exact artist capabilities\n  -- internally and is unavailable to anon and the service backend.\n  ('public.list_client_lifecycle_execution_history(uuid,integer)', false, true, false),\n\n  -- Templates and the consent/suppression gate (migration 0082)."""
          if text.count(needle) != 1:
              raise SystemExit('Expected exact Lifecycle Studio ACL anchor once; refusing to patch')
          path.write_text(text.replace(needle, replacement))
          PY
          git rm .github/workflows/agent-pr459-acl-patch.yml
          git diff --check
          git diff --exit-code -- supabase/tests/050_rls_roles.sql >/dev/null && {
            echo 'ACL allow-list patch produced no change' >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/050_rls_roles.sql
          git commit -m 'Register lifecycle history RPC in ACL inventory'
          git push origin HEAD:${GITHUB_REF_NAME}
