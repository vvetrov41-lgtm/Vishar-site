name: One-shot London Metadata Residue Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: geo/london-metadata-residue-cleanup
          fetch-depth: 1

      - name: Replace stale location alt text
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('Black and grey realism hannya demon artwork by Vladimir Vishar, Manchester tattoo artist', 'Black and grey realism hannya demon artwork by Vladimir Vishar, London tattoo artist'),
              ('Portrait of Vladimir Vishar, Manchester realism tattoo artist', 'Portrait of Vladimir Vishar, London realism tattoo artist'),
              ('Realism tattoo by Vladimir Vishar, Manchester &amp; Salford — portfolio piece ${i+1}', 'Realism tattoo by Vladimir Vishar, London — portfolio piece ${i+1}'),
              ('Vladimir Vishar, Manchester realism tattoo artist', 'Vladimir Vishar, London realism tattoo artist'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

      - name: Verify and self-remove
        shell: bash
        run: |
          ! grep -nE 'Manchester tattoo artist|Manchester realism tattoo artist|Manchester &amp; Salford' index.html
          rm .github/workflows/temp-london-metadata-residue-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/temp-london-metadata-residue-fix.yml
          git diff --cached --check
          git commit -m 'Remove remaining stale Manchester alt text'
          git push origin HEAD:geo/london-metadata-residue-cleanup
