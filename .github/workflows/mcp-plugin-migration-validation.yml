name: MCP Plugin migration validation

on:
  pull_request:
    paths:
      - 'docs/gpt-actions/**'
      - 'admin/src/lib/oauth-consent-api.ts'
      - 'admin/src/test/oauth-consent-api.test.ts'
      - 'workers/lib/mcp-*.js'
      - 'workers/vishar-mcp.js'
      - 'scripts/build-mcp-plugin-tools.mjs'
      - 'scripts/test-mcp-plugin-tools.mjs'
      - 'scripts/test-mcp-enquiry-reference-analyses.mjs'
      - 'scripts/build-mcp-plugin-parity.mjs'
      - 'scripts/probe-mcp-plugin-production.mjs'
      - 'scripts/activate-mcp-plugin-client.mjs'
      - 'scripts/test-mcp-plugin-client-activation.mjs'
      - 'scripts/test-mcp-plugin-client-activation-db.mjs'
      - 'docs/plugin-mcp/**'
      - 'plugins/vishar-crm/**'
      - 'wrangler.mcp*.toml'
      - '.github/workflows/mcp-plugin-production-bootstrap.yml'
      - '.github/workflows/mcp-plugin-production-activation.yml'
      - '.github/workflows/mcp-plugin-production-acceptance.yml'
      - '.github/workflows/mcp-plugin-migration-validation.yml'
  push:
    branches:
      - 'agent/platform-telegram-self-service'
    paths:
      - 'docs/gpt-actions/**'
      - 'workers/lib/mcp-*.js'
      - 'workers/vishar-mcp.js'
      - 'scripts/build-mcp-plugin-tools.mjs'
      - 'scripts/test-mcp-plugin-tools.mjs'
      - 'scripts/test-mcp-enquiry-reference-analyses.mjs'
      - 'scripts/build-mcp-plugin-parity.mjs'
      - 'scripts/probe-mcp-plugin-production.mjs'
      - 'scripts/activate-mcp-plugin-client.mjs'
      - 'scripts/test-mcp-plugin-client-activation.mjs'
      - 'scripts/test-mcp-plugin-client-activation-db.mjs'
      - 'docs/plugin-mcp/**'
      - 'plugins/vishar-crm/**'
      - 'wrangler.mcp*.toml'
      - '.github/workflows/mcp-plugin-production-bootstrap.yml'
      - '.github/workflows/mcp-plugin-production-activation.yml'
      - '.github/workflows/mcp-plugin-production-acceptance.yml'
      - '.github/workflows/mcp-plugin-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-config-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: plugin_config_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test dedicated config SQL against disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: plugin_config_test
          PGUSER: postgres
          PGPASSWORD: test-only-password
        run: node scripts/test-mcp-plugin-client-activation-db.mjs
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Plugin MCP tool registry
        run: node scripts/build-mcp-plugin-tools.mjs
      - name: Syntax check
        run: |
          node --check scripts/build-mcp-plugin-tools.mjs
          node --check scripts/probe-mcp-plugin-production.mjs
          node --check workers/lib/generated/mcp-plugin-tools.js
          node --check workers/lib/mcp-plugin-actions.js
          node --check workers/lib/mcp-plugin-server.js
      - name: Plugin MCP contracts
        run: |
          node scripts/test-mcp-plugin-tools.mjs
          node scripts/test-mcp-enquiry-reference-analyses.mjs
          node scripts/test-mcp-plugin-client-activation.mjs
      - name: Plugin package and operation parity
        run: |
          node scripts/build-mcp-plugin-parity.mjs --check
          node --input-type=module -e "import {readFileSync} from 'node:fs'; for (const file of ['plugins/vishar-crm/.codex-plugin/plugin.json', 'plugins/vishar-crm/.app.json']) JSON.parse(readFileSync(file, 'utf8'));"
      - name: Existing MCP regression tests
        run: |
          node scripts/test-mcp-domain-contracts.mjs
          node scripts/test-mcp-meta-domain.mjs
          node scripts/test-mcp-production-config.mjs
      - name: MCP production bundle dry-run
        run: npm run check:mcp-production-bundle
