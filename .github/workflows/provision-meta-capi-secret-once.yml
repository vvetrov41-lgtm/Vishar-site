name: Provision Vladimir Meta CAPI secret once

on:
  push:
    branches:
      - 'release/private-crm-rc1048-inventory-capi-auth-20261009'

permissions:
  contents: read

concurrency:
  group: deploy-private-production-telegram
  cancel-in-progress: false

jobs:
  provision:
    if: github.actor == github.repository_owner && github.event.head_commit.message == 'Provision Vladimir Meta CAPI secret once, approved'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: crm-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify single-use release target and source validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = 'release/private-crm-rc1048-inventory-capi-auth-20261009' ]
          [ "$(git log -1 --format=%s)" = 'Provision Vladimir Meta CAPI secret once, approved' ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git merge-base --is-ancestor c511025193a951c591466fc5f3788354dc3f1079 HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=c511025193a951c591466fc5f3788354dc3f1079&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/validated-source-checks.json"
          for name in 'Static Validation' 'CRM and booking validation'; do
            jq -e --arg name "$name" \
              'any(.[]; .name == $name and .status == "completed" and .conclusion == "success" and .head_sha == "c511025193a951c591466fc5f3788354dc3f1079")' \
              "$RUNNER_TEMP/validated-source-checks.json" >/dev/null
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run token custody tests
        run: node --test scripts/test-meta-capi-production-token.mjs
      - name: Verify token and production destination, read only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          META_ADS_VLADIMIR_ACCESS_TOKEN: ${{ secrets.META_ADS_VLADIMIR_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/provision-meta-capi-production-token.mjs >/dev/null
      - name: Add precisely one Meta CAPI Worker secret; leave drain disabled
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          META_ADS_VLADIMIR_ACCESS_TOKEN: ${{ secrets.META_ADS_VLADIMIR_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/provision-meta-capi-production-token.mjs --provision >> "$GITHUB_STEP_SUMMARY"
