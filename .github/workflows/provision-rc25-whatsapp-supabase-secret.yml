name: Provision RC25 WhatsApp Supabase backend secret

on:
  push:
    branches:
      - release/private-crm-rc25-whatsapp-webhook-operator
    paths:
      - .github/workflows/provision-rc25-whatsapp-supabase-secret.yml

permissions:
  contents: read

concurrency:
  group: provision-rc25-whatsapp-supabase-secret
  cancel-in-progress: false

jobs:
  provision:
    name: Provision existing Supabase backend key to WhatsApp Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crm-production
    env:
      RELEASE_SHA: 2729bf08ed206a0d6d42f6d055ded8489d0858e4
      WORKER_NAME: vishar-whatsapp-webhook-production
      PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact RC25 ancestry and operator-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          [ "$PROJECT_REF" = 'vfjexhfdbrjmuxfdvbdx' ] || {
            echo 'Refusing non-production Supabase project.' >&2
            exit 1
          }
          unexpected="$(git diff --name-only "$RELEASE_SHA"...HEAD | grep -vE '^\.github/workflows/(bootstrap-rc25-whatsapp-webhook|inspect-rc25-whatsapp-production|verify-rc25-whatsapp-public|diagnose-rc25-whatsapp-secret|provision-rc25-whatsapp-supabase-secret)\.yml$' || true)"
          [ -z "$unexpected" ] || {
            echo 'Unexpected non-operator changes.' >&2
            exit 1
          }
          [ -n "$SUPABASE_ACCESS_TOKEN" ]
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Copy one existing modern Supabase secret directly into Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          secret_file="$RUNNER_TEMP/supabase-backend-key.txt"
          cleanup() {
            rm -f "$keys_file" "$secret_file"
          }
          trap cleanup EXIT
          umask 077

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true" \
            > "$keys_file"

          KEYS_FILE="$keys_file" SECRET_FILE="$secret_file" node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.env.KEYS_FILE, 'utf8'));
          if (!Array.isArray(rows)) throw new Error('Supabase API-key response was not an array');

          const modernSecrets = rows.filter((row) => (
            row
            && typeof row === 'object'
            && typeof row.api_key === 'string'
            && row.api_key.startsWith('sb_secret_')
          ));
          const defaults = modernSecrets.filter((row) => row.name === 'default');
          const selected = defaults.length === 1
            ? defaults[0]
            : (modernSecrets.length === 1 ? modernSecrets[0] : null);

          if (!selected) {
            throw new Error('No unambiguous existing modern Supabase secret key is available; no key was created');
          }
          if (selected.api_key.length < 20 || selected.api_key.length > 1024) {
            throw new Error('Selected Supabase secret key has an unexpected format');
          }
          fs.writeFileSync(process.env.SECRET_FILE, selected.api_key, { mode: 0o600 });
          console.log('EXISTING_MODERN_SUPABASE_SECRET_SELECTED=true');
          NODE

          npx wrangler secret put SUPABASE_SECRET_KEY \
            --config wrangler.whatsapp-webhook.production.toml \
            --name "$WORKER_NAME" \
            < "$secret_file" >/dev/null

          cleanup
          trap - EXIT

      - name: Verify only secret names and fail-closed public boundary
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config wrangler.whatsapp-webhook.production.toml --name "$WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const values = JSON.parse(process.env.SECRET_LIST || '[]');
          const names = new Set(values.map((entry) => entry?.name).filter(Boolean));
          for (const required of [
            'SUPABASE_SECRET_KEY',
            'WHATSAPP_WEBHOOK_VERIFY_TOKEN',
            'ARTIST_WHATSAPP_VLADIMIR_HPRODUCTION',
          ]) {
            if (!names.has(required)) throw new Error(`Missing required Worker secret name: ${required}`);
          }
          for (const forbidden of [
            'SUPABASE_SERVICE_ROLE_KEY',
            'WHATSAPP_ACCESS_TOKEN',
            'WHATSAPP_PHONE_NUMBER_ID',
            'WHATSAPP_WABA_ID',
          ]) {
            if (names.has(forbidden)) throw new Error(`Forbidden global/legacy Worker secret name present: ${forbidden}`);
          }
          console.log(`SAFE_SECRET_NAMES=${JSON.stringify([...names].sort())}`);
          NODE

          base="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 https://whatsapp.vishartattoo.com/webhook || true)"
          wrong="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 'https://whatsapp.vishartattoo.com/webhook?hub.mode=subscribe&hub.verify_token=definitely-wrong-operator-token&hub.challenge=123456' || true)"
          [ "$base" = '403' ]
          [ "$wrong" = '403' ]

      - name: Safe summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RC25 WhatsApp Supabase backend-secret provisioning'
            echo
            echo "- Exact RC25 ancestor: \`$RELEASE_SHA\`"
            echo '- Existing Supabase modern secret only; this workflow never creates, rotates or deletes an API key'
            echo '- Secret value is transferred directly to Cloudflare encrypted secret input and never printed or uploaded'
            echo '- Worker: `vishar-whatsapp-webhook-production` only'
            echo '- No database mutation, Meta call, message send, billing action or drain activation exists in this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
