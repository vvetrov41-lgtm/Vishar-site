name: Import healed fresh pair images

on:
  push:
    branches:
      - agent/site-healed-paired-comparison
    paths:
      - .github/workflows/import-healed-fresh-pairs.yml

permissions:
  contents: write

jobs:
  import-fresh-pairs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/site-healed-paired-comparison
          fetch-depth: 0

      - name: Download prepared fresh images
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://at.adobe.com/oqdlZm71PuaFPMS8' \
            -o /tmp/healed-fresh-pairs.tar.gz
          echo '8cd0bbfae041c833a9d18ce04bca18ba86b41b4d8e420293e0bb2ee7fefe7a31  /tmp/healed-fresh-pairs.tar.gz' | sha256sum -c -

      - name: Install and verify 25 fresh sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/healed-fresh-pairs
          mkdir -p /tmp/healed-fresh-pairs assets/healed/fresh/thumbs
          tar -xzf /tmp/healed-fresh-pairs.tar.gz -C /tmp/healed-fresh-pairs
          for i in $(seq -w 1 25); do
            test -f "/tmp/healed-fresh-pairs/${i}.webp"
            cp "/tmp/healed-fresh-pairs/${i}.webp" "assets/healed/fresh/${i}.webp"
          done
          test "$(find /tmp/healed-fresh-pairs -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" = '25'

      - name: Install image tooling
        run: npm ci

      - name: Generate responsive fresh thumbnails
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const widths = [320, 480, 720, 960];
          for (let n = 1; n <= 25; n += 1) {
            const stem = String(n).padStart(2, '0');
            const input = path.join('assets', 'healed', 'fresh', `${stem}.webp`);
            for (const width of widths) {
              const output = path.join('assets', 'healed', 'fresh', 'thumbs', `${stem}-${width}.webp`);
              await sharp(input)
                .resize({ width, fit: 'inside', withoutEnlargement: false })
                .webp({ quality: 82, effort: 4 })
                .toFile(output);
            }
          }
          const files = await fs.readdir(path.join('assets', 'healed', 'fresh', 'thumbs'));
          if (files.filter((name) => name.endsWith('.webp')).length !== 100) {
            throw new Error('Expected 100 fresh thumbnails');
          }
          NODE

      - name: Commit imported images and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/import-healed-fresh-pairs.yml
          git add assets/healed/fresh .github/workflows/import-healed-fresh-pairs.yml
          test "$(find assets/healed/fresh -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" = '25'
          test "$(find assets/healed/fresh/thumbs -type f -name '*.webp' | wc -l | tr -d ' ')" = '100'
          git commit -m 'Add fresh images for healed comparisons'
          git push origin HEAD:agent/site-healed-paired-comparison
