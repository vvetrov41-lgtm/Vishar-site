name: Kristina booking contract audit 2026-08-24

on:
  push:
    branches:
      - agent/kristina-booking-contract-audit-20260824

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
      - name: Inspect live Kristina form contract without submitting
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            'https://www.kristinavishar.com/?booking-contract-audit=20260824' \
            -o /tmp/kristina.html
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          text = Path('/tmp/kristina.html').read_text(encoding='utf-8', errors='replace')

          def one(pattern):
              match = re.search(pattern, text, re.I | re.S)
              return match.group(1).strip() if match else None

          form_tag = one(r'(<form\b[^>]*(?:id=["\']tattoo-enquiry-form["\']|data-[^>]*booking)[^>]*>)')
          action = None
          method = None
          if form_tag:
              action = one_from = re.search(r'\baction=["\']([^"\']*)["\']', form_tag, re.I)
              action = action.group(1) if action else None
              method_m = re.search(r'\bmethod=["\']([^"\']*)["\']', form_tag, re.I)
              method = method_m.group(1) if method_m else None

          endpoint_assignments = []
          for name, value in re.findall(r'\b([A-Za-z_$][\w$]*(?:Endpoint|endpoint|URL|Url|url))\s*=\s*["\']([^"\']+)["\']', text):
              if value.startswith(('http://', 'https://', '/', './')):
                  endpoint_assignments.append({'name': name, 'value': value})

          fetch_literals = sorted(set(re.findall(r'fetch\(\s*["\']([^"\']+)["\']', text)))
          formdata_appends = sorted(set(re.findall(r'\.append\(\s*["\']([^"\']+)["\']', text)))
          formdata_sets = sorted(set(re.findall(r'\.set\(\s*["\']([^"\']+)["\']', text)))
          named_controls = sorted(set(re.findall(r'<(?:input|select|textarea)\b[^>]*\bname=["\']([^"\']+)["\']', text, re.I)))
          has_formdata = bool(re.search(r'new\s+FormData\s*\(', text))
          has_json_stringify = bool(re.search(r'JSON\.stringify\s*\(', text))
          content_types = sorted(set(re.findall(r'["\']Content-Type["\']\s*:\s*["\']([^"\']+)["\']', text, re.I)))

          submit_context = None
          anchors = [m.start() for m in re.finditer(r'(?:tattoo-enquiry-form|addEventListener\(\s*["\']submit["\']|fetch\s*\()', text, re.I)]
          if anchors:
              pos = anchors[-1]
              snippet = text[max(0, pos-2500):min(len(text), pos+7000)]
              # Keep only structure-relevant lines and redact arbitrary string contents not needed for routing.
              lines = []
              for raw in snippet.splitlines():
                  line = raw.strip()
                  if any(token in line for token in ('fetch(', 'FormData', '.append(', '.set(', 'Endpoint', 'endpoint', 'Content-Type', 'JSON.stringify', 'submit', 'privacy', 'idempot')):
                      lines.append(line[:500])
              submit_context = lines[:80]

          report = {
              'http_contract_audit': 'read_only',
              'form_action': action,
              'form_method': method,
              'endpoint_assignments': endpoint_assignments,
              'fetch_literals': fetch_literals,
              'uses_formdata': has_formdata,
              'uses_json_stringify': has_json_stringify,
              'explicit_content_types': content_types,
              'formdata_append_fields': formdata_appends,
              'formdata_set_fields': formdata_sets,
              'named_controls': named_controls,
              'submit_context': submit_context,
          }
          print(json.dumps(report, indent=2, ensure_ascii=True))
          PY
