name: Kristina booking contract audit 2026-08-24

on:
  push:
    branches:
      - agent/kristina-booking-contract-audit-20260824
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4

      - name: Read live browser contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            'https://www.kristinavishar.com/?booking-contract-audit=20260824' \
            -o /tmp/kristina.html
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('/tmp/kristina.html').read_text(encoding='utf-8', errors='replace')
          print(json.dumps({
            'fetch_literals': sorted(set(re.findall(r'fetch\(\s*["\']([^"\']+)["\']', text))),
            'uses_formdata': bool(re.search(r'new\s+FormData\s*\(', text)),
            'uses_json_stringify': bool(re.search(r'JSON\.stringify\s*\(', text)),
            'named_controls': sorted(set(re.findall(r'<(?:input|select|textarea)\b[^>]*\bname=["\']([^"\']+)["\']', text, re.I))),
            'has_started_at_runtime': bool(re.search(r'startedAt', text)),
          }, indent=2))
          PY

      - name: Submit one marked synthetic enquiry through exact live browser endpoint
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/e2e-reference.png
          started_at="$(( $(date +%s%3N) - 10000 ))"
          status="$(curl --silent --show-error \
            --request POST \
            --header 'Origin: https://www.kristinavishar.com' \
            --header 'Referer: https://www.kristinavishar.com/' \
            --output /tmp/response.txt \
            --write-out '%{http_code}' \
            --form-string 'name=E2E TEST KRISTINA BROWSER CONTRACT' \
            --form-string 'email=booking-e2e-kristina-browser-20260824@invalid.example' \
            --form-string 'phone=' \
            --form-string 'instagram=' \
            --form-string 'preferredReply=Email' \
            --form-string 'travellingFrom=Production E2E test' \
            --form-string 'projectType=Not sure yet' \
            --form-string 'placement=E2E test placement' \
            --form-string 'size=E2E test size' \
            --form-string 'coverUp=No' \
            --form-string 'timing=E2E TEST - safe to delete' \
            --form-string 'idea=PRODUCTION E2E TEST through the exact Kristina browser contract. Safe to delete.' \
            --form-string 'consent=on' \
            --form-string 'website=' \
            --form-string "startedAt=${started_at}" \
            --form 'references=@/tmp/e2e-reference.png;type=image/png;filename=e2e-reference.png' \
            'https://www.kristinavishar.com/api/booking')"
          echo "http_status=${status}"
          python3 - <<'PY'
          from pathlib import Path
          body = Path('/tmp/response.txt').read_text(encoding='utf-8', errors='replace')
          print('response_body=' + body[:2000].replace('\n',' '))
          PY
