name: PR 178 run consultation duration update

on:
  push:
    branches:
      - agent/appointment-types-foundation

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  apply-duration-policy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/appointment-types-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/appointment-types-foundation
          fetch-depth: 0

      - name: Verify temporary-only head
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EVENT_SHA" ]
          git merge-base --is-ancestor 5baeb61dd85ca7198644becbd334c8ba59d6409f HEAD
          mapfile -t changed < <(git diff --name-only 5baeb61dd85ca7198644becbd334c8ba59d6409f HEAD | sort)
          [ "${#changed[@]}" -eq 2 ]
          [ "${changed[0]}" = ".github/workflows/pr178-apply-consultation-duration-runner.yml" ]
          [ "${changed[1]}" = ".github/workflows/pr178-apply-consultation-duration.yml" ]

      - name: Execute scoped update and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/pr178-apply-consultation-duration.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('embedded update script markers are not unique')
          script = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(dedent(script), {'__name__': '__main__'})
          Path('.github/workflows/pr178-apply-consultation-duration-runner.yml').unlink()
          PY

          git diff --check
          allowed='^(.github/workflows/pr178-apply-consultation-duration-runner.yml|.github/workflows/pr178-apply-consultation-duration.yml|.github/workflows/pr178-staging-resume-e2e.yml|admin/src/pages/AppointmentsPage.tsx|admin/src/pages/ProjectDetailPage.tsx|admin/src/test/appointments-page.test.tsx|docs/crm/adr/0002-appointment-types-and-compatible-sessions.md|scripts/pr178-staging-appointments-e2e.sh|scripts/pr178-staging-post-migration-check.sh|supabase/migrations/0027_consultation_duration_bounds.sql|supabase/tests/160_appointment_types.sql)$'
          while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected changed path: $path" >&2; exit 1; }
          done < <(git status --short | sed 's/^...//')

      - name: Commit scoped source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Set consultation duration to 15-30 minutes"
          git push origin HEAD:agent/appointment-types-foundation
