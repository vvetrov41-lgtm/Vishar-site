name: Diagnose Vladimir Meta token identity (read only)

on:
  push:
    branches:
      - agent/meta-capi-token-identity-20261009

permissions:
  contents: read

jobs:
  identity:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: crm-production
    steps:
      - name: Check Meta system-user identity, scopes, Pixel, without disclosing credentials
        env:
          META_TOKEN: ${{ secrets.META_ADS_VLADIMIR_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.META_TOKEN;
          if (!token || /\\s/.test(token)) throw new Error('Secret missing or malformed');
          const base = 'https://graph.facebook.com/v26.0/';
          const get = async path => {
            const res = await fetch(base + path, {
              headers: { Authorization: 'Bearer ' + token },
              signal: AbortSignal.timeout(15000), redirect: 'error'
            });
            if (!res.ok) throw new Error('Meta read rejected, HTTP ' + res.status);
            return res.json();
          };
          let results = {};
          try {
            const me = await get('me?fields=id,name');
            results.me_name = typeof me.name === 'string' ? me.name.slice(0, 100) : '(none)';
            results.id_equals_current_gate = me.id === '61593708522729';
            const scopes = await get('me/permissions');
            results.ads_read_granted = Boolean(scopes.data?.some(x => x.permission === 'ads_read' && x.status === 'granted'));
            const pixel = await get('2163876287819749?fields=id');
            results.pixel_readable = pixel.id === '2163876287819749';
            try {
              const users = await get('692776505711216/system_users?fields=id,name&limit=100');
              const named = users.data?.filter(x => x.name === 'Vishar CRM Integration') || [];
              results.business_list_accessible = true;
              results.named_business_users = named.length;
              results.me_matches_named_business_user = named.some(x => x.id === me.id);
              results.canonical_gate_id_in_list = (users.data || []).some(x => x.id === '61593708522729');
            } catch (e) {
              results.business_list_accessible = false;
              results.business_list_http_error_only = e.message;
            }
            const rows = Object.entries(results).map(([k,v])=>'- '+k+': '+String(v).replace(/[|\\r\\n]/g,' '));
            const fs = await import('node:fs');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Meta token identity diagnosis (read only)\\n' + rows.join('\\n') + '\\n');
            console.log('Meta identity diagnostic finished; inspect sanitized step summary.');
          } catch(e) {
            throw new Error('Read-only Meta diagnostic failed: ' + (e.message.startsWith('Meta read rejected') ? e.message : 'provider read unsuccessful'));
          }
          NODE
