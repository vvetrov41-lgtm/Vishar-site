name: Firecrawl secret presence probe

on:
  push:
    branches:
      - 'release/private-crm-rc*-firecrawl-secret-probe'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: crm-production
    steps:
      - name: Check Firecrawl secret presence without revealing it
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${FIRECRAWL_API_KEY:-}" ]]; then
            echo 'FIRECRAWL_API_KEY_PRESENT=true'
          else
            echo 'FIRECRAWL_API_KEY_PRESENT=false'
          fi
