name: Report RC76 Instagram CRM Pages operator

on:
  push:
    branches:
      - ops/rc76-instagram-oauth-dispatch
    paths:
      - .github/workflows/report-rc76-instagram-crm-pages-operator.yml

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate protected CRM Pages operator and report on PR 379
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sleep 8
          rows="$(gh run list --repo "$REPO" --workflow rc76-instagram-crm-pages-operator.yml --branch ops/rc76-instagram-oauth-dispatch --event push --limit 1 --json databaseId,url,status,conclusion,headSha,createdAt)"
          ROWS="$rows" node <<'NODE' > /tmp/report.md
          const rows = JSON.parse(process.env.ROWS || '[]');
          if (!rows.length) throw new Error('No protected RC76 CRM Pages operator run found');
          const r = rows[0];
          console.log(`RC76 Instagram CRM Pages protected run: ${r.url}`);
          console.log(`status=${r.status}, conclusion=${r.conclusion || 'n/a'}, operator_head=${r.headSha}, created=${r.createdAt}`);
          console.log('Product source is pinned and revalidated inside the job at release/private-crm-rc76-instagram-communications @ 93f1bb9f3869b3bba63a8d6a56ef499e0106174c.');
          NODE
          gh pr comment 379 --repo "$REPO" --body-file /tmp/report.md
