name: Branch-only Telegram legacy-secret retirement refactor

on:
  push:
    branches:
      - agent/telegram-retire-legacy-production-secrets

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify bounded branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/telegram-retire-legacy-production-secrets'
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test -z "$(git status --porcelain)"

      - name: Apply guarded refactor
        run: node scripts/_branch_retire_telegram_legacy_secrets.mjs

      - name: Run focused production-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-telegram-production-preflight.mjs
          node scripts/test-telegram-production-config.mjs
          node scripts/test-private-production-release-orchestrator.mjs
          git diff --check
          if git grep -n 'ARTIST_TELEGRAM_' -- \
            scripts/preflight-telegram-production.mjs \
            scripts/generate-telegram-production-deploy-config.mjs \
            .github/workflows/private-production-release.yml \
            .github/workflows/deploy-private-production-telegram.yml; then
            echo 'Legacy Artist Telegram secret remains in a production contract' >&2
            exit 1
          fi

      - name: Remove branch-only refactor machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_branch_retire_telegram_legacy_secrets.mjs
          rm .github/workflows/_branch-retire-telegram-legacy-secrets.yml

      - name: Commit bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/preflight-telegram-production.mjs \
            scripts/generate-telegram-production-deploy-config.mjs \
            scripts/test-telegram-production-preflight.mjs \
            scripts/test-telegram-production-config.mjs \
            scripts/test-private-production-release-orchestrator.mjs \
            .github/workflows/private-production-release.yml \
            .github/workflows/deploy-private-production-telegram.yml \
            scripts/_branch_retire_telegram_legacy_secrets.mjs \
            .github/workflows/_branch-retire-telegram-legacy-secrets.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Retire legacy Telegram production Artist secret contract'
          git push origin HEAD:"$GITHUB_REF_NAME"
