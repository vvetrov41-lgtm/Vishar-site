name: Branch-only Telegram legacy-secret retirement refactor

on:
  push:
    branches:
      - agent/telegram-retire-legacy-production-secrets

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify bounded branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/telegram-retire-legacy-production-secrets'
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test -z "$(git status --porcelain)"

      - name: Apply guarded refactor
        run: node scripts/_branch_retire_telegram_legacy_secrets.mjs

      - name: Run focused production-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-telegram-production-preflight.mjs
          node scripts/test-telegram-production-config.mjs
          node scripts/test-private-production-release-orchestrator.mjs
          git diff --check
          if git grep -n 'ARTIST_TELEGRAM_' -- \
            scripts/preflight-telegram-production.mjs \
            scripts/generate-telegram-production-deploy-config.mjs \
            .github/workflows/private-production-release.yml \
            .github/workflows/deploy-private-production-telegram.yml; then
            echo 'Legacy Artist Telegram secret remains in a production contract' >&2
            exit 1
          fi

      - name: Materialize tested files outside workflow paths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .retirement-materialized
          mkdir -p .retirement-materialized
          cp scripts/preflight-telegram-production.mjs .retirement-materialized/preflight-telegram-production.mjs
          cp scripts/generate-telegram-production-deploy-config.mjs .retirement-materialized/generate-telegram-production-deploy-config.mjs
          cp scripts/test-telegram-production-preflight.mjs .retirement-materialized/test-telegram-production-preflight.mjs
          cp scripts/test-telegram-production-config.mjs .retirement-materialized/test-telegram-production-config.mjs
          cp scripts/test-private-production-release-orchestrator.mjs .retirement-materialized/test-private-production-release-orchestrator.mjs
          cp .github/workflows/private-production-release.yml .retirement-materialized/private-production-release.yml.txt
          cp .github/workflows/deploy-private-production-telegram.yml .retirement-materialized/deploy-private-production-telegram.yml.txt
          {
            echo "source_head=$(git rev-parse HEAD)"
            sha256sum .retirement-materialized/*.mjs .retirement-materialized/*.txt
          } > .retirement-materialized/MANIFEST.txt

      - name: Restore tracked tree and commit only materialized outputs
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .retirement-materialized
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Materialize tested Telegram retirement files'
          git push origin HEAD:"$GITHUB_REF_NAME"
