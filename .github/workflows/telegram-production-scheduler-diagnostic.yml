name: Telegram production scheduler diagnostic

on:
  push:
    branches:
      - agent/telegram-production-scheduler-diagnostic

permissions:
  contents: read
  statuses: write

concurrency:
  group: telegram-production-scheduler-diagnostic
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect scheduler without mutation
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: crm-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: vishar-telegram-drain-production

    steps:
      - name: Checkout diagnostic snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify read-only diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]
          [ "$GITHUB_REF_NAME" = 'agent/telegram-production-scheduler-diagnostic' ]
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]
          [ "$WORKER_NAME" = 'vishar-telegram-drain-production' ]

      - name: Publish diagnostic run link
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"vishar/telegram-scheduler-diagnostic",description:"Read-only production scheduler inspection is running.",target_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID}))')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked tooling
        run: npm ci

      - name: Read live cron trigger
        shell: bash
        run: |
          set -euo pipefail
          schedule_file="$RUNNER_TEMP/schedules.json"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$schedule_file" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules"
          node - "$schedule_file" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.success !== true || !Array.isArray(body.result)) {
            throw new Error('Cloudflare schedule readback failed');
          }
          const crons = body.result.map((row) => row?.cron).filter((v) => typeof v === 'string');
          console.log(JSON.stringify({ schedule_count: crons.length, crons }));
          if (crons.length !== 1 || crons[0] !== '*/5 * * * *') {
            throw new Error('Unexpected Telegram production cron');
          }
          NODE
          rm -f "$schedule_file"

      - name: Tail one cron window with redacted output
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sanitize-tail.cjs" <<'NODE'
          const readline = require('readline');
          const rl = readline.createInterface({ input: process.stdin, crlfDelay: Infinity });
          const safePrefixes = [
            'telegram outbox drain',
            'telegram outbox drain failed',
            'gmail outbox shared drain',
            'gmail outbox shared drain failed',
          ];
          let scheduled = 0;
          for await (const line of rl) {
            let value;
            try { value = JSON.parse(line); } catch { continue; }
            const event = value?.event || {};
            const isScheduled = Object.prototype.hasOwnProperty.call(event, 'scheduledTime')
              || Object.prototype.hasOwnProperty.call(event, 'cron');
            if (!isScheduled) continue;
            scheduled += 1;
            const safe = {
              event: 'scheduled',
              outcome: typeof value?.outcome === 'string' ? value.outcome : 'unknown',
              timestamp: Number.isFinite(value?.eventTimestamp) ? value.eventTimestamp : null,
              cron: typeof event?.cron === 'string' ? event.cron : null,
              logs: [],
            };
            for (const entry of Array.isArray(value?.logs) ? value.logs : []) {
              const raw = Array.isArray(entry?.message) ? entry.message.join(' ') : String(entry?.message ?? '');
              if (!safePrefixes.some((prefix) => raw.startsWith(prefix))) continue;
              safe.logs.push(raw.slice(0, 500));
            }
            console.log(JSON.stringify(safe));
          }
          console.log(JSON.stringify({ scheduled_events_seen: scheduled }));
          NODE

          set +e
          timeout 390s npx wrangler tail "$WORKER_NAME" --format json --sampling-rate 1 \
            2>"$RUNNER_TEMP/wrangler-tail.stderr" \
            | node "$RUNNER_TEMP/sanitize-tail.cjs"
          tail_status=${PIPESTATUS[0]}
          set -e
          if [ "$tail_status" -ne 0 ] && [ "$tail_status" -ne 124 ]; then
            echo "wrangler tail failed with status ${tail_status}" >&2
            sed -E 's/(Bearer|token|secret)[^ ]*/[redacted]/Ig' "$RUNNER_TEMP/wrangler-tail.stderr" | tail -n 20 >&2
            exit "$tail_status"
          fi
          rm -f "$RUNNER_TEMP/sanitize-tail.cjs" "$RUNNER_TEMP/wrangler-tail.stderr"

      - name: Publish diagnostic completion
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state='success'
          description='Read-only scheduler diagnostic completed.'
          if [ "$JOB_STATUS" != 'success' ]; then
            state='error'
            description='Read-only scheduler diagnostic did not complete successfully.'
          fi
          payload="$(STATE="$state" DESCRIPTION="$description" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"vishar/telegram-scheduler-diagnostic",description:process.env.DESCRIPTION,target_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID}))')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
