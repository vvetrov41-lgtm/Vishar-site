name: RC76 Instagram CSP Pages run locator

on:
  push:
    branches:
      - ops/rc76-instagram-csp-pages-locator
    paths:
      - .github/workflows/rc76-instagram-csp-pages-locator.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate exact protected CRM Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: acf77918ecf1a6736d469f3c1e40193f54a6f0cb
        shell: bash
        run: |
          set -euo pipefail
          # Read-only locator for the exact protected Pages rollout created by the operator push.
          json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rc76-instagram-crm-pages-release-operator.yml/runs?branch=release/private-crm-rc76-instagram-crm-pages-operator&event=push&per_page=10")"
          RUN_JSON="$json" node <<'NODE' > "$RUNNER_TEMP/run.txt"
          const payload = JSON.parse(process.env.RUN_JSON || '{}');
          const target = process.env.TARGET_SHA;
          const run = (payload.workflow_runs || []).find((entry) => entry.head_sha === target);
          if (!run) process.exit(2);
          console.log(`${run.html_url}\n${run.status}\n${run.conclusion || 'n/a'}\n${run.id}`);
          NODE
          mapfile -t fields < "$RUNNER_TEMP/run.txt"
          body=$(printf 'RC76 Instagram CSP Pages operator status:\nproduction=%s status=%s conclusion=%s head=%s run_id=%s\n' "${fields[0]}" "${fields[1]}" "${fields[2]}" "$TARGET_SHA" "${fields[3]}")
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/379/comments" -f body="$body" >/dev/null
