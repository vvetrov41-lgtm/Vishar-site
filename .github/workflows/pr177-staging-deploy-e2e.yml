name: PR 177 retained staging deploy and E2E

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current green PR 177 head SHA
        required: true
        type: string
      confirmation:
        description: Type DEPLOY PR177 TO RETAINED STAGING ONLY
        required: true
        type: string
  pull_request_review:
    types:
      - submitted

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr177-retained-staging-mutation
  cancel-in-progress: false

jobs:
  retained-staging:
    name: Guarded migration, deploy and hosted E2E
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.action == 'submitted' &&
        github.event.review.state == 'commented' &&
        github.event.review.body == 'DEPLOY PR177 TO RETAINED STAGING ONLY' &&
        github.event.sender.login == 'vvetrov41-lgtm' &&
        github.event.pull_request.number == 177 &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.draft == true &&
        github.event.pull_request.head.ref == 'agent/multi-artist-payments-foundation' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPROVED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_sha || github.event.pull_request.head.sha }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || github.event.review.body }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Fail closed before checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = "DEPLOY PR177 TO RETAINED STAGING ONLY" ]
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [ "$GITHUB_REF_NAME" = "agent/multi-artist-payments-foundation" ]
              [ "$APPROVED_SHA" = "$GITHUB_SHA" ]
              ;;
            pull_request_review)
              jq -e --arg sha "$APPROVED_SHA" --arg repo "$GITHUB_REPOSITORY" '
                .action == "submitted"
                and .review.state == "commented"
                and .review.body == "DEPLOY PR177 TO RETAINED STAGING ONLY"
                and .sender.login == "vvetrov41-lgtm"
                and .pull_request.number == 177
                and .pull_request.state == "open"
                and .pull_request.draft == true
                and .pull_request.head.ref == "agent/multi-artist-payments-foundation"
                and .pull_request.head.sha == $sha
                and .pull_request.head.repo.full_name == $repo
              ' "$GITHUB_EVENT_PATH" >/dev/null
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Check out the exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify PR state, ancestry and completed normal CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          git merge-base --is-ancestor 04cea62317dc33322e5c2e198a7a9a6b709af0b4 "$APPROVED_SHA"

          gh api "repos/$GITHUB_REPOSITORY/pulls/177" > "$RUNNER_TEMP/pr.json"
          jq -e --arg sha "$APPROVED_SHA" '
            .state == "open" and .draft == true and .merged == false
            and .head.ref == "agent/multi-artist-payments-foundation"
            and .head.sha == $sha
          ' "$RUNNER_TEMP/pr.json" >/dev/null

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,event,head_sha}' \
            | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in "Static Validation" "CRM and booking validation"; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[]; .name == $name and .head_sha == $sha
                       and .status == "completed" and .conclusion == "success")
            ' "$RUNNER_TEMP/runs.json" >/dev/null
          done

      - name: Verify staging-only encrypted configuration is present
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_ACCESS_TOKEN STAGING_SUPABASE_DB_PASSWORD STAGING_SUPABASE_URL \
            STAGING_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          [ "${#missing[@]}" -eq 0 ] || {
            printf 'Missing encrypted staging configuration names: %s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          }
          case "$STAGING_SUPABASE_URL" in
            https://gwaliusblwrzisrwnsvs.supabase.co) ;;
            *) echo 'STAGING_SUPABASE_URL is not the retained staging project' >&2; exit 1 ;;
          esac
          case "$STAGING_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo 'Staging browser key is not a publishable key' >&2; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned repository dependencies
        run: npm ci

      - name: Snapshot, dry-run and apply migrations 0015 through 0025
        run: bash scripts/pr177-staging-validation.sh migrate

      - name: Configure trusted source and metadata-only artist route
        run: bash scripts/pr177-staging-validation.sh metadata

      - name: Install artist binding, remove legacy bindings and deploy Worker
        run: bash scripts/pr177-staging-validation.sh worker

      - name: Build and deploy exact booking and CRM artifacts
        run: bash scripts/pr177-staging-validation.sh pages

      - name: Run routed, fail-closed, CRM, RLS, Storage, audit and edge E2E
        run: bash scripts/pr177-staging-validation.sh e2e

      - name: Upload safe retained-staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr177-retained-staging-evidence-${{ env.APPROVED_SHA }}
          path: ${{ runner.temp }}/pr177-staging-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Record safe mutation result on PR 177
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr177-staging-evidence"
          positive=unavailable
          noroute=unavailable
          if [ -f "$evidence/summary.json" ]; then
            positive="$(jq -r '.positive_reference' "$evidence/summary.json")"
            noroute="$(jq -r '.no_route_reference' "$evidence/summary.json")"
          fi
          gh pr comment 177 --repo "$GITHUB_REPOSITORY" --body "<!-- pr177-retained-staging-deploy-e2e -->
          ### PR #177 retained hosted staging mutation

          - Exact reviewed and deployed SHA: `$APPROVED_SHA`
          - Guarded job: **$JOB_STATUS**
          - Database target: retained `vishar-crm-staging` only
          - Forward migrations: `0015–0025`
          - Hosted pgTAP expectation: `933`
          - PostgreSQL lint level: `error`
          - Worker target: `tattooai-preview`
          - Pages targets: `vishar-booking-staging`, `vishar-crm-staging`
          - Routed synthetic enquiry: `$positive`
          - Fail-closed synthetic enquiry: `$noroute`
          - Staging retained: `true`

          The attached Actions artifact contains only safe identifiers, counts, binding names and control results. It contains no credential values. Production was not targeted by this workflow."
