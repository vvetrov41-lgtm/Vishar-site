name: PR 180 calendar encryption key bootstrap

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'agent/google-calendar-oauth-connector' &&
      github.event.pull_request.base.ref == 'agent/google-calendar-foundation' &&
      contains(github.event.pull_request.body, '<!-- BOOTSTRAP_PR180_CALENDAR_KEY -->')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Generate and upload encryption key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          printf '%s' "$key" | npx --yes wrangler@4 secret put CALENDAR_TOKEN_ENCRYPTION_KEY --name vishar-calendar-staging
          unset key
