name: Gmail production rollout

on:
  push:
    branches:
      - 'release/private-crm-rc*-gmail-bootstrap'
      - 'release/private-crm-rc*-gmail-vladimir-read'
      - 'release/private-crm-rc*-gmail-vladimir-send'
      - 'release/private-crm-rc*-gmail-kristina-read'
      - 'release/private-crm-rc*-gmail-kristina-send'

permissions:
  actions: read
  contents: read

concurrency:
  group: gmail-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crm-production
    env:
      PRODUCT_BRANCH: agent/platform-telegram-self-service
      SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      GMAIL_WORKER_NAME: vishar-gmail-production
      GPT_WORKER_NAME: vishar-gpt-actions-production
      GMAIL_HOST: gmail.vishartattoo.com
      OPERATIONS_HOST: gpt-operations.vishartattoo.com
      GMAIL_STATE_NAMESPACE_TITLE: vishar-gmail-production-oauth-state
      GMAIL_TOKENS_NAMESPACE_TITLE: vishar-gmail-production-oauth-tokens
      GMAIL_DEPLOY_CONFIG: ${{ github.workspace }}/.wrangler.gmail.production.deploy.toml

    steps:
      - name: Resolve phase and verify production branch boundary
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^release/private-crm-rc[0-9]+-gmail-(bootstrap|vladimir-read|vladimir-send|kristina-read|kristina-send)$ ]]; then
            phase="${BASH_REMATCH[1]}"
          else
            echo 'Unexpected Gmail production operator branch.' >&2
            exit 1
          fi
          test "$SUPABASE_URL" = 'https://vfjexhfdbrjmuxfdvbdx.supabase.co'
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo 'Production publishable key is unavailable.' >&2; exit 1 ;; esac
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Checkout exact operator SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify operator SHA equals current platform head and exact-head CI is green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
          product_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test -n "$product_sha"
          test "$product_sha" = "$GITHUB_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs[] | {name,status,conclusion,head_sha,event}' | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in 'Static Validation' 'CRM and booking validation' 'Gmail production validation'; do
            jq -e --arg name "$workflow" --arg sha "$GITHUB_SHA" 'any(.[]; .name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/runs.json" >/dev/null
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate Gmail production exact head
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/test-gmail-production.mjs
          node scripts/test-gmail-rollout-phases.mjs
          node scripts/test-telegram-drain-worker.mjs
          node scripts/test-gpt-gmail-openapi.mjs
          npm run validate:gpt-actions
          npm run scan:secrets
          npx wrangler deploy --config wrangler.gmail.production.toml --dry-run --outdir .wrangler/gmail-production-rollout-dry-run
          npx wrangler deploy --config wrangler.gpt-actions.production.toml --dry-run --outdir .wrangler/gpt-production-rollout-dry-run

      - name: Resolve dedicated Gmail production KV namespaces
        id: kv
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          resolve_namespace() {
            local title="$1"
            local listing id created
            listing="$(curl --fail --silent --show-error "${auth[@]}" "$api?per_page=100")"
            id="$(jq -r --arg title "$title" '.result[]? | select(.title == $title) | .id' <<<"$listing")"
            if [ -z "$id" ] && [ "$PHASE" = 'bootstrap' ]; then
              created="$(jq -nc --arg title "$title" '{title:$title}' | curl --fail --silent --show-error "${auth[@]}" -X POST --data-binary @- "$api")"
              jq -e '.success == true' <<<"$created" >/dev/null
              id="$(jq -r '.result.id' <<<"$created")"
            fi
            if ! [[ "$id" =~ ^[0-9a-f]{32}$ ]]; then
              echo "Dedicated Gmail namespace $title is unavailable." >&2
              exit 1
            fi
            printf '%s' "$id"
          }

          state_id="$(resolve_namespace "$GMAIL_STATE_NAMESPACE_TITLE")"
          tokens_id="$(resolve_namespace "$GMAIL_TOKENS_NAMESPACE_TITLE")"
          test "$state_id" != "$tokens_id"
          echo "state_id=$state_id" >> "$GITHUB_OUTPUT"
          echo "tokens_id=$tokens_id" >> "$GITHUB_OUTPUT"

      - name: Generate and validate exact production Gmail Worker config
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          GMAIL_KV_STATE_ID: ${{ steps.kv.outputs.state_id }}
          GMAIL_KV_TOKENS_ID: ${{ steps.kv.outputs.tokens_id }}
        run: |
          set -euo pipefail
          test "$(dirname "$GMAIL_DEPLOY_CONFIG")" = "$GITHUB_WORKSPACE"
          node scripts/generate-gmail-production-deploy-config.mjs "$GMAIL_DEPLOY_CONFIG" "$PHASE"
          grep -Fq 'main = "workers/gmail-production-entrypoint.js"' "$GMAIL_DEPLOY_CONFIG"
          grep -Fq 'SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"' "$GMAIL_DEPLOY_CONFIG"
          grep -Fq "id = \"$GMAIL_KV_STATE_ID\"" "$GMAIL_DEPLOY_CONFIG"
          grep -Fq "id = \"$GMAIL_KV_TOKENS_ID\"" "$GMAIL_DEPLOY_CONFIG"
          grep -Fq 'crons = []' "$GMAIL_DEPLOY_CONFIG"
          ! grep -Fq '*/5 * * * *' "$GMAIL_DEPLOY_CONFIG"
          case "$PHASE" in
            bootstrap)
              grep -Fq 'GMAIL_OAUTH_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_READ_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_DRAIN_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_VLADIMIR_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_KRISTINA_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              ;;
            vladimir-read)
              grep -Fq 'GMAIL_OAUTH_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_READ_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_DRAIN_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_VLADIMIR_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_KRISTINA_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              ;;
            vladimir-send)
              grep -Fq 'GMAIL_OAUTH_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_READ_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_DRAIN_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_VLADIMIR_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_KRISTINA_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              ;;
            kristina-read)
              grep -Fq 'GMAIL_OAUTH_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_READ_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_DRAIN_ENABLED = "false"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_VLADIMIR_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_KRISTINA_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              ;;
            kristina-send)
              grep -Fq 'GMAIL_OAUTH_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_READ_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_DRAIN_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_VLADIMIR_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              grep -Fq 'GMAIL_KRISTINA_ENABLED = "true"' "$GMAIL_DEPLOY_CONFIG"
              ;;
          esac
          npx wrangler deploy --config "$GMAIL_DEPLOY_CONFIG" --name "$GMAIL_WORKER_NAME" --dry-run --outdir .wrangler/gmail-production-generated-phase

      - name: Deploy bootstrap Gmail Worker and provision only generated encryption key
        if: ${{ steps.phase.outputs.phase == 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config "$GMAIL_DEPLOY_CONFIG" --name "$GMAIL_WORKER_NAME" --strict
          secrets_json="$(npx wrangler secret list --config "$GMAIL_DEPLOY_CONFIG" --name "$GMAIL_WORKER_NAME" --format json)"
          if ! jq -e 'any(.[]; .name == "GMAIL_TOKEN_ENCRYPTION_KEY")' <<<"$secrets_json" >/dev/null; then
            node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64url'))" \
              | npx wrangler secret put GMAIL_TOKEN_ENCRYPTION_KEY --config "$GMAIL_DEPLOY_CONFIG" --name "$GMAIL_WORKER_NAME"
          fi

      - name: Verify Gmail Worker secrets before OAuth/read activation
        if: ${{ steps.phase.outputs.phase != 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config "$GMAIL_DEPLOY_CONFIG" --name "$GMAIL_WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const entries = JSON.parse(process.env.SECRET_LIST || '[]');
          const names = new Set(entries.map((entry) => entry?.name).filter(Boolean));
          const required = [
            'GOOGLE_OAUTH_CLIENT_ID',
            'GOOGLE_OAUTH_CLIENT_SECRET',
            'GMAIL_TOKEN_ENCRYPTION_KEY',
            'SUPABASE_SECRET_KEY',
          ];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) throw new Error(`Production Gmail Worker is missing ${missing.join(', ')}`);
          NODE

      - name: Deploy activated Gmail Worker phase
        if: ${{ steps.phase.outputs.phase != 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail
          # Activation phases intentionally change reviewed feature flags. The
          # generated-config assertions above are the fail-closed authorization
          # boundary; Wrangler --strict would reject those expected differences.
          npx wrangler deploy --config "$GMAIL_DEPLOY_CONFIG" --name "$GMAIL_WORKER_NAME"

      - name: Deploy GPT service binding without changing GPT OAuth/capability gates
        if: ${{ steps.phase.outputs.phase == 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.gpt-actions.production.toml --name "$GPT_WORKER_NAME" --strict \
            --var SUPABASE_URL:"$SUPABASE_URL" \
            --var SUPABASE_PUBLISHABLE_KEY:"$SUPABASE_PUBLISHABLE_KEY" \
            --var VISHAR_ENVIRONMENT:production \
            --var GPT_OAUTH_RELAY_ENABLED:true \
            --var GPT_ACTIONS_ENABLED:true

      - name: Read back Gmail direct schedule count
        shell: bash
        run: |
          set -euo pipefail
          schedules="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GMAIL_WORKER_NAME/schedules")"
          SCHEDULES="$schedules" node <<'NODE'
          const payload = JSON.parse(process.env.SCHEDULES || '{}');
          const result = payload.result;
          const schedules = Array.isArray(result) ? result : Array.isArray(result?.schedules) ? result.schedules : null;
          if (payload.success !== true || schedules === null || schedules.length !== 0) {
            throw new Error('Gmail Worker direct Cron Trigger count is not zero');
          }
          console.log('Gmail direct cron count: 0');
          NODE

      - name: Verify production edge state
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          set -euo pipefail
          start_slug='vladimir'
          if [[ "$PHASE" == kristina-* ]]; then start_slug='kristina'; fi
          for attempt in $(seq 1 20); do
            privacy="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$OPERATIONS_HOST/privacy" || true)"
            ops="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$OPERATIONS_HOST/v1/enquiries/11111111-1111-4111-8111-111111111111/gmail/history" || true)"
            start_headers="$(curl -sS -D - -o /dev/null --max-time 10 "https://$GMAIL_HOST/oauth/google/start/$start_slug" || true)"
            start_status="$(printf '%s' "$start_headers" | awk 'toupper($1) ~ /^HTTP\// {status=$2} END {print status}')"
            if [ "$privacy" = 200 ] && [ "$ops" = 401 ]; then
              if [ "$PHASE" = 'bootstrap' ] && [ "$start_status" = 404 ]; then exit 0; fi
              if [ "$PHASE" != 'bootstrap' ] && [ "$start_status" = 302 ] && grep -qi '^location: https://accounts.google.com/' <<<"$start_headers"; then exit 0; fi
            fi
            sleep 6
          done
          echo 'Production Gmail/GPT edge did not reach the expected phase state.' >&2
          exit 1

      - name: Remove generated Gmail deploy config
        if: always()
        shell: bash
        run: rm -f "$GMAIL_DEPLOY_CONFIG"

      - name: Production Gmail rollout summary
        if: always()
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          {
            echo '### Production Gmail rollout'
            echo "- Exact SHA: \`$GITHUB_SHA\`"
            echo "- Operator branch: \`$GITHUB_REF_NAME\`"
            echo "- Phase: \`$PHASE\`"
            echo '- Product lineage: current `agent/platform-telegram-self-service` head'
            echo '- Gmail Worker: `vishar-gmail-production`'
            echo '- Gmail OAuth domain: `gmail.vishartattoo.com`'
            echo '- Gmail direct Cron Trigger count: `0`'
            echo '- Shared scheduler remains `vishar-telegram-drain-production` via `GMAIL_SERVICE`'
            echo '- GPT Operations domain remains `gpt-operations.vishartattoo.com`'
            echo '- Gmail state/token KV namespaces: dedicated production-only namespaces'
            echo '- Calendar Worker/token/KV bindings: untouched'
            echo '- Tracked Gmail config: inert; activation exists only in generated ephemeral deploy config'
            echo '- Staging Supabase/Workers/KV: not referenced or mutated'
          } >> "$GITHUB_STEP_SUMMARY"
