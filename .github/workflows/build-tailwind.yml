name: Build Tailwind CSS

on:
  workflow_dispatch:

concurrency:
  group: build-tailwind
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:tailwind

      - name: Verify compiled CSS output
        run: |
          test -f assets/css/tailwind.css
          size=$(wc -c < assets/css/tailwind.css)
          echo "tailwind.css size: ${size} bytes"
          if [ "$size" -lt 5000 ]; then
            echo "Compiled CSS appears too small; failing."
            exit 1
          fi

      - name: Validate full site
        run: npm run validate:site

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: build Tailwind CSS artifact"
          branch: chore/build-tailwind
          delete-branch: true
          title: "chore: rebuild Tailwind CSS"
          body: |
            Automated rebuild of `assets/css/tailwind.css` from `assets/css/input.css` and the current page content, triggered manually via `workflow_dispatch`.

            This PR was opened by the `Build Tailwind CSS` workflow after `npm run validate:site` passed against the rebuilt CSS. It contains no changes if the compiled output is unchanged from what's already committed.
          add-paths: |
            assets/css/tailwind.css
