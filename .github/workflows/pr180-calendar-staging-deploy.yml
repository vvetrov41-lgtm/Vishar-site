name: PR 180 calendar staging deploy

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr180-calendar-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, '<!-- DEPLOY_PR180_CALENDAR_STAGING -->')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Fail-closed PR guard
        shell: bash
        env:
          EXPECTED_REPOSITORY: vvetrov41-lgtm/Vishar-site
          EXPECTED_HEAD_REF: agent/google-calendar-oauth-connector
          EXPECTED_BASE_REF: agent/google-calendar-foundation
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTUAL_STATE: ${{ github.event.pull_request.state }}
          ACTUAL_DRAFT: ${{ github.event.pull_request.draft }}
          ACTUAL_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTUAL_HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$ACTUAL_BASE_REF" = "$EXPECTED_BASE_REF"
          test "$ACTUAL_STATE" = "open"
          test "$ACTUAL_DRAFT" = "true"
          test "$ACTUAL_MERGED" = "false"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify isolated staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node scripts/validate-calendar-staging.mjs --deploy-ready
          grep -Fx 'name = "vishar-calendar-staging"' wrangler.calendar.staging.toml
          grep -Fx 'workers_dev = false' wrangler.calendar.staging.toml
          grep -F 'calendar-staging.vishartattoo.com' wrangler.calendar.staging.toml
          grep -F 'workers/calendar-oauth.js' wrangler.calendar.staging.toml
          grep -Fx 'CRM_RETURN_URL = "https://vishar-crm-staging.pages.dev/#/integrations/calendar"' wrangler.calendar.staging.toml
          grep -Fx 'CRM_APPOINTMENTS_URL = "https://vishar-crm-staging.pages.dev/#/appointments"' wrangler.calendar.staging.toml
          grep -Fx 'CALENDAR_ACCESS_TEAM_DOMAIN = "https://vishar-site-pages.cloudflareaccess.com"' wrangler.calendar.staging.toml
          grep -Fx 'CALENDAR_ACCESS_AUD = "2a0569d2cc1acb785ccf190585be7ca9cad70fe6db7042a8094bf39160a26013"' wrangler.calendar.staging.toml
          grep -Fx 'CALENDAR_DRAIN_ENABLED = "false"' wrangler.calendar.staging.toml
          test "$(grep -c '^\[\[kv_namespaces\]\]$' wrangler.calendar.staging.toml)" = "2"
          grep -Fx 'binding = "CALENDAR_OAUTH_STATE"' wrangler.calendar.staging.toml
          grep -Fx 'binding = "CALENDAR_OAUTH_TOKENS"' wrangler.calendar.staging.toml
          ! grep -E 'tattooai-preview|intake-staging|vishar-booking-staging|production' wrangler.calendar.staging.toml
          ! grep -Eq '^\[triggers\]$|^crons\s*=' wrangler.calendar.staging.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Deploy isolated Worker with encrypted secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          CALENDAR_TOKEN_ENCRYPTION_KEY: ${{ secrets.CALENDAR_TOKEN_ENCRYPTION_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID \
            GOOGLE_OAUTH_CLIENT_SECRET CALENDAR_TOKEN_ENCRYPTION_KEY SUPABASE_SECRET_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          [ "${#missing[@]}" -eq 0 ] || {
            printf 'Missing encrypted staging configuration names: %s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          }

          secrets_file="$RUNNER_TEMP/calendar-worker-secrets.json"
          deploy_config="$RUNNER_TEMP/wrangler.calendar.deploy.toml"
          export secrets_file deploy_config
          trap 'rm -f "$secrets_file" "$deploy_config"' EXIT
          python - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          client_id = os.environ['GOOGLE_OAUTH_CLIENT_ID'].strip()
          if not client_id.endswith('.apps.googleusercontent.com'):
              raise SystemExit('GOOGLE_OAUTH_CLIENT_ID has an unexpected format')

          raw_key = os.environ['CALENDAR_TOKEN_ENCRYPTION_KEY'].strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]+={0,2}', raw_key):
              raise SystemExit('CALENDAR_TOKEN_ENCRYPTION_KEY is not base64url')
          padded = raw_key + '=' * (-len(raw_key) % 4)
          try:
              decoded = base64.urlsafe_b64decode(padded)
          except Exception as exc:
              raise SystemExit('CALENDAR_TOKEN_ENCRYPTION_KEY is not valid base64url') from exc
          if len(decoded) != 32:
              raise SystemExit('CALENDAR_TOKEN_ENCRYPTION_KEY must decode to exactly 32 bytes')

          payload = {
              'GOOGLE_OAUTH_CLIENT_ID': client_id,
              'GOOGLE_OAUTH_CLIENT_SECRET': os.environ['GOOGLE_OAUTH_CLIENT_SECRET'],
              'CALENDAR_TOKEN_ENCRYPTION_KEY': raw_key,
              'SUPABASE_SECRET_KEY': os.environ['SUPABASE_SECRET_KEY'],
          }
          secrets_path = Path(os.environ['secrets_file'])
          secrets_path.write_text(json.dumps(payload), encoding='utf-8')
          secrets_path.chmod(0o600)

          source = Path('wrangler.calendar.staging.toml').read_text(encoding='utf-8').splitlines()
          output = []
          skipping_routes = False
          removed_routes = False
          for line in source:
              if not skipping_routes and re.match(r'^routes\s*=\s*\[\s*$', line):
                  skipping_routes = True
                  removed_routes = True
                  continue
              if skipping_routes:
                  if line.strip() == ']':
                      skipping_routes = False
                  continue
              output.append(line)
          if skipping_routes or not removed_routes:
              raise SystemExit('Expected one top-level routes array in canonical staging config')
          deploy_text = '\n'.join(output).rstrip() + '\n'
          if 'custom_domain' in deploy_text or re.search(r'^routes\s*=', deploy_text, re.M):
              raise SystemExit('Dashboard-managed routes were not removed from deploy config')
          if not re.search(r'^workers_dev\s*=\s*false$', deploy_text, re.M):
              raise SystemExit('workers_dev must remain disabled in deploy config')
          deploy_path = Path(os.environ['deploy_config'])
          deploy_path.write_text(deploy_text, encoding='utf-8')
          deploy_path.chmod(0o600)
          PY

          npx wrangler deploy \
            --config "$deploy_config" \
            --keep-vars \
            --secrets-file "$secrets_file"
          rm -f "$secrets_file" "$deploy_config"
          trap - EXIT

      - name: Verify Cloudflare Access gates the custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --write-out '%{http_code}' --max-time 10 https://calendar-staging.vishartattoo.com/health || true)"
            echo "HTTP_AFTER_DEPLOY=$status"
            case "$status" in
              302|303|307|401|403)
                rm -f "$headers"
                exit 0
                ;;
              200)
                rm -f "$headers"
                echo 'Access is not gating the calendar staging hostname yet.' >&2
                exit 1
                ;;
            esac
            rm -f "$headers"
            sleep 6
          done
          echo 'Calendar staging hostname did not return an Access response.' >&2
          exit 1
