          Path('admin/src/test/consequential-actions.test.tsx').write_text("""import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';
import { fireEvent, screen, waitFor, within } from '@testing-library/react';
import { App } from '../App';
import { confirmConsequentialAction } from '../lib/confirm-action';
import {
  ENQUIRY_ID,
  PROJECT_ID,
  renderWithSession,
} from './fixtures';

beforeEach(() => {
  vi.mocked(window.confirm).mockReset();
  vi.mocked(window.confirm).mockReturnValue(true);
});

afterEach(() => {
  vi.clearAllMocks();
});

describe('consequential action confirmations', () => {
  it('does not convert an enquiry when confirmation is declined', async () => {
    vi.mocked(window.confirm).mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/enquiries/${ENQUIRY_ID}`,
      enquiryStatus: 'accepted',
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /convert to project/i }));

    expect(window.confirm).toHaveBeenCalledWith(expect.stringMatching(/cannot be undone/i));
    expect(rpcCalls.some((entry) => entry.name === 'convert_enquiry_to_project')).toBe(false);
  });

  it('converts an enquiry after confirmation', async () => {
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/enquiries/${ENQUIRY_ID}`,
      enquiryStatus: 'accepted',
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /convert to project/i }));

    await waitFor(() => {
      expect(rpcCalls.some((entry) => entry.name === 'convert_enquiry_to_project')).toBe(true);
    });
  });

  it('does not cancel a session when confirmation is declined', async () => {
    vi.mocked(window.confirm).mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/projects/${PROJECT_ID}`,
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /^cancel$/i }));

    expect(window.confirm).toHaveBeenCalledWith(expect.stringMatching(/active schedule/i));
    expect(rpcCalls.some((entry) => entry.name === 'set_session_status')).toBe(false);
  });

  it('cancels a session after confirmation', async () => {
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/projects/${PROJECT_ID}`,
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /^cancel$/i }));

    await waitFor(() => {
      expect(rpcCalls.some((entry) => (
        entry.name === 'set_session_status' && entry.args.p_status === 'cancelled'
      ))).toBe(true);
    });
  });

  it('keeps ordinary session confirmation free of an extra prompt', async () => {
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/projects/${PROJECT_ID}`,
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /^confirm$/i }));

    await waitFor(() => {
      expect(rpcCalls.some((entry) => (
        entry.name === 'set_session_status' && entry.args.p_status === 'confirmed'
      ))).toBe(true);
    });
    expect(window.confirm).not.toHaveBeenCalled();
  });

  it('deactivates another user only after confirmation', async () => {
    vi.mocked(window.confirm).mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, { role: 'owner', path: '/users', rpcCalls });

    await screen.findByText('Manager');
    const managerRow = screen.getByLabelText('Role for Manager').closest('.row') as HTMLElement;
    const deactivate = within(managerRow).getByRole('button', { name: /deactivate/i });

    fireEvent.click(deactivate);
    expect(rpcCalls.some((entry) => entry.name === 'set_profile_active')).toBe(false);

    vi.mocked(window.confirm).mockReturnValue(true);
    fireEvent.click(deactivate);

    await waitFor(() => {
      expect(rpcCalls.some((entry) => (
        entry.name === 'set_profile_active' && entry.args.p_is_active === false
      ))).toBe(true);
    });
    expect(window.confirm).toHaveBeenCalledWith(expect.stringMatching(/withdrawn immediately/i));
  });

  it('reactivates a user without a confirmation prompt', async () => {
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, { role: 'owner', path: '/users', rpcCalls });

    await screen.findByText('Former');
    const formerRow = screen.getByLabelText('Role for Former').closest('.row') as HTMLElement;
    fireEvent.click(within(formerRow).getByRole('button', { name: /reactivate/i }));

    await waitFor(() => {
      expect(rpcCalls.some((entry) => (
        entry.name === 'set_profile_active' && entry.args.p_is_active === true
      ))).toBe(true);
    });
    expect(window.confirm).not.toHaveBeenCalled();
  });

  it('provides localised no-show confirmation copy', () => {
    vi.mocked(window.confirm).mockReturnValue(false);

    expect(confirmConsequentialAction('markNoShow', 'ru', '10:00')).toBe(false);
    expect(window.confirm).toHaveBeenCalledWith(expect.stringMatching(/клиент не пришёл/i));
  });
});
""")
          PY

      - name: Validate private CRM
        id: validate
        working-directory: admin
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run typecheck
          npm run build

      - name: Commit focused changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            admin/src/lib/confirm-action.ts \
            admin/src/pages/EnquiryDetailPage.tsx \
            admin/src/pages/ProjectDetailPage.tsx \
            admin/src/pages/UsersPage.tsx \
            admin/src/test/setup.ts \
            admin/src/test/consequential-actions.test.tsx
          git diff --cached --check
          git commit -m "Add confirmations for consequential CRM actions"
          git push origin HEAD:agent/multi-artist-payments-foundation

      - name: Record patch outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          gh pr comment 177 --repo "$GITHUB_REPOSITORY" --body "<!-- pr177-consequential-confirmations --> Confirmation patch workflow: apply=${APPLY_OUTCOME:-unknown}, validate=${VALIDATE_OUTCOME:-unknown}, commit=${COMMIT_OUTCOME:-unknown}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
