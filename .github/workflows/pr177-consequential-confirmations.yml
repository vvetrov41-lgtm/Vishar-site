          Path('admin/src/test/consequential-actions.test.tsx').write_text("""import { afterEach, describe, expect, it, vi } from 'vitest';
import { fireEvent, screen, waitFor, within } from '@testing-library/react';
import { App } from '../App';
import {
  ENQUIRY_ID,
  PROJECT_ID,
  renderWithSession,
} from './fixtures';

afterEach(() => {
  vi.restoreAllMocks();
});

describe('consequential action confirmations', () => {
  it('does not convert an enquiry when confirmation is declined', async () => {
    const confirm = vi.spyOn(window, 'confirm').mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/enquiries/${ENQUIRY_ID}`,
      enquiryStatus: 'accepted',
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /convert to project/i }));

    expect(confirm).toHaveBeenCalledWith(expect.stringMatching(/cannot be undone/i));
    expect(rpcCalls.some((entry) => entry.name === 'convert_enquiry_to_project')).toBe(false);
  });

  it('does not cancel a session when confirmation is declined', async () => {
    const confirm = vi.spyOn(window, 'confirm').mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/projects/${PROJECT_ID}`,
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /^cancel$/i }));

    expect(confirm).toHaveBeenCalledWith(expect.stringMatching(/active schedule/i));
    expect(rpcCalls.some((entry) => entry.name === 'set_session_status')).toBe(false);
  });

  it('marks a confirmed session as no-show only after confirmation', async () => {
    const confirm = vi.spyOn(window, 'confirm').mockReturnValue(true);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/projects/${PROJECT_ID}`,
      sessionStatus: 'confirmed',
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /mark no-show/i }));

    await waitFor(() => {
      expect(rpcCalls).toContainEqual({
        name: 'set_session_status',
        args: { p_session_id: expect.any(String), p_status: 'no_show' },
      });
    });
    expect(confirm).toHaveBeenCalledWith(expect.stringMatching(/did not attend/i));
  });

  it('keeps ordinary session confirmation free of an extra prompt', async () => {
    const confirm = vi.spyOn(window, 'confirm').mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, {
      role: 'booking_manager',
      path: `/projects/${PROJECT_ID}`,
      rpcCalls,
    });

    fireEvent.click(await screen.findByRole('button', { name: /^confirm$/i }));

    await waitFor(() => {
      expect(rpcCalls.some((entry) => (
        entry.name === 'set_session_status' && entry.args.p_status === 'confirmed'
      ))).toBe(true);
    });
    expect(confirm).not.toHaveBeenCalled();
  });

  it('deactivates another user only after confirmation', async () => {
    const confirm = vi.spyOn(window, 'confirm').mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, { role: 'owner', path: '/users', rpcCalls });

    await screen.findByText('Manager');
    const managerRow = screen.getByLabelText('Role for Manager').closest('.row') as HTMLElement;
    const deactivate = within(managerRow).getByRole('button', { name: /deactivate/i });

    fireEvent.click(deactivate);
    expect(rpcCalls.some((entry) => entry.name === 'set_profile_active')).toBe(false);

    confirm.mockReturnValue(true);
    fireEvent.click(deactivate);

    await waitFor(() => {
      expect(rpcCalls.some((entry) => (
        entry.name === 'set_profile_active' && entry.args.p_is_active === false
      ))).toBe(true);
    });
    expect(confirm).toHaveBeenCalledWith(expect.stringMatching(/withdrawn immediately/i));
  });

  it('reactivates a user without a confirmation prompt', async () => {
    const confirm = vi.spyOn(window, 'confirm').mockReturnValue(false);
    const rpcCalls: { name: string; args: any }[] = [];
    renderWithSession(<App />, { role: 'owner', path: '/users', rpcCalls });

    await screen.findByText('Former');
    const formerRow = screen.getByLabelText('Role for Former').closest('.row') as HTMLElement;
    fireEvent.click(within(formerRow).getByRole('button', { name: /reactivate/i }));

    await waitFor(() => {
      expect(rpcCalls.some((entry) => (
        entry.name === 'set_profile_active' && entry.args.p_is_active === true
      ))).toBe(true);
    });
    expect(confirm).not.toHaveBeenCalled();
  });
});
""")
