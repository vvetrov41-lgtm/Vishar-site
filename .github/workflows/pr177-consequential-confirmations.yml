name: PR 177 consequential confirmations patch

on:
  push:
    branches:
      - agent/multi-artist-payments-foundation
    paths:
      - .github/workflows/pr177-consequential-confirmations.yml

permissions:
  contents: write

concurrency:
  group: pr177-consequential-confirmations-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow creation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard branch and expected parent
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "agent/multi-artist-payments-foundation" ]
          [ "$(git rev-parse HEAD^)" = "a54f0e3be3ccfff99655b55600b030d48a68ff6f" ]

      - name: Apply focused confirmation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          Path('admin/src/lib/confirm-action.ts').write_text("""import type { Language } from './i18n';

export type ConsequentialAction =
  | 'convertEnquiry'
  | 'cancelSession'
  | 'markNoShow'
  | 'deactivateUser';

const COPY: Record<Language, Record<ConsequentialAction, string>> = {
  en: {
    convertEnquiry: 'Convert this enquiry to a project? This creates a permanent project link and cannot be undone.',
    cancelSession: 'Cancel this session? It will be removed from the active schedule.',
    markNoShow: 'Mark this session as a no-show? This records that the client did not attend.',
    deactivateUser: 'Deactivate this user? Their CRM access will be withdrawn immediately.',
  },
  ru: {
    convertEnquiry: 'Преобразовать эту заявку в проект? Будет создана постоянная связь с проектом, которую нельзя отменить.',
    cancelSession: 'Отменить этот сеанс? Он будет удалён из активного расписания.',
    markNoShow: 'Отметить неявку на этот сеанс? Будет записано, что клиент не пришёл.',
    deactivateUser: 'Деактивировать пользователя? Его доступ к CRM будет отозван немедленно.',
  },
};

export function confirmConsequentialAction(
  action: ConsequentialAction,
  language: Language,
  subject?: string
): boolean {
  const message = subject ? `${COPY[language][action]}\n\n${subject}` : COPY[language][action];
  return window.confirm(message);
}
""")

          replace_once(
