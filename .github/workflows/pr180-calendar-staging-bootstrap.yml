name: PR 180 calendar staging bootstrap

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr180-calendar-staging-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.ref == 'agent/google-calendar-oauth-connector' &&
      github.event.pull_request.base.ref == 'agent/google-calendar-foundation' &&
      contains(github.event.pull_request.body, '<!-- SETUP_PR180_CALENDAR_STAGING -->')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Fail-closed repository guard
        shell: bash
        env:
          EXPECTED_REPOSITORY: vvetrov41-lgtm/Vishar-site
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$ACTUAL_HEAD"
          grep -Fx 'name = "vishar-calendar-staging"' wrangler.calendar.staging.toml
          grep -Fx 'workers_dev = false' wrangler.calendar.staging.toml
          grep -F 'calendar-staging.vishartattoo.com' wrangler.calendar.staging.toml
          ! grep -E 'tattooai-preview|intake-staging|vishar-booking-staging|production' wrangler.calendar.staging.toml

      - name: Check health before Access setup
        id: health_before
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/calendar-health-before --write-out '%{http_code}' --max-time 15 https://calendar-staging.vishartattoo.com/health)"
          echo "HTTP_BEFORE_ACCESS=$status"
          if [ "$status" = "200" ]; then
            grep -F '"service":"vishar-calendar-oauth"' /tmp/calendar-health-before
          fi

      - name: Create or verify owner-only Access and KV namespaces
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE'
          const fs = await import('node:fs');

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const host = 'calendar-staging.vishartattoo.com';
          const appName = 'Vishar Calendar Staging';
          const ownerEmail = 'vvetrov41@gmail.com';
          const workerName = 'vishar-calendar-staging';
          const expectedSecrets = [
            'GOOGLE_OAUTH_CLIENT_ID',
            'GOOGLE_OAUTH_CLIENT_SECRET',
            'CALENDAR_TOKEN_ENCRYPTION_KEY',
            'CALENDAR_OWNER_EMAILS',
            'VLADIMIR_ARTIST_ID',
            'VLADIMIR_GOOGLE_EMAIL',
            'KRISTINA_ARTIST_ID',
            'KRISTINA_GOOGLE_EMAIL',
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
          ];

          async function cf(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = {}; }
            if (!response.ok || body.success === false) {
              const messages = [...(body.errors || []), ...(body.messages || [])]
                .map((item) => item.message || item.code)
                .filter(Boolean)
                .join('; ');
              throw new Error(`Cloudflare API ${init.method || 'GET'} ${path} failed (${response.status})${messages ? `: ${messages}` : ''}`);
            }
            return body.result;
          }

          function isHostDestination(app) {
            return app.domain === host || (app.destinations || []).some((item) => item.type === 'public' && item.uri === host);
          }

          function exactOwnerPolicy(policy) {
            const include = Array.isArray(policy.include) ? policy.include : [];
            const exclude = Array.isArray(policy.exclude) ? policy.exclude : [];
            const requireRules = Array.isArray(policy.require) ? policy.require : [];
            return policy.name === 'Owner only' &&
              policy.decision === 'allow' &&
              include.length === 1 &&
              include[0]?.email?.email?.toLowerCase() === ownerEmail &&
              exclude.length === 0 &&
              requireRules.length === 0;
          }

          const apps = await cf(`/accounts/${accountId}/access/apps?per_page=100`);
          const matchingApps = (apps || []).filter(isHostDestination);
          console.log(`ACCESS_PREEXISTING=${matchingApps.length === 1}`);
          if (matchingApps.length > 1) throw new Error(`Multiple Access applications protect ${host}`);

          let app = matchingApps[0];
          if (!app) {
            app = await cf(`/accounts/${accountId}/access/apps`, {
              method: 'POST',
              body: JSON.stringify({
                name: appName,
                domain: host,
                type: 'self_hosted',
                session_duration: '24h',
                app_launcher_visible: false,
                allow_authenticate_via_warp: false,
                destinations: [{ type: 'public', uri: host }],
              }),
            });
            console.log('ACCESS_CREATED=true');
          } else {
            console.log('ACCESS_CREATED=false');
          }

          if (app.name !== appName || app.type !== 'self_hosted' || !isHostDestination(app)) {
            throw new Error('Existing Access application does not match the required staging configuration');
          }

          let policies = await cf(`/accounts/${accountId}/access/apps/${app.id}/policies?per_page=100`);
          const ownerPolicies = (policies || []).filter((policy) => policy.name === 'Owner only');
          if (ownerPolicies.length > 1) throw new Error('Multiple Owner only policies found');
          if (ownerPolicies.length === 0) {
            await cf(`/accounts/${accountId}/access/apps/${app.id}/policies`, {
              method: 'POST',
              body: JSON.stringify({
                name: 'Owner only',
                decision: 'allow',
                include: [{ email: { email: ownerEmail } }],
                exclude: [],
                require: [],
                session_duration: '24h',
                precedence: 1,
              }),
            });
            console.log('ACCESS_POLICY_CREATED=true');
            policies = await cf(`/accounts/${accountId}/access/apps/${app.id}/policies?per_page=100`);
          } else {
            console.log('ACCESS_POLICY_CREATED=false');
          }

          if ((policies || []).length !== 1 || !exactOwnerPolicy(policies[0])) {
            throw new Error('Access policy set is not exactly one owner-email Allow policy');
          }

          let namespaces = await cf(`/accounts/${accountId}/storage/kv/namespaces?per_page=100`);
          async function ensureNamespace(title) {
            let matches = (namespaces || []).filter((item) => item.title === title);
            console.log(`${title}_PREEXISTING=${matches.length === 1}`);
            if (matches.length > 1) throw new Error(`Multiple KV namespaces named ${title}`);
            if (matches.length === 0) {
              const created = await cf(`/accounts/${accountId}/storage/kv/namespaces`, {
                method: 'POST',
                body: JSON.stringify({ title }),
              });
              matches = [created];
              namespaces = [...(namespaces || []), created];
              console.log(`${title}_CREATED=true`);
            } else {
              console.log(`${title}_CREATED=false`);
            }
            return matches[0];
          }

          const stateNamespace = await ensureNamespace('CALENDAR_OAUTH_STATE');
          const tokenNamespace = await ensureNamespace('CALENDAR_OAUTH_TOKENS');

          const settings = await cf(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
          const bindings = Array.isArray(settings?.bindings) ? settings.bindings : [];
          const bindingSummary = bindings.map((binding) => `${binding.name}:${binding.type}`).sort();
          console.log(`WORKER_BINDINGS_BEFORE=${bindingSummary.join(',')}`);
          console.log(`KV_BINDINGS_PREEXISTING=${bindings.some((b) => b.name === 'CALENDAR_OAUTH_STATE') || bindings.some((b) => b.name === 'CALENDAR_OAUTH_TOKENS')}`);

          const subdomain = await cf(`/accounts/${accountId}/workers/scripts/${workerName}/subdomain`);
          if (subdomain?.enabled !== false) throw new Error('workers.dev is enabled for the calendar staging Worker');
          console.log('WORKERS_DEV_ENABLED=false');

          const secrets = await cf(`/accounts/${accountId}/workers/scripts/${workerName}/secrets`);
          const secretNames = new Set((secrets || []).map((item) => item.name));
          const missingSecrets = expectedSecrets.filter((name) => !secretNames.has(name));
          if (missingSecrets.length) throw new Error(`Missing Worker secrets: ${missingSecrets.join(', ')}`);
          console.log(`EXPECTED_SECRET_COUNT=${expectedSecrets.length}`);
          console.log('EXPECTED_SECRETS_PRESENT=true');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `access_app_id=${app.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `state_namespace_id=${stateNamespace.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tokens_namespace_id=${tokenNamespace.id}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Calendar staging bootstrap\n` +
            `- Access app: ${appName} (${app.id})\n` +
            `- Policy: Owner only (${ownerEmail})\n` +
            `- CALENDAR_OAUTH_STATE: ${stateNamespace.id}\n` +
            `- CALENDAR_OAUTH_TOKENS: ${tokenNamespace.id}\n` +
            `- workers.dev: disabled\n` +
            `- Expected Worker secrets: present\n`);
          NODE

      - name: Verify Access now gates the hostname
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --write-out '%{http_code}' --max-time 15 https://calendar-staging.vishartattoo.com/health)"
          echo "HTTP_AFTER_ACCESS=$status"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")"
          if [ "$status" = "200" ]; then
            echo 'Access did not gate the hostname.' >&2
            exit 1
          fi
          case "$status" in
            302|303|307|401|403) ;;
            *) echo "Unexpected Access response: $status" >&2; exit 1 ;;
          esac
          if [ -n "$location" ]; then
            printf 'ACCESS_REDIRECT_HOST=%s\n' "$(printf '%s' "$location" | sed -E 's#https?://([^/]+).*#\1#')"
          fi
