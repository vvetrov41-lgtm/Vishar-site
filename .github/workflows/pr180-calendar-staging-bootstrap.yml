name: PR 180 calendar KV bootstrap

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr180-calendar-kv-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.ref == 'agent/google-calendar-oauth-connector' &&
      github.event.pull_request.base.ref == 'agent/google-calendar-foundation' &&
      contains(github.event.pull_request.body, '<!-- SETUP_PR180_CALENDAR_KV -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Fail-closed staging guard
        shell: bash
        env:
          EXPECTED_REPOSITORY: vvetrov41-lgtm/Vishar-site
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$ACTUAL_HEAD"
          grep -Fx 'name = "vishar-calendar-staging"' wrangler.calendar.staging.toml
          grep -Fx 'workers_dev = false' wrangler.calendar.staging.toml
          ! grep -E 'tattooai-preview|intake-staging|vishar-booking-staging|production' wrangler.calendar.staging.toml

      - name: Create or verify calendar KV namespaces
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE'
          const fs = await import('node:fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;

          async function cf(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              const message = [...(body.errors || []), ...(body.messages || [])]
                .map((item) => item.message || item.code)
                .filter(Boolean)
                .join('; ');
              throw new Error(`Cloudflare API ${init.method || 'GET'} ${path} failed (${response.status})${message ? `: ${message}` : ''}`);
            }
            return body.result;
          }

          let namespaces = await cf(`/accounts/${accountId}/storage/kv/namespaces?per_page=100`);
          async function ensureNamespace(title) {
            let matches = (namespaces || []).filter((item) => item.title === title);
            if (matches.length > 1) throw new Error(`Multiple KV namespaces named ${title}`);
            if (matches.length === 0) {
              const created = await cf(`/accounts/${accountId}/storage/kv/namespaces`, {
                method: 'POST',
                body: JSON.stringify({ title }),
              });
              namespaces = [...(namespaces || []), created];
              matches = [created];
              console.log(`${title}_CREATED=true`);
            } else {
              console.log(`${title}_CREATED=false`);
            }
            console.log(`${title}_ID=${matches[0].id}`);
            return matches[0];
          }

          const state = await ensureNamespace('CALENDAR_OAUTH_STATE');
          const tokens = await ensureNamespace('CALENDAR_OAUTH_TOKENS');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `state_namespace_id=${state.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tokens_namespace_id=${tokens.id}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Calendar OAuth KV\n- CALENDAR_OAUTH_STATE: ${state.id}\n- CALENDAR_OAUTH_TOKENS: ${tokens.id}\n`);
          NODE
