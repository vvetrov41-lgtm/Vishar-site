name: PR 180 fix async error boundary

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, '<!-- FIX_PR180_ASYNC_ERROR_BOUNDARY -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-calendar-oauth-connector
          fetch-depth: 1
      - name: Patch awaited route handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('workers/calendar-oauth.js')
          text = path.read_text()
          replacements = {
            "if (request.method === 'GET' && startMatch) return startOAuth(request, startMatch[1], env);": "if (request.method === 'GET' && startMatch) return await startOAuth(request, startMatch[1], env);",
            "return callback(request, env);": "return await callback(request, env);",
            "if (disconnectMatch) return disconnect(request, disconnectMatch[1], env);": "if (disconnectMatch) return await disconnect(request, disconnectMatch[1], env);",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- workers/calendar-oauth.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workers/calendar-oauth.js
          git commit -m 'Await Calendar OAuth route handlers'
          git push origin HEAD:agent/google-calendar-oauth-connector
