name: Calendar edge scope production sync

on:
  pull_request:
    paths:
      - 'scripts/calendar-edge-scope-sync.mjs'
      - 'scripts/test-calendar-edge-scope-sync.mjs'
      - '.github/workflows/calendar-edge-scope-production-sync.yml'
      - 'specs/universal-calendar-onboarding/**'
  push:
    branches:
      - 'release/private-crm-rc*-inventory-calendar-edge-scope-*'

permissions:
  actions: read
  contents: read

concurrency:
  group: calendar-edge-scope-production-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Calendar edge scope sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test fail-closed edge scope sync
        run: |
          set -euo pipefail
          node --check scripts/calendar-edge-scope-sync.mjs
          node --check scripts/test-calendar-edge-scope-sync.mjs
          node scripts/test-calendar-edge-scope-sync.mjs

  sync-production:
    name: Sync Calendar edge path and method scope
    if: >-
      github.event_name == 'push'
      && github.actor == github.repository_owner
      && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      CANONICAL_BRANCH: agent/platform-telegram-self-service
      APPROVED_SHA: ${{ github.event.before }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CALENDAR_HOST: calendar.vishartattoo.com
      CRM_ORIGIN: https://crm.vishartattoo.com
      MARKER_FILE: .github/ops-triggers/calendar-edge-scope-sync.trigger

    steps:
      - name: Checkout trigger ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable marker, canonical source and exact-head CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-inventory-calendar-edge-scope-*) ;;
            *) echo 'Calendar edge scope sync must use its isolated release namespace.' >&2; exit 1 ;;
          esac
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ -n "$CLOUDFLARE_API_TOKEN" ]

          parent_count="$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF-1}')"
          [ "$parent_count" = '1' ] || { echo 'Trigger must be a single-parent marker commit.' >&2; exit 1; }
          [ "$(git rev-parse "$GITHUB_SHA^")" = "$APPROVED_SHA" ]

          mapfile -t changed_files < <(git diff --name-only "$APPROVED_SHA" "$GITHUB_SHA")
          [ "${#changed_files[@]}" = '1' ]
          [ "${changed_files[0]}" = "$MARKER_FILE" ]
          [ "$(tr -d '\r\n' < "$MARKER_FILE")" = "sync:$APPROVED_SHA" ]

          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$APPROVED_SHA" ] || {
            echo 'Canonical moved before edge scope admission.' >&2
            exit 1
          }
          release_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$release_sha" = "$GITHUB_SHA" ]

          required_workflows=(
            'Static Validation'
            'CRM and booking validation'
            'Gmail production validation'
            'Booking host validation'
            'WhatsApp production onboarding validation'
          )
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/exact-head-runs.json"
          for workflow in "${required_workflows[@]}"; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[]; .name == $name and .head_sha == $sha
                       and .status == "completed" and .conclusion == "success")
            ' "$RUNNER_TEMP/exact-head-runs.json" >/dev/null || {
              echo "Required exact-head workflow is not green: $workflow" >&2
              exit 1
            }
          done

          git checkout --detach "$APPROVED_SHA"
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ -z "$(git status --short)" ]

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate fail-closed sync implementation
        run: |
          set -euo pipefail
          node --check scripts/calendar-edge-scope-sync.mjs
          node scripts/test-calendar-edge-scope-sync.mjs

      - name: Read the Calendar edge rule before mutation
        run: |
          set -euo pipefail
          node scripts/calendar-edge-scope-sync.mjs inspect --output "$RUNNER_TEMP/calendar-edge-before.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/calendar-edge-before.json', 'utf8'));
          if (state.host !== 'calendar.vishartattoo.com') throw new Error('unexpected Calendar host');
          if (state.source !== 'zone_legacy_firewall_rule') throw new Error('unexpected firewall source');
          if (state.rule_action !== 'block') throw new Error('unexpected rule action');
          if (state.allows_access_endpoints !== true) throw new Error('the rule does not exempt the Access endpoints');
          if (!/^[0-9a-f]{64}$/.test(state.current_expression_digest || '')) throw new Error('current digest missing');
          NODE

      # Record the live state after the path-specific OAuth Access Bypass rollout.
      # GET /start/* should already reach the public Worker and be rejected there;
      # POST/OPTIONS may still be stopped by the legacy firewall until this sync.
      - name: Record the Calendar edge behaviour before mutation
        shell: bash
        run: |
          set -euo pipefail
          known="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://$CALENDAR_HOST/oauth/google/start/vladimir" || true)"
          unknown="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://$CALENDAR_HOST/oauth/google/start/edge-scope-probe" || true)"
          post="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 -X POST -H "Origin: $CRM_ORIGIN" "https://$CALENDAR_HOST/oauth/google/start/edge-scope-probe" || true)"
          options="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 -X OPTIONS -H "Origin: $CRM_ORIGIN" "https://$CALENDAR_HOST/oauth/google/start/edge-scope-probe" || true)"
          echo "before: known_get=$known unknown_get=$unknown unknown_post=$post unknown_options=$options"
          echo "EDGE_BEFORE_KNOWN=$known" >> "$GITHUB_ENV"
          echo "EDGE_BEFORE_UNKNOWN=$unknown" >> "$GITHUB_ENV"
          echo "EDGE_BEFORE_POST=$post" >> "$GITHUB_ENV"
          echo "EDGE_BEFORE_OPTIONS=$options" >> "$GITHUB_ENV"

      - name: Recheck immutable source immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$APPROVED_SHA" ] || {
            echo 'Canonical moved after edge scope preflight.' >&2
            exit 1
          }
          release_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$release_sha" = "$GITHUB_SHA" ]

      - name: Replace only the Calendar path-scope expression
        run: |
          set -euo pipefail
          node scripts/calendar-edge-scope-sync.mjs sync --output "$RUNNER_TEMP/calendar-edge-sync.json"

      - name: Independent rule readback
        run: |
          set -euo pipefail
          node scripts/calendar-edge-scope-sync.mjs inspect --output "$RUNNER_TEMP/calendar-edge-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/calendar-edge-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/calendar-edge-after.json', 'utf8'));
          if (after.in_sync !== true) throw new Error('the Calendar edge rule does not match the generic scope');
          if (after.enumerates_artists !== false) throw new Error('the Calendar edge rule still names an artist');
          if (after.allows_access_endpoints !== true) throw new Error('the Calendar edge rule would block Cloudflare Access');
          if (after.filter_id !== before.filter_id) throw new Error('the Calendar filter identity changed');
          if (after.rule_id !== before.rule_id) throw new Error('the Calendar rule identity changed');
          if (after.rule_count !== before.rule_count) throw new Error('the firewall rule count changed');
          if (after.other_rules_digest !== before.other_rules_digest) throw new Error('a neighbouring firewall rule changed');
          NODE

      # OAuth start and callback are intentionally path-specific Access Bypasses.
      # Prove the exact GET/POST/OPTIONS behaviour reaches the Worker, while
      # host-level operator routes and unrelated edge paths stay protected.
      - name: Verify OAuth start methods reach Worker and deny-by-default holds
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 20); do
            get_status="$(curl -sS -o "$RUNNER_TEMP/start-get.json" -w '%{http_code}' -m 15 "https://$CALENDAR_HOST/oauth/google/start/edge-scope-probe" || true)"
            post_status="$(curl -sS -o "$RUNNER_TEMP/start-post.json" -w '%{http_code}' -m 15 -X POST -H "Origin: $CRM_ORIGIN" "https://$CALENDAR_HOST/oauth/google/start/edge-scope-probe" || true)"
            options_headers="$(curl -sS -D - -o /dev/null -m 15 -X OPTIONS -H "Origin: $CRM_ORIGIN" "https://$CALENDAR_HOST/oauth/google/start/edge-scope-probe" || true)"
            options_status="$(printf '%s' "$options_headers" | awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}')"
            allow_origin="$(printf '%s' "$options_headers" | awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}')"

            if [ "$get_status" = '405' ] \
              && [ "$post_status" = '401' ] \
              && jq -e '.ok == false and .code == "calendar_session_required"' "$RUNNER_TEMP/start-post.json" >/dev/null 2>&1 \
              && [ "$options_status" = '204' ] \
              && [ "$allow_origin" = "$CRM_ORIGIN" ]; then
              ready=true
              break
            fi
            if [ "$get_status" = '200' ] || [ "$post_status" = '200' ]; then
              echo 'Unauthenticated Calendar OAuth start became usable.' >&2
              exit 1
            fi
            sleep 6
          done
          [ "$ready" = true ] || { echo 'Calendar OAuth POST/OPTIONS did not reach the public Worker with the expected authorization boundary.' >&2; exit 1; }

          known="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://$CALENDAR_HOST/oauth/google/start/vladimir" || true)"
          [ "$known" = '405' ] || { echo "Existing artist GET start boundary regressed: $known" >&2; exit 1; }

          callback="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://$CALENDAR_HOST/oauth/google/callback?state=edge-scope-probe" || true)"
          [ "$callback" = '400' ] || { echo "Public OAuth callback boundary regressed: $callback" >&2; exit 1; }

          health="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://$CALENDAR_HOST/health" || true)"
          case "$health" in 302|303|307|401|403) ;; *) echo "The protected health route regressed: $health" >&2; exit 1 ;; esac

          off_scope="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://$CALENDAR_HOST/edge-scope-probe" || true)"
          [ "$off_scope" = '403' ] || { echo "Deny-by-default was weakened: off-scope path returned $off_scope" >&2; exit 1; }

      - name: Upload sanitized edge scope evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-edge-scope-sync-${{ env.APPROVED_SHA }}
          path: |
            ${{ runner.temp }}/calendar-edge-before.json
            ${{ runner.temp }}/calendar-edge-sync.json
            ${{ runner.temp }}/calendar-edge-after.json
          if-no-files-found: error
          retention-days: 7

      - name: Boundary summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Calendar edge scope production sync'
            echo "- Exact canonical SHA: \`$APPROVED_SHA\`"
            echo "- Edge behaviour before: known GET \`$EDGE_BEFORE_KNOWN\`, unknown GET \`$EDGE_BEFORE_UNKNOWN\`, unknown POST \`$EDGE_BEFORE_POST\`, unknown OPTIONS \`$EDGE_BEFORE_OPTIONS\`"
            echo '- Mutation scope: one zone firewall rule expression at the Calendar hostname'
            echo '- Generic artist path scope preserved; POST and OPTIONS added only for `/oauth/google/start/*`'
            echo '- Kept: deny-by-default off connector routes, host-level Access protection, path-specific OAuth Bypass and Worker/Supabase authorization'
            echo '- Worker / Pages / Supabase mutation: none'
            echo '- Rule expressions and credentials: not printed'
          } >> "$GITHUB_STEP_SUMMARY"
