name: GPT production domain reconciliation

on:
  push:
    branches:
      - 'release/private-crm-rc*-inventory-gpt-domain-operator'

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-production-domain-reconciliation-${{ github.event.before || github.sha }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor == github.repository_owner && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      CANONICAL_BRANCH: agent/platform-telegram-self-service
      APPROVED_SHA: ${{ github.event.before }}
      WORKER_NAME: vishar-gpt-actions-production
      CORE_HOST: gpt-actions.vishartattoo.com
      OPERATIONS_HOST: gpt-operations.vishartattoo.com
      STALE_HOST: gpt-communications.vishartattoo.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact approved canonical source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify isolated operator trigger, immutable canonical SHA and exact-head CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-inventory-gpt-domain-operator) ;;
            *) echo 'GPT domain operator must use its reserved inventory-excluded release namespace.' >&2; exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" != "$APPROVED_SHA" ]
          [ "$(git rev-parse "$GITHUB_SHA^")" = "$APPROVED_SHA" ]
          [ "$(git rev-parse "$GITHUB_SHA^{tree}")" = "$(git rev-parse "$APPROVED_SHA^{tree}")" ]
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ -z "$(git status --short)" ]
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ -n "$canonical_sha" ]
          [ "$canonical_sha" = "$APPROVED_SHA" ] || {
            echo 'Approved operator SHA is no longer the current canonical Vishar CRM head.' >&2
            exit 1
          }

          required_workflows=(
            'Static Validation'
            'CRM and booking validation'
            'Gmail production validation'
            'Booking host validation'
            'WhatsApp production onboarding validation'
          )
          for attempt in $(seq 1 60); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
              --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' \
              | jq -s . > "$RUNNER_TEMP/exact-head-runs.json"
            all_green=true
            for workflow in "${required_workflows[@]}"; do
              if ! jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
                any(.[]; .name == $name and .head_sha == $sha
                         and .status == "completed" and .conclusion == "success")
              ' "$RUNNER_TEMP/exact-head-runs.json" >/dev/null; then
                all_green=false
              fi
            done
            if [ "$all_green" = true ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'Required exact-head CI did not become green within the bounded admission window.' >&2
              jq . "$RUNNER_TEMP/exact-head-runs.json" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate exact GPT production source before Cloudflare access
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run test:gpt-production
          node scripts/test-gpt-operations-domain.mjs
          node scripts/test-gpt-production-domain-reconciliation.mjs
          npm run check:gpt-production-bundle
          npm run scan:secrets
          [ "$(grep -c 'custom_domain = true' wrangler.gpt-actions.production.toml)" -eq 2 ]
          grep -Fq "pattern = \"$CORE_HOST\", custom_domain = true" wrangler.gpt-actions.production.toml
          grep -Fq "pattern = \"$OPERATIONS_HOST\", custom_domain = true" wrangler.gpt-actions.production.toml
          ! grep -Fq "$STALE_HOST" wrangler.gpt-actions.production.toml

      - name: Fresh read-only Cloudflare preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-gpt-production-domains.mjs

      - name: Reconcile only the stale GPT Communications Custom Domain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-gpt-production-domains.mjs --apply

      - name: Verify canonical GPT HTTP boundaries after readback
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            expected="$1"
            url="$2"
            actual="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            [ "$actual" = "$expected" ] || {
              echo "GPT boundary mismatch for $url: expected $expected, got $actual" >&2
              exit 1
            }
          }
          probe 200 "https://$CORE_HOST/privacy"
          probe 400 "https://$CORE_HOST/oauth/authorize"
          probe 401 "https://$CORE_HOST/v1/clients"
          probe 200 "https://$OPERATIONS_HOST/privacy"
          probe 401 "https://$OPERATIONS_HOST/v1/appointments"

      - name: Boundary summary
        if: always()
        shell: bash
        run: |
          {
            echo '### GPT production domain reconciliation'
            echo "- Exact canonical SHA: \`$APPROVED_SHA\`"
            echo "- Trigger SHA: \`$GITHUB_SHA\` (same tree, one no-op child commit)"
            echo '- Operator namespace: `release/private-crm-rc*-inventory-gpt-domain-operator`'
            echo '- Full production release/observer: excluded by the existing `inventory-*` namespace boundary'
            echo '- Branch-creation events: skipped before checkout; valid trigger concurrency is keyed by approved parent SHA'
            echo '- Canonical domains: `gpt-actions.vishartattoo.com`, `gpt-operations.vishartattoo.com`'
            echo '- Retired transition domain: `gpt-communications.vishartattoo.com` when present'
            echo '- Mutation acceptance: HTTP 2xx is provisional; fresh GET readback is authoritative'
            echo '- Production GPT Worker code/version mutation: none'
            echo '- Supabase mutation: none'
            echo '- Staging mutation: none'
            echo '- Failure mode: fail closed; ambiguous or failed post-mutation state restores the previous domain set'
          } >> "$GITHUB_STEP_SUMMARY"
