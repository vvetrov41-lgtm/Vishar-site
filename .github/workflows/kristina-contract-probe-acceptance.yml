name: Kristina contract probe acceptance

on:
  push:
    branches:
      - 'agent/kristina-probe-script-acceptance-20260919'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact PR probe against live production
        id: probe
        run: node scripts/probe-kristina-live-booking-contract.mjs
      - name: Publish acceptance status on probed SHA
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBED_SHA: ${{ github.event.before }}
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PROBED_SHA"             -f state="$state"             -f context='kristina-live-contract-acceptance'             -f description="No-write live Kristina booking contract probe: $OUTCOME"             -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
