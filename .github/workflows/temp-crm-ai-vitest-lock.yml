name: Temporary CRM AI Vitest lock repair

on:
  push:
    branches:
      - ops/crm-ai-vitest-audit-fix-20260908

permissions:
  contents: write

concurrency:
  group: temp-crm-ai-vitest-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: ops/crm-ai-vitest-audit-fix-20260908
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Generate patched lockfile
        working-directory: admin
        run: npm install --save-dev --save-exact vitest@4.1.11 --package-lock-only
      - name: Install locked dependencies
        working-directory: admin
        run: npm ci
      - name: Audit patched dependencies
        working-directory: admin
        run: npm audit --audit-level=moderate
      - name: Run CRM tests
        working-directory: admin
        run: npm test
      - name: Typecheck CRM
        working-directory: admin
        run: npm run typecheck
      - name: Commit generated dependency files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add admin/package.json admin/package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Test: update Vitest to patched 4.1.11"
          git push origin HEAD:ops/crm-ai-vitest-audit-fix-20260908
