name: One-shot lifecycle history UI patch

on:
  push:
    branches:
      - agent/lifecycle-execution-history-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lifecycle-execution-history-ui
          fetch-depth: 0
      - name: Apply guarded UI patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one guarded match, found {count}')
              p.write_text(text.replace(old, new, 1))

          page = 'admin/src/pages/LifecycleAutomationPage.tsx'
          test = 'admin/src/test/lifecycle-automation-page.test.tsx'

          replace_once(page,
          """import type {\n  ClientLifecyclePreview,\n""",
          """import type {\n  ClientLifecycleExecutionHistoryRow,\n  ClientLifecyclePreview,\n""")

          replace_once(page,
          """  variables: ClientLifecycleVariable[];\n  previewSessions: ClientLifecyclePreviewSession[];\n  canManage: boolean;\n  canPreview: boolean;\n""",
          """  variables: ClientLifecycleVariable[];\n  previewSessions: ClientLifecyclePreviewSession[];\n  history: ClientLifecycleExecutionHistoryRow[];\n  canManage: boolean;\n  canPreview: boolean;\n  canHistory: boolean;\n""")

          replace_once(page,
          """const PREVIEW_CAPABILITIES = [\n  'view_automations',\n  'view_sessions',\n  'view_clients',\n  'view_enquiries',\n  'view_integrations',\n  'view_finance',\n] as const;\n""",
          """const PREVIEW_CAPABILITIES = [\n  'view_automations',\n  'view_sessions',\n  'view_clients',\n  'view_enquiries',\n  'view_integrations',\n  'view_finance',\n] as const;\n\nconst HISTORY_CAPABILITIES = [\n  'view_automations',\n  'view_sessions',\n  'view_clients',\n  'view_integrations',\n] as const;\n""")

          replace_once(page,
          """    const [rules, templates, purposes, variables, previewSessions, capabilities, context] = await Promise.all([\n      api.listClientLifecycleRules(selectedArtistId),\n      api.listClientLifecycleTemplates(selectedArtistId),\n      api.listClientLifecycleTemplatePurposes(selectedArtistId),\n      api.listClientLifecycleTemplateVariables(selectedArtistId),\n      api.listClientLifecyclePreviewSessions(selectedArtistId),\n      api.listCapabilities(selectedArtistId),\n""",
          """    const [rules, templates, purposes, variables, previewSessions, history, capabilities, context] = await Promise.all([\n      api.listClientLifecycleRules(selectedArtistId),\n      api.listClientLifecycleTemplates(selectedArtistId),\n      api.listClientLifecycleTemplatePurposes(selectedArtistId),\n      api.listClientLifecycleTemplateVariables(selectedArtistId),\n      api.listClientLifecyclePreviewSessions(selectedArtistId),\n      api.listClientLifecycleExecutionHistory(selectedArtistId),\n      api.listCapabilities(selectedArtistId),\n""")

          replace_once(page,
          """      variables,\n      previewSessions,\n      canManage: granted.has('manage_automations'),\n      canPreview: PREVIEW_CAPABILITIES.every((capability) => granted.has(capability)),\n      workspaceId: context.workspace_id,\n""",
          """      variables,\n      previewSessions,\n      history,\n      canManage: granted.has('manage_automations'),\n      canPreview: PREVIEW_CAPABILITIES.every((capability) => granted.has(capability)),\n      canHistory: HISTORY_CAPABILITIES.every((capability) => granted.has(capability)),\n      workspaceId: context.workspace_id,\n""")

          replace_once(page,
          """      </Section>\n\n      <Section title={ru ? 'Правила' : 'Rules'}>\n""",
          """      </Section>\n\n      <Section title={ru ? 'История выполнения' : 'Execution history'}>\n        <LifecycleExecutionHistoryPanel\n          key={selectedArtistId}\n          ru={ru}\n          rows={data.history}\n          canView={data.canHistory}\n        />\n      </Section>\n\n      <Section title={ru ? 'Правила' : 'Rules'}>\n""")

          history_component = r'''function LifecycleExecutionHistoryPanel({
  ru,
  rows,
  canView,
}: {
  ru: boolean;
  rows: ClientLifecycleExecutionHistoryRow[];
  canView: boolean;
}) {
  if (!canView) {
    return (
      <EmptyState
        compact
        title={ru ? 'История недоступна' : 'History unavailable'}
        hint={ru
          ? 'Для истории нужен доступ к автоматизациям, клиентам, записям и интеграциям этого мастера.'
          : 'History requires access to this artist’s automations, clients, appointments and integrations.'}
      />
    );
  }

  if (rows.length === 0) {
    return (
      <EmptyState
        compact
        title={ru ? 'История пока пуста' : 'No execution history yet'}
        hint={ru
          ? 'Здесь появятся последние запланированные и выполненные автоматизации этого мастера.'
          : 'The latest scheduled and completed automations for this artist will appear here.'}
      />
    );
  }

  return (
    <div className="stack">
      <div className="meta">
        {ru
          ? 'Последние 50 задач. История доступна только для чтения и не показывает адреса получателей, текст писем или ошибки провайдера.'
          : 'Latest 50 jobs. History is read-only and never exposes recipient addresses, message bodies or raw provider errors.'}
      </div>
      {rows.map((row) => (
        <article className="card" key={row.job_id}>
          <div className="row" style={{ justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <strong>{row.rule_name}</strong>
              <div className="meta">
                {row.client_name}
                {' · '}{appointmentLabel(row.appointment_type, ru)}
                {' · '}{row.message_purpose}
                {' · '}v{row.rule_version}
              </div>
            </div>
            <span className={`badge ${executionBadgeClass(row.lifecycle_status)}`}>
              {executionStatusLabel(row.lifecycle_status, ru)}
            </span>
          </div>
          <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1fr)', gap: '4px', margin: '14px 0 0' }}>
            <dt className="meta">{ru ? 'Запланировано' : 'Scheduled for'}</dt>
            <dd style={{ margin: 0 }}>{formatDateTime(row.scheduled_at, ru ? 'ru' : 'en')}</dd>
            <dt className="meta">{ru ? 'Попытки' : 'Attempts'}</dt>
            <dd style={{ margin: 0 }}>{row.attempt_count}</dd>
            {row.failure_reason ? (
              <>
                <dt className="meta">{ru ? 'Причина' : 'Reason'}</dt>
                <dd style={{ margin: 0 }}>{failureReasonLabel(row.failure_reason, ru)}</dd>
              </>
            ) : null}
          </dl>
        </article>
      ))}
    </div>
  );
}

'''
          replace_once(page, "function LifecyclePreviewPanel({\n", history_component + "function LifecyclePreviewPanel({\n")

          history_helpers = r'''function executionStatusLabel(status: ClientLifecycleExecutionHistoryRow['lifecycle_status'], ru: boolean): string {
  const labels: Record<ClientLifecycleExecutionHistoryRow['lifecycle_status'], [string, string]> = {
    scheduled: ['Scheduled', 'Запланировано'],
    pending: ['Pending', 'Ожидает'],
    queued: ['Queued', 'В очереди'],
    sent: ['Sent', 'Отправлено'],
    suppressed: ['Suppressed', 'Отправка запрещена'],
    withdrawn: ['Withdrawn', 'Снято'],
    cancelled: ['Cancelled', 'Отменено'],
    failed: ['Failed', 'Ошибка'],
    retrying: ['Retrying', 'Повторная попытка'],
  };
  return labels[status][ru ? 1 : 0];
}

function executionBadgeClass(status: ClientLifecycleExecutionHistoryRow['lifecycle_status']): string {
  if (status === 'sent') return 'ok';
  if (['failed', 'suppressed', 'withdrawn', 'cancelled', 'retrying'].includes(status)) return 'warn';
  return '';
}

function failureReasonLabel(reason: string, ru: boolean): string {
  const labels: Record<string, [string, string]> = {
    client_suppressed: ['Client communications are suppressed', 'Коммуникации с клиентом отключены'],
    appointment_withdrawn: ['Appointment is no longer eligible', 'Запись больше не подходит для отправки'],
    integration_unavailable: ['Email integration is unavailable', 'Email-интеграция недоступна'],
    template_unavailable: ['Active template is unavailable', 'Нет подходящего активного шаблона'],
    destination_unavailable: ['Delivery destination is unavailable', 'Адрес доставки недоступен'],
    email_failed: ['Email preparation failed', 'Не удалось подготовить email'],
    provider_delivery_failed: ['Provider delivery failed', 'Провайдер не доставил сообщение'],
    delivery_state_missing: ['Delivery state could not be confirmed', 'Не удалось подтвердить состояние доставки'],
    automation_failed: ['Automation failed', 'Ошибка автоматизации'],
  };
  return labels[reason]?.[ru ? 1 : 0] ?? (ru ? 'Неизвестная причина' : 'Unknown failure reason');
}

'''
          replace_once(page, "function blockerLabel(blocker: string, ru: boolean): string {\n", history_helpers + "function blockerLabel(blocker: string, ru: boolean): string {\n")

          history_mock = r'''    listClientLifecycleExecutionHistory: vi.fn(async () => [{
      job_id: 'job-1',
      rule_id: 'rule-1',
      rule_name: '24 hour reminder',
      rule_version: 1,
      session_id: SESSION_ID,
      client_name: 'History Client',
      appointment_type: 'tattoo_session',
      message_purpose: 'session_reminder_24h',
      scheduled_at: '2026-08-26T10:00:00Z',
      lifecycle_status: 'scheduled',
      job_status: 'pending',
      email_status: null,
      outbox_status: null,
      failure_reason: null,
      attempt_count: 0,
      created_at: '2026-08-25T10:00:00Z',
      updated_at: '2026-08-25T10:00:00Z',
    }]),
'''
          replace_once(test, "    previewClientLifecycleRule: vi.fn(async () => ({\n", history_mock + "    previewClientLifecycleRule: vi.fn(async () => ({\n")

          replace_once(test,
          """    expect(screen.getByRole('button', { name: 'Show preview' })).toBeInTheDocument();\n    expect(screen.getByText('You can view these automations but cannot change them.')).toBeInTheDocument();\n""",
          """    expect(screen.getByRole('button', { name: 'Show preview' })).toBeInTheDocument();\n    expect(screen.getByText('Execution history')).toBeInTheDocument();\n    expect(screen.getByText('Scheduled')).toBeInTheDocument();\n    expect(screen.getByText('History Client')).toBeInTheDocument();\n    expect(screen.getByText('You can view these automations but cannot change them.')).toBeInTheDocument();\n""")

          history_test = r'''  it('renders only normalized execution-history failures through the bounded read RPC', async () => {
    const lifecycle = api(false, true);
    lifecycle.listClientLifecycleExecutionHistory.mockResolvedValue([{
      job_id: 'job-failed',
      rule_id: 'rule-1',
      rule_name: '24 hour reminder',
      rule_version: 1,
      session_id: SESSION_ID,
      client_name: 'History Client',
      appointment_type: 'tattoo_session',
      message_purpose: 'session_reminder_24h',
      scheduled_at: '2026-08-26T10:00:00Z',
      lifecycle_status: 'failed',
      job_status: 'completed',
      email_status: 'queued',
      outbox_status: 'dead',
      failure_reason: 'provider_delivery_failed',
      attempt_count: 3,
      created_at: '2026-08-25T10:00:00Z',
      updated_at: '2026-08-26T10:05:00Z',
    }]);
    vi.mocked(useArtistScope).mockReturnValue(artistScope(ARTIST_ID));
    vi.mocked(useApi).mockReturnValue(lifecycle);

    render(<LifecycleAutomationPage />);

    expect(await screen.findByText('Provider delivery failed')).toBeInTheDocument();
    expect(screen.getByText('Failed')).toBeInTheDocument();
    expect(screen.queryByText('provider_delivery_failed')).not.toBeInTheDocument();
    expect(lifecycle.listClientLifecycleExecutionHistory).toHaveBeenCalledWith(ARTIST_ID);
    expect(lifecycle.createClientLifecycleRule).not.toHaveBeenCalled();
    expect(lifecycle.upsertMessageTemplate).not.toHaveBeenCalled();
    expect(lifecycle.setAutomationRuleEnabled).not.toHaveBeenCalled();
    expect(lifecycle.setMessageTemplateActive).not.toHaveBeenCalled();
  });

'''
          replace_once(test, "  it('fails closed when the operator lacks the complete preview capability set', async () => {\n", history_test + "  it('fails closed when the operator lacks the complete preview capability set', async () => {\n")

          replace_once(test,
          """    expect(await screen.findByText('Preview unavailable')).toBeInTheDocument();\n    expect(screen.queryByRole('button', { name: 'Show preview' })).not.toBeInTheDocument();\n""",
          """    expect(await screen.findByText('Preview unavailable')).toBeInTheDocument();\n    expect(screen.getByText('History unavailable')).toBeInTheDocument();\n    expect(screen.queryByRole('button', { name: 'Show preview' })).not.toBeInTheDocument();\n""")

          replace_once(test,
          """    await screen.findByRole('button', { name: 'Показать предпросмотр' });\n    fireEvent.click(screen.getByRole('button', { name: 'Показать предпросмотр' }));\n""",
          """    await screen.findByRole('button', { name: 'Показать предпросмотр' });\n    expect(screen.getByText('История выполнения')).toBeInTheDocument();\n    expect(screen.getByText('Запланировано')).toBeInTheDocument();\n    fireEvent.click(screen.getByRole('button', { name: 'Показать предпросмотр' }));\n""")
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/lifecycle-history-ui-patch.yml
      - name: Commit bounded UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/src/pages/LifecycleAutomationPage.tsx admin/src/test/lifecycle-automation-page.test.tsx .github/workflows/lifecycle-history-ui-patch.yml
          git diff --cached --check
          git commit -m 'Add lifecycle execution history UI'
          git push origin HEAD:agent/lifecycle-execution-history-ui
