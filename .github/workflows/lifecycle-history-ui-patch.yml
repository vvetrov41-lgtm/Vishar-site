name: One-shot lifecycle history UI patch

on:
  push:
    branches:
      - agent/lifecycle-execution-history-ui

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lifecycle-execution-history-ui
          fetch-depth: 0
      - name: Apply guarded UI patch
        run: python scripts/one-shot-lifecycle-history-ui.py
      - name: Remove one-shot patcher files
        run: rm .github/workflows/lifecycle-history-ui-patch.yml scripts/one-shot-lifecycle-history-ui.py
      - name: Commit bounded UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/src/pages/LifecycleAutomationPage.tsx admin/src/test/lifecycle-automation-page.test.tsx .github/workflows/lifecycle-history-ui-patch.yml scripts/one-shot-lifecycle-history-ui.py
          git diff --cached --check
          git commit -m 'Add lifecycle execution history UI'
          git push origin HEAD:agent/lifecycle-execution-history-ui
