name: Enquiry AI production canary enable

on:
  push:
    branches:
      - 'release/private-crm-rc*-inventory-enquiry-ai-enable-canary'

permissions:
  contents: read

jobs:
  enable:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: crm-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact canonical one-file canary snapshot
        shell: bash
        run: |
          set -euo pipefail
          canonical="$(git ls-remote origin refs/heads/agent/platform-telegram-self-service | awk 'NR==1{print $1}')"
          test "$canonical" = '61a0735e8f726235283b3e09c804e436eee70839'
          test "$(git rev-parse HEAD^)" = "$canonical"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/enquiry-ai-production-canary-enable.yml'
          test "$PROJECT_REF" != 'gwaliusblwrzisrwnsvs'
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Resolve production pooler
        id: db
        shell: bash
        run: |
          set -euo pipefail
          region="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.region // empty')"
          [[ "$region" =~ ^[a-z0-9-]+$ ]]
          echo "host=aws-0-${region}.pooler.supabase.com" >> "$GITHUB_OUTPUT"
      - name: Enable text-only AI and verify clean live queue
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.host }}
        run: |
          set -euo pipefail
          conn="host=$DB_HOST port=5432 dbname=postgres user=postgres.$PROJECT_REF sslmode=require connect_timeout=10"
          psql "$conn" -v ON_ERROR_STOP=1 -X -q -c "update crm_private.enquiry_ai_config set enabled=true, images_enabled=false where singleton;"
          flag="$(psql "$conn" -v ON_ERROR_STOP=1 -X -Atq -c "select enabled::text || ',' || images_enabled::text from crm_private.enquiry_ai_config where singleton;")"
          test "$flag" = 'true,false'
          active="$(psql "$conn" -v ON_ERROR_STOP=1 -X -Atq -c "select count(*) from public.enquiry_ai_jobs where status in ('pending','processing');")"
          failed_ai="$(psql "$conn" -v ON_ERROR_STOP=1 -X -Atq -c "select count(*) from public.enquiry_ai_jobs where status='failed' and error_code='ai_unavailable';")"
          test "$active" = '0'
          test "$failed_ai" = '0'
          echo 'Production canary enabled with images disabled and no carried active/ai_unavailable jobs.'
