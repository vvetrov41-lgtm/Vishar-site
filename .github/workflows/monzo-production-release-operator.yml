name: Monzo production release operator

# Mutating Monzo production phases must enter crm-production from the approved
# release branch because the environment itself only permits release/private-crm-rc*.
# PR #307 is an operator-only draft whose head is that exact release branch.
# It is never a product base and must never be merged.

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: monzo-production-release-operator
  cancel-in-progress: false

env:
  OPERATOR_PR: '307'
  PRODUCT_PR: '304'
  PRODUCT_HEAD_BRANCH: claude/vishar-monzo-production-ejbe23
  OPERATOR_RELEASE_BRANCH: release/private-crm-rc34-monzo-production
  OPERATOR_BASE_BRANCH: agent/monzo-duration-tiered-deposits-production

jobs:
  authorize:
    name: Authorize release-branch Monzo production request
    if: >-
      github.event.action == 'edited' &&
      github.event.sender.login == 'vvetrov41-lgtm' &&
      github.event.pull_request.number == 307 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.ref == 'release/private-crm-rc34-monzo-production' &&
      github.event.pull_request.base.ref == 'agent/monzo-duration-tiered-deposits-production' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        contains(github.event.pull_request.body, format('<!-- RUN_MONZO_PRODUCTION_BOOTSTRAP:{0} -->', github.event.pull_request.head.sha)) ||
        contains(github.event.pull_request.body, format('<!-- RUN_MONZO_PRODUCTION_ROLLOUT:{0} -->', github.event.pull_request.head.sha))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      approved_sha: ${{ github.event.pull_request.head.sha }}
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Resolve the requested phase
        id: phase
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bootstrap=0; rollout=0
          case "$PR_BODY" in *"<!-- RUN_MONZO_PRODUCTION_BOOTSTRAP:${HEAD_SHA} -->"*) bootstrap=1 ;; esac
          case "$PR_BODY" in *"<!-- RUN_MONZO_PRODUCTION_ROLLOUT:${HEAD_SHA} -->"*) rollout=1 ;; esac
          total=$((bootstrap + rollout))
          if [ "$total" -ne 1 ]; then
            echo "Exactly one mutating activation marker must match this head; found ${total}." >&2
            exit 1
          fi
          if [ "$bootstrap" = 1 ]; then phase=bootstrap; else phase=rollout; fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Requested phase: $phase"

      - name: Checkout exact approved release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify release branch, ancestry and product PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --short)"

          release_tip="$(git ls-remote --heads origin "refs/heads/${OPERATOR_RELEASE_BRANCH}" | awk '{print $1}')"
          test "$release_tip" = "$APPROVED_SHA"

          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$APPROVED_SHA"

          product="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref] | @tsv')"
          IFS=$'\t' read -r state draft merged head_ref head_sha base_ref <<< "$product"
          test "$state" = open
          test "$draft" = true
          test "$merged" = false
          test "$head_ref" = "$PRODUCT_HEAD_BRANCH"
          test "$head_sha" = "$APPROVED_SHA"
          test "$base_ref" = "$OPERATOR_BASE_BRANCH"

          echo "Release branch and product PR #${PRODUCT_PR} both resolve to ${APPROVED_SHA}."

      - name: Confirm normal exact-head CI is green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          runs_file="$(mktemp)"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${APPROVED_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "none"), .started_at] | @tsv' \
            > "$runs_file"

          problems=''
          while IFS= read -r required; do
            latest="$(awk -F'\t' -v name="$required" '$1 == name { print $4 "\t" $2 "\t" $3 }' "$runs_file" | sort -r | head -1)"
            if [ -z "$latest" ]; then
              problems="${problems}${required}: absent; "
              continue
            fi
            status="$(printf '%s' "$latest" | cut -f2)"
            conclusion="$(printf '%s' "$latest" | cut -f3)"
            if [ "$status" != completed ] || [ "$conclusion" != success ]; then
              problems="${problems}${required}: ${status}/${conclusion}; "
            fi
          done <<'REQUIRED'
          static-validation
          Private CRM
          Supabase migrations and pgTAP
          Public site and Worker
          REQUIRED
          rm -f "$runs_file"
          if [ -n "$problems" ]; then
            echo "Normal exact-head CI is not green: ${problems}" >&2
            exit 1
          fi

      - name: Operator authorisation summary
        if: always()
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### Monzo production release operator'
            echo
            echo "- Operator PR: #${OPERATOR_PR} (draft, never merge)"
            echo "- Product PR: #${PRODUCT_PR} (verified open/draft/unmerged)"
            echo "- Release branch: \`${OPERATOR_RELEASE_BRANCH}\`"
            echo "- Approved SHA: \`${APPROVED_SHA}\`"
            echo "- Phase: \`${PHASE:-unresolved}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  bootstrap:
    name: Inert bootstrap
    needs: authorize
    if: needs.authorize.outputs.phase == 'bootstrap'
    uses: ./.github/workflows/deploy-private-production-monzo.yml
    with:
      approved_sha: ${{ needs.authorize.outputs.approved_sha }}
      deploy: true
      approval_phrase: BOOTSTRAP_PRIVATE_CRM_MONZO_INERT
    secrets: inherit

  rollout:
    name: Full rollout
    needs: authorize
    if: needs.authorize.outputs.phase == 'rollout'
    uses: ./.github/workflows/deploy-private-production-monzo.yml
    with:
      approved_sha: ${{ needs.authorize.outputs.approved_sha }}
      deploy: true
      approval_phrase: DEPLOY_PRIVATE_CRM_MONZO_ONLY
    secrets: inherit
