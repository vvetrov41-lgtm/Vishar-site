name: Monzo production release operator

# Mutating Monzo production phases must enter crm-production from the approved
# release branch because the environment itself only permits release/private-crm-rc*.
# A pull_request-triggered deployment is not sufficient here: GitHub evaluates
# the environment against refs/pull/<n>/merge. This operator therefore runs only
# from an exact push to the dedicated release branch. The release-only delta from
# product PR #304 is constrained to this workflow file and is never a product base.

on:
  push:
    branches:
      - release/private-crm-rc34-monzo-production

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: monzo-production-release-operator
  cancel-in-progress: false

env:
  OPERATOR_PR: '307'
  PRODUCT_PR: '304'
  PRODUCT_HEAD_BRANCH: claude/vishar-monzo-production-ejbe23
  OPERATOR_RELEASE_BRANCH: release/private-crm-rc34-monzo-production
  OPERATOR_BASE_BRANCH: agent/monzo-duration-tiered-deposits-production
  OPERATOR_WORKFLOW_PATH: .github/workflows/monzo-production-release-operator.yml

jobs:
  authorize:
    name: Authorize release-branch Monzo production request
    if: >-
      github.actor == 'vvetrov41-lgtm' &&
      github.ref == 'refs/heads/release/private-crm-rc34-monzo-production' &&
      (
        contains(github.event.head_commit.message, '[RUN_MONZO_PRODUCTION_BOOTSTRAP]') ||
        contains(github.event.head_commit.message, '[RUN_MONZO_PRODUCTION_ROLLOUT]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      approved_sha: ${{ github.sha }}
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Resolve the requested phase
        id: phase
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          bootstrap=0; rollout=0
          case "$COMMIT_MESSAGE" in *'[RUN_MONZO_PRODUCTION_BOOTSTRAP]'*) bootstrap=1 ;; esac
          case "$COMMIT_MESSAGE" in *'[RUN_MONZO_PRODUCTION_ROLLOUT]'*) rollout=1 ;; esac
          total=$((bootstrap + rollout))
          if [ "$total" -ne 1 ]; then
            echo "Exactly one production phase marker must be present in the release push commit; found ${total}." >&2
            exit 1
          fi
          if [ "$bootstrap" = 1 ]; then phase=bootstrap; else phase=rollout; fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Requested phase: $phase"

      - name: Checkout exact approved release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release branch, operator PR and product PR
        id: lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --short)"

          release_tip="$(git ls-remote --heads origin "refs/heads/${OPERATOR_RELEASE_BRANCH}" | awk '{print $1}')"
          test "$release_tip" = "$APPROVED_SHA"

          operator="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${OPERATOR_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref] | @tsv')"
          IFS=$'\t' read -r op_state op_draft op_merged op_head_ref op_head_sha op_base_ref <<< "$operator"
          test "$op_state" = open
          test "$op_draft" = true
          test "$op_merged" = false
          test "$op_head_ref" = "$OPERATOR_RELEASE_BRANCH"
          test "$op_head_sha" = "$APPROVED_SHA"
          test "$op_base_ref" = "$OPERATOR_BASE_BRANCH"

          product="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref] | @tsv')"
          IFS=$'\t' read -r state draft merged head_ref product_sha base_ref <<< "$product"
          test "$state" = open
          test "$draft" = true
          test "$merged" = false
          test "$head_ref" = "$PRODUCT_HEAD_BRANCH"
          test "$base_ref" = "$OPERATOR_BASE_BRANCH"

          git cat-file -e "${product_sha}^{commit}"
          git merge-base --is-ancestor "$product_sha" "$APPROVED_SHA"

          mapfile -t release_delta < <(git diff --name-only "$product_sha" "$APPROVED_SHA")
          if [ "${#release_delta[@]}" -ne 1 ] || [ "${release_delta[0]}" != "$OPERATOR_WORKFLOW_PATH" ]; then
            echo 'Release-only delta is not confined to the operator workflow:' >&2
            printf '  %s\n' "${release_delta[@]}" >&2
            exit 1
          fi

          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "Release ${APPROVED_SHA} is product ${product_sha} plus operator-only workflow changes."

      - name: Wait for normal exact-head CI to be green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 720))

          while [ "$SECONDS" -lt "$deadline" ]; do
            runs_file="$(mktemp)"
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${APPROVED_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "none"), .started_at] | @tsv' \
              > "$runs_file"

            waiting=''
            failed=''
            while IFS= read -r required; do
              latest="$(awk -F'\t' -v name="$required" '$1 == name { print $4 "\t" $2 "\t" $3 }' "$runs_file" | sort -r | head -1)"
              if [ -z "$latest" ]; then
                waiting="${waiting}${required}: absent; "
                continue
              fi
              status="$(printf '%s' "$latest" | cut -f2)"
              conclusion="$(printf '%s' "$latest" | cut -f3)"
              if [ "$status" != completed ]; then
                waiting="${waiting}${required}: ${status}; "
              elif [ "$conclusion" != success ]; then
                failed="${failed}${required}: ${conclusion}; "
              fi
            done <<'REQUIRED'
          static-validation
          Private CRM
          Supabase migrations and pgTAP
          Public site and Worker
          REQUIRED
            rm -f "$runs_file"

            if [ -n "$failed" ]; then
              echo "Normal exact-head CI failed: ${failed}" >&2
              exit 1
            fi
            if [ -z "$waiting" ]; then
              echo "All required normal exact-head CI checks are green for ${APPROVED_SHA}."
              exit 0
            fi

            echo "Waiting for exact-head CI: ${waiting}"
            sleep 10
          done

          echo 'Timed out waiting for normal exact-head CI.' >&2
          exit 1

      - name: Operator authorisation summary
        if: always()
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          APPROVED_SHA: ${{ github.sha }}
          PRODUCT_SHA: ${{ steps.lineage.outputs.product_sha }}
        run: |
          {
            echo '### Monzo production release operator'
            echo
            echo "- Operator PR: #${OPERATOR_PR} (draft, never merge)"
            echo "- Product PR: #${PRODUCT_PR} (verified open/draft/unmerged)"
            echo "- Product SHA: \`${PRODUCT_SHA:-unresolved}\`"
            echo "- Release branch: \`${OPERATOR_RELEASE_BRANCH}\`"
            echo "- Approved release SHA: \`${APPROVED_SHA}\`"
            echo "- Release-only delta: \`${OPERATOR_WORKFLOW_PATH}\`"
            echo "- Phase: \`${PHASE:-unresolved}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  bootstrap:
    name: Inert bootstrap
    needs: authorize
    if: needs.authorize.outputs.phase == 'bootstrap'
    uses: ./.github/workflows/deploy-private-production-monzo.yml
    with:
      approved_sha: ${{ needs.authorize.outputs.approved_sha }}
      deploy: true
      approval_phrase: BOOTSTRAP_PRIVATE_CRM_MONZO_INERT
    secrets: inherit

  rollout:
    name: Full rollout
    needs: authorize
    if: needs.authorize.outputs.phase == 'rollout'
    uses: ./.github/workflows/deploy-private-production-monzo.yml
    with:
      approved_sha: ${{ needs.authorize.outputs.approved_sha }}
      deploy: true
      approval_phrase: DEPLOY_PRIVATE_CRM_MONZO_ONLY
    secrets: inherit
