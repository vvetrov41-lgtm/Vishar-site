name: Monzo reconciliation production activation operator

# Release-only operator for the bounded reconciliation activation in PR #319.
# The product change only flips the tracked production flag and its regression
# guards. This workflow never becomes a product base and must never be merged.
# Production mutation remains behind the protected crm-production environment.

on:
  push:
    branches:
      - release/private-crm-rc41-monzo-reconciliation

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: monzo-reconciliation-production-activation
  cancel-in-progress: false

env:
  OPERATOR_PR: '0'
  PRODUCT_PR: '319'
  PRODUCT_HEAD_BRANCH: agent/monzo-reconciliation-production-activation
  PRODUCT_BASE_BRANCH: agent/monzo-setup-confirmation-consistency-fix
  PRODUCT_BASE_SHA: f40d538d741266cf31d1a318ca5ad253fc669269
  OPERATOR_RELEASE_BRANCH: release/private-crm-rc41-monzo-reconciliation
  OPERATOR_BASE_BRANCH: agent/monzo-reconciliation-production-activation
  OPERATOR_WORKFLOW_PATH: .github/workflows/monzo-production-release-operator.yml
  WORKER_NAME: vishar-monzo-api-production
  MONZO_HOSTNAME: monzo.vishartattoo.com

jobs:
  authorize:
    name: Authorize Monzo reconciliation activation
    if: >-
      github.actor == 'vvetrov41-lgtm' &&
      github.ref == 'refs/heads/release/private-crm-rc41-monzo-reconciliation' &&
      contains(github.event.head_commit.message, '[RUN_MONZO_RECONCILIATION_ACTIVATION]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      approved_sha: ${{ github.sha }}
      product_sha: ${{ steps.lineage.outputs.product_sha }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release branch and stacked PR lineage
        id: lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --short)"

          release_tip="$(git ls-remote --heads origin "refs/heads/${OPERATOR_RELEASE_BRANCH}" | awk '{print $1}')"
          test "$release_tip" = "$APPROVED_SHA"

          operator="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${OPERATOR_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref] | @tsv')"
          IFS=$'\t' read -r op_state op_draft op_merged op_head_ref op_head_sha op_base_ref <<< "$operator"
          test "$op_state" = open
          test "$op_draft" = true
          test "$op_merged" = false
          test "$op_head_ref" = "$OPERATOR_RELEASE_BRANCH"
          test "$op_head_sha" = "$APPROVED_SHA"
          test "$op_base_ref" = "$OPERATOR_BASE_BRANCH"

          product="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref, .base.sha] | @tsv')"
          IFS=$'\t' read -r state draft merged head_ref product_sha base_ref base_sha <<< "$product"
          test "$state" = open
          test "$draft" = true
          test "$merged" = false
          test "$head_ref" = "$PRODUCT_HEAD_BRANCH"
          test "$base_ref" = "$PRODUCT_BASE_BRANCH"
          test "$base_sha" = "$PRODUCT_BASE_SHA"

          git cat-file -e "${product_sha}^{commit}"
          git merge-base --is-ancestor "$product_sha" "$APPROVED_SHA"

          mapfile -t release_delta < <(git diff --name-only "$product_sha" "$APPROVED_SHA")
          if [ "${#release_delta[@]}" -ne 1 ] || [ "${release_delta[0]}" != "$OPERATOR_WORKFLOW_PATH" ]; then
            echo 'Release-only delta is not confined to the operator workflow:' >&2
            printf '  %s\n' "${release_delta[@]}" >&2
            exit 1
          fi

          grep -Fxq 'MONZO_RECONCILIATION_ENABLED = "true"' wrangler.monzo-api.production.toml
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "Release ${APPROVED_SHA} is product ${product_sha} plus operator-only workflow changes."

      - name: Wait for normal exact-head CI to be green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))

          while [ "$SECONDS" -lt "$deadline" ]; do
            runs_file="$(mktemp)"
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${APPROVED_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "none"), .started_at] | @tsv' \
              > "$runs_file"

            waiting=''
            failed=''
            while IFS= read -r required; do
              latest="$(awk -F'\t' -v name="$required" '$1 == name { print $4 "\t" $2 "\t" $3 }' "$runs_file" | sort -r | head -1)"
              if [ -z "$latest" ]; then
                waiting="${waiting}${required}: absent; "
                continue
              fi
              status="$(printf '%s' "$latest" | cut -f2)"
              conclusion="$(printf '%s' "$latest" | cut -f3)"
              if [ "$status" != completed ]; then
                waiting="${waiting}${required}: ${status}; "
              elif [ "$conclusion" != success ]; then
                failed="${failed}${required}: ${conclusion}; "
              fi
            done <<'REQUIRED'
          static-validation
          Private CRM
          Supabase migrations and pgTAP
          Public site and Worker
          REQUIRED
            rm -f "$runs_file"

            if [ -n "$failed" ]; then
              echo "Normal exact-head CI failed: ${failed}" >&2
              exit 1
            fi
            if [ -z "$waiting" ]; then
              echo "All required normal exact-head CI checks are green for ${APPROVED_SHA}."
              exit 0
            fi

            echo "Waiting for exact-head CI: ${waiting}"
            sleep 10
          done

          echo 'Timed out waiting for normal exact-head CI.' >&2
          exit 1

      - name: Authorisation summary
        if: always()
        shell: bash
        env:
          APPROVED_SHA: ${{ github.sha }}
          PRODUCT_SHA: ${{ steps.lineage.outputs.product_sha }}
        run: |
          {
            echo '### Monzo reconciliation production activation'
            echo
            echo "- Operator PR: #${OPERATOR_PR} (draft, never merge)"
            echo "- Product PR: #${PRODUCT_PR} (verified open/draft/unmerged)"
            echo "- Product SHA: \`${PRODUCT_SHA:-unresolved}\`"
            echo "- Release SHA: \`${APPROVED_SHA}\`"
            echo "- Release-only delta: \`${OPERATOR_WORKFLOW_PATH}\`"
            echo '- Production effect before crm-production approval: none'
          } >> "$GITHUB_STEP_SUMMARY"

  artifact_validation:
    name: Validate activated Monzo artifact without credentials
    needs: authorize
    uses: ./.github/workflows/deploy-private-production-monzo.yml
    with:
      approved_sha: ${{ needs.authorize.outputs.approved_sha }}
      deploy: false
      approval_phrase: ''

  activate:
    name: Activate Monzo reconciliation candidates in production
    needs:
      - authorize
      - artifact_validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    steps:
      - name: Confirm protected activation gate
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_MONZO_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENABLED" != 'true' ]; then
            echo 'CRM_PRODUCTION_MONZO_DEPLOY_ENABLED is not explicitly enabled.' >&2
            exit 1
          fi

      - name: Checkout exact approved release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.approved_sha }}

      - name: Verify exact activation artifact
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --short)"
          grep -Fxq 'MONZO_RECONCILIATION_ENABLED = "true"' wrangler.monzo-api.production.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked root dependencies
        run: npm ci

      - name: Verify pre-provisioned Worker secret boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config wrangler.monzo-api.production.toml --name "$WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const values = JSON.parse(process.env.SECRET_LIST || '[]');
          const names = new Set(values.map((entry) => entry?.name).filter(Boolean));
          const expected = [
            'MONZO_OAUTH_CLIENT_ID',
            'MONZO_OAUTH_CLIENT_SECRET',
            'MONZO_TOKEN_ENCRYPTION_KEY',
            'SUPABASE_SECRET_KEY',
          ];
          const missing = expected.filter((name) => !names.has(name));
          if (missing.length) throw new Error(`Missing production Worker secret(s): ${missing.join(', ')}`);
          NODE

      - name: Deploy only the Monzo connector Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          XDG_CONFIG_HOME=.wrangler/config \
          WRANGLER_LOG_PATH=.wrangler/monzo-reconciliation-activation.log \
          WRANGLER_SEND_METRICS=false \
            npx wrangler deploy \
              --config wrangler.monzo-api.production.toml \
              --name "$WORKER_NAME" \
              --strict

      - name: Verify activated production boundary
        shell: bash
        run: |
          set -euo pipefail

          for path in /health /oauth/monzo/start/vladimir /oauth/monzo/status/vladimir /oauth/monzo/accounts/kristina; do
            gated=''
            for attempt in $(seq 1 20); do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://${MONZO_HOSTNAME}${path}" || true)"
              echo "PROTECTED ${path} -> ${status}"
              case "$status" in
                302|303|307|401|403) gated='yes'; break ;;
                200)
                  echo "Access is not gating ${path}." >&2
                  exit 1
                  ;;
              esac
              sleep 3
            done
            test "$gated" = yes
          done

          webhook_key="$(head -c 36 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
          activated=''
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --output /tmp/monzo-webhook-body --write-out '%{http_code}' --max-time 10 \
              -X POST -H 'Content-Type: application/json' --data '{"type":"transaction.created","data":{"id":"tx_boundarycheck"}}' \
              "https://${MONZO_HOSTNAME}/webhooks/monzo/${webhook_key}" || true)"
            body="$(cat /tmp/monzo-webhook-body 2>/dev/null || true)"
            echo "PUBLIC /webhooks/monzo/<unknown opaque> -> ${status} ${body}"
            case "$status" in
              404)
                printf '%s' "$body" | grep -Fq '"code":"not_found"'
                activated='yes'
                break
                ;;
              429)
                sleep 65
                ;;
              503)
                if printf '%s' "$body" | grep -Fq 'reconciliation_disabled'; then
                  echo 'Production still reports reconciliation_disabled.' >&2
                  exit 1
                fi
                ;;
              302|303|307|401|403)
                echo 'Access is blocking the public Monzo webhook path.' >&2
                exit 1
                ;;
            esac
            sleep 3
          done
          test "$activated" = yes

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 \
            "https://${MONZO_HOSTNAME}/webhooks/monzo/" || true)"
          echo "PUBLIC /webhooks/monzo/ -> ${status}"
          case "$status" in
            302|303|307|401|403|404) ;;
            200)
              echo 'Unexpected public path returned Worker output.' >&2
              exit 1
              ;;
          esac

      - name: Activation summary
        if: always()
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          {
            echo '### Monzo reconciliation production activation'
            echo
            echo "- Exact SHA: \`${APPROVED_SHA}\`"
            echo "- Worker: \`${WORKER_NAME}\`"
            echo '- Reconciliation: enabled for authenticated, account-bound candidate creation only'
            echo '- Automatic settlement: absent'
            echo '- OAuth/token/account routing: unchanged'
            echo '- Public surface: rate-limited `POST /webhooks/monzo/<opaque>` only'
            echo '- Pages/database/booking/Calendar/Telegram/WhatsApp/GPT deployments: none'
          } >> "$GITHUB_STEP_SUMMARY"
