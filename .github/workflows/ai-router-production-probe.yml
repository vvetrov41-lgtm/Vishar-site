name: AI router production probe

# Proves, against the live Worker, that each model tier is reachable and which
# Cloudflare model actually answers.
#
# The probe endpoint is authenticated by a Worker secret that does not exist in
# steady state. This workflow mints a random one, uses it, and deletes it again
# in the same run; the value is generated on the runner, never printed, and
# never stored in GitHub. The deletion step runs even when a probe fails, so a
# red run cannot leave the endpoint open.
#
# Every request uses the endpoint's own fixed synthetic prompts. No customer
# data is read and no records are created.

# Triggered by pushing a `probe/ai-router-production-*` branch, the same pattern
# the tattooai release uses, because a workflow_dispatch entry is only
# dispatchable from the default branch and the CRM trunk is not `main`. The run
# asserts its own lineage before touching anything, so a probe branch cannot
# carry unreviewed code into a job that holds production credentials.
on:
  push:
    branches:
      - 'probe/ai-router-production-*'
  workflow_dispatch:
    inputs:
      confirm_probe:
        description: 'Type PROBE AI ROUTER PRODUCTION to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-router-production-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'push' || inputs.confirm_probe == 'PROBE AI ROUTER PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      ENDPOINT: https://tattooai.vvetrov41.workers.dev/internal/ai-router
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact probe snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the probe snapshot is canonical
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin agent/platform-telegram-self-service --no-tags
          git merge-base --is-ancestor origin/agent/platform-telegram-self-service "$GITHUB_SHA"
          echo 'Probe snapshot descends from the canonical branch.'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked tooling
        run: npm ci

      - name: Confirm the endpoint is closed before the probe window opens
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/closed.json -w '%{http_code}' "$ENDPOINT")"
          test "$status" = '404'
          grep -Fq 'not_found' /tmp/closed.json
          echo 'Probe endpoint is closed, as expected.'

      - name: Mint an ephemeral probe token
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "PROBE_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx wrangler secret put AI_ROUTER_PROBE_TOKEN --name tattooai
          echo 'Ephemeral probe token installed.'

      - name: Read back the live routing configuration
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            status="$(curl -sS -o /tmp/routing.json -w '%{http_code}' \
              -H "authorization: Bearer $PROBE_TOKEN" "$ENDPOINT")"
            if [ "$status" = '200' ]; then break; fi
            echo "Attempt $attempt saw HTTP $status; waiting for the secret to propagate."
            sleep 10
          done
          test "$status" = '200'
          node -e '
            const r = require("/tmp/routing.json").routing;
            const tiers = Object.fromEntries(r.providers.map((p) => [p.provider, p.configured]));
            console.log("configured tiers:", JSON.stringify(tiers));
            for (const t of r.tasks) {
              console.log(`${t.task.padEnd(32)} ${t.chain.join(" -> ").padEnd(24)} selected=${t.selected}`);
            }
            if (!tiers.deepseek || !tiers.qwen || !tiers.workers_ai) {
              throw new Error("a Cloudflare-hosted tier reports itself unconfigured");
            }
          '

      - name: Live synthetic DeepSeek probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/deepseek.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H "authorization: Bearer $PROBE_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"task":"high_quality_reasoning"}')"
          cat /tmp/deepseek.json
          echo
          # DeepSeek is informative for this workflow, not an enquiry-MVP gate.
          # Keep reporting unexpected DeepSeek failures, but do not let an
          # optional paid-tier/provider issue prevent the enquiry probe.
          node -e '
            const r = require("/tmp/deepseek.json");
            const attempt = (r.attempts || []).find((a) => a.provider === "deepseek");
            if (!attempt) throw new Error("the request never reached the DeepSeek tier");
            if (!attempt.model.startsWith("cf-deepseek-ai-")) {
              throw new Error(`unexpected model ${attempt.model}`);
            }
            if (r.ok && r.provider === "deepseek") {
              console.log(`DeepSeek reachable and answering: ${r.model} in ${r.durationMs}ms`);
            } else if (attempt.errorCode === "provider_unavailable") {
              console.log(`DeepSeek routed correctly (${attempt.model}) but the binding refused it.`);
              console.log("This account most likely lacks Workers Paid or prepaid AI Gateway credits.");
            } else {
              throw new Error(`DeepSeek failed unexpectedly: ${attempt.errorCode}`);
            }
          '

      - name: Live synthetic enquiry schema probe
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/enquiry.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H "authorization: Bearer $PROBE_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"task":"enquiry_intake"}')"
          cat /tmp/enquiry.json
          echo
          test "$status" = '200'
          node -e '
            const r = require("/tmp/enquiry.json");
            const attempts = Array.isArray(r.attempts) ? r.attempts : [];
            const qwenAttempt = attempts.find((a) => a.provider === "qwen");
            if (!qwenAttempt) throw new Error("enquiry routing never attempted qwen");
            if (!qwenAttempt.model.startsWith("cf-qwen-")) {
              throw new Error(`unexpected qwen model ${qwenAttempt.model}`);
            }
            if (r.schemaValid !== true) throw new Error("enquiry output failed the production schema");
            if (r.outputPreview !== null) throw new Error("private-schema probe returned an output preview");

            if (r.provider === "qwen") {
              if (!r.model.startsWith("@cf/qwen/")) throw new Error(`unexpected final qwen model ${r.model}`);
              console.log(`Qwen enquiry schema valid: ${r.model} in ${r.durationMs}ms`);
            } else if (r.provider === "workers_ai") {
              if (r.fallbackUsed !== true) throw new Error("workers_ai served enquiry without fallbackUsed=true");
              if (qwenAttempt.outcome !== "failed" || qwenAttempt.errorCode !== "provider_timeout") {
                throw new Error(`unexpected qwen fallback cause ${qwenAttempt.errorCode}`);
              }
              if (!r.model.startsWith("@cf/meta/llama-3.1-8b-instruct-fast")) {
                throw new Error(`unexpected workers_ai fallback model ${r.model}`);
              }
              console.log(`Workers AI enquiry fallback schema valid after Qwen timeout: ${r.model} in ${r.durationMs}ms`);
            } else {
              throw new Error(`enquiry served by unexpected provider ${r.provider}`);
            }
          '

      - name: Live synthetic Qwen vision probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/qwen.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H "authorization: Bearer $PROBE_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"task":"vision_reference_understanding"}')"
          cat /tmp/qwen.json
          echo
          # Vision is intentionally informational while production enquiry image
          # processing remains disabled. Text enquiry acceptance must not depend
          # on a disabled image capability.
          test "$status" = '200'
          node -e '
            const r = require("/tmp/qwen.json");
            if (r.provider !== "qwen") throw new Error(`served by ${r.provider}, not qwen`);
            if (!r.model.startsWith("@cf/qwen/")) throw new Error(`unexpected model ${r.model}`);
            console.log(`Qwen vision reachable: ${r.model} in ${r.durationMs}ms`);
          '

      - name: Confirm the public assistants still answer
        shell: bash
        run: |
          set -euo pipefail
          root='https://tattooai.vvetrov41.workers.dev/'
          for type in idea aftercare; do
            status="$(curl -sS -o "/tmp/assistant-${type}.json" -w '%{http_code}' -X POST "$root" \
              -H 'content-type: application/json' \
              -H 'Origin: https://vishartattoo.com' \
              --data "{\"type\":\"${type}\",\"message\":\"Production routing probe. Reply briefly.\"}")"
            test "$status" = '200'
            node -e '
              const r = require(`/tmp/assistant-${process.argv[1]}.json`);
              if (Object.keys(r).join() !== "response") throw new Error("assistant response shape changed");
              if (!r.response.trim()) throw new Error("assistant returned an empty answer");
              console.log(`${process.argv[1]} assistant OK (${r.response.length} chars)`);
            ' "$type"
          done

      # Deletion goes through the REST API rather than wrangler, because a
      # wrangler flag change must never be able to leave the endpoint open: an
      # earlier run failed here on `--force` and left the token installed.
      # Whatever the delete call reports, the step only passes once the live
      # endpoint answers 404 again.
      - name: Close the probe window
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/tattooai/secrets/AI_ROUTER_PROBE_TOKEN" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/delete.json -w 'delete status=%{http_code}\n' || true
          node -e '
            try {
              const r = require("/tmp/delete.json");
              console.log("delete success:", r.success === true);
              if (Array.isArray(r.errors) && r.errors.length) {
                console.log("delete errors:", r.errors.map((e) => e.code).join(","));
              }
            } catch { console.log("delete response was not JSON"); }
          ' || true

          if ! npx wrangler secret list --name tattooai --format json > /tmp/secrets.json 2>/dev/null; then
            echo 'Could not list secrets; relying on the live check below.'
          else
            node -e '
              const names = require("/tmp/secrets.json").map((s) => s.name);
              console.log("remaining secrets:", JSON.stringify(names));
              if (names.includes("AI_ROUTER_PROBE_TOKEN")) {
                throw new Error("AI_ROUTER_PROBE_TOKEN is still installed");
              }
            '
          fi

          set -e
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS -o /tmp/reclosed.json -w '%{http_code}' "$ENDPOINT")"
            if [ "$status" = '404' ]; then break; fi
            echo "Attempt $attempt saw HTTP $status; waiting for the deletion to propagate."
            sleep 10
          done
          test "$status" = '404'
          grep -Fq 'not_found' /tmp/reclosed.json
          echo 'Probe endpoint is closed again.'
