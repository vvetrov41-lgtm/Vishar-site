name: OpenAI Ads CAPI validation

on:
  pull_request:
    paths:
      - 'workers/lib/openai-ads.js'
      - 'workers/routes/enquiries.js'
      - 'workers/tattooai.js'
      - 'scripts/test-openai-ads-capi.mjs'
      - 'specs/openai-ads-capi/**'
      - '.github/workflows/openai-ads-capi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "head=${actual}"
          test "${actual}" = "${expected}"
          test -z "$(git status --porcelain)"

      - name: Check modified Worker modules
        run: |
          set -euo pipefail
          node --check workers/lib/openai-ads.js
          node --check workers/routes/enquiries.js
          node --check workers/tattooai.js

      - name: Test CAPI trust and failure boundaries
        run: node scripts/test-openai-ads-capi.mjs

      - name: Compile production Worker without deploy
        run: npm run check:worker-bundle

      - name: Scan repository for committed secrets
        run: node scripts/scan-secrets.mjs
