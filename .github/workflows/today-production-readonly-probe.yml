# Read live deployments and CSP after Today follow-up 5359fa7ce2b48f67ab1a2bf754232e4da6629d73
name: Today production read-only probe
on:
  push:
    branches: ['release/private-crm-rc1034-inventory-today-readonly-20261007']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: crm-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read exact Pages deployments and public boundary
        run: |
          node --input-type=module <<'NODE'
          for (const project of ['vishar-crm-production', 'vishar-crm-internal']) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/pages/projects/' + project, {headers: {authorization:'Bearer ' + process.env.CLOUDFLARE_API_TOKEN}});
            const body = await response.json();
            if (!response.ok || !body.success) throw new Error('Pages read failed: ' + project);
            const deployment = body.result.canonical_deployment;
            console.log(JSON.stringify({project, domains:body.result.domains, deployment_id:deployment?.id, sha:deployment?.deployment_trigger?.metadata?.commit_hash, status:deployment?.latest_stage?.status, created_on:deployment?.created_on}));
          }
          for (const host of ['crm.vishartattoo.com', 'app.vishartattoo.com']) {
            const start=performance.now();
            const response=await fetch('https://' + host, {redirect:'manual'});
            console.log(JSON.stringify({host,status:response.status,ms:Math.round(performance.now()-start),access_redirect:(response.headers.get('location')||'').includes('cloudflareaccess.com'),posthog_capture_csp:(response.headers.get('content-security-policy')||'').includes('https://eu.i.posthog.com/i/v0/e/'),posthog_any_csp:(response.headers.get('content-security-policy')||'').includes('posthog')}));
          }
          const origin='https://crm.vishartattoo.com';
          const cors=await fetch('https://eu.i.posthog.com/i/v0/e/', {method:'OPTIONS',redirect:'manual',headers:{Origin:origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}});
          console.log(JSON.stringify({analytics_preflight_status:cors.status,origin_allowed:['*',origin].includes(cors.headers.get('access-control-allow-origin')),post_allowed:(cors.headers.get('access-control-allow-methods')||'').toUpperCase().includes('POST'),content_type_allowed:(cors.headers.get('access-control-allow-headers')||'').toLowerCase().includes('content-type')}));
          NODE
