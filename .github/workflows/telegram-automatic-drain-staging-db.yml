name: Telegram automatic drain retained staging DB validation

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: telegram-automatic-drain-retained-staging-db
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    name: Apply rollout cutoff and validate hosted pgTAP/lint
    if: >-
      github.event.action == 'edited' &&
      github.event.sender.login == 'vvetrov41-lgtm' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'agent/kristina-telegram-parity' &&
      github.event.pull_request.head.ref == 'agent/telegram-outbox-automatic-drain' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, format('<!-- RUN_TELEGRAM_AUTO_DB:{0} -->', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: 68b9d9eb08e7f9aa119fead893c22d031694ad5f
      EXPECTED_BASE_BRANCH: agent/kristina-telegram-parity
      EXPECTED_HEAD_BRANCH: agent/telegram-outbox-automatic-drain
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      PRODUCTION_TARGETED: 'false'

    steps:
      - name: Fail closed before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          marker="<!-- RUN_TELEGRAM_AUTO_DB:${APPROVED_SHA} -->"
          jq -e \
            --arg sha "$APPROVED_SHA" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg base "$EXPECTED_BASE_BRANCH" \
            --arg head "$EXPECTED_HEAD_BRANCH" \
            --arg marker "$marker" \
            --arg repo "$GITHUB_REPOSITORY" '
            .action == "edited"
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == $base
            and .pull_request.base.sha == $base_sha
            and .pull_request.head.ref == $head
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
            and (.pull_request.body | contains($marker))
          ' "$GITHUB_EVENT_PATH" >/dev/null
          [ "$PRODUCTION_TARGETED" = 'false' ]

      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify exact stack and successful normal CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ "$(git rev-parse "${EXPECTED_BASE_SHA}^{commit}")" = "$EXPECTED_BASE_SHA" ]
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$APPROVED_SHA"

          gh api "repos/$GITHUB_REPOSITORY/pulls/190" > "$RUNNER_TEMP/pr190.json"
          jq -e --arg sha "$EXPECTED_BASE_SHA" '
            .state == "open" and .draft == true and .merged == false
            and .head.ref == "agent/kristina-telegram-parity" and .head.sha == $sha
          ' "$RUNNER_TEMP/pr190.json" >/dev/null

          jq -e \
            --arg sha "$APPROVED_SHA" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg base "$EXPECTED_BASE_BRANCH" \
            --arg head "$EXPECTED_HEAD_BRANCH" \
            --arg repo "$GITHUB_REPOSITORY" '
            .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == $base
            and .pull_request.base.sha == $base_sha
            and .pull_request.head.ref == $head
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
          ' "$GITHUB_EVENT_PATH" >/dev/null

          mkdir -p "$RUNNER_TEMP/telegram-automatic-drain-db-evidence"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,html_url}' \
            | jq -s . > "$RUNNER_TEMP/runs.json"
          jq -n --slurpfile runs "$RUNNER_TEMP/runs.json" --arg sha "$APPROVED_SHA" '
            ["Static Validation", "CRM and booking validation"] as $required
            | reduce $required[] as $name ({};
                ($runs[0] | map(select(
                  .name == $name and .event == "pull_request" and .head_sha == $sha
                  and .status == "completed" and .conclusion == "success"
                )) | sort_by(.id) | last) as $run
                | if $run == null then error("missing exact-head normal CI: " + $name)
                  else .[$name] = $run end
              )
          ' > "$RUNNER_TEMP/normal-ci-runs.json"
          jq -r 'to_entries[].value.id' "$RUNNER_TEMP/normal-ci-runs.json" | while read -r run_id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '{run_id:'"$run_id"',jobs:[.jobs[]|{id,name,status,conclusion}]}'
          done | jq -s . > "$RUNNER_TEMP/normal-ci-jobs.json"
          jq -n \
            --argjson runs "$(cat "$RUNNER_TEMP/normal-ci-runs.json")" \
            --argjson jobs "$(cat "$RUNNER_TEMP/normal-ci-jobs.json")" \
            '{runs:$runs,jobs:$jobs}' \
            > "$RUNNER_TEMP/telegram-automatic-drain-db-evidence/normal-ci.json"

      - name: Verify encrypted staging configuration names
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_ACCESS_TOKEN STAGING_SUPABASE_DB_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          [ "${#missing[@]}" -eq 0 ] || {
            printf 'Missing encrypted staging configuration names: %s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          }
          [ "$PRODUCTION_TARGETED" = 'false' ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Install exact locked dependencies
        run: npm ci

      - name: Recheck exact-head code before hosted mutation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/telegram-automatic-drain-staging-db.sh
          npm run test:worker
          npm run test:booking
          npm run scan:secrets
          npm run check:worker-bundle
          npm run check:telegram-drain-bundle

      - name: Apply only migration 0036 and validate retained staging
        shell: bash
        run: bash scripts/telegram-automatic-drain-staging-db.sh

      - name: Upload safe DB validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-automatic-drain-db-${{ env.APPROVED_SHA }}
          path: ${{ runner.temp }}/telegram-automatic-drain-db-evidence
          if-no-files-found: warn
          retention-days: 30
