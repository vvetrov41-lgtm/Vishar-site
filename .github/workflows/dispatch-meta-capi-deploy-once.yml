name: Dispatch approved Meta CAPI production deploy once

on:
  push:
    branches:
      - 'release/private-crm-rc1048-inventory-capi-auth-20261009'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.actor == github.repository_owner && github.event.head_commit.message == 'Dispatch Meta CAPI deploy with preserved Telegram linking, approved'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate one-time deployment against validated predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = 'release/private-crm-rc1048-inventory-capi-auth-20261009' ]
          [ "$(git log -1 --format=%s)" = 'Dispatch Meta CAPI deploy with preserved Telegram linking, approved' ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git merge-base --is-ancestor 0c6262c1d0f4292fed843416c14f2e6234a2f326 HEAD
          result="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37934752045 --jq .conclusion)"
          [ "$result" = 'success' ]
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-private-production-telegram.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" \
            -f "inputs[approved_sha]=$GITHUB_SHA" \
            -f 'inputs[deploy]=true' \
            -f 'inputs[approval_phrase]=ENABLE_PRIVATE_CRM_TELEGRAM_DRAIN' \
            -f 'inputs[enable_linking]=true' \
            -f 'inputs[linking_approval_phrase]=ENABLE_TELEGRAM_LINKING' \
            -f 'inputs[disable_linking]=false' \
            -f 'inputs[enable_meta_ads]=true' \
            -f 'inputs[disable_meta_ads]=false' \
            -f 'inputs[meta_ads_approval_phrase]=ENABLE_META_ADS_CAPI'
          echo 'Submitted approved deployment via the protected production workflow.'
