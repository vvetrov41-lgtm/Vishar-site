name: Private production release

on:
  push:
    branches:
      - 'release/private-crm-rc*'
      - '!release/private-crm-rc*-booking-host*'
      - '!release/private-crm-rc*-inventory-*'
      - '!release/private-crm-rc*-backend-auth-*'
      - '!release/private-crm-rc*-gpt-worker'
      - '!release/private-crm-rc*-whatsapp-webhook-only'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-production-release
  cancel-in-progress: false

env:
  REQUIRED_RELEASE_FOUNDATION_SHA: cbcb5fa1e5e8559fadd98c9681c6de7ea8549687

jobs:
  validate-release:
    name: Release and Worker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact release snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable release snapshot
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-backend-auth*) echo 'Backend auth refs must use the scheduler-only workflow.' >&2; exit 1 ;;
            release/private-crm-rc*-booking-host*)
              echo 'Booking-host release refs are handled by the bounded booking-host workflow only.' >&2
              exit 1
              ;;
            release/private-crm-rc*-inventory-*)
              echo 'Read-only inventory refs must never enter the production release workflow.' >&2
              exit 1
              ;;
            release/private-crm-rc*-gpt-worker)
              echo 'GPT Worker release refs are handled by the bounded GPT Worker rollout only.' >&2
              exit 1
              ;;
            release/private-crm-rc*-whatsapp-webhook-only)
              echo 'WhatsApp webhook-only refs are handled by the bounded webhook workflow only.' >&2
              exit 1
              ;;
            release/private-crm-rc*) ;;
            *)
              echo 'Private production release may run only from release/private-crm-rc*.' >&2
              exit 1
              ;;
          esac
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --short)" ]
          git merge-base --is-ancestor "$REQUIRED_RELEASE_FOUNDATION_SHA" "$GITHUB_SHA" || {
            echo 'Release snapshot does not descend from the approved private-platform foundation.' >&2
            exit 1
          }
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          [ -n "$remote_sha" ]
          [ "$remote_sha" = "$GITHUB_SHA" ] || {
            echo 'Release branch moved after this workflow started; refusing production rollout.' >&2
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate public and Worker boundaries
        run: |
          npm run validate:site
          npm run test:booking
          npm run test:worker
          npm run test:telegram-production
          npm run check:worker-bundle
          npm run check:telegram-production-bundle
          node scripts/test-private-production-release-workflows.mjs
          node scripts/test-private-production-release-orchestrator.mjs
          npm run scan:secrets

  validate-crm:
    name: Private CRM validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact release snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable release snapshot
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-backend-auth*) echo 'Backend auth refs must use the scheduler-only workflow.' >&2; exit 1 ;;
            release/private-crm-rc*-booking-host*) exit 1 ;;
            release/private-crm-rc*-gpt-worker)
              echo 'GPT Worker release refs are handled by the bounded GPT Worker rollout only.' >&2
              exit 1
              ;;
            release/private-crm-rc*-whatsapp-webhook-only)
              echo 'WhatsApp webhook-only refs are handled by the bounded webhook workflow only.' >&2
              exit 1
              ;;
            release/private-crm-rc*) ;;
            *) exit 1 ;;
          esac
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --short)" ]
          git merge-base --is-ancestor "$REQUIRED_RELEASE_FOUNDATION_SHA" "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          [ -n "$remote_sha" ]
          [ "$remote_sha" = "$GITHUB_SHA" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked CRM dependencies
        working-directory: admin
        run: npm ci

      - name: Audit CRM dependencies
        working-directory: admin
        run: npm audit --audit-level=moderate

      - name: Test, typecheck and build private CRM
        working-directory: admin
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Verify private CRM artifact safety
        run: node scripts/check-private-crm-artifact.mjs admin/dist

  validate-database:
    name: Database validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact release snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable release snapshot
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-backend-auth*) echo 'Backend auth refs must use the scheduler-only workflow.' >&2; exit 1 ;;
            release/private-crm-rc*-booking-host*) exit 1 ;;
            release/private-crm-rc*-gpt-worker)
              echo 'GPT Worker release refs are handled by the bounded GPT Worker rollout only.' >&2
              exit 1
              ;;
            release/private-crm-rc*-whatsapp-webhook-only)
              echo 'WhatsApp webhook-only refs are handled by the bounded webhook workflow only.' >&2
              exit 1
              ;;
            release/private-crm-rc*) ;;
            *) exit 1 ;;
          esac
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --short)" ]
          git merge-base --is-ancestor "$REQUIRED_RELEASE_FOUNDATION_SHA" "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          [ -n "$remote_sha" ]
          [ "$remote_sha" = "$GITHUB_SHA" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start clean local Supabase stack
        run: supabase start

      - name: Reset local database without development seed
        run: supabase db reset --local --no-seed

      - name: Run full pgTAP suite
        run: supabase test db

      - name: Verify communications migration preservation
        run: npm run test:communications-migration

      - name: Lint PostgreSQL functions
        run: supabase db lint --local --schema public,crm_private --level error --fail-on error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Production rollout
    if: github.actor == github.repository_owner
    needs:
      - validate-release
      - validate-crm
      - validate-database
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crm-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      PROJECT_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TEAM_INVITE_URL: ${{ vars.CRM_PRODUCTION_TEAM_INVITE_URL }}
      VITE_CALENDAR_CONNECTOR_ORIGIN: https://calendar.vishartattoo.com
      VITE_MONZO_CONNECTOR_ORIGIN: https://monzo.vishartattoo.com
      VITE_INSTAGRAM_CONNECTOR_ORIGIN: https://instagram.vishartattoo.com
      CRM_PAGES_PROJECT: ${{ vars.CRM_PRODUCTION_PAGES_PROJECT }}
      CRM_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: vishar-telegram-drain-production

    steps:
      - name: Checkout exact release snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Re-verify immutable release snapshot and kill switches
        shell: bash
        env:
          DB_DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DB_DEPLOY_ENABLED }}
          CRM_DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ] || {
            echo 'Only the repository owner may authorize an automatic private production release.' >&2
            exit 1
          }
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-backend-auth*) echo 'Backend auth refs must use the scheduler-only workflow.' >&2; exit 1 ;;
            release/private-crm-rc*-booking-host*)
              echo 'Booking-host release refs must never enter the full private production rollout.' >&2
              exit 1
              ;;
            release/private-crm-rc*-gpt-worker)
              echo 'GPT Worker release refs are handled by the bounded GPT Worker rollout only.' >&2
              exit 1
              ;;
            release/private-crm-rc*-whatsapp-webhook-only)
              echo 'WhatsApp webhook-only refs are handled by the bounded webhook workflow only.' >&2
              exit 1
              ;;
            release/private-crm-rc*) ;;
            *)
              echo 'Private production release may run only from release/private-crm-rc*.' >&2
              exit 1
              ;;
          esac
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --short)" ]
          git merge-base --is-ancestor "$REQUIRED_RELEASE_FOUNDATION_SHA" "$GITHUB_SHA" || {
            echo 'Release snapshot does not descend from the approved private-platform foundation.' >&2
            exit 1
          }
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          [ -n "$remote_sha" ]
          [ "$remote_sha" = "$GITHUB_SHA" ] || {
            echo 'Release branch moved after validation; refusing production rollout.' >&2
            exit 1
          }
          [ "$DB_DEPLOY_ENABLED" = 'true' ] || {
            echo 'CRM_PRODUCTION_DB_DEPLOY_ENABLED is not enabled.' >&2
            exit 1
          }
          [ "$CRM_DEPLOY_ENABLED" = 'true' ] || {
            echo 'CRM_PRODUCTION_DEPLOY_ENABLED is not enabled.' >&2
            exit 1
          }

      - name: Verify exact production targets
        shell: bash
        run: |
          set -euo pipefail
          RETAINED_STAGING_PROJECT_REF='gwaliusblwrzisrwnsvs'
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [ "$PROJECT_REF" != "$RETAINED_STAGING_PROJECT_REF" ]
          [ "$PROJECT_URL" = "https://${PROJECT_REF}.supabase.co" ]
          [ "$VITE_SUPABASE_URL" = "$PROJECT_URL" ]
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
          [ "$CRM_ORIGIN" = 'https://crm.vishartattoo.com' ]
          [ "$CRM_PAGES_PROJECT" = 'vishar-crm-production' ]
          [ "$VITE_CALENDAR_CONNECTOR_ORIGIN" = 'https://calendar.vishartattoo.com' ]
          [ "$VITE_MONZO_CONNECTOR_ORIGIN" = 'https://monzo.vishartattoo.com' ]
          [ "$VITE_INSTAGRAM_CONNECTOR_ORIGIN" = 'https://instagram.vishartattoo.com' ]
          [ -n "$SUPABASE_ACCESS_TOKEN" ]
          [ -n "$SUPABASE_DB_PASSWORD" ]
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked deployment tooling
        run: npm ci

      - name: Audit deployment dependencies and scan secrets
        run: |
          npm audit --audit-level=moderate
          npm run scan:secrets

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Link exact production Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show production migration state before deploy
        run: supabase migration list

      - name: Dry-run production migrations
        run: supabase db push --dry-run

      - name: Preflight Cloudflare Pages target before mutation
        run: node scripts/verify-crm-pages-production.mjs

      - name: Verify exact Telegram production Worker secret names before mutation
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config wrangler.telegram-drain.production.toml --name "$WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const values = JSON.parse(process.env.SECRET_LIST || '[]');
          const actual = values.map((entry) => entry?.name).filter(Boolean).sort();
          const expected = [
            'ARTIST_TELEGRAM_KRISTINA_HPRODUCTION',
            'ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION',
            'SUPABASE_SECRET_KEY',
            'TELEGRAM_BOT_TOKEN',
            'TELEGRAM_WEBHOOK_SECRET',
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Production Telegram Worker secret-name set mismatch before mutation: ${actual.join(', ')}`);
          }
          NODE

      - name: Telegram production preflight before mutation
        shell: bash
        run: |
          set -euo pipefail
          preflight_config="$RUNNER_TEMP/telegram.preflight.before-mutation.toml"
          node scripts/generate-telegram-production-deploy-config.mjs "$preflight_config" --enable-linking
          node scripts/preflight-telegram-production.mjs "$preflight_config" --allow-linking
          rm -f "$preflight_config"

      - name: Apply production migrations
        run: supabase db push

      - name: Verify no production migrations remain
        run: |
          supabase migration list
          supabase db push --dry-run

      - name: Install locked CRM dependencies
        working-directory: admin
        run: npm ci

      - name: Build exact production CRM artifact
        working-directory: admin
        run: npm run build

      - name: Verify exact production CRM artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f admin/dist/index.html
          test -f admin/dist/_headers
          grep -Fq 'noindex' admin/dist/index.html
          grep -R -Fq "$VITE_SUPABASE_URL" admin/dist
          grep -R -Fq "$VITE_SUPABASE_PUBLISHABLE_KEY" admin/dist
          grep -R -Fq "$VITE_CALENDAR_CONNECTOR_ORIGIN" admin/dist
          grep -R -Fq "$VITE_MONZO_CONNECTOR_ORIGIN" admin/dist
          grep -R -Fq "$VITE_INSTAGRAM_CONNECTOR_ORIGIN" admin/dist
          node scripts/check-private-crm-artifact.mjs admin/dist
          test -f admin/functions/api/whatsapp/embedded-signup/provision.js

      - name: Reconcile production Supabase Auth URLs
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          current="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "$api")"
          payload="$(CURRENT_AUTH_CONFIG="$current" node <<'NODE'
          const current = JSON.parse(process.env.CURRENT_AUTH_CONFIG || '{}');
          const crmOrigin = 'https://crm.vishartattoo.com';
          const required = [crmOrigin, `${crmOrigin}/`, `${crmOrigin}/**`];
          const existing = String(current.uri_allow_list || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          process.stdout.write(JSON.stringify({
            site_url: crmOrigin,
            uri_allow_list: Array.from(new Set([...existing, ...required])).join(','),
          }));
          NODE
          )"
          curl -fsS -X PATCH "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload" >/dev/null
          after="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "$api")"
          AUTH_AFTER="$after" node <<'NODE'
          const after = JSON.parse(process.env.AUTH_AFTER || '{}');
          const crmOrigin = 'https://crm.vishartattoo.com';
          if (after.site_url !== crmOrigin) throw new Error('Production Auth site_url readback mismatch');
          const allow = String(after.uri_allow_list || '').split(',').map((v) => v.trim()).filter(Boolean);
          for (const expected of [crmOrigin, `${crmOrigin}/`, `${crmOrigin}/**`]) {
            if (!allow.includes(expected)) throw new Error(`Production Auth allow-list missing ${expected}`);
          }
          NODE

      - name: Deploy private CRM Pages project
        working-directory: admin
        run: >-
          ../node_modules/.bin/wrangler pages deploy dist
          --project-name "$CRM_PAGES_PROJECT"
          --branch production
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=false

      - name: Read back exact CRM Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          deployments="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CRM_PAGES_PROJECT}/deployments")"
          DEPLOYMENTS="$deployments" node <<'NODE'
          const body = JSON.parse(process.env.DEPLOYMENTS || '{}');
          if (body.success !== true || !Array.isArray(body.result)) {
            throw new Error('Cloudflare Pages deployment readback failed');
          }
          const matching = body.result.find((entry) => (
            entry?.environment === 'production'
            && entry?.deployment_trigger?.metadata?.commit_hash === process.env.GITHUB_SHA
          ));
          if (!matching) throw new Error('Exact production Pages commit was not found in deployment readback');
          NODE

      - name: Verify exact Telegram production Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config wrangler.telegram-drain.production.toml --name "$WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const values = JSON.parse(process.env.SECRET_LIST || '[]');
          const actual = values.map((entry) => entry?.name).filter(Boolean).sort();
          const expected = [
            'ARTIST_TELEGRAM_KRISTINA_HPRODUCTION',
            'ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION',
            'SUPABASE_SECRET_KEY',
            'TELEGRAM_BOT_TOKEN',
            'TELEGRAM_WEBHOOK_SECRET',
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Production Telegram Worker secret-name set mismatch: ${actual.join(', ')}`);
          }
          NODE

      - name: Telegram production preflight
        shell: bash
        run: |
          set -euo pipefail
          preflight_config="$RUNNER_TEMP/telegram.preflight.toml"
          node scripts/generate-telegram-production-deploy-config.mjs "$preflight_config" --enable-linking
          node scripts/preflight-telegram-production.mjs "$preflight_config" --allow-linking
          rm -f "$preflight_config"

      - name: Dry-run Telegram shared scheduler
        shell: bash
        run: |
          set -euo pipefail
          deploy_config="$RUNNER_TEMP/telegram.deploy.toml"
          node scripts/generate-telegram-production-deploy-config.mjs "$deploy_config" --enable-linking
          grep -Fq 'TELEGRAM_DRAIN_ENABLED = "true"' "$deploy_config"
          grep -Fq 'GMAIL_SHARED_DRAIN_ENABLED = "true"' "$deploy_config"
          grep -Fq 'TELEGRAM_LINKING_ENABLED = "true"' "$deploy_config"
          grep -Fq 'binding = "GMAIL_SERVICE"' "$deploy_config"
          grep -Fq 'service = "vishar-gmail-production"' "$deploy_config"
          grep -Fq 'crons = ["*/5 * * * *"]' "$deploy_config"
          npx wrangler deploy \
            --config "$deploy_config" \
            --name "$WORKER_NAME" \
            --dry-run \
            --outdir "$RUNNER_TEMP/telegram-production-generated"
          rm -f "$deploy_config"

      - name: Deploy Telegram shared scheduler
        shell: bash
        run: |
          set -euo pipefail
          deploy_config="$RUNNER_TEMP/telegram.deploy.toml"
          deploy_output="$RUNNER_TEMP/telegram-production-wrangler-output.ndjson"
          trap 'rm -f "$deploy_config" "$deploy_output"' EXIT
          node scripts/generate-telegram-production-deploy-config.mjs "$deploy_config" --enable-linking
          node scripts/preflight-telegram-production.mjs "$deploy_config" --allow-linking
          rm -f "$deploy_output"
          WRANGLER_OUTPUT_FILE_PATH="$deploy_output" \
            npx wrangler deploy --config "$deploy_config" --name "$WORKER_NAME"
          node scripts/preflight-telegram-production.mjs "$deploy_config" --allow-linking
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + '/telegram-production-wrangler-output.ndjson', 'utf8')
            .split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
          const deploys = lines.filter((entry) => entry?.type === 'deploy'
            && entry?.worker_name === process.env.WORKER_NAME
            && typeof entry?.version_id === 'string'
            && entry.version_id.length > 0);
          if (deploys.length !== 1) throw new Error('Unable to resolve exactly one Telegram deploy version');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/telegram-deployed-version', deploys[0].version_id);
          NODE
          deployed_version="$(cat "$RUNNER_TEMP/telegram-deployed-version")"
          versions="$(npx wrangler versions list --name "$WORKER_NAME" --json)"
          VERSIONS="$versions" DEPLOYED_VERSION="$deployed_version" node <<'NODE'
          const versions = JSON.parse(process.env.VERSIONS || '[]');
          if (!Array.isArray(versions) || !versions.some((entry) => entry?.id === process.env.DEPLOYED_VERSION)) {
            throw new Error('Deployed Telegram version is absent from Worker version readback');
          }
          NODE
          rm -f "$deploy_config" "$deploy_output"
          trap - EXIT

      - name: Verify live Telegram HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            expected="$1"
            shift
            actual="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "$@")"
            [ "$actual" = "$expected" ] || {
              echo "Telegram HTTP boundary mismatch: expected $expected, got $actual" >&2
              exit 1
            }
          }
          probe 404 https://telegram.vishartattoo.com/
          probe 404 https://telegram.vishartattoo.com/anything
          probe 405 https://telegram.vishartattoo.com/webhook
          probe 404 -X POST https://telegram.vishartattoo.com/notwebhook
          probe 401 -X POST https://telegram.vishartattoo.com/webhook

      - name: Production release summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Private production release'
            echo
            echo "- Exact immutable release SHA: \`$GITHUB_SHA\`"
            echo "- Release branch: \`$GITHUB_REF_NAME\`"
            echo "- Release actor: \`$GITHUB_ACTOR\` (repository owner required)"
            echo '- Validation: public/Worker, private CRM, full pgTAP, communications migration preservation, PostgreSQL lint'
            echo '- Database: remote dry-run, apply, post-apply dry-run'
            echo '- CRM: exact production build, Supabase Auth readback, Pages commit-hash readback'
            echo '- Telegram: linking preserved ON, Gmail shared drain preserved, preflight + dry-run + deploy + post-deploy preflight + version readback'
            echo '- Telegram webhook activation and secret mutation: not performed'
            echo '- Public booking Worker deployment: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
