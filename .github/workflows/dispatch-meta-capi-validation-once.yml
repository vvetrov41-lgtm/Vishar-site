name: Dispatch Telegram CAPI validation only once

on:
  push:
    branches:
      - 'release/private-crm-rc1048-inventory-capi-auth-20261009'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.actor == github.repository_owner && github.event.head_commit.message == 'Dispatch audited Meta CAPI validation only, approved'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Submit protected deploy workflow in read-only validation mode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = 'release/private-crm-rc1048-inventory-capi-auth-20261009' ]
          [ "$(git log -1 --format=%s)" = 'Dispatch audited Meta CAPI validation only, approved' ]
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-private-production-telegram.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" \
            -f "inputs[approved_sha]=$GITHUB_SHA" \
            -f 'inputs[deploy]=false' \
            -f 'inputs[enable_linking]=false' \
            -f 'inputs[disable_linking]=false' \
            -f 'inputs[enable_meta_ads]=false' \
            -f 'inputs[disable_meta_ads]=false'
          echo 'Submitted read-only Telegram production preflight.'
