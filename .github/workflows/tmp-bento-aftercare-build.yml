name: Temp Bento aftercare build
on:
  push:
    branches:
      - tmp-bento-aftercare-build-20261004
    paths:
      - '.github/workflows/tmp-bento-aftercare-build.yml'
      - 'tmp/bento-aftercare/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect source fragments
        shell: bash
        run: |
          mkdir -p export/parts
          cp tmp/bento-aftercare/doc.part* export/parts/
          cat tmp/bento-aftercare/doc.part* > export/combined.b64
          wc -c export/parts/doc.part* export/combined.b64
          sha256sum export/parts/doc.part* export/combined.b64

      - name: Download official Bento Slides v1.2.5 shell
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/nyblnet/bento/releases/download/v1.2.5/Bento_Slides.bento.html \
            -o export/Bento_Slides.bento.html
          sha256sum export/Bento_Slides.bento.html

      - name: Upload repair bundle
        uses: actions/upload-artifact@v4
        with:
          name: bento-aftercare-repair-bundle
          path: export/
          retention-days: 7
