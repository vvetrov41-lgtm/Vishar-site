name: PR 180 calendar drain test patch

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr180-calendar-drain-patch
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.ref == 'agent/google-calendar-oauth-connector' &&
      github.event.pull_request.base.ref == 'agent/google-calendar-foundation' &&
      contains(github.event.pull_request.body, '<!-- PATCH_PR180_CALENDAR_DRAIN -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/google-calendar-oauth-connector
          fetch-depth: 0

      - name: Fail-closed repository guard
        shell: bash
        env:
          EXPECTED_REPOSITORY: vvetrov41-lgtm/Vishar-site
          ACTUAL_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Patch explicit Worker and database ACL inventories
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          worker = Path('scripts/test-worker-modules.mjs')
          worker_text = worker.read_text()
          old_worker = """    'list_incomplete_intakes',\n    'mark_enquiry_file_uploaded',\n    'record_outbox_attempt',\n    'resolve_outbox_route',\n"""
          new_worker = """    'claim_calendar_outbox',\n    'create_trusted_enquiry_intake',\n    'fail_enquiry_intake',\n    'finalize_enquiry_intake',\n    'list_incomplete_intakes',\n    'mark_enquiry_file_uploaded',\n    'record_calendar_outbox_result',\n    'record_outbox_attempt',\n    'resolve_outbox_route',\n"""
          existing_worker = """    'create_trusted_enquiry_intake',\n    'fail_enquiry_intake',\n    'finalize_enquiry_intake',\n    'list_incomplete_intakes',\n    'mark_enquiry_file_uploaded',\n    'record_outbox_attempt',\n    'resolve_outbox_route',\n"""
          if worker_text.count(existing_worker) != 1:
              raise SystemExit('Worker RPC allow-list needle missing or duplicated')
          worker.write_text(worker_text.replace(existing_worker, new_worker, 1))

          acl = Path('supabase/tests/050_rls_roles.sql')
          acl_text = acl.read_text()
          old_acl = """  ('public.record_calendar_sync_result(uuid,integer,boolean,public.calendar_provider,text,text)', false, false, true),\n\n  -- Authenticated CRM RPCs."""
          new_acl = """  ('public.record_calendar_sync_result(uuid,integer,boolean,public.calendar_provider,text,text)', false, false, true),\n  ('public.claim_calendar_outbox(text,integer,integer)', false, false, true),\n  ('public.record_calendar_outbox_result(uuid,text,integer,boolean,text,text)', false, false, true),\n\n  -- Authenticated CRM RPCs."""
          if acl_text.count(old_acl) != 1:
              raise SystemExit('Database ACL inventory needle missing or duplicated')
          acl.write_text(acl_text.replace(old_acl, new_acl, 1))
          PY

          git diff --check
          grep -F "'claim_calendar_outbox'" scripts/test-worker-modules.mjs
          grep -F "'record_calendar_outbox_result'" scripts/test-worker-modules.mjs
          grep -F "public.claim_calendar_outbox(text,integer,integer)" supabase/tests/050_rls_roles.sql
          grep -F "public.record_calendar_outbox_result(uuid,text,integer,boolean,text,text)" supabase/tests/050_rls_roles.sql

      - name: Commit exact patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-worker-modules.mjs supabase/tests/050_rls_roles.sql
          git commit -m 'test: register calendar drain RPC boundaries'
          git push origin HEAD:agent/google-calendar-oauth-connector
