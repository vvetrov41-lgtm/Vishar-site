name: Monzo retained staging preflight operator

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: monzo-retained-staging-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect retained staging Monzo prerequisites
    if: >-
      github.event.action == 'edited' &&
      github.event.sender.login == 'vvetrov41-lgtm' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'agent/monzo-staging-preflight' &&
      github.event.pull_request.head.ref == 'agent/monzo-staging-preflight-run' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, format('<!-- RUN_MONZO_STAGING_PREFLIGHT:{0} -->', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      OPERATOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PRODUCT_SHA: f5d37fe54bbbf96d69025d2c2056cd04099b8506
      OPERATOR_BASE_BRANCH: agent/monzo-staging-preflight
      RUN_HEAD_BRANCH: agent/monzo-staging-preflight-run
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MONZO_OAUTH_CLIENT_ID: ${{ secrets.MONZO_OAUTH_CLIENT_ID }}
      MONZO_OAUTH_CLIENT_SECRET: ${{ secrets.MONZO_OAUTH_CLIENT_SECRET }}
      MONZO_TOKEN_ENCRYPTION_KEY: ${{ secrets.MONZO_TOKEN_ENCRYPTION_KEY }}
      PRODUCTION_TARGETED: 'false'
      STAGING_PROJECT_REF: gwaliusblwrzisrwnsvs

    steps:
      - name: Fail closed before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATOR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          marker="<!-- RUN_MONZO_STAGING_PREFLIGHT:${APPROVED_SHA} -->"
          jq -e \
            --arg sha "$APPROVED_SHA" \
            --arg base_sha "$OPERATOR_BASE_SHA" \
            --arg base "$OPERATOR_BASE_BRANCH" \
            --arg head "$RUN_HEAD_BRANCH" \
            --arg marker "$marker" \
            --arg repo "$GITHUB_REPOSITORY" '
            .action == "edited"
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == $base
            and .pull_request.base.sha == $base_sha
            and .pull_request.head.ref == $head
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
            and (.pull_request.body | contains($marker))
          ' "$GITHUB_EVENT_PATH" >/dev/null
          [ "$PRODUCTION_TARGETED" = 'false' ]

      - name: Check out exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify exact stack, bounded diff and normal CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ "$(git rev-parse "${OPERATOR_BASE_SHA}^{commit}")" = "$OPERATOR_BASE_SHA" ]
          git merge-base --is-ancestor "$OPERATOR_BASE_SHA" "$APPROVED_SHA"
          [ "$PRODUCTION_TARGETED" = 'false' ]

          gh api "repos/$GITHUB_REPOSITORY/pulls/274" > "$RUNNER_TEMP/pr274.json"
          jq -e \
            --arg base_sha "$OPERATOR_BASE_SHA" \
            --arg product_sha "$PRODUCT_SHA" \
            --arg repo "$GITHUB_REPOSITORY" '
            .number == 274
            and .state == "open"
            and .draft == true
            and .merged == false
            and .head.ref == "agent/monzo-staging-preflight"
            and .head.sha == $base_sha
            and .base.ref == "agent/monzo-account-connection-activation"
            and .base.sha == $product_sha
            and .head.repo.full_name == $repo
          ' "$RUNNER_TEMP/pr274.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/pulls/273" > "$RUNNER_TEMP/pr273.json"
          jq -e --arg sha "$PRODUCT_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .number == 273
            and .state == "open"
            and .draft == true
            and .merged == false
            and .head.ref == "agent/monzo-account-connection-activation"
            and .head.sha == $sha
            and .head.repo.full_name == $repo
          ' "$RUNNER_TEMP/pr273.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/compare/$OPERATOR_BASE_SHA...$APPROVED_SHA" > "$RUNNER_TEMP/compare.json"
          jq -e '
            .status == "ahead"
            and .behind_by == 0
            and ([.files[].filename] | sort) == ([
              "docs/crm/monzo-staging-preflight-run.md"
            ] | sort)
          ' "$RUNNER_TEMP/compare.json" >/dev/null

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {id,name,event,status,conclusion,head_sha}' \
            | jq -s . > "$RUNNER_TEMP/runs.json"

          jq -n --slurpfile runs "$RUNNER_TEMP/runs.json" --arg sha "$APPROVED_SHA" '
            ["Static Validation", "CRM and booking validation"] as $required
            | reduce $required[] as $name ({};
                ($runs[0] | map(select(
                  .name == $name
                  and .event == "pull_request"
                  and .head_sha == $sha
                  and .status == "completed"
                  and .conclusion == "success"
                )) | sort_by(.id) | last) as $run
                | if $run == null then error("missing exact-head normal CI: " + $name)
                  else .[$name] = $run end
              )
          ' > "$RUNNER_TEMP/normal-ci-runs.json"

          crm_run_id="$(jq -r '.["CRM and booking validation"].id' "$RUNNER_TEMP/normal-ci-runs.json")"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$crm_run_id/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {id,name,status,conclusion}' \
            | jq -s . > "$RUNNER_TEMP/normal-ci-jobs.json"
          for job in "Public site and Worker" "Private CRM" "Supabase migrations and pgTAP"; do
            jq -e --arg name "$job" '
              [.[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length == 1
            ' "$RUNNER_TEMP/normal-ci-jobs.json" >/dev/null
          done

      - name: Verify read-only inspection credentials are present
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_ACCESS_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          [ "${#missing[@]}" -eq 0 ] || {
            printf 'Missing encrypted staging inspection configuration names: %s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          }
          [ "$PRODUCTION_TARGETED" = 'false' ]

      - name: Read retained Supabase staging state
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/monzo-staging-preflight"
          mkdir -p "$evidence"

          project_raw="$RUNNER_TEMP/monzo-project.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}" > "$project_raw"
          jq -e --arg ref "$STAGING_PROJECT_REF" \
            '.id == $ref and .status == "ACTIVE_HEALTHY" and .region == "eu-west-2"' \
            "$project_raw" >/dev/null
          jq '{status,region,database_version:.database.version}' "$project_raw" > "$evidence/supabase-project.json"
          rm -f "$project_raw"

          sql_file="$RUNNER_TEMP/monzo-state.sql"
          query_file="$RUNNER_TEMP/monzo-query.json"
          cat > "$sql_file" <<'SQL'
          select jsonb_build_object(
            'latest_migration', (select max(version) from supabase_migrations.schema_migrations),
            'migration_count', (select count(*)::integer from supabase_migrations.schema_migrations),
            'payments', jsonb_build_object(
              'requests', (select count(*)::integer from public.payment_requests),
              'transactions', (select count(*)::integer from public.payment_transactions),
              'policies', (select count(*)::integer from public.artist_payment_policies),
              'integrations', (select count(*)::integer from public.artist_integrations where integration_type = 'payments'),
              'enabled_integrations', (select count(*)::integer from public.artist_integrations where integration_type = 'payments' and is_enabled),
              'reconciliation_candidates', (select count(*)::integer from public.payment_reconciliation_candidates)
            ),
            'outbox', jsonb_build_object(
              'total', (select count(*)::integer from public.integration_outbox),
              'pending', (select count(*)::integer from public.integration_outbox where status = 'pending'),
              'leased', (select count(*)::integer from public.integration_outbox where status = 'leased'),
              'failed', (select count(*)::integer from public.integration_outbox where status = 'failed'),
              'dead', (select count(*)::integer from public.integration_outbox where status = 'dead')
            ),
            'security', jsonb_build_object(
              'candidates_force_rls', (select relrowsecurity and relforcerowsecurity from pg_class where oid = 'public.payment_reconciliation_candidates'::regclass),
              'authenticated_reconcile_execute', has_function_privilege('authenticated', 'public.register_monzo_reconciliation_candidate(text,text,text,numeric,text,timestamptz)', 'EXECUTE'),
              'service_reconcile_execute', has_function_privilege('service_role', 'public.register_monzo_reconciliation_candidate(text,text,text,numeric,text,timestamptz)', 'EXECUTE')
            )
          ) as state;
          SQL
          jq -Rs '{query:.}' < "$sql_file" > "$query_file"

          raw="$RUNNER_TEMP/monzo-state.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@$query_file" \
            "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query" > "$raw"
          jq -e 'length == 1 and (.[0].state | type == "object")' "$raw" >/dev/null
          jq -S '.[0].state' "$raw" > "$evidence/supabase-state.json"
          jq -e '
            (.latest_migration | tonumber) >= 44
            and .security.candidates_force_rls == true
            and .security.authenticated_reconcile_execute == false
            and .security.service_reconcile_execute == true
          ' "$evidence/supabase-state.json" >/dev/null
          rm -f "$sql_file" "$query_file" "$raw"

      - name: Read Cloudflare staging Monzo footprint
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/monzo-staging-preflight"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          kv_raw="$RUNNER_TEMP/monzo-kv.json"
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" > "$kv_raw"
          jq -e '.success == true and (.result | type == "array")' "$kv_raw" >/dev/null
          jq '[.result[] | select((.title // "") | test("monzo"; "i")) | .title] | sort' \
            "$kv_raw" > "$evidence/cloudflare-monzo-kv-titles.json"
          rm -f "$kv_raw"

          worker_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vishar-monzo-api-staging/settings")"
          case "$worker_status" in
            200) worker_exists=true ;;
            404) worker_exists=false ;;
            *) echo "Unexpected Cloudflare Worker inspection status: $worker_status" >&2; exit 1 ;;
          esac
          jq -n --argjson worker_exists "$worker_exists" \
            --slurpfile titles "$evidence/cloudflare-monzo-kv-titles.json" \
            '{worker_exists:$worker_exists, monzo_kv_namespace_count:($titles[0]|length), monzo_kv_namespace_titles:$titles[0]}' \
            > "$evidence/cloudflare-state.json"

      - name: Record protected configuration readiness without values
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/monzo-staging-preflight"
          present() { if [ -n "${!1:-}" ]; then printf true; else printf false; fi; }
          jq -n \
            --argjson monzo_client "$(present MONZO_OAUTH_CLIENT_ID)" \
            --argjson monzo_secret "$(present MONZO_OAUTH_CLIENT_SECRET)" \
            --argjson monzo_key "$(present MONZO_TOKEN_ENCRYPTION_KEY)" \
            --argjson supabase_secret "$(present SUPABASE_SECRET_KEY)" \
            '{monzo_oauth_client_id:$monzo_client,monzo_oauth_client_secret:$monzo_secret,monzo_token_encryption_key:$monzo_key,supabase_secret_key:$supabase_secret}' \
            > "$evidence/protected-config-readiness.json"

          jq -n \
            --arg sha "$APPROVED_SHA" \
            --arg base_sha "$OPERATOR_BASE_SHA" \
            --slurpfile supabase "$evidence/supabase-state.json" \
            --slurpfile cloudflare "$evidence/cloudflare-state.json" \
            --slurpfile config "$evidence/protected-config-readiness.json" \
            '{exact_head:$sha,operator_base:$base_sha,production_targeted:false,supabase:$supabase[0],cloudflare:$cloudflare[0],protected_configuration:$config[0]}' \
            > "$evidence/summary.json"
          jq . "$evidence/summary.json"
          {
            echo '### Monzo retained staging preflight'
            echo '```json'
            jq . "$evidence/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-sensitive preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monzo-staging-preflight-${{ env.APPROVED_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/monzo-staging-preflight/supabase-project.json
            ${{ runner.temp }}/monzo-staging-preflight/supabase-state.json
            ${{ runner.temp }}/monzo-staging-preflight/cloudflare-monzo-kv-titles.json
            ${{ runner.temp }}/monzo-staging-preflight/cloudflare-state.json
            ${{ runner.temp }}/monzo-staging-preflight/protected-config-readiness.json
            ${{ runner.temp }}/monzo-staging-preflight/summary.json
