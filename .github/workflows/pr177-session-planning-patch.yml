name: PR 177 session planning patch

on:
  push:
    branches:
      - agent/multi-artist-payments-foundation
    paths:
      - .github/workflows/pr177-session-planning-patch.yml

permissions:
  contents: write

concurrency:
  group: pr177-session-planning-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/multi-artist-payments-foundation
          fetch-depth: 0

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^)" = "16e44d5f817382db8952a98c98e8083d9ccd57eb" ]

      - name: Apply session planning changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('admin/src/lib/session-planning.ts')
          helper.write_text("""import type { CrmSession } from './types';

export const SESSION_DURATION_SHORTCUTS = [3, 5, 7] as const;

const CONFLICTING_STATUSES = new Set<CrmSession['status']>([
  'draft',
  'proposed',
  'confirmed',
]);

function validDate(value: string): Date | null {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

function pad(value: number): string {
  return String(value).padStart(2, '0');
}

export function addHoursToLocalDateTime(value: string, hours: number): string {
  const start = validDate(value);
  if (!start || !Number.isFinite(hours) || hours <= 0) return '';

  const end = new Date(start.getTime() + hours * 60 * 60 * 1000);
  return [
    end.getFullYear(),
    '-',
    pad(end.getMonth() + 1),
    '-',
    pad(end.getDate()),
    'T',
    pad(end.getHours()),
    ':',
    pad(end.getMinutes()),
  ].join('');
}

export function findSessionConflicts(
  sessions: CrmSession[],
  startValue: string,
  endValue: string
): CrmSession[] {
  const start = validDate(startValue);
  const end = validDate(endValue);
  if (!start || !end || end <= start) return [];

  return sessions.filter((session) => {
    if (!CONFLICTING_STATUSES.has(session.status)) return false;
    const existingStart = validDate(session.start_at);
    const existingEnd = validDate(session.end_at);
    if (!existingStart || !existingEnd) return false;
    return existingStart < end && existingEnd > start;
  });
}
""", encoding='utf-8')

          page_path = Path('admin/src/pages/ProjectDetailPage.tsx')
          page = page_path.read_text(encoding='utf-8')

