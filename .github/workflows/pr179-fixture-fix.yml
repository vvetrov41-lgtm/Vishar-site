name: PR 179 fix calendar fixture

on:
  push:
    branches: [agent/google-calendar-foundation]
    paths: [.github/workflows/pr179-fixture-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-calendar-foundation
          fetch-depth: 0
      - name: Add explicit calendar owner membership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/170_calendar_projection.sql')
          text = path.read_text()
          anchor = """insert into public.profiles (id, email, display_name, role, is_active) values
  ('c8111111-1111-4111-8111-111111111111', 'calendar-owner@example.test',
   'Calendar Owner', 'owner', true);

"""
          addition = anchor + """insert into public.artist_memberships (
  profile_id, artist_id, access_level,
  can_view_finance, can_manage_finance,
  can_manage_sessions, can_manage_integrations, is_active
) values (
  'c8111111-1111-4111-8111-111111111111',
  'a1111111-1111-4111-8111-111111111111',
  'owner', true, true, true, true, true
);

"""
          if anchor not in text:
              raise SystemExit('calendar profile anchor not found')
          path.write_text(text.replace(anchor, addition, 1))
          PY
          rm .github/workflows/pr179-fixture-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/170_calendar_projection.sql .github/workflows/pr179-fixture-fix.yml
          git commit -m "Fix calendar owner membership fixture"
          git push origin HEAD:agent/google-calendar-foundation
