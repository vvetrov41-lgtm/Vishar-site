name: PR 181 patch artifact scan diagnostics

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 181 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'agent/calendar-connections-ui' &&
      contains(github.event.pull_request.body, '<!-- PATCH_PR181_ARTIFACT_SCAN -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendar-connections-ui
          fetch-depth: 1
      - name: Make artifact scan diagnostic without printing values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr181-staging-calendar-connections.sh')
          text = path.read_text()
          old = '''  ! grep -R -E -q \\
    'sb_secret_[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY|CALENDAR_TOKEN_ENCRYPTION_KEY|Cf-Access-Jwt-Assertion' \\
    admin/dist || die "CRM artifact contains a forbidden secret marker"
'''
          new = '''  local marker pattern match_file
  while IFS='|' read -r marker pattern; do
    [ -n "$marker" ] || continue
    match_file="$(grep -R -E -l -m1 "$pattern" admin/dist | head -n1 || true)"
    [ -z "$match_file" ] \\
      || die "CRM artifact contains forbidden marker $marker in ${match_file#admin/dist/}"
  done <<'MARKERS'
supabase_secret_value|sb_secret_[A-Za-z0-9_-]{20,}
legacy_supabase_secret_name|SUPABASE_SERVICE_ROLE_KEY
calendar_encryption_secret_name|CALENDAR_TOKEN_ENCRYPTION_KEY
cloudflare_access_jwt_header|Cf-Access-Jwt-Assertion
MARKERS
'''
          if text.count(old) != 1:
              raise SystemExit('Expected one legacy artifact scan block')
          path.write_text(text.replace(old, new))
          PY
          bash -n scripts/pr181-staging-calendar-connections.sh
          git diff --check
          git diff -- scripts/pr181-staging-calendar-connections.sh
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pr181-staging-calendar-connections.sh
          git commit -m 'Report safe CRM artifact scan marker'
          git push origin HEAD:agent/calendar-connections-ui
