name: One-shot Wrangler security update

on:
  push:
    branches:
      - fix/wrangler-sharp-20260908

permissions:
  contents: write

concurrency:
  group: wrangler-sharp-security-fix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wrangler-sharp-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade patched dependencies and validate release tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact sharp@0.35.4 wrangler@4.129.1 --package-lock-only --ignore-scripts
          npm pkg set overrides.sharp=0.35.4 overrides.postcss-selector-parser=6.1.3 overrides.undici=7.29.1
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=moderate
          npm run validate:site
          npm run test:booking
          npm run test:worker
          npm run test:telegram-production
          npm run check:worker-bundle
          npm run check:telegram-production-bundle
          node scripts/test-private-production-release-workflows.mjs
          node scripts/test-private-production-release-orchestrator.mjs
          npm run scan:secrets
      - name: Commit dependency metadata and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wrangler-sharp-security-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/wrangler-sharp-security-fix.yml
          git diff --cached --check
          git commit -m 'Security: update Wrangler and patched transitive dependencies'
          git push origin HEAD:fix/wrangler-sharp-20260908
