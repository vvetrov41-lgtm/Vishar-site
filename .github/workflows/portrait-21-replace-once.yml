name: Portrait 21 one-shot replacement

on:
  push:
    branches:
      - agent/site-replace-portrait-21

permissions:
  contents: write

jobs:
  replace:
    if: github.ref == 'refs/heads/agent/site-replace-portrait-21'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch and metadata
        run: |
          test "$GITHUB_REF_NAME" = "agent/site-replace-portrait-21"
          grep -F 'Colour realism male portrait tattoo with blue eye and warm accent by Vladimir Vishar' assets/portraits/metadata.json

      - name: Download replacement photo
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://at.adobe.com/i4PHQ5UxVsfS8cTc' \
            -o /tmp/portrait-21.jpeg
          test -s /tmp/portrait-21.jpeg

      - name: Prepare ImageMagick
        run: |
          if command -v magick >/dev/null 2>&1; then
            echo 'IMG=magick' >> "$GITHUB_ENV"
          elif command -v convert >/dev/null 2>&1; then
            echo 'IMG=convert' >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            echo 'IMG=convert' >> "$GITHUB_ENV"
          fi

      - name: Build source and responsive thumbnails
        run: |
          mkdir -p assets/portraits/thumbs
          $IMG /tmp/portrait-21.jpeg -auto-orient -strip -resize '2400x2400>' -quality 85 assets/portraits/21.webp
          for width in 320 480 720 960; do
            $IMG assets/portraits/21.webp -resize "${width}x>" -quality 80 "assets/portraits/thumbs/21-${width}.webp"
          done

          test -s assets/portraits/21.webp
          for width in 320 480 720 960; do
            test -s "assets/portraits/thumbs/21-${width}.webp"
          done
          git diff --check

      - name: Commit replacement and remove importer
        run: |
          rm .github/workflows/portrait-21-replace-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portraits/21.webp \
                  assets/portraits/thumbs/21-320.webp \
                  assets/portraits/thumbs/21-480.webp \
                  assets/portraits/thumbs/21-720.webp \
                  assets/portraits/thumbs/21-960.webp \
                  .github/workflows/portrait-21-replace-once.yml
          git commit -m 'Replace Portrait gallery image 21'
          git push origin HEAD:agent/site-replace-portrait-21
