name: Wrangler security probe

on:
  pull_request:
    branches:
      - agent/platform-telegram-self-service
    paths:
      - .github/workflows/wrangler-security-probe.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/wrangler-sharp-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate validated dependency update
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.devDependencies.wrangler = '4.132.0';
          p.devDependencies.sharp = '0.35.5';
          p.overrides.sharp = '0.35.5';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Verify dependency graph and audit
        run: |
          node -e "const l=require('./package-lock.json'); const p=l.packages; console.log({wrangler:p['node_modules/wrangler']?.version,miniflare:p['node_modules/miniflare']?.version,sharp:p['node_modules/sharp']?.version,miniflareSharp:p['node_modules/miniflare']?.dependencies?.sharp,undici:p['node_modules/undici']?.version,workerd:p['node_modules/workerd']?.version});"
          npm ci
          node scripts/audit-root-dependencies.mjs --self-test
          node scripts/audit-root-dependencies.mjs --audit-level=moderate
      - name: Test Worker compatibility
        run: |
          npm run test:booking
          node scripts/test-worker-modules.mjs
          npm run check:worker-bundle
          npm run check:telegram-production-bundle
          npm run check:calendar-production-bundle
          npm run check:whatsapp-production-bundle
          npm run check:gpt-production-bundle
      - name: Commit validated dependency files and remove probe
        run: |
          git config user.name 'vvetrov41-lgtm'
          git config user.email 'vvetrov41@gmail.com'
          git add package.json package-lock.json
          git rm .github/workflows/wrangler-security-probe.yml
          git commit -m 'Patch Wrangler and Sharp security dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
