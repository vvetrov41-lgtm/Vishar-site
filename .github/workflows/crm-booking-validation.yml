name: CRM and booking validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-booking-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-and-worker:
    name: Public site and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate public site
        run: npm run validate:site

      - name: Test booking flow
        run: npm run test:booking

      - name: Test Worker modules
        run: npm run test:worker

      - name: Compile Worker with Wrangler
        run: npm run check:worker-bundle

      - name: Scan repository for committed secrets
        run: npm run scan:secrets

  admin:
    name: Private CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  supabase:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset canonical test database without development seed
        run: supabase db reset --local --no-seed

      - name: Run pgTAP suite
        run: supabase test db

      - name: Lint PostgreSQL functions
        run: supabase db lint --local --schema public,crm_private --level error --fail-on error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  staging-network-controls:
    name: Hosted staging network controls
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 176
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject invalid Origin
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output "$body" \
            --dump-header "$headers" \
            --request OPTIONS \
            --header 'Origin: https://invalid-origin.example' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            --write-out '%{http_code}' \
            'https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026')"

          tr -d '\r' < "$headers" > headers-clean.txt
          allow_origin="$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2; exit}' headers-clean.txt)"
          safe_code="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("code", ""))' "$body" 2>/dev/null || true)"

          echo "invalid_origin_status=${status}"
          echo "invalid_origin_allow_origin=${allow_origin:-missing}"
          echo "invalid_origin_safe_code=${safe_code:-none}"

          test "$status" = '403'
          test -z "$allow_origin"

      - name: Clear rate window
        run: sleep 12

      - name: Enforce rate limit and recover
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026'
          origin='https://vishar-booking-staging.pages.dev'
          statuses=()

          for i in 1 2 3 4 5 6 7; do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              --output /dev/null \
              --request OPTIONS \
              --header "Origin: ${origin}" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --write-out '%{http_code}' \
              "$endpoint")"
            statuses+=("$status")
          done

          joined="$(IFS=,; echo "${statuses[*]}")"
          served=0
          blocked=0
          for status in "${statuses[@]}"; do
            if [ "$status" = '204' ]; then
              served=$((served + 1))
            elif [ "$status" = '429' ] || [ "$status" = '403' ]; then
              blocked=$((blocked + 1))
            fi
          done

          echo "rate_burst_statuses=${joined}"
          echo "rate_served=${served}"
          echo "rate_blocked=${blocked}"

          test "${statuses[0]}" = '204'
          test "$served" -ge 1
          test "$blocked" -ge 1

          sleep 12
          recovery="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null \
            --request OPTIONS \
            --header "Origin: ${origin}" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            --write-out '%{http_code}' \
            "$endpoint")"

          echo "rate_recovery_status=${recovery}"
          test "$recovery" = '204'
