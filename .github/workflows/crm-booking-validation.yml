name: CRM and booking validation

on:
  pull_request:
  push:
    branches:
      - main
      - agent/platform-telegram-self-service
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-booking-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-and-worker:
    name: Public site and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate public site
        run: npm run validate:site

      - name: Test booking flow
        run: npm run test:booking

      - name: Test Worker modules
        run: npm run test:worker

      - name: Test bounded enquiry AI safety
        run: npm run test:enquiry-ai

      # Also covered by test:worker above. Named separately so a failure in the
      # derived client-state boundary is legible in the CI log rather than one
      # line inside an eighty-script chain.
      - name: Test derived CRM AI client state
        run: |
          npm run test:crm-agent
          node scripts/test-crm-agent-review-fixes.mjs

      - name: Test canonical public booking slugs and root edge
        run: |
          node scripts/test-public-booking-slugs.mjs
          node scripts/test-public-booking-edge.mjs
          XDG_CONFIG_HOME=.wrangler/config \
          WRANGLER_LOG_PATH=.wrangler/public-booking-edge.log \
          WRANGLER_SEND_METRICS=false \
          npx wrangler deploy --config wrangler.public-booking.production.toml --dry-run --outdir .wrangler/public-booking-edge-dry-run

      - name: Validate Telegram production configuration
        run: npm run test:telegram-production

      - name: Validate single Telegram settings surface
        run: node scripts/test-telegram-settings-surface.mjs

      - name: Validate WhatsApp production configuration
        run: npm run test:whatsapp-production

      - name: Validate Instagram production configuration
        run: npm run test:instagram-production

      - name: Validate Calendar staging configuration
        run: |
          npm run validate:calendar-staging
          npm run validate:calendar-staging:deploy-ready

      - name: Validate Calendar production configuration
        run: |
          npm run validate:calendar-production
          npm run validate:calendar-production:deploy-ready

      - name: Validate PR181 dormant staging boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 181
        run: bash scripts/validate-pr181-staging-source.sh

      - name: Compile Worker with Wrangler
        run: npm run check:worker-bundle

      - name: Compile disabled Telegram drain Worker with Wrangler
        run: npm run check:telegram-drain-bundle

      - name: Compile inert production Telegram drain Worker with Wrangler
        run: npm run check:telegram-production-bundle

      - name: Compile disabled Team admin Worker with Wrangler
        run: npm run check:team-admin-bundle

      - name: Compile dormant payment redirect Worker with Wrangler
        run: npm run check:payment-redirect-bundle

      - name: Compile dormant Monzo API Worker with Wrangler
        run: npm run check:monzo-api-bundle

      - name: Compile inert production Calendar Worker with Wrangler
        run: npm run check:calendar-production-bundle

      - name: Compile inert production WhatsApp drain Worker with Wrangler
        run: npm run check:whatsapp-production-bundle

      - name: Compile inert production Instagram connector with Wrangler
        run: npm run check:instagram-production-bundle

      - name: Test private production release workflow boundaries
        run: |
          node scripts/test-private-production-release-workflows.mjs
          node scripts/test-tattooai-production-release.mjs

      - name: Test automatic private production release boundaries
        run: node scripts/test-private-production-release-orchestrator.mjs

      - name: Test read-only Cloudflare production inventory boundary
        run: node scripts/test-cloudflare-production-inventory.mjs

      - name: Backend auth observer privacy and release boundaries
        run: |
          node scripts/test-backend-auth-observer.mjs
          node scripts/test-backend-auth-restart.mjs
          node scripts/test-worker-import-closure.mjs

      - name: Test exact CRM Pages production preflight
        run: node scripts/test-crm-pages-production-preflight.mjs

      - name: Test GPT production domain boundaries
        run: |
          node scripts/test-gpt-operator-parity.mjs
          node scripts/test-gpt-domain-operations.mjs
          node scripts/test-gpt-provider-proxy.mjs
          node scripts/build-gpt-unified-openapi.mjs --check
          node scripts/test-gpt-unified-domain-rollout.mjs
          node scripts/test-gpt-team-domain-rollout.mjs
          node scripts/test-gpt-communications-domain-rollout.mjs
          node scripts/test-gpt-worker-rollout.mjs

      - name: Scan repository for committed secrets
        run: npm run scan:secrets

  admin:
    name: Private CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify private CRM artifact contains no staging endpoints or privileged credentials
        working-directory: .
        run: node scripts/check-private-crm-artifact.mjs admin/dist

  supabase:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify migration order, production DB release paths and release ref routing
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node scripts/check-migration-order.mjs --self-test
          node scripts/check-production-db-release-paths.mjs
          node scripts/check-release-ref-routing.mjs --self-test
          node scripts/check-release-ref-routing.mjs
          if [ -n "$BASE_REF" ]; then
            node scripts/check-migration-order.mjs "origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            node scripts/check-migration-order.mjs "$BEFORE_SHA"
          fi

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.110.0

      # pgTAP needs Postgres plus the services that own the auth, storage and
      # realtime schemas. The dashboard, edge runtime, image proxy, logging and
      # mail containers are never used here, and pulling them from ghcr.io is
      # what hits its rate limit. The same images are mirrored on
      # public.ecr.aws; a throttled pull alternates registries with backoff.
      - name: Start local Supabase stack
        shell: bash
        run: |
          set -uo pipefail
          registries=(public.ecr.aws ghcr.io public.ecr.aws)
          for attempt in 1 2 3; do
            export SUPABASE_INTERNAL_IMAGE_REGISTRY="${registries[$((attempt - 1))]}"
            echo "Starting Supabase from $SUPABASE_INTERNAL_IMAGE_REGISTRY (attempt $attempt)"
            if supabase start -x studio,edge-runtime,imgproxy,logflare,vector,mailpit,supavisor; then
              # Later steps (pg_prove, lint) pull their images from the same registry.
              echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$SUPABASE_INTERNAL_IMAGE_REGISTRY" >> "$GITHUB_ENV"
              exit 0
            fi
            supabase stop --no-backup || true
            [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
          done
          exit 1

      - name: Reset canonical test database without development seed
        run: supabase db reset --local --no-seed

      - name: Run pgTAP suite
        run: supabase test db

      - name: Verify the communications migration preserves existing WhatsApp records
        run: npm run test:communications-migration

      - name: Lint PostgreSQL functions
        run: supabase db lint --local --schema public,crm_private --level error --fail-on error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
