name: CRM and booking validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-booking-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-booking-e2e:
    name: Production booking E2E smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/production-booking-e2e-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create harmless reference image
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/e2e-reference.png
          file /tmp/e2e-reference.png

      - name: Submit through both live site contracts
        shell: bash
        run: |
          set -euo pipefail

          submit_form() {
            local label="$1"
            local page_url="$2"
            local origin="$3"
            local fallback_source="$4"
            local email="$5"
            local idem="$6"
            local html="/tmp/${label}.html"
            local body="/tmp/${label}-response.json"

            echo "=== ${label}: fetch live page ==="
            curl --fail-with-body --silent --show-error --location "$page_url" -o "$html"

            local endpoint
            endpoint="$(python3 - "$html" <<'PY'
import re,sys
text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
patterns=[
    r"productionEndpoint\s*=\s*['\"]([^'\"]+)['\"]",
    r"bookingEndpoint\s*=\s*['\"]([^'\"]+)['\"]",
    r"https://[A-Za-z0-9.-]+\.workers\.dev/?(?:\?[^'\"<> ]*)?",
]
for pattern in patterns:
    m=re.search(pattern,text)
    if m:
        print(m.group(1) if m.lastindex else m.group(0))
        break
PY
)"
            test -n "$endpoint"

            local source_value
            source_value="$(python3 - "$html" "$fallback_source" <<'PY'
import re,sys
text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
fallback=sys.argv[2]
m=re.search(r"payload\.append\(\s*['\"]source['\"]\s*,\s*['\"]([^'\"]+)['\"]",text)
print(m.group(1) if m else fallback)
PY
)"

            echo "page=${page_url}"
            echo "origin=${origin}"
            echo "endpoint=${endpoint}"
            echo "source_field=${source_value}"

            local status
            status="$(curl --silent --show-error \
              --request POST \
              --header "Origin: ${origin}" \
              --output "$body" \
              --write-out '%{http_code}' \
              --form-string "idempotencyKey=${idem}" \
              --form-string "name=E2E TEST ${label} 2026-08-24" \
              --form-string "email=${email}" \
              --form-string "phone=" \
              --form-string "instagram=" \
              --form-string "preferredReply=Email" \
              --form-string "travellingFrom=Production E2E test" \
              --form-string "projectType=Not sure yet" \
              --form-string "placement=E2E test placement" \
              --form-string "size=E2E test size" \
              --form-string "coverUp=No" \
              --form-string "timing=E2E TEST - safe to delete" \
              --form-string "idea=PRODUCTION E2E TEST. This record is intentionally synthetic and may be deleted after verification." \
              --form-string "privacyAcknowledged=true" \
              --form-string "privacyNoticeVersion=2026-07-29" \
              --form-string "source=${source_value}" \
              --form-string "landingPage=${page_url}" \
              --form-string "referrer=" \
              --form-string "utmSource=e2e-production-smoke" \
              --form-string "utmMedium=github-actions" \
              --form-string "utmCampaign=booking-reliability-20260824" \
              --form-string "utmContent=${label}" \
              --form-string "utmTerm=" \
              --form-string "elapsedMs=2500" \
              --form "references=@/tmp/e2e-reference.png;type=image/png;filename=e2e-reference.png" \
              "$endpoint")"

            echo "http_status=${status}"
            cat "$body"
            echo
            test "$status" = "200"
            python3 - "$body" <<'PY'
import json,sys
obj=json.load(open(sys.argv[1]))
assert obj.get('ok') is True, obj
assert isinstance(obj.get('reference'),str) and obj['reference'], obj
print('reference=' + obj['reference'])
PY
          }

          submit_form \
            "vladimir" \
            "https://vishartattoo.com/booking/" \
            "https://vishartattoo.com" \
            "/booking/" \
            "booking-e2e-vladimir-20260824@invalid.example" \
            "20260824-0001-4000-8000-000000000001"

          submit_form \
            "kristina" \
            "https://www.kristinavishar.com/" \
            "https://www.kristinavishar.com" \
            "/#booking" \
            "booking-e2e-kristina-20260824@invalid.example" \
            "20260824-0002-4000-8000-000000000002"

  site-and-worker:
    name: Public site and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate public site
        run: npm run validate:site

      - name: Test booking flow
        run: npm run test:booking

      - name: Test Worker modules
        run: npm run test:worker

      - name: Validate Telegram production configuration
        run: npm run test:telegram-production

      - name: Validate WhatsApp production configuration
        run: npm run test:whatsapp-production

      - name: Validate Instagram production configuration
        run: npm run test:instagram-production

      - name: Validate Calendar staging configuration
        run: |
          npm run validate:calendar-staging
          npm run validate:calendar-staging:deploy-ready

      - name: Validate Calendar production configuration
        run: |
          npm run validate:calendar-production
          npm run validate:calendar-production:deploy-ready

      - name: Validate PR181 dormant staging boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 181
        run: bash scripts/validate-pr181-staging-source.sh

      - name: Compile Worker with Wrangler
        run: npm run check:worker-bundle

      - name: Compile disabled Telegram drain Worker with Wrangler
        run: npm run check:telegram-drain-bundle

      - name: Compile inert production Telegram drain Worker with Wrangler
        run: npm run check:telegram-production-bundle

      - name: Compile disabled Team admin Worker with Wrangler
        run: npm run check:team-admin-bundle

      - name: Compile dormant payment redirect Worker with Wrangler
        run: npm run check:payment-redirect-bundle

      - name: Compile dormant Monzo API Worker with Wrangler
        run: npm run check:monzo-api-bundle

      - name: Compile inert production Calendar Worker with Wrangler
        run: npm run check:calendar-production-bundle

      - name: Compile inert production WhatsApp drain Worker with Wrangler
        run: npm run check:whatsapp-production-bundle

      - name: Compile inert production Instagram connector with Wrangler
        run: npm run check:instagram-production-bundle

      - name: Test private production release workflow boundaries
        run: node scripts/test-private-production-release-workflows.mjs

      - name: Test automatic private production release boundaries
        run: node scripts/test-private-production-release-orchestrator.mjs

      - name: Scan repository for committed secrets
        run: npm run scan:secrets

  admin:
    name: Private CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify private CRM artifact contains no staging endpoints or privileged credentials
        working-directory: .
        run: node scripts/check-private-crm-artifact.mjs admin/dist

  supabase:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset canonical test database without development seed
        run: supabase db reset --local --no-seed

      - name: Run pgTAP suite
        run: supabase test db

      - name: Verify the communications migration preserves existing WhatsApp records
        run: npm run test:communications-migration

      - name: Lint PostgreSQL functions
        run: supabase db lint --local --schema public,crm_private --level error --fail-on error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
