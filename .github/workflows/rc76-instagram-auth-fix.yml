name: RC76 Instagram operator authorization pgTAP fix

on:
  push:
    branches:
      - ops/rc76-instagram-auth-fix
    paths:
      - .github/workflows/rc76-instagram-auth-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: claude/instagram-communications-integration-po9a1e
      EXPECTED_SHA: e42882b1c8f47351ffecce488ed7535113a42d07
    steps:
      - name: Checkout exact Instagram PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --short)"
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - name: Checkout bounded patcher
        uses: actions/checkout@v4
        with:
          ref: ops/rc76-instagram-auth-fix
          path: .operator
          fetch-depth: 1

      - name: Apply test-only patch
        shell: bash
        run: |
          set -euo pipefail
          python .operator/scripts/rc76-instagram-auth-fix.py
          rm -rf .operator
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            supabase/tests/050_rls_roles.sql \
            supabase/tests/220_instagram_channel.sql | sort)"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- supabase/migrations workers scripts admin)"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset canonical test database
        run: supabase db reset --local --no-seed

      - name: Run full pgTAP suite
        run: supabase test db

      - name: Lint database functions
        run: supabase db lint --local --schema public,crm_private --level error --fail-on error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

      - name: Commit only the test fix
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/050_rls_roles.sql supabase/tests/220_instagram_channel.sql
          git diff --cached --check
          git commit -m 'Fix Instagram operator authorization pgTAP fixtures'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
