name: RC76 Instagram operator authorization fix

on:
  push:
    branches:
      - ops/rc76-instagram-auth-fix
    paths:
      - .github/workflows/rc76-instagram-auth-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: claude/instagram-communications-integration-po9a1e
      EXPECTED_SHA: 1c2c31bcf115779f9e97b415477444b90d0b97f3
    steps:
      - name: Checkout exact Instagram PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --short)"
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - name: Checkout bounded patcher
        uses: actions/checkout@v4
        with:
          ref: ops/rc76-instagram-auth-fix
          path: .operator
          fetch-depth: 1

      - name: Apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python .operator/scripts/rc76-instagram-auth-fix.py
          rm -rf .operator
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            scripts/test-instagram-connector.mjs \
            supabase/migrations/0073_instagram_operator_authorization.sql \
            supabase/tests/220_instagram_channel.sql \
            workers/instagram-production.js \
            workers/lib/instagram-supabase.js | sort)"
          test "$changed" = "$expected"

      - name: Install pinned tooling
        run: npm ci

      - name: Run focused Instagram regression tests
        run: |
          set -euo pipefail
          node scripts/test-instagram-connector.mjs
          npm run test:instagram-production
          npm run check:instagram-production-bundle
          npm run scan:secrets

      - name: Commit only the bounded fix
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/test-instagram-connector.mjs \
            supabase/migrations/0073_instagram_operator_authorization.sql \
            supabase/tests/220_instagram_channel.sql \
            workers/instagram-production.js \
            workers/lib/instagram-supabase.js
          git diff --cached --check
          git commit -m 'Verify Instagram operators before backend authorization'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
