name: CRM host split operator

# Moves the CRM from one Access-gated host to two: a public
# `crm.vishartattoo.com` and an operator `app.vishartattoo.com` that keeps the
# protection `crm` has today.
#
# Staged on purpose. Each stage mutates at most one production boundary and
# reads it back. workflow_dispatch remains the emergency/manual path. The
# reserved `release/private-crm-rc*-inventory-host-split-<stage>-*` push path is
# the automation path. The existing private production release and its observer
# both exclude the whole `release/private-crm-rc*-inventory-*` namespace, while
# the crm-production Environment already admits `release/private-crm-rc*`.
# A trigger may carry exactly one marker file, operates on its tree-parent rather
# than the marker commit, and requires that parent to still be the exact
# canonical CRM HEAD before any stage runs.

on:
  push:
    branches:
      - 'release/private-crm-rc*-inventory-host-split-inspect-access-*'
      - 'release/private-crm-rc*-inventory-host-split-protect-internal-*'
      - 'release/private-crm-rc*-inventory-host-split-create-internal-pages-*'
      - 'release/private-crm-rc*-inventory-host-split-deploy-internal-*'
      - 'release/private-crm-rc*-inventory-host-split-verify-internal-*'
      - 'release/private-crm-rc*-inventory-host-split-open-public-*'
      - 'release/private-crm-rc*-inventory-host-split-verify-public-*'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact release/private-crm-rc branch HEAD SHA approved for this run
        required: true
        type: string
      stage:
        description: Which step of the split to perform
        required: true
        type: choice
        options:
          - inspect-access
          - protect-internal
          - create-internal-pages
          - deploy-internal
          - verify-internal
          - open-public
          - verify-public
      approval_phrase:
        description: Required for every mutating manual stage
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: crm-host-split-operator
  cancel-in-progress: false

jobs:
  host-split:
    name: CRM host split
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crm-production
    env:
      CANONICAL_BRANCH: agent/platform-telegram-self-service
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE: vishartattoo.com
      PUBLIC_HOST: crm.vishartattoo.com
      PUBLIC_PAGES_PROJECT: vishar-crm-production
      PUBLIC_PAGES_SUBDOMAIN: vishar-crm-production.pages.dev
      INTERNAL_HOST: app.vishartattoo.com
      INTERNAL_PAGES_PROJECT: vishar-crm-internal
      INTERNAL_PAGES_SUBDOMAIN: vishar-crm-internal.pages.dev
      STAGE: ${{ inputs.stage }}
      VITE_SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TEAM_INVITE_URL: ${{ vars.CRM_PRODUCTION_TEAM_INVITE_URL }}
      VITE_CALENDAR_CONNECTOR_ORIGIN: https://calendar.vishartattoo.com
      VITE_MONZO_CONNECTOR_ORIGIN: https://monzo.vishartattoo.com
      VITE_INSTAGRAM_CONNECTOR_ORIGIN: https://instagram.vishartattoo.com
      VITE_BOOKING_FORMS_ORIGIN: https://booking.vishartattoo.com
      # Explicit product analytics. Publishable values only; the build stays
      # analytics-free until both repository variables exist.
      VITE_POSTHOG_KEY: ${{ vars.CRM_PRODUCTION_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.CRM_PRODUCTION_POSTHOG_HOST }}

    steps:
      - name: Verify trigger metadata, gate and target
        shell: bash
        env:
          APPROVED_SHA_INPUT: ${{ inputs.approved_sha }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
          DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo 'Only the repository owner may run the CRM host split.' >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            case "$GITHUB_REF_NAME" in
              release/private-crm-rc*-inventory-host-split-inspect-access-*) STAGE='inspect-access' ;;
              release/private-crm-rc*-inventory-host-split-protect-internal-*) STAGE='protect-internal' ;;
              release/private-crm-rc*-inventory-host-split-create-internal-pages-*) STAGE='create-internal-pages' ;;
              release/private-crm-rc*-inventory-host-split-deploy-internal-*) STAGE='deploy-internal' ;;
              release/private-crm-rc*-inventory-host-split-verify-internal-*) STAGE='verify-internal' ;;
              release/private-crm-rc*-inventory-host-split-open-public-*) STAGE='open-public' ;;
              release/private-crm-rc*-inventory-host-split-verify-public-*) STAGE='verify-public' ;;
              *)
                echo 'Push trigger is outside the reserved CRM host-split namespace.' >&2
                exit 1
                ;;
            esac
          else
            case "$GITHUB_REF_NAME" in
              release/private-crm-rc*) ;;
              *)
                echo 'Manual host-split runs require an approved release/private-crm-rc* branch.' >&2
                exit 1
                ;;
            esac
            [ -n "$APPROVED_SHA_INPUT" ] || {
              echo 'approved_sha is required for a manual host-split run.' >&2
              exit 1
            }
          fi

          case "$STAGE" in
            inspect-access|verify-internal|verify-public) ;;
            protect-internal|create-internal-pages|deploy-internal|open-public)
              [ "$DEPLOY_ENABLED" = 'true' ] || {
                echo 'CRM_PRODUCTION_DEPLOY_ENABLED is not explicitly enabled.' >&2
                exit 1
              }
              if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
                [ "$APPROVAL_PHRASE" = 'SPLIT_CRM_HOSTS' ] || {
                  echo 'The exact approval phrase is required for a mutating manual stage.' >&2
                  exit 1
                }
              fi
              ;;
            *)
              echo "Unknown CRM host-split stage: $STAGE" >&2
              exit 1
              ;;
          esac

          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) exit 1 ;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac

          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "RELEASE_SHA=$APPROVED_SHA_INPUT" >> "$GITHUB_ENV"
          fi

      - name: Checkout trigger source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable source and checkout exact release SHA
        shell: bash
        env:
          APPROVED_SHA_INPUT: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ -n "$canonical_sha" ] || {
            echo 'Canonical CRM branch could not be resolved.' >&2
            exit 1
          }

          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            parent_count="$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF-1}')"
            [ "$parent_count" = '1' ] || {
              echo 'The automation trigger must be a single-parent marker commit.' >&2
              exit 1
            }
            release_sha="$(git rev-parse "$GITHUB_SHA^")"
            [ "$release_sha" = "$canonical_sha" ] || {
              echo 'The automation trigger parent is no longer the exact canonical CRM HEAD.' >&2
              exit 1
            }

            mapfile -t changed_files < <(git diff --name-only "$release_sha" "$GITHUB_SHA")
            [ "${#changed_files[@]}" = '1' ] || {
              echo 'The automation trigger may change exactly one marker file.' >&2
              exit 1
            }
            [ "${changed_files[0]}" = '.github/ops-triggers/crm-host-split.trigger' ] || {
              echo 'The automation trigger changed something other than its marker file.' >&2
              exit 1
            }

            marker="$(tr -d '\r\n' < .github/ops-triggers/crm-host-split.trigger)"
            [ "$marker" = "$STAGE:$release_sha" ] || {
              echo 'The automation trigger marker does not match the requested stage and exact release SHA.' >&2
              exit 1
            }
            echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          else
            release_sha="$APPROVED_SHA_INPUT"
            [ "$release_sha" = "$GITHUB_SHA" ] || {
              echo 'approved_sha must exactly match the manual workflow source SHA.' >&2
              exit 1
            }
            git merge-base --is-ancestor "$release_sha" "$canonical_sha" || {
              echo 'The approved manual release is not in canonical CRM lineage.' >&2
              exit 1
            }
          fi

          git checkout --detach "$release_sha"
          [ "$(git rev-parse HEAD)" = "$release_sha" ]
          [ -z "$(git status --short)" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the requested stage
        shell: bash
        run: GITHUB_SHA="$RELEASE_SHA" node scripts/crm-host-split.mjs "$STAGE"

      - name: Install locked CRM dependencies
        if: >-
          ${{
            inputs.stage == 'deploy-internal'
            || inputs.stage == 'open-public'
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-deploy-internal-')
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-open-public-')
          }}
        working-directory: admin
        run: npm ci

      - name: Build the CRM for this stage's surface
        if: >-
          ${{
            inputs.stage == 'deploy-internal'
            || inputs.stage == 'open-public'
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-deploy-internal-')
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-open-public-')
          }}
        working-directory: admin
        env:
          VITE_CRM_SURFACE: ${{ inputs.stage == 'deploy-internal' && 'internal' || 'public' }}
        run: |
          set -euo pipefail
          if [ "$STAGE" = 'deploy-internal' ]; then
            export VITE_CRM_SURFACE='internal'
          else
            export VITE_CRM_SURFACE='public'
          fi
          npm test
          npm run typecheck
          npm run build

      - name: Verify the built bundle carries the intended surface
        if: >-
          ${{
            inputs.stage == 'deploy-internal'
            || inputs.stage == 'open-public'
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-deploy-internal-')
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-open-public-')
          }}
        shell: bash
        run: |
          set -euo pipefail
          test -f admin/dist/index.html
          test -f admin/dist/_headers
          grep -Fq 'noindex' admin/dist/index.html
          grep -R -Fq "$VITE_SUPABASE_URL" admin/dist
          grep -R -Fq "$VITE_SUPABASE_PUBLISHABLE_KEY" admin/dist
          grep -R -Fq "$VITE_BOOKING_FORMS_ORIGIN" admin/dist
          node scripts/check-private-crm-artifact.mjs admin/dist
          if [ "$STAGE" = 'deploy-internal' ]; then
            grep -R -Fq 'VITE_CRM_SURFACE:"internal"' admin/dist
          else
            if grep -R -Fq 'VITE_CRM_SURFACE:"internal"' admin/dist; then
              echo 'The public build carries the internal surface. Refusing.' >&2
              exit 1
            fi
          fi

      - name: Install pinned deployment tooling
        if: >-
          ${{
            inputs.stage == 'deploy-internal'
            || inputs.stage == 'open-public'
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-deploy-internal-')
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-open-public-')
          }}
        run: npm ci

      - name: Deploy the operator build to the internal Pages project
        if: >-
          ${{
            inputs.stage == 'deploy-internal'
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-deploy-internal-')
          }}
        working-directory: admin
        run: >-
          ../node_modules/.bin/wrangler pages deploy dist
          --project-name "$INTERNAL_PAGES_PROJECT"
          --branch production
          --commit-hash "$RELEASE_SHA"
          --commit-dirty=false

      - name: Deploy the public build to the public Pages project
        if: >-
          ${{
            inputs.stage == 'open-public'
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-open-public-')
          }}
        working-directory: admin
        run: >-
          ../node_modules/.bin/wrangler pages deploy dist
          --project-name "$PUBLIC_PAGES_PROJECT"
          --branch production
          --commit-hash "$RELEASE_SHA"
          --commit-dirty=false

      - name: Complete the stage and read production back
        if: >-
          ${{
            inputs.stage == 'deploy-internal'
            || inputs.stage == 'open-public'
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-deploy-internal-')
            || startsWith(github.ref_name, 'release/private-crm-rc') && contains(github.ref_name, '-inventory-host-split-open-public-')
          }}
        shell: bash
        run: GITHUB_SHA="$RELEASE_SHA" node scripts/crm-host-split.mjs "${STAGE}-readback"

      - name: Stage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### CRM host split - \`$STAGE\`"
            echo
            echo "- Exact release SHA: \`${RELEASE_SHA:-unresolved}\`"
            echo "- Trigger ref: \`$GITHUB_REF_NAME\`"
            echo "- Public host: \`$PUBLIC_HOST\` (project \`$PUBLIC_PAGES_PROJECT\`)"
            echo "- Operator host: \`$INTERNAL_HOST\` (project \`$INTERNAL_PAGES_PROJECT\`)"
            echo '- Supabase migration / Worker / public site deploy commands: none'
          } >> "$GITHUB_STEP_SUMMARY"
