name: Activate private production Telegram Worker

on:
  push:
    branches:
      - release/private-crm-rc19-telegram-activation

permissions:
  contents: read

concurrency:
  group: activate-private-production-telegram
  cancel-in-progress: false

jobs:
  activate:
    name: Activate scheduled Telegram production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      WORKER_NAME: vishar-telegram-drain-production
      SOURCE_SHA: 7cc9a7fc895a76e3d276ad1f57fafd26e947e3e9
      REQUIRED_TELEGRAM_SHA: 314f0359ad083cec4efc7ea389d3111e2d83b755
      EXPECTED_INERT_VERSION: d7023426-1d3a-4fc1-ae51-748d40fc6283
      WORKFLOW_PATH: .github/workflows/activate-private-production-telegram.yml

    steps:
      - name: Checkout activation branch for gate verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bounded activation branch
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = 'release/private-crm-rc19-telegram-activation' ] || {
            echo 'Unexpected activation branch.' >&2
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          [ "$(git rev-list --count "$SOURCE_SHA..$GITHUB_SHA")" = '1' ] || {
            echo 'Activation branch must remain exactly one commit above RC19.' >&2
            exit 1
          }
          changed_files="$(git diff --name-only "$SOURCE_SHA...$GITHUB_SHA")"
          [ "$changed_files" = "$WORKFLOW_PATH" ] || {
            echo 'Activation branch contains changes outside the one-time workflow.' >&2
            exit 1
          }

      - name: Checkout exact validated RC19 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source and Telegram ancestry
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ -z "$(git status --short)" ]
          git merge-base --is-ancestor "$REQUIRED_TELEGRAM_SHA" "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked root dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=moderate

      - name: Re-run focused Telegram production boundaries
        run: |
          set -euo pipefail
          node scripts/test-telegram-drain.mjs
          node scripts/test-telegram-drain-worker.mjs
          npm run test:telegram-production
          npm run check:telegram-production-bundle
          npm run scan:secrets

      - name: Verify exact inert Worker state before activation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          versions_json="$(npx wrangler versions list --name "$WORKER_NAME" --json)"
          VERSION_LIST="$versions_json" node <<'NODE'
          const versions = JSON.parse(process.env.VERSION_LIST || '[]');
          if (!Array.isArray(versions) || versions[0]?.id !== process.env.EXPECTED_INERT_VERSION) {
            throw new Error('Production Telegram Worker drifted from the approved inert version');
          }
          NODE

          secrets_json="$(npx wrangler secret list --config wrangler.telegram-drain.production.toml --name "$WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const values = JSON.parse(process.env.SECRET_LIST || '[]');
          const actual = values.map((entry) => entry?.name).filter(Boolean).sort();
          const expected = [
            'ARTIST_TELEGRAM_KRISTINA_HPRODUCTION',
            'ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION',
            'SUPABASE_SECRET_KEY',
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Production Telegram Worker secret-name set drifted');
          }
          NODE

          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          subdomain_json="$(curl --fail-with-body --silent --show-error \
            "$api_base/workers/scripts/$WORKER_NAME/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          schedules_json="$(curl --fail-with-body --silent --show-error \
            "$api_base/workers/scripts/$WORKER_NAME/schedules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          domains_json="$(curl --fail-with-body --silent --show-error \
            "$api_base/workers/domains?service=$WORKER_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          SUBDOMAIN_JSON="$subdomain_json" SCHEDULES_JSON="$schedules_json" DOMAINS_JSON="$domains_json" node <<'NODE'
          const subdomain = JSON.parse(process.env.SUBDOMAIN_JSON);
          const schedules = JSON.parse(process.env.SCHEDULES_JSON);
          const domains = JSON.parse(process.env.DOMAINS_JSON);
          if (subdomain?.success !== true || subdomain?.result?.enabled !== false || subdomain?.result?.previews_enabled !== false) {
            throw new Error('Worker public subdomain or preview boundary drifted');
          }
          if (schedules?.success !== true || !Array.isArray(schedules?.result?.schedules) || schedules.result.schedules.length !== 0) {
            throw new Error('Expected inert Worker with zero cron schedules');
          }
          const workerDomains = Array.isArray(domains?.result)
            ? domains.result.filter((entry) => entry?.service === process.env.WORKER_NAME)
            : null;
          if (domains?.success !== true || !Array.isArray(workerDomains) || workerDomains.length !== 0) {
            throw new Error('Expected zero Custom Domains before activation');
          }
          NODE

      - name: Generate and deploy exact scheduled Telegram drain Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deploy_config="$GITHUB_WORKSPACE/.wrangler.telegram.production.deploy.toml"
          trap 'rm -f "$deploy_config"' EXIT

          node scripts/generate-telegram-production-deploy-config.mjs "$deploy_config"
          grep -Fq 'TELEGRAM_DRAIN_ENABLED = "true"' "$deploy_config"
          grep -Fq 'crons = ["*/5 * * * *"]' "$deploy_config"

          XDG_CONFIG_HOME=.wrangler/config \
          WRANGLER_LOG_PATH=.wrangler/telegram-production-activation.log \
          WRANGLER_SEND_METRICS=false \
            npx wrangler deploy \
              --config "$deploy_config" \
              --name "$WORKER_NAME" \
              --dry-run \
              --outdir .wrangler/telegram-production-active-generated

          npx wrangler deploy \
            --config "$deploy_config" \
            --name "$WORKER_NAME" \
            --strict

          rm -f "$deploy_config"
          trap - EXIT

      - name: Verify exact active Cloudflare state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          secrets_json="$(npx wrangler secret list --config wrangler.telegram-drain.production.toml --name "$WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const values = JSON.parse(process.env.SECRET_LIST || '[]');
          const actual = values.map((entry) => entry?.name).filter(Boolean).sort();
          const expected = [
            'ARTIST_TELEGRAM_KRISTINA_HPRODUCTION',
            'ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION',
            'SUPABASE_SECRET_KEY',
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Active Worker secret-name set is not exact');
          }
          NODE

          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          subdomain_json="$(curl --fail-with-body --silent --show-error \
            "$api_base/workers/scripts/$WORKER_NAME/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          schedules_json="$(curl --fail-with-body --silent --show-error \
            "$api_base/workers/scripts/$WORKER_NAME/schedules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          domains_json="$(curl --fail-with-body --silent --show-error \
            "$api_base/workers/domains?service=$WORKER_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          SUBDOMAIN_JSON="$subdomain_json" SCHEDULES_JSON="$schedules_json" DOMAINS_JSON="$domains_json" node <<'NODE'
          const subdomain = JSON.parse(process.env.SUBDOMAIN_JSON);
          const schedules = JSON.parse(process.env.SCHEDULES_JSON);
          const domains = JSON.parse(process.env.DOMAINS_JSON);
          if (subdomain?.success !== true || subdomain?.result?.enabled !== false || subdomain?.result?.previews_enabled !== false) {
            throw new Error('Active Worker must remain unreachable through workers.dev/previews');
          }
          const cronList = schedules?.result?.schedules;
          if (
            schedules?.success !== true ||
            !Array.isArray(cronList) ||
            cronList.length !== 1 ||
            cronList[0]?.cron !== '*/5 * * * *'
          ) {
            throw new Error('Active Worker must have exactly one five-minute cron');
          }
          const workerDomains = Array.isArray(domains?.result)
            ? domains.result.filter((entry) => entry?.service === process.env.WORKER_NAME)
            : null;
          if (domains?.success !== true || !Array.isArray(workerDomains) || workerDomains.length !== 0) {
            throw new Error('Active Worker must have zero Custom Domains');
          }
          NODE

      - name: Record non-secret active Worker evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/telegram-production-activation-evidence"
          mkdir -p "$evidence_dir"
          versions_json="$(npx wrangler versions list --name "$WORKER_NAME" --json)"
          deployments_json="$(npx wrangler deployments list --name "$WORKER_NAME" --json)"

          VERSIONS_JSON="$versions_json" DEPLOYMENTS_JSON="$deployments_json" EVIDENCE_DIR="$evidence_dir" node <<'NODE'
          const fs = require('fs');
          const versions = JSON.parse(process.env.VERSIONS_JSON || '[]');
          const deployments = JSON.parse(process.env.DEPLOYMENTS_JSON || '[]');
          if (!Array.isArray(versions) || !versions.length || !versions[0]?.id) {
            throw new Error('Unable to resolve active Telegram Worker version id');
          }
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/safe-summary.json', JSON.stringify({
            worker: process.env.WORKER_NAME,
            source_sha: process.env.SOURCE_SHA,
            version_id: versions[0].id,
            prior_inert_version_id: process.env.EXPECTED_INERT_VERSION,
            deployments_observed: Array.isArray(deployments) ? deployments.length : null,
            workers_dev: false,
            preview_urls: false,
            cron: '*/5 * * * *',
            custom_domain_count: 0,
            telegram_drain_enabled: true,
            secret_names_only: true,
          }, null, 2));
          console.log(`TELEGRAM_ACTIVE_WORKER_VERSION=${versions[0].id}`);
          NODE

      - name: Upload safe activation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: telegram-production-active-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/telegram-production-activation-evidence/safe-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Activation summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Telegram production scheduled activation'
            echo
            echo "- Trigger SHA: \`$GITHUB_SHA\`"
            echo "- Exact deployed source: \`$SOURCE_SHA\`"
            echo "- Prior inert version: \`$EXPECTED_INERT_VERSION\`"
            echo '- Worker: `vishar-telegram-drain-production`'
            echo '- `TELEGRAM_DRAIN_ENABLED=true`'
            echo '- workers.dev disabled'
            echo '- preview URLs disabled'
            echo '- exactly one cron: `*/5 * * * *`'
            echo '- zero Custom Domains'
            echo '- exact three-secret name set preserved'
            echo '- no Supabase mutation performed by this workflow'
            echo '- no Telegram API message is sent by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
