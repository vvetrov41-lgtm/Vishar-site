name: Static Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Build Tailwind CSS
        run: npm run build:tailwind

      - name: Validate static site
        run: npm run validate:site

      - name: Compile GEO runtime and launcher
        run: python -m compileall .geo-topic-agent-runtime scripts

      - name: Test dual-runtime integration
        run: pytest tests/test_geo_agent_dual_runtime.py -q
