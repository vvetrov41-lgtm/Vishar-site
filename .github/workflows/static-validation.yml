name: Static Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce public repository workflow safety
        run: node scripts/check-public-repo-workflow-safety.mjs

      - name: Scan repository for committed secrets
        run: node scripts/scan-secrets.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Build Tailwind CSS
        run: npm run build:tailwind

      - name: Validate static site
        run: npm run validate:site

      - name: Check social share previews
        run: node scripts/test-social-preview.mjs

      - name: Public deploy boundary self-test
        run: npm run build:public:self-test

      - name: Public deploy boundary build check
        run: npm run build:public:check

      - name: CRM scheduler watchdog self-test
        run: node scripts/crm-scheduler-watchdog.mjs --self-test

      - name: Compile GEO runtime and launcher
        run: python -m compileall .geo-topic-agent-runtime scripts

      - name: Test GEO runtime
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.geo-topic-agent-runtime
        run: python -m pytest tests -q

      - name: Check calculator rules, mobile layout and booking handoff
        run: |
          node scripts/test-tattoo-pricing.mjs
          npm install --prefix "$RUNNER_TEMP/calculator-qa" --no-audit --no-fund playwright@1.58.2 axe-core@4.10.3
          mkdir -p "$RUNNER_TEMP/calculator-fixtures"
          cp assets/og/og-london-2026-nov.jpg "$RUNNER_TEMP/calculator-fixtures/design.jpg"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/calculator-qa/node_modules/playwright/index.mjs" \
          AXE_PATH="$RUNNER_TEMP/calculator-qa/node_modules/axe-core/axe.min.js" \
          PLAYWRIGHT_EXECUTABLE="$(command -v google-chrome)" \
          node scripts/test-enquiry-form-v2-browser.mjs --only 'Calculator mobile' --fixtures "$RUNNER_TEMP/calculator-fixtures"
