name: Gmail production validation

on:
  pull_request:
    paths:
      - 'workers/gmail-production.js'
      - 'workers/gmail-production-entrypoint.js'
      - 'workers/gmail-complete-discovery-api.js'
      - 'workers/gmail-operator-api.js'
      - 'workers/telegram-drain-worker.js'
      - 'workers/lib/google-gmail.js'
      - 'workers/lib/gmail-supabase.js'
      - 'workers/lib/gmail-tool-contract.js'
      - 'workers/gpt-actions-production-full.js'
      - 'wrangler.gmail.production.toml'
      - 'wrangler.gpt-actions.production.toml'
      - 'supabase/migrations/0059_gmail_production_integration.sql'
      - 'supabase/migrations/0122_gmail_client_scoped_read.sql'
      - 'supabase/migrations/0123_gmail_known_client_discovery.sql'
      - 'supabase/tests/209_gmail_production_integration.sql'
      - 'supabase/tests/210_gmail_acl_inventory.sql'
      - 'docs/gpt-actions/openapi.production*.yaml'
      - 'docs/crm/MCP_READY_ARCHITECTURE.md'
      - 'scripts/test-gmail-production.mjs'
      - 'scripts/test-gmail-operator-api.mjs'
      - 'scripts/test-gmail-complete-discovery.mjs'
      - 'scripts/test-gmail-gpt-host-boundary.mjs'
      - 'scripts/test-gmail-rollout-phases.mjs'
      - 'scripts/test-gmail-mcp-ready.mjs'
      - 'scripts/test-gpt-gmail-openapi.mjs'
      - 'scripts/test-telegram-drain-worker.mjs'
      - 'scripts/materialize-gmail-openapi.mjs'
      - 'scripts/generate-gmail-production-deploy-config.mjs'
      - '.github/workflows/gmail-backend-production-redeploy.yml'
      - '.github/workflows/gmail-production-validation.yml'
  push:
    branches:
      - agent/platform-telegram-self-service
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmail-production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Gmail OAuth/provider regression
        run: node scripts/test-gmail-production.mjs

      - name: CRM Gmail operator boundary regression
        run: node scripts/test-gmail-operator-api.mjs

      - name: Complete known-client discovery regression
        run: node scripts/test-gmail-complete-discovery.mjs

      - name: Gmail GPT host boundary regression
        run: node scripts/test-gmail-gpt-host-boundary.mjs

      - name: Gmail rollout phase regression
        run: node scripts/test-gmail-rollout-phases.mjs

      - name: Shared scheduler RPC contract regression
        run: node scripts/test-telegram-drain-worker.mjs

      - name: Gmail MCP-ready contract regression
        run: node scripts/test-gmail-mcp-ready.mjs

      - name: GPT Gmail OpenAPI split regression
        run: node scripts/test-gpt-gmail-openapi.mjs

      - name: Canonical GPT Actions validation
        run: npm run validate:gpt-actions

      - name: Secret scan
        run: npm run scan:secrets

      - name: Gmail Worker syntax check
        run: |
          node --check workers/gmail-production.js
          node --check workers/gmail-production-entrypoint.js
          node --check workers/gmail-complete-discovery-api.js
          node --check workers/gmail-operator-api.js
          node --check workers/lib/google-gmail.js
          node --check workers/lib/gmail-supabase.js
          node --check workers/lib/gmail-tool-contract.js
          node --check scripts/generate-gmail-production-deploy-config.mjs
          node --check scripts/test-gmail-operator-api.mjs
          node --check scripts/test-gmail-complete-discovery.mjs
          node --check scripts/test-gmail-gpt-host-boundary.mjs
          node --check scripts/test-gmail-rollout-phases.mjs

      - name: Gmail production bundle dry-run
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.wrangler/config
          WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler/gmail-production-wrangler.log
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --config wrangler.gmail.production.toml --dry-run --outdir .wrangler/gmail-production-dry-run

      - name: GPT production service-binding bundle dry-run
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.wrangler/config
          WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler/gpt-gmail-production-wrangler.log
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --config wrangler.gpt-actions.production.toml --dry-run --outdir .wrangler/gpt-gmail-production-dry-run

      - name: Diff hygiene
        run: git diff --check
