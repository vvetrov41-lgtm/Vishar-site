name: PR 180 calendar staging lifecycle mutation

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr180-calendar-staging-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle-mutation:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.draft == true &&
      (
        contains(github.event.pull_request.body, '<!-- RUN_PR180_CALENDAR_RESCHEDULE_V3 -->') ||
        contains(github.event.pull_request.body, '<!-- RUN_PR180_CALENDAR_CANCEL_V4 -->')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Fail-closed PR guard
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$APPROVED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            (.pull_request.body | contains("<!-- RUN_PR180_CALENDAR_RESCHEDULE_V3 -->")) as $reschedule
            | (.pull_request.body | contains("<!-- RUN_PR180_CALENDAR_CANCEL_V4 -->")) as $cancel
            | .action == "edited"
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.number == 180
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == "agent/google-calendar-foundation"
            and .pull_request.head.ref == "agent/google-calendar-oauth-connector"
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
            and ($reschedule != $cancel)
          ' "$GITHUB_EVENT_PATH" >/dev/null

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact head, normal CI and provider custody
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' \
            | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in \
            "Static Validation" \
            "CRM and booking validation" \
            "PR 180 calendar staging token preflight" \
            "PR 180 calendar provider readiness"; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[];
                .name == $name
                and .head_sha == $sha
                and .status == "completed"
                and .conclusion == "success"
              )
            ' "$RUNNER_TEMP/runs.json" >/dev/null
          done
          node scripts/validate-calendar-staging.mjs --deploy-ready
          grep -Fx 'CALENDAR_DRAIN_ENABLED = "false"' wrangler.calendar.staging.toml
          ! grep -Eq '^\[triggers\]$|^crons\s*=' wrangler.calendar.staging.toml

      - name: Mutate exact synthetic Calendar lifecycle phase
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || {
            echo 'Missing encrypted staging configuration name: SUPABASE_ACCESS_TOKEN' >&2
            exit 1
          }

          phase="$(jq -r '
            if (.pull_request.body | contains("<!-- RUN_PR180_CALENDAR_RESCHEDULE_V3 -->"))
            then "reschedule_v3"
            else "cancel_v4"
            end
          ' "$GITHUB_EVENT_PATH")"

          sql_file="$RUNNER_TEMP/calendar-lifecycle-${phase}.sql"
          request_file="$RUNNER_TEMP/calendar-lifecycle-${phase}-request.json"
          response_file="$RUNNER_TEMP/calendar-lifecycle-${phase}-response.json"
          cleanup() {
            rm -f "$sql_file" "$request_file" "$response_file"
          }
          trap cleanup EXIT

          if [ "$phase" = "reschedule_v3" ]; then
            cat > "$sql_file" <<'SQL'
          begin;

          do $precheck$
          declare
            v_session public.sessions%rowtype;
            v_active integer;
            v_due integer;
          begin
            select * into strict v_session
            from public.sessions
            where id = 'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid
            for update;

            if v_session.artist_id <> 'a1111111-1111-4111-8111-111111111111'::uuid
              or v_session.status <> 'confirmed'::public.session_status
              or v_session.appointment_type <> 'in_person_consultation'::public.appointment_type
              or v_session.calendar_version <> 2
              or v_session.calendar_sync_status <> 'synced'::public.calendar_sync_status
              or v_session.calendar_provider <> 'google'::public.calendar_provider
              or v_session.calendar_event_id <> 'vishar414cb8ae6f91fda2fb5e2bb3bcc5a5548b6c79c81435c567c55ff9baa4bcdb61'
              or v_session.calendar_last_synced_version <> 2
              or v_session.calendar_last_error_code is not null
              or v_session.start_at <> '2026-08-06 08:46:00+00'::timestamptz
              or v_session.end_at <> '2026-08-06 09:01:00+00'::timestamptz then
              raise exception 'approved synced synthetic appointment state changed';
            end if;

            if not exists (
              select 1
              from public.clients c
              where c.id = v_session.client_id
                and c.full_name = 'PR177 Synthetic NoRoute'
                and c.email::text = 'pr177-30884006932-noroute@example.invalid'
            ) then
              raise exception 'approved synthetic identity marker is missing';
            end if;

            select count(*) into v_active
            from public.integration_outbox
            where session_id = v_session.id
              and kind in ('calendar_create', 'calendar_update', 'calendar_cancel')
              and status in ('pending', 'failed', 'leased');

            if v_active <> 0 then
              raise exception 'approved appointment already has active Calendar work';
            end if;

            select count(*) into v_due
            from public.integration_outbox
            where kind in ('calendar_create', 'calendar_update', 'calendar_cancel')
              and (
                (status in ('pending', 'failed') and next_attempt_at <= now())
                or (status = 'leased' and lease_expires_at <= now())
              );

            if v_due <> 0 then
              raise exception 'another due Calendar job exists';
            end if;

            if exists (
              select 1
              from public.sessions s
              where s.artist_id = v_session.artist_id
                and s.id <> v_session.id
                and s.status not in ('cancelled', 'completed')
                and tstzrange(s.start_at, s.end_at, '[)')
                  && tstzrange(
                    '2026-08-07 08:46:00+00'::timestamptz,
                    '2026-08-07 09:01:00+00'::timestamptz,
                    '[)'
                  )
            ) then
              raise exception 'approved update target slot is no longer free';
            end if;
          end
          $precheck$;

          select set_config(
            'request.jwt.claims',
            jsonb_build_object(
              'sub', (
                select profile_id
                from crm_private.profile_access
                where role = 'owner' and is_active
                order by profile_id
                limit 1
              ),
              'role', 'authenticated'
            )::text,
            true
          );
          set local role authenticated;

          select public.reschedule_appointment(
            'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid,
            '2026-08-07 08:46:00+00'::timestamptz,
            '2026-08-07 09:01:00+00'::timestamptz
          );

          reset role;

          do $postcheck$
          declare
            v_session public.sessions%rowtype;
            v_pending integer;
            v_due integer;
          begin
            select * into strict v_session
            from public.sessions
            where id = 'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid
            for update;

            if v_session.status <> 'confirmed'::public.session_status
              or v_session.calendar_version <> 3
              or v_session.calendar_sync_status <> 'queued'::public.calendar_sync_status
              or v_session.calendar_provider <> 'google'::public.calendar_provider
              or v_session.calendar_event_id <> 'vishar414cb8ae6f91fda2fb5e2bb3bcc5a5548b6c79c81435c567c55ff9baa4bcdb61'
              or v_session.calendar_last_synced_version <> 2
              or v_session.calendar_last_error_code is not null
              or v_session.start_at <> '2026-08-07 08:46:00+00'::timestamptz
              or v_session.end_at <> '2026-08-07 09:01:00+00'::timestamptz then
              raise exception 'authorised Calendar update postcondition failed';
            end if;

            select count(*) into v_pending
            from public.integration_outbox
            where session_id = v_session.id
              and kind = 'calendar_update'
              and status = 'pending'
              and attempt_count = 0
              and last_error_code is null
              and payload->>'appointment_type' = v_session.appointment_type::text
              and (payload->>'calendar_version')::integer = 3;

            if v_pending <> 1 then
              raise exception 'version three Calendar update job is missing or duplicated';
            end if;

            select count(*) into v_due
            from public.integration_outbox
            where kind in ('calendar_create', 'calendar_update', 'calendar_cancel')
              and (
                (status in ('pending', 'failed') and next_attempt_at <= now())
                or (status = 'leased' and lease_expires_at <= now())
              );

            if v_due <> 1 then
              raise exception 'unexpected due Calendar job count after update';
            end if;
          end
          $postcheck$;

          commit;

          select jsonb_build_object(
            'phase', 'reschedule_v3',
            'session_id', s.id,
            'calendar_version', s.calendar_version,
            'calendar_sync_status', s.calendar_sync_status,
            'start_at', s.start_at,
            'end_at', s.end_at,
            'event_id_unchanged', s.calendar_event_id = 'vishar414cb8ae6f91fda2fb5e2bb3bcc5a5548b6c79c81435c567c55ff9baa4bcdb61'
          ) as summary
          from public.sessions s
          where s.id = 'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid;
          SQL
          else
            cat > "$sql_file" <<'SQL'
          begin;

          do $precheck$
          declare
            v_session public.sessions%rowtype;
            v_active integer;
            v_due integer;
          begin
            select * into strict v_session
            from public.sessions
            where id = 'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid
            for update;

            if v_session.artist_id <> 'a1111111-1111-4111-8111-111111111111'::uuid
              or v_session.status <> 'confirmed'::public.session_status
              or v_session.appointment_type <> 'in_person_consultation'::public.appointment_type
              or v_session.calendar_version <> 3
              or v_session.calendar_sync_status <> 'synced'::public.calendar_sync_status
              or v_session.calendar_provider <> 'google'::public.calendar_provider
              or v_session.calendar_event_id <> 'vishar414cb8ae6f91fda2fb5e2bb3bcc5a5548b6c79c81435c567c55ff9baa4bcdb61'
              or v_session.calendar_last_synced_version <> 3
              or v_session.calendar_last_error_code is not null
              or v_session.start_at <> '2026-08-07 08:46:00+00'::timestamptz
              or v_session.end_at <> '2026-08-07 09:01:00+00'::timestamptz then
              raise exception 'approved updated synthetic appointment state changed';
            end if;

            select count(*) into v_active
            from public.integration_outbox
            where session_id = v_session.id
              and kind in ('calendar_create', 'calendar_update', 'calendar_cancel')
              and status in ('pending', 'failed', 'leased');

            if v_active <> 0 then
              raise exception 'approved appointment already has active Calendar work';
            end if;

            select count(*) into v_due
            from public.integration_outbox
            where kind in ('calendar_create', 'calendar_update', 'calendar_cancel')
              and (
                (status in ('pending', 'failed') and next_attempt_at <= now())
                or (status = 'leased' and lease_expires_at <= now())
              );

            if v_due <> 0 then
              raise exception 'another due Calendar job exists';
            end if;
          end
          $precheck$;

          select set_config(
            'request.jwt.claims',
            jsonb_build_object(
              'sub', (
                select profile_id
                from crm_private.profile_access
                where role = 'owner' and is_active
                order by profile_id
                limit 1
              ),
              'role', 'authenticated'
            )::text,
            true
          );
          set local role authenticated;

          select public.set_appointment_status(
            'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid,
            'cancelled'::public.session_status
          );

          reset role;

          do $postcheck$
          declare
            v_session public.sessions%rowtype;
            v_pending integer;
            v_due integer;
          begin
            select * into strict v_session
            from public.sessions
            where id = 'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid
            for update;

            if v_session.status <> 'cancelled'::public.session_status
              or v_session.cancelled_at is null
              or v_session.calendar_version <> 4
              or v_session.calendar_provider <> 'google'::public.calendar_provider
              or v_session.calendar_event_id <> 'vishar414cb8ae6f91fda2fb5e2bb3bcc5a5548b6c79c81435c567c55ff9baa4bcdb61'
              or v_session.calendar_last_synced_version <> 3
              or v_session.calendar_last_error_code is not null then
              raise exception 'authorised Calendar cancellation postcondition failed';
            end if;

            select count(*) into v_pending
            from public.integration_outbox
            where session_id = v_session.id
              and kind = 'calendar_cancel'
              and status = 'pending'
              and attempt_count = 0
              and last_error_code is null
              and payload->>'appointment_type' = v_session.appointment_type::text
              and (payload->>'calendar_version')::integer = 4;

            if v_pending <> 1 then
              raise exception 'version four Calendar cancellation job is missing or duplicated';
            end if;

            select count(*) into v_due
            from public.integration_outbox
            where kind in ('calendar_create', 'calendar_update', 'calendar_cancel')
              and (
                (status in ('pending', 'failed') and next_attempt_at <= now())
                or (status = 'leased' and lease_expires_at <= now())
              );

            if v_due <> 1 then
              raise exception 'unexpected due Calendar job count after cancellation';
            end if;
          end
          $postcheck$;

          commit;

          select jsonb_build_object(
            'phase', 'cancel_v4',
            'session_id', s.id,
            'status', s.status,
            'calendar_version', s.calendar_version,
            'has_event_id_before_drain', s.calendar_event_id is not null
          ) as summary
          from public.sessions s
          where s.id = 'beecc81c-9a3e-4fdf-9f3a-7b77df1ef616'::uuid;
          SQL
          fi

          jq -Rs '{query: .}' < "$sql_file" > "$request_file"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@$request_file" \
            'https://api.supabase.com/v1/projects/gwaliusblwrzisrwnsvs/database/query')"
          case "$http_status" in
            200|201) ;;
            *)
              echo "CALENDAR_LIFECYCLE_FAILED=${phase};STATUS=$http_status" >&2
              exit 1
              ;;
          esac

          jq -e 'type == "array" or type == "object"' "$response_file" >/dev/null
          echo "CALENDAR_LIFECYCLE_OK=${phase}"
