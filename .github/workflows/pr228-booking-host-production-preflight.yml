name: PR 228 booking host production verification

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr228-booking-host-production-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify dedicated booking host
    if: >-
      github.event.pull_request.number == 228 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/production-booking-host'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BOOKING_HOST: booking.vishartattoo.com

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --short)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate domain-independent Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-booking-host-worker.mjs
          node scripts/test-booking-host-production-config.mjs
          npx wrangler deploy --config wrangler.booking-host.production.toml --dry-run --outdir .wrangler/booking-host-production-verification
          npm run scan:secrets

      - name: Verify live dedicated hostname and route surface
        shell: bash
        run: |
          set -euo pipefail
          root_url="https://${BOOKING_HOST}/?verify=${EXPECTED_HEAD_SHA}"
          root_status="$(curl --silent --show-error --header 'Cache-Control: no-cache' --output /tmp/booking-root.html --write-out '%{http_code}' --max-time 10 "$root_url")"
          privacy_status="$(curl --silent --show-error --header 'Cache-Control: no-cache' --output /dev/null --write-out '%{http_code}' --max-time 10 "https://${BOOKING_HOST}/privacy/?verify=${EXPECTED_HEAD_SHA}")"
          random_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://${BOOKING_HOST}/services/")"
          post_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 -X POST "https://${BOOKING_HOST}/")"

          relay_marker=false
          tattooai_marker=false
          grep -Fq "https://${BOOKING_HOST}/api/enquiry" /tmp/booking-root.html && relay_marker=true
          grep -Fq 'https://tattooai.vvetrov41.workers.dev/' /tmp/booking-root.html && tattooai_marker=true

          echo "BOOKING_ROOT_HTTP=$root_status"
          echo "PRIVACY_HTTP=$privacy_status"
          echo "RANDOM_PATH_HTTP=$random_status"
          echo "FRONTEND_POST_HTTP=$post_status"
          echo "LIVE_HAS_SAME_ORIGIN_RELAY=$relay_marker"
          echo "LIVE_HAS_DIRECT_TATTOOAI=$tattooai_marker"

          test "$root_status" = '200'
          test "$privacy_status" = '200'
          test "$random_status" = '404'
          test "$post_status" = '405'
          grep -Fq 'noindex' /tmp/booking-root.html

      - name: Probe live relay exact-Origin and type boundary
        shell: bash
        run: |
          set -euo pipefail
          spoof_status="$(curl --silent --show-error --output /tmp/spoof.json --write-out '%{http_code}' --max-time 10 \
            -X POST "https://${BOOKING_HOST}/api/enquiry" \
            -H 'Origin: https://booking.vishartattoo.com.evil.example' \
            -H 'Content-Type: application/json' \
            --data '{"type":"tattoo-enquiry"}')"
          generic_status="$(curl --silent --show-error --output /tmp/generic.json --write-out '%{http_code}' --max-time 10 \
            -X POST "https://${BOOKING_HOST}/api/enquiry" \
            -H "Origin: https://${BOOKING_HOST}" \
            -H 'Content-Type: application/json' \
            --data '{"type":"lead","contact":"probe@example.com"}')"

          echo "SPOOFED_ORIGIN_HTTP=$spoof_status"
          echo "GENERIC_PROXY_HTTP=$generic_status"
          echo "SPOOFED_BODY=$(head -c 200 /tmp/spoof.json | tr '\n\r' ' ')"
          echo "GENERIC_BODY=$(head -c 200 /tmp/generic.json | tr '\n\r' ' ')"

          test "$spoof_status" = '403'
          test "$generic_status" = '400'

      - name: Probe relay through legacy tattooai without Telegram delivery
        shell: bash
        run: |
          set -euo pipefail
          probe="$(node <<'NODE'
          process.stdout.write(JSON.stringify({
            type: 'tattoo-enquiry',
            name: 'Relay Boundary Probe',
            email: 'probe@example.com',
            phone: '',
            instagram: '',
            preferredReply: 'Email',
            travellingFrom: 'London',
            projectType: 'Colour realism',
            placement: 'Outer forearm',
            size: '20 cm',
            coverUp: 'No',
            timing: 'Flexible',
            idea: 'Non-persisting relay boundary probe',
            website: '',
            startedAt: Date.now() - 3000,
            images: [{ type: 'image/jpeg', data: Buffer.from('not-a-jpeg').toString('base64') }]
          }));
          NODE
          )"
          status="$(curl --silent --show-error --output /tmp/relay-probe.json --write-out '%{http_code}' --max-time 15 \
            -X POST "https://${BOOKING_HOST}/api/enquiry" \
            -H "Origin: https://${BOOKING_HOST}" \
            -H 'Content-Type: application/json' \
            --data "$probe")"
          summary="$(head -c 300 /tmp/relay-probe.json | tr '\n\r' ' ')"
          echo "NON_PERSISTING_RELAY_HTTP=$status"
          echo "NON_PERSISTING_RELAY_BODY=$summary"
          test "$status" = '400'
          grep -Fqi 'reference image' /tmp/relay-probe.json

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Dedicated booking host verification'
            echo
            echo "- PR head: \`$EXPECTED_HEAD_SHA\`"
            echo '- Production mutations: none'
            echo '- Cloudflare credentials: none'
            echo '- Supabase / CRM mutations: none'
            echo '- Relay E2E probe uses invalid image magic, so legacy tattooai rejects before Telegram delivery'
          } >> "$GITHUB_STEP_SUMMARY"
