name: PR 228 booking host production stage 1

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr228-booking-host-production-stage-1
  cancel-in-progress: false

jobs:
  deploy_frontend:
    name: Deploy isolated booking frontend host
    if: >-
      github.event.pull_request.number == 228 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/production-booking-host'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --short)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate isolated frontend before production mutation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-booking-host-worker.mjs
          node scripts/test-booking-host-production-config.mjs
          npx wrangler deploy --config wrangler.booking-host.production.toml --dry-run --outdir .wrangler/booking-host-production-stage-1
          npm run scan:secrets

      - name: Require dedicated Worker to be absent
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vishar-booking-host-production/settings"
          status="$(curl --silent --show-error --output /tmp/booking-host-settings.json --write-out '%{http_code}' "$api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          if [ "$status" != '404' ]; then
            echo "Refusing first deploy because vishar-booking-host-production is no longer absent (HTTP $status)." >&2
            exit 1
          fi

      - name: Deploy only the dedicated frontend Worker and exact Custom Domain
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.booking-host.production.toml --strict

      - name: Verify dedicated hostname and narrow route surface
        shell: bash
        run: |
          set -euo pipefail
          root_status=000
          for attempt in $(seq 1 20); do
            root_status="$(curl --silent --show-error --output /tmp/booking-root.html --write-out '%{http_code}' --max-time 10 https://booking.vishartattoo.com/ || true)"
            echo "BOOKING_HOST_ROOT_ATTEMPT_${attempt}=$root_status"
            if [ "$root_status" = '200' ]; then
              break
            fi
            sleep 3
          done
          test "$root_status" = '200'
          grep -Fq 'https://tattooai.vvetrov41.workers.dev/' /tmp/booking-root.html
          grep -Fq 'noindex' /tmp/booking-root.html

          privacy_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 https://booking.vishartattoo.com/privacy/)"
          random_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 https://booking.vishartattoo.com/services/)"
          post_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 -X POST https://booking.vishartattoo.com/)"
          echo "PRIVACY_HTTP=$privacy_status"
          echo "RANDOM_PATH_HTTP=$random_status"
          echo "FRONTEND_POST_HTTP=$post_status"
          test "$privacy_status" = '200'
          test "$random_status" = '404'
          test "$post_status" = '405'

      - name: Stage 1 summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Dedicated booking host production stage 1'
            echo
            echo "- PR head: \`$EXPECTED_HEAD_SHA\`"
            echo '- Mutation scope: `vishar-booking-host-production` Worker and exact `booking.vishartattoo.com` Custom Domain only'
            echo '- Worker secrets/bindings: none'
            echo '- tattooai mutation: none'
            echo '- Supabase / CRM mutation: none'
            echo '- Calendar mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"
