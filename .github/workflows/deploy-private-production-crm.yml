name: Deploy private production CRM

on:
  push:
    branches:
      - 'release/private-crm-rc*-backend-auth-crm-only'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact release/private-crm-rc branch HEAD SHA approved for this run
        required: true
        type: string
      deploy:
        description: Deploy after validation. Leave false for validation-only runs.
        required: true
        default: false
        type: boolean
      approval_phrase:
        description: Required only for deploy=true
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-private-production-crm
  cancel-in-progress: false

jobs:
  private-crm:
    name: Private CRM production gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crm-production
    env:
      PRODUCT_BRANCH: agent/platform-telegram-self-service
      # This workflow deploys `crm.vishartattoo.com`, which is the PUBLIC CRM:
      # where an artist signs up and works. The operator environment moved to
      # `app.vishartattoo.com` and is deployed by the host split gate's
      # `deploy-internal` stage, which is re-runnable for ordinary operator
      # deploys too.
      #
      # Saying `public` explicitly rather than relying on the fail-closed
      # default keeps the intent legible next to the assertion below.
      VITE_CRM_SURFACE: public
      VITE_SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TEAM_INVITE_URL: ${{ vars.CRM_PRODUCTION_TEAM_INVITE_URL }}
      VITE_CALENDAR_CONNECTOR_ORIGIN: https://calendar.vishartattoo.com
      VITE_MONZO_CONNECTOR_ORIGIN: https://monzo.vishartattoo.com
      # The production connector is live. Keep the browser target exact and
      # repository-owned so a missing GitHub variable cannot silently disable
      # both artist connection controls in a successful Pages deployment.
      VITE_INSTAGRAM_CONNECTOR_ORIGIN: https://instagram.vishartattoo.com
      # Public booking links are handed to clients, so the branded production
      # booking host is pinned here rather than left to a build-time default.
      VITE_BOOKING_FORMS_ORIGIN: https://booking.vishartattoo.com
      # Product analytics. The publishable key stays environment-owned, while
      # the ingestion host is a repository-owned production invariant so a
      # malformed mutable variable cannot block or redirect a Pages release.
      VITE_POSTHOG_KEY: ${{ vars.CRM_PRODUCTION_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: eu.i.posthog.com
      CRM_PAGES_PROJECT: ${{ vars.CRM_PRODUCTION_PAGES_PROJECT }}
      CRM_ORIGIN: ${{ vars.CRM_PRODUCTION_ORIGIN }}

    steps:
      - name: Verify exact release branch and explicit production gate
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.deploy }}
          APPROVAL_PHRASE: ${{ github.event_name == 'push' && 'DEPLOY_PRIVATE_CRM_ONLY' || inputs.approval_phrase }}
          DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            [[ "$GITHUB_REF_NAME" =~ ^release/private-crm-rc[0-9]+-backend-auth-crm-only$ ]] || {
              echo 'Automatic CRM-only rollout requires the exact isolated backend-auth-crm-only release ref.' >&2
              exit 1
            }
            [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ] || {
              echo 'Only the repository owner may trigger an automatic CRM-only production rollout.' >&2
              exit 1
            }
          else
            case "$GITHUB_REF_NAME" in
              release/private-crm-rc*) ;;
              *)
                echo 'This workflow may run only from an approved release/private-crm-rc* branch.' >&2
                exit 1
                ;;
            esac
          fi

          if [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo 'approved_sha must exactly match the workflow source SHA.' >&2
            exit 1
          fi

          if [ "$DEPLOY_REQUESTED" = 'true' ]; then
            if [ "$DEPLOY_ENABLED" != 'true' ]; then
              echo 'CRM_PRODUCTION_DEPLOY_ENABLED is not explicitly enabled in the crm-production environment.' >&2
              exit 1
            fi
            if [ "$APPROVAL_PHRASE" != 'DEPLOY_PRIVATE_CRM_ONLY' ]; then
              echo 'The exact production approval phrase is required for deploy=true.' >&2
              exit 1
            fi
          fi

      - name: Verify production-only browser configuration
        shell: bash
        run: |
          set -euo pipefail

          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo 'CRM_PRODUCTION_SUPABASE_URL must be an exact hosted Supabase project root URL.' >&2
              exit 1
              ;;
          esac

          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *)
              echo 'CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY must use the publishable-key format.' >&2
              exit 1
              ;;
          esac

          if [ -n "$VITE_TEAM_INVITE_URL" ]; then
            case "$VITE_TEAM_INVITE_URL" in
              https://*.vishartattoo.com/v1/staff/invite) ;;
              *)
                echo 'CRM_PRODUCTION_TEAM_INVITE_URL must be the exact owned Team invite endpoint.' >&2
                exit 1
                ;;
            esac
          fi

          if [ "$VITE_CALENDAR_CONNECTOR_ORIGIN" != 'https://calendar.vishartattoo.com' ]; then
            echo 'The private production CRM may use only the exact production Calendar connector origin.' >&2
            exit 1
          fi

          if [ "$VITE_MONZO_CONNECTOR_ORIGIN" != 'https://monzo.vishartattoo.com' ]; then
            echo 'The private production CRM may use only the exact production Monzo connector origin.' >&2
            exit 1
          fi

          if [ "$VITE_INSTAGRAM_CONNECTOR_ORIGIN" != 'https://instagram.vishartattoo.com' ]; then
            echo 'The private production CRM may use only the exact production Instagram connector origin.' >&2
            exit 1
          fi

          if [ "$VITE_BOOKING_FORMS_ORIGIN" != 'https://booking.vishartattoo.com' ]; then
            echo 'The production CRM may generate booking links only on the production booking host.' >&2
            exit 1
          fi

          # Analytics is optional. When configured, both values must be exact:
          # a publishable project key and an approved PostHog ingestion host.
          if [ -n "$VITE_POSTHOG_KEY" ] || [ -n "$VITE_POSTHOG_HOST" ]; then
            case "$VITE_POSTHOG_KEY" in
              phc_*) ;;
              *)
                echo 'CRM_PRODUCTION_POSTHOG_KEY must be a publishable phc_ project key.' >&2
                exit 1
                ;;
            esac
            case "$VITE_POSTHOG_HOST" in
              eu.i.posthog.com|us.i.posthog.com) ;;
              *)
                echo 'CRM_PRODUCTION_POSTHOG_HOST must be an approved PostHog ingestion host.' >&2
                exit 1
                ;;
            esac
          fi

          if [ "$CRM_PAGES_PROJECT" != 'vishar-crm-production' ]; then
            echo 'CRM_PRODUCTION_PAGES_PROJECT must be the exact production CRM Pages project.' >&2
            exit 1
          fi

          if [ "$CRM_ORIGIN" != 'https://crm.vishartattoo.com' ]; then
            echo 'CRM_PRODUCTION_ORIGIN must be the exact private CRM production origin.' >&2
            exit 1
          fi

      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          fetch-depth: 0

      - name: Verify checkout SHA
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$APPROVED_SHA"
          test -z "$(git status --short)"

      - name: Verify automatic CRM-only exact canonical source and CI
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canonical_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk 'NR == 1 {print $1}')"
          operator_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$GITHUB_SHA" ] || {
            echo 'Canonical CRM branch moved or does not match this release SHA.' >&2
            exit 1
          }
          [ "$operator_sha" = "$GITHUB_SHA" ] || {
            echo 'CRM-only release ref moved after the workflow started.' >&2
            exit 1
          }

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/crm-only-ci.json"
          for workflow in \
            'Static Validation' \
            'CRM and booking validation' \
            'Gmail production validation' \
            'Booking host validation' \
            'WhatsApp production onboarding validation'; do
            jq -e --arg name "$workflow" --arg sha "$GITHUB_SHA" \
              'any(.[]; .name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")' \
              "$RUNNER_TEMP/crm-only-ci.json" >/dev/null || {
                echo "Required exact-head workflow is not green: $workflow" >&2
                exit 1
              }
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked CRM dependencies
        working-directory: admin
        run: npm ci

      - name: Audit CRM dependencies
        working-directory: admin
        run: npm audit --audit-level=moderate

      - name: Test, typecheck and build only the private CRM
        working-directory: admin
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Verify exact private CRM artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f admin/dist/index.html
          test -f admin/dist/_headers
          grep -Fq 'noindex' admin/dist/index.html
          grep -R -Fq "$VITE_SUPABASE_URL" admin/dist
          grep -R -Fq "$VITE_SUPABASE_PUBLISHABLE_KEY" admin/dist
          grep -R -Fq "$VITE_CALENDAR_CONNECTOR_ORIGIN" admin/dist
          grep -R -Fq "$VITE_MONZO_CONNECTOR_ORIGIN" admin/dist
          grep -R -Fq "$VITE_INSTAGRAM_CONNECTOR_ORIGIN" admin/dist
          grep -R -Fq "$VITE_BOOKING_FORMS_ORIGIN" admin/dist
          # An internal workers.dev intake address must never reach a link the
          # CRM shows an artist to send to a client.
          if grep -R -Fq 'tattooai.vvetrov41.workers.dev' admin/dist; then
            echo 'The production CRM bundle still carries the internal intake host.' >&2
            exit 1
          fi
          # The public bundle must not carry the operator surface. Vite inlines
          # the value, so its presence would mean this deployment is about to
          # put the installation's own administration on the open web.
          if grep -R -Fq 'VITE_CRM_SURFACE:"internal"' admin/dist; then
            echo 'The public CRM build carries the internal surface. Refusing.' >&2
            exit 1
          fi
          node scripts/check-private-crm-artifact.mjs admin/dist
          test -f admin/functions/api/whatsapp/embedded-signup/provision.js

      - name: Install pinned root deployment tooling
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        run: npm ci

      - name: Preflight exact production Pages target and Access boundary
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-crm-pages-production.mjs

      - name: Recheck automatic CRM-only source immediately before mutation
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          canonical_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk 'NR == 1 {print $1}')"
          operator_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$GITHUB_SHA" ]
          [ "$operator_sha" = "$GITHUB_SHA" ]

      - name: Configure production Supabase Auth URLs
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if ! [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo 'CRM_PRODUCTION_SUPABASE_PROJECT_REF is missing or malformed.' >&2
            exit 1
          fi

          if [ "$PROJECT_REF" = 'gwaliusblwrzisrwnsvs' ]; then
            echo 'Refusing to target retained staging Supabase.' >&2
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN is not configured.' >&2
            exit 1
          fi

          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          current="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "$api")"

          payload="$(CURRENT_AUTH_CONFIG="$current" node <<'NODE'
          const current = JSON.parse(process.env.CURRENT_AUTH_CONFIG || '{}');
          const crmOrigin = 'https://crm.vishartattoo.com';
          const required = [crmOrigin, `${crmOrigin}/`, `${crmOrigin}/**`];
          const existing = String(current.uri_allow_list || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          const uri_allow_list = Array.from(new Set([...existing, ...required])).join(',');
          process.stdout.write(JSON.stringify({
            site_url: crmOrigin,
            uri_allow_list,
          }));
          NODE
          )"

          curl -fsS -X PATCH "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload" >/dev/null

          after="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "$api")"

          AUTH_AFTER="$after" node <<'NODE'
          const after = JSON.parse(process.env.AUTH_AFTER || '{}');
          const crmOrigin = 'https://crm.vishartattoo.com';
          if (after.site_url !== crmOrigin) {
            throw new Error('Production Auth site_url did not update to the private CRM origin');
          }
          const allow = String(after.uri_allow_list || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          for (const expected of [crmOrigin, `${crmOrigin}/`, `${crmOrigin}/**`]) {
            if (!allow.includes(expected)) {
              throw new Error(`Production Auth redirect allow-list is missing ${expected}`);
            }
          }
          NODE

      - name: Deploy CRM Pages project with its Functions
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        working-directory: admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          ../node_modules/.bin/wrangler pages deploy dist
          --project-name "$CRM_PAGES_PROJECT"
          --branch production
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=false

      - name: Read back exact CRM Pages deployment
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deployments="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CRM_PAGES_PROJECT}/deployments")"
          DEPLOYMENTS="$deployments" node <<'NODE'
          const body = JSON.parse(process.env.DEPLOYMENTS || '{}');
          if (body.success !== true || !Array.isArray(body.result)) {
            throw new Error('Cloudflare Pages deployment readback failed');
          }
          const matching = body.result.find((entry) => (
            entry?.environment === 'production'
            && entry?.deployment_trigger?.metadata?.commit_hash === process.env.GITHUB_SHA
          ));
          if (!matching) throw new Error('Exact production Pages commit was not found in deployment readback');
          NODE

      - name: Re-verify production Pages target and Access boundary
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-crm-pages-production.mjs

      - name: Verify the public CRM serves and the operator host does not follow it
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          # The public CRM must answer a signed-out request: that is the whole
          # point of this host. Supabase Auth and row level security are the
          # authorization boundary, and they are unchanged.
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$CRM_ORIGIN/" || true)"
            [ "$status" = '200' ] && break
            if [ "$attempt" -eq 20 ]; then
              echo "Public CRM origin answered $status, expected 200." >&2
              exit 1
            fi
            sleep 6
          done

          # And the operator environment must still be gated. A deploy of the
          # public CRM has no business changing that, so if it has changed,
          # something is wrong that this gate should not deploy past.
          operator_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 https://app.vishartattoo.com/ || true)"
          case "$operator_status" in
            302|303|307|401|403) ;;
            *)
              echo "Operator host answered $operator_status; expected an Access redirect." >&2
              exit 1
              ;;
          esac

      - name: Production boundary summary
        if: always()
        shell: bash
        env:
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.deploy }}
        run: |
          {
            echo '### Private CRM production gate'
            echo
            echo "- Exact SHA: \`$GITHUB_SHA\`"
            echo "- Release branch: \`$GITHUB_REF_NAME\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Deploy requested: \`$DEPLOY_REQUESTED\`"
            echo '- Automatic path: exact canonical SHA + exact-head CI + immutable isolated release ref'
            echo '- Source build scope: `admin/` only'
            echo '- Upload scope: `admin/dist` plus `admin/functions` discovered from the Pages project root'
            echo '- Production Auth site URL target: `https://crm.vishartattoo.com`'
            echo '- Calendar connector in this build: `https://calendar.vishartattoo.com`'
            echo '- Monzo connector in this build: `https://monzo.vishartattoo.com` (owner-only launcher; no token, account id or webhook key reaches the browser)'
            echo '- WhatsApp onboarding: owner-only Meta Embedded Signup for exact Vladimir/Kristina routes; credentials go only to encrypted Worker bindings'
            echo '- Post-deploy acceptance: exact Pages commit readback + Pages/Access recheck + public HTTP on crm and Access still gating app'
            echo '- Supabase migration / public site / booking Worker / shared scheduler deploy commands: none'
          } >> "$GITHUB_STEP_SUMMARY"
