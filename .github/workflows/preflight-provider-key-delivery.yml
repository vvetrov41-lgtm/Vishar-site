name: Preflight provider key delivery

# One-shot, owner-only delivery of the jev-eval OpenRouter key to the tattooai
# Worker secret DECISION_MODEL_API_KEY. See scripts/ops/preflight-key-delivery.mjs.
on:
  push:
    branches:
      - 'release/private-crm-rc*-backend-auth-preflight-key'

permissions:
  contents: read

concurrency:
  group: preflight-provider-key-delivery
  cancel-in-progress: false

jobs:
  install:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: crm-production
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ops/preflight-key-delivery.mjs install

  seal:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: jev-eval
    timeout-minutes: 8
    permissions:
      contents: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ops/preflight-key-delivery.mjs seal
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-key-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: sealed.json
          retention-days: 1
          if-no-files-found: error
