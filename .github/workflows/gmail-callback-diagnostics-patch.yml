name: Gmail callback diagnostics patch

on:
  push:
    branches:
      - ops/gmail-callback-diagnostics-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_BRANCH: agent/gmail-crm-production-integration
      EXPECTED_HEAD: fc753f1acf55ea0b78e1df21d7fd8c1ff13d027b
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Verify exact product boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Apply bounded callback diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker = Path('workers/gmail-production.js')
          text = worker.read_text()

          anchor = """function stateKey(state) {
            if (typeof state !== 'string' || !/^[A-Za-z0-9_-]{32,128}$/.test(state)) throw new Error('gmail_oauth_state_invalid');
            return `${STATE_PREFIX}${state}`;
          }
          """
          insertion = anchor + """
          const OAUTH_SAFE_FAILURE_CODES = new Set([
            'gmail_oauth_code_exchange_failed',
            'gmail_oauth_refresh_token_missing',
            'gmail_oauth_scope_mismatch',
            'gmail_access_token_rejected',
            'gmail_api_error',
            'gmail_profile_identity_invalid',
            'gmail_encryption_key_unavailable',
            'gmail_encryption_key_invalid',
            'gmail_token_store_unavailable',
            'gmail_rpc_forbidden',
            'gmail_rpc_failed',
          ]);

          function oauthFailureCode(error) {
            const reason = error instanceof Error ? error.message : '';
            return OAUTH_SAFE_FAILURE_CODES.has(reason) ? reason : 'gmail_oauth_failed';
          }
          """
          if anchor not in text:
            raise SystemExit('stateKey anchor not found')
          text = text.replace(anchor, insertion, 1)

          old_catch = """  } catch (error) {
            const reason = error instanceof Error ? error.message : 'gmail_oauth_failed';
            const message = reason === 'gmail_oauth_scope_mismatch'
              ? 'Google did not grant the required read and send Gmail scopes.'
              : 'The Gmail OAuth exchange or account verification failed. No Gmail integration was enabled.';
            return html(400, 'Gmail connection failed', message);
          }
          """
          new_catch = """  } catch (error) {
            const reason = error instanceof Error ? error.message : 'gmail_oauth_failed';
            const diagnostic = oauthFailureCode(error);
            const message = reason === 'gmail_oauth_scope_mismatch'
              ? `Google did not grant the required read and send Gmail scopes. Diagnostic: ${diagnostic}.`
              : `The Gmail OAuth exchange or account verification failed. No Gmail integration was enabled. Diagnostic: ${diagnostic}.`;
            return html(400, 'Gmail connection failed', message);
          }
          """
          if old_catch not in text:
            raise SystemExit('oauth catch anchor not found')
          text = text.replace(old_catch, new_catch, 1)

          old_export = """  stateKey,
            startOAuth,
          """
          new_export = """  stateKey,
            oauthFailureCode,
            startOAuth,
          """
          if old_export not in text:
            raise SystemExit('__testing export anchor not found')
          text = text.replace(old_export, new_export, 1)
          worker.write_text(text)

          tests = Path('scripts/test-gmail-production.mjs')
          test_text = tests.read_text()
          test_anchor = """await test('scope validation rejects full mailbox scope and missing send/read scope', () => {
            assert.equal(gmail.hasRequiredScopes(`${GMAIL_READ_SCOPE} ${GMAIL_SEND_SCOPE}`), true);
            assert.equal(gmail.hasRequiredScopes(GMAIL_READ_SCOPE), false);
            assert.equal(gmail.hasRequiredScopes(`${GMAIL_READ_SCOPE} ${GMAIL_SEND_SCOPE} https://mail.google.com/`), false);
          });
          """
          test_insert = test_anchor + """
          await test('OAuth callback diagnostics expose only bounded backend codes', () => {
            assert.equal(worker.oauthFailureCode(new Error('gmail_oauth_code_exchange_failed')), 'gmail_oauth_code_exchange_failed');
            assert.equal(worker.oauthFailureCode(new Error('gmail_api_error')), 'gmail_api_error');
            assert.equal(worker.oauthFailureCode(new Error('provider secret detail')), 'gmail_oauth_failed');
          });
          """
          if test_anchor not in test_text:
            raise SystemExit('test anchor not found')
          tests.write_text(test_text.replace(test_anchor, test_insert, 1))
          PY

          git diff --check
          git diff -- workers/gmail-production.js scripts/test-gmail-production.mjs

      - name: Validate focused Gmail tests
        run: |
          npm ci --ignore-scripts
          node scripts/test-gmail-production.mjs
          npm run scan:secrets

      - name: Commit diagnostics patch to product branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/gmail-production.js scripts/test-gmail-production.mjs
          git commit -m 'Add safe Gmail OAuth callback diagnostics'
          git push origin "HEAD:$PRODUCT_BRANCH"
