name: Gmail callback diagnostics patch

on:
  push:
    branches:
      - ops/gmail-callback-diagnostics-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_BRANCH: agent/gmail-crm-production-integration
      EXPECTED_HEAD: 8529d53cdef9256d69528ac682babd390c95095f
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Verify exact product boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Apply bounded token transport diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          gmail = Path('workers/lib/google-gmail.js')
          text = gmail.read_text()

          old = """  const response = await fetchImpl(GOOGLE_TOKEN_ENDPOINT, {\n    method: 'POST',\n    headers: { 'content-type': 'application/x-www-form-urlencoded' },\n    body,\n    redirect: 'error',\n  });\n  const json = await response.json().catch(() => null);\n  if (!response.ok || !json || typeof json.access_token !== 'string') {\n    const providerError = typeof json?.error === 'string' ? json.error : '';\n    const code = ({\n      invalid_client: 'gmail_oauth_invalid_client',\n      invalid_grant: 'gmail_oauth_invalid_grant',\n      redirect_uri_mismatch: 'gmail_oauth_redirect_uri_mismatch',\n      invalid_request: 'gmail_oauth_invalid_request',\n      unauthorized_client: 'gmail_oauth_unauthorized_client',\n      deleted_client: 'gmail_oauth_deleted_client',\n      access_denied: 'gmail_oauth_access_denied',\n    })[providerError] || 'gmail_oauth_code_exchange_failed';\n    throw new Error(code);\n  }\n"""
          new = """  let response;\n  try {\n    response = await fetchImpl(GOOGLE_TOKEN_ENDPOINT, {\n      method: 'POST',\n      headers: { 'content-type': 'application/x-www-form-urlencoded' },\n      body,\n      redirect: 'error',\n    });\n  } catch {\n    throw new Error('gmail_oauth_token_fetch_failed');\n  }\n\n  let json = null;\n  try { json = await response.json(); } catch {\n    if (response.status === 400) throw new Error('gmail_oauth_token_http_400');\n    if (response.status === 401) throw new Error('gmail_oauth_token_http_401');\n    if (response.status === 403) throw new Error('gmail_oauth_token_http_403');\n    if (response.status === 429) throw new Error('gmail_oauth_token_http_429');\n    if (response.status >= 500) throw new Error('gmail_oauth_token_http_5xx');\n    throw new Error('gmail_oauth_token_response_invalid');\n  }\n\n  if (!response.ok || !json || typeof json.access_token !== 'string') {\n    const providerError = typeof json?.error === 'string' ? json.error : '';\n    const code = ({\n      invalid_client: 'gmail_oauth_invalid_client',\n      invalid_grant: 'gmail_oauth_invalid_grant',\n      redirect_uri_mismatch: 'gmail_oauth_redirect_uri_mismatch',\n      invalid_request: 'gmail_oauth_invalid_request',\n      unauthorized_client: 'gmail_oauth_unauthorized_client',\n      deleted_client: 'gmail_oauth_deleted_client',\n      access_denied: 'gmail_oauth_access_denied',\n      invalid_scope: 'gmail_oauth_invalid_scope',\n      unsupported_grant_type: 'gmail_oauth_unsupported_grant_type',\n      temporarily_unavailable: 'gmail_oauth_temporarily_unavailable',\n      server_error: 'gmail_oauth_server_error',\n    })[providerError]\n      || (response.status === 400 ? 'gmail_oauth_token_http_400'\n        : response.status === 401 ? 'gmail_oauth_token_http_401'\n          : response.status === 403 ? 'gmail_oauth_token_http_403'\n            : response.status === 429 ? 'gmail_oauth_token_http_429'\n              : response.status >= 500 ? 'gmail_oauth_token_http_5xx'\n                : 'gmail_oauth_token_response_invalid');\n    throw new Error(code);\n  }\n"""
          if old not in text:
            raise SystemExit('exchange transport anchor not found')
          gmail.write_text(text.replace(old, new, 1))

          worker = Path('workers/gmail-production.js')
          text = worker.read_text()
          old = """  'gmail_oauth_access_denied',\n  'gmail_oauth_refresh_token_missing',\n"""
          new = """  'gmail_oauth_access_denied',\n  'gmail_oauth_invalid_scope',\n  'gmail_oauth_unsupported_grant_type',\n  'gmail_oauth_temporarily_unavailable',\n  'gmail_oauth_server_error',\n  'gmail_oauth_token_fetch_failed',\n  'gmail_oauth_token_http_400',\n  'gmail_oauth_token_http_401',\n  'gmail_oauth_token_http_403',\n  'gmail_oauth_token_http_429',\n  'gmail_oauth_token_http_5xx',\n  'gmail_oauth_token_response_invalid',\n  'gmail_oauth_refresh_token_missing',\n"""
          if old not in text:
            raise SystemExit('safe failure allow-list anchor not found')
          worker.write_text(text.replace(old, new, 1))

          tests = Path('scripts/test-gmail-production.mjs')
          text = tests.read_text()
          anchor = """  assert.equal(worker.oauthFailureCode(new Error('gmail_oauth_invalid_client')), 'gmail_oauth_invalid_client');\n  assert.equal(worker.oauthFailureCode(new Error('gmail_oauth_invalid_grant')), 'gmail_oauth_invalid_grant');\n});\n"""
          insertion = """  assert.equal(worker.oauthFailureCode(new Error('gmail_oauth_invalid_client')), 'gmail_oauth_invalid_client');\n  assert.equal(worker.oauthFailureCode(new Error('gmail_oauth_invalid_grant')), 'gmail_oauth_invalid_grant');\n  await assert.rejects(\n    exchangeAuthorizationCode({ ...base, fetchImpl: async () => { throw new TypeError('network detail'); } }),\n    (error) => error instanceof Error && error.message === 'gmail_oauth_token_fetch_failed' && !error.message.includes('network detail'),\n  );\n  await assert.rejects(\n    exchangeAuthorizationCode({ ...base, fetchImpl: async () => new Response('not-json', { status: 401 }) }),\n    (error) => error instanceof Error && error.message === 'gmail_oauth_token_http_401',\n  );\n  await assert.rejects(\n    exchangeAuthorizationCode({ ...base, fetchImpl: async () => Response.json({ error: 'invalid_scope', error_description: 'do not expose' }, { status: 400 }) }),\n    (error) => error instanceof Error && error.message === 'gmail_oauth_invalid_scope',\n  );\n  await assert.rejects(\n    exchangeAuthorizationCode({ ...base, fetchImpl: async () => Response.json({ error: 'unexpected_provider_value', error_description: 'do not expose' }, { status: 400 }) }),\n    (error) => error instanceof Error && error.message === 'gmail_oauth_token_http_400',\n  );\n  await assert.rejects(\n    exchangeAuthorizationCode({ ...base, fetchImpl: async () => Response.json({}, { status: 200 }) }),\n    (error) => error instanceof Error && error.message === 'gmail_oauth_token_response_invalid',\n  );\n  assert.equal(worker.oauthFailureCode(new Error('gmail_oauth_token_fetch_failed')), 'gmail_oauth_token_fetch_failed');\n  assert.equal(worker.oauthFailureCode(new Error('gmail_oauth_token_http_401')), 'gmail_oauth_token_http_401');\n});\n"""
          if anchor not in text:
            raise SystemExit('token endpoint regression anchor not found')
          tests.write_text(text.replace(anchor, insertion, 1))
          PY

          git diff --check
          git diff -- workers/lib/google-gmail.js workers/gmail-production.js scripts/test-gmail-production.mjs

      - name: Validate focused Gmail tests
        run: |
          npm ci --ignore-scripts
          node scripts/test-gmail-production.mjs
          npm run scan:secrets

      - name: Commit token transport diagnostics patch to product branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/lib/google-gmail.js workers/gmail-production.js scripts/test-gmail-production.mjs
          git commit -m 'Refine Google OAuth token transport diagnostics'
          git push origin "HEAD:$PRODUCT_BRANCH"
