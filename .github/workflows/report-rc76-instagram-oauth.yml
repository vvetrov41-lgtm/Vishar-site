name: Report RC76 Instagram OAuth dispatch

on:
  push:
    branches:
      - ops/rc76-instagram-oauth-dispatch
    paths:
      - .github/workflows/report-rc76-instagram-oauth.yml

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report dispatcher and protected production run on PR 379
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sleep 8
          dispatcher="$(gh run list --repo "$REPO" --workflow dispatch-rc76-instagram-oauth.yml --branch ops/rc76-instagram-oauth-dispatch --limit 1 --json databaseId,url,status,conclusion,headSha,createdAt)"
          production="$(gh run list --repo "$REPO" --workflow deploy-private-production-instagram.yml --branch release/private-crm-rc76-instagram-communications --event workflow_dispatch --limit 1 --json databaseId,url,status,conclusion,headSha,createdAt)"
          DISPATCHER="$dispatcher" PRODUCTION="$production" node <<'NODE' > /tmp/report.md
          const d = JSON.parse(process.env.DISPATCHER || '[]')[0];
          const p = JSON.parse(process.env.PRODUCTION || '[]')[0];
          console.log('RC76 Instagram OAuth operator status:');
          if (d) console.log(`dispatcher=${d.url} status=${d.status} conclusion=${d.conclusion || 'n/a'} head=${d.headSha}`);
          else console.log('dispatcher=not-found');
          if (p) console.log(`production=${p.url} status=${p.status} conclusion=${p.conclusion || 'n/a'} head=${p.headSha} created=${p.createdAt}`);
          else console.log('production=not-found');
          NODE
          gh pr comment 379 --repo "$REPO" --body-file /tmp/report.md
