name: GPT Monzo branch patch

on:
  push:
    branches:
      - agent/gpt-monzo-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply GPT Monzo generated patches') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gpt-monzo-reconciliation
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch canonical files
        run: node scripts/patch-gpt-monzo-generated-files.mjs
      - name: Verify patch
        run: |
          git diff --check
          node scripts/test-gpt-openapi-split.mjs
      - name: Commit deterministic patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/050_rls_roles.sql docs/gpt-actions/openapi.production.yaml scripts/test-gpt-openapi-split.mjs
          git commit -m "Apply GPT Monzo generated patches"
          git push origin HEAD:agent/gpt-monzo-reconciliation
