name: PR 228 booking host adapter deploy

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr228-booking-host-adapter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated booking relay adapter
    if: >-
      github.event.pull_request.number == 228 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/production-booking-host'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BOOKING_HOST: booking.vishartattoo.com
      BOOKING_WORKER: vishar-booking-host-production

    steps:
      - name: Verify exact public Worker credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --short)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-run dedicated Worker safety tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-booking-host-worker.mjs
          node scripts/test-booking-host-production-config.mjs
          npx wrangler deploy --config wrangler.booking-host.production.toml --dry-run --outdir .wrangler/booking-host-adapter-deploy
          npm run scan:secrets

      - name: Require existing isolated Worker and exact Custom Domain
        shell: bash
        run: |
          set -euo pipefail
          settings_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BOOKING_WORKER}/settings"
          settings="$(curl --fail-with-body --silent --show-error "$settings_api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          SETTINGS="$settings" node <<'NODE'
          const payload = JSON.parse(process.env.SETTINGS || '{}');
          if (!payload.success || !payload.result) throw new Error('Dedicated booking Worker is unavailable');
          const bindings = Array.isArray(payload.result.bindings) ? payload.result.bindings : [];
          if (bindings.length !== 0) throw new Error('Refusing deploy because dedicated booking Worker has bindings');
          NODE

          domains_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"
          domains="$(curl --fail-with-body --silent --show-error "$domains_api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          DOMAINS="$domains" BOOKING_HOST="$BOOKING_HOST" BOOKING_WORKER="$BOOKING_WORKER" node <<'NODE'
          const payload = JSON.parse(process.env.DOMAINS || '{}');
          if (!payload.success || !Array.isArray(payload.result)) throw new Error('Workers Domains list is unavailable');
          const match = payload.result.find((entry) => entry?.hostname === process.env.BOOKING_HOST);
          if (!match || match.service !== process.env.BOOKING_WORKER) {
            throw new Error('Dedicated booking hostname is not attached to the expected isolated Worker');
          }
          NODE

      - name: Deploy only isolated booking Worker code
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.booking-host.production.toml --name "$BOOKING_WORKER"

      - name: Verify Worker stayed credential-free and domain stayed attached
        shell: bash
        run: |
          set -euo pipefail
          settings_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BOOKING_WORKER}/settings"
          settings="$(curl --fail-with-body --silent --show-error "$settings_api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          SETTINGS="$settings" node <<'NODE'
          const payload = JSON.parse(process.env.SETTINGS || '{}');
          const bindings = Array.isArray(payload?.result?.bindings) ? payload.result.bindings : [];
          if (!payload.success || bindings.length !== 0) throw new Error('Booking Worker binding boundary changed after deploy');
          NODE

          domains_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"
          domains="$(curl --fail-with-body --silent --show-error "$domains_api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          DOMAINS="$domains" BOOKING_HOST="$BOOKING_HOST" BOOKING_WORKER="$BOOKING_WORKER" node <<'NODE'
          const payload = JSON.parse(process.env.DOMAINS || '{}');
          const match = Array.isArray(payload.result) && payload.result.find((entry) => entry?.hostname === process.env.BOOKING_HOST);
          if (!payload.success || !match || match.service !== process.env.BOOKING_WORKER) {
            throw new Error('Booking Custom Domain drifted during code deploy');
          }
          NODE

      - name: Verify live page uses same-origin relay
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error --max-time 10 "https://${BOOKING_HOST}/?adapter_check=${EXPECTED_HEAD_SHA}" --output /tmp/booking-live.html && break
            sleep 2
          done
          grep -Fq "https://${BOOKING_HOST}/api/enquiry" /tmp/booking-live.html
          if grep -Fq 'https://tattooai.vvetrov41.workers.dev/' /tmp/booking-live.html; then
            echo 'Live dedicated form still exposes the cross-origin tattooai endpoint.' >&2
            exit 1
          fi

      - name: Verify live relay denial boundaries
        shell: bash
        run: |
          set -euo pipefail
          spoof_status="$(curl --silent --show-error --output /tmp/spoof.json --write-out '%{http_code}' --max-time 10 \
            -X POST "https://${BOOKING_HOST}/api/enquiry" \
            -H 'Origin: https://booking.vishartattoo.com.evil.example' \
            -H 'Content-Type: application/json' \
            --data '{"type":"tattoo-enquiry"}')"
          test "$spoof_status" = '403'

          generic_status="$(curl --silent --show-error --output /tmp/generic.json --write-out '%{http_code}' --max-time 10 \
            -X POST "https://${BOOKING_HOST}/api/enquiry" \
            -H "Origin: https://${BOOKING_HOST}" \
            -H 'Content-Type: application/json' \
            --data '{"type":"lead","contact":"probe@example.com"}')"
          test "$generic_status" = '400'

      - name: Verify relay reaches legacy tattooai without sending Telegram
        shell: bash
        run: |
          set -euo pipefail
          probe="$(node <<'NODE'
          process.stdout.write(JSON.stringify({
            type: 'tattoo-enquiry',
            name: 'Relay Boundary Probe',
            email: 'probe@example.com',
            phone: '',
            instagram: '',
            preferredReply: 'Email',
            travellingFrom: 'London',
            projectType: 'Colour realism',
            placement: 'Outer forearm',
            size: '20 cm',
            coverUp: 'No',
            timing: 'Flexible',
            idea: 'Non-persisting relay boundary probe',
            website: '',
            startedAt: Date.now() - 3000,
            images: [{ type: 'image/jpeg', data: Buffer.from('not-a-jpeg').toString('base64') }]
          }));
          NODE
          )"
          status="$(curl --silent --show-error --output /tmp/relay-probe.json --write-out '%{http_code}' --max-time 15 \
            -X POST "https://${BOOKING_HOST}/api/enquiry" \
            -H "Origin: https://${BOOKING_HOST}" \
            -H 'Content-Type: application/json' \
            --data "$probe")"
          echo "NON_PERSISTING_RELAY_HTTP=$status"
          cat /tmp/relay-probe.json
          echo
          test "$status" = '400'
          grep -Fqi 'reference image' /tmp/relay-probe.json

      - name: Adapter deploy summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Dedicated booking relay adapter deploy'
            echo
            echo "- Exact head: \`$EXPECTED_HEAD_SHA\`"
            echo '- Mutated service: `vishar-booking-host-production` code only'
            echo '- Custom Domain: verified unchanged'
            echo '- Worker bindings/secrets: zero before and after'
            echo '- tattooai code/settings: not mutated'
            echo '- Supabase / CRM / Calendar: not mutated'
            echo '- Live E2E probe uses invalid image magic and therefore stops before Telegram delivery'
          } >> "$GITHUB_STEP_SUMMARY"
