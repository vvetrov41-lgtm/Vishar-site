name: Gmail config normalize

on:
  push:
    branches:
      - agent/gmail-crm-production-integration
    paths:
      - scripts/normalize-gmail-configured.mjs
      - .github/workflows/gmail-config-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gmail-crm-production-integration
          fetch-depth: 0
      - name: Normalize predicate
        run: node scripts/normalize-gmail-configured.mjs
      - name: Verify exact bounded diff
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'workers/gmail-production.js'
      - name: Commit normalized Worker
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workers/gmail-production.js
          git commit -m 'Return a boolean from Gmail production config guard'
          git push origin HEAD:agent/gmail-crm-production-integration
