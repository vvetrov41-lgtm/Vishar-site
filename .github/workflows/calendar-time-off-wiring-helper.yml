# One-shot branch-only source patch helper. It removes itself after applying
# three exact repository-only replacements. No deploy, database or external API.
name: Calendar Time Off wiring helper

on:
  push:
    branches:
      - agent/calendar-time-off-projection
    paths:
      - .github/workflows/calendar-time-off-wiring-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendar-time-off-projection
          fetch-depth: 0

      - name: Apply exact wiring changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'workers/calendar-oauth.js',
              "import { drainCalendarOutbox } from './lib/calendar-drain.js';\n",
              "import { drainCalendarOutbox } from './lib/calendar-drain.js';\n"
              "import { drainCalendarAvailabilityOutbox } from './lib/calendar-availability-drain.js';\n",
          )

          old_drain = """async function runScheduledDrain(env) {
            const result = await drainCalendarOutbox(env);
            console.log('calendar outbox drain', JSON.stringify({
              claimed: result.claimed,
              succeeded: result.succeeded,
              obsolete: result.obsolete,
              failed: result.failed,
              unrecorded: result.unrecorded,
            }));
          }
          """
          new_drain = """async function runScheduledDrain(env) {
            const appointments = await drainCalendarOutbox(env);
            const availability = await drainCalendarAvailabilityOutbox(env);
            console.log('calendar outbox drain', JSON.stringify({
              appointments: {
                claimed: appointments.claimed,
                succeeded: appointments.succeeded,
                obsolete: appointments.obsolete,
                failed: appointments.failed,
                unrecorded: appointments.unrecorded,
              },
              availability: {
                claimed: availability.claimed,
                succeeded: availability.succeeded,
                obsolete: availability.obsolete,
                failed: availability.failed,
                unrecorded: availability.unrecorded,
              },
            }));
          }
          """
          replace_exact('workers/calendar-oauth.js', old_drain, new_drain)

          replace_exact(
              'package.json',
              'node scripts/test-calendar-worker.mjs && node scripts/test-calendar-cancelled-event-recovery.mjs',
              'node scripts/test-calendar-worker.mjs && node scripts/test-calendar-availability-worker.mjs && node scripts/test-calendar-cancelled-event-recovery.mjs',
          )

          replace_exact(
              'supabase/tests/050_rls_roles.sql',
              "  ('public.record_calendar_outbox_result(uuid,text,integer,boolean,text,text)', false, false, true),\n",
              "  ('public.record_calendar_outbox_result(uuid,text,integer,boolean,text,text)', false, false, true),\n"
              "  ('public.claim_calendar_availability_outbox(text,integer,integer)', false, false, true),\n"
              "  ('public.record_calendar_availability_outbox_result(uuid,text,integer,boolean,text,text)', false, false, true),\n",
          )
          PY

          git rm .github/workflows/calendar-time-off-wiring-helper.yml
          git diff --check
          git add workers/calendar-oauth.js package.json supabase/tests/050_rls_roles.sql

          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/calendar-time-off-wiring-helper.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'workers/calendar-oauth.js'
          printf '%s\n' "${changed[@]}" | grep -Fx 'package.json'
          printf '%s\n' "${changed[@]}" | grep -Fx 'supabase/tests/050_rls_roles.sql'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire Calendar Time Off projection'
          git push origin HEAD:agent/calendar-time-off-projection
