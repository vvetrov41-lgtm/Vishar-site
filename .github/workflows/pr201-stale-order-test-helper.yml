name: PR201 stale-order test helper

on:
  push:
    branches:
      - agent/calendar-time-off-projection
    paths:
      - .github/workflows/pr201-stale-order-test-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendar-time-off-projection
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/tests/195_calendar_availability_projection.sql')
          text = p.read_text()
          old = """reset role;
          select pg_temp.calendar_availability_claims('{\"role\":\"service_role\"}');

          create temporary table kristina_stale_claim as
          select * from public.claim_calendar_availability_outbox(
            'calendar-availability-worker-stale', 1, 120
          );
          """
          new = """reset role;
          select pg_temp.calendar_availability_claims('{\"role\":\"service_role\"}');

          -- now() is transaction-stable, so create v0 and update v1 otherwise share
          -- the same scheduling timestamp. Order this fixture explicitly so the
          -- stale path is deterministic instead of depending on random UUID order.
          update public.integration_outbox
          set next_attempt_at = case
            when (payload ->> 'calendar_version')::integer = 0 then now() - interval '1 second'
            else now() + interval '1 minute'
          end
          where availability_block_id =
            (select (result ->> 'availability_block_id')::uuid from kristina_block)
            and kind in ('calendar_availability_create', 'calendar_availability_update');

          create temporary table kristina_stale_claim as
          select * from public.claim_calendar_availability_outbox(
            'calendar-availability-worker-stale', 1, 120
          );
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale-claim target, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old2 = """select is(
            (select calendar_version
             from public.artist_availability_blocks
             where id = (select (result ->> 'availability_block_id')::uuid from kristina_block)),
            1,
            'stale acknowledgement never rewinds Kristina Time Off version'
          );

          create temporary table kristina_current_claim as
          """
          new2 = """select is(
            (select calendar_version
             from public.artist_availability_blocks
             where id = (select (result ->> 'availability_block_id')::uuid from kristina_block)),
            1,
            'stale acknowledgement never rewinds Kristina Time Off version'
          );

          update public.integration_outbox
          set next_attempt_at = now()
          where availability_block_id =
            (select (result ->> 'availability_block_id')::uuid from kristina_block)
            and (payload ->> 'calendar_version')::integer = 1
            and status = 'pending';

          create temporary table kristina_current_claim as
          """
          if text.count(old2) != 1:
              raise SystemExit(f'expected one current-claim target, found {text.count(old2)}')
          p.write_text(text.replace(old2, new2, 1))
          PY
          git rm .github/workflows/pr201-stale-order-test-helper.yml
          git diff --check
          git add supabase/tests/195_calendar_availability_projection.sql
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/pr201-stale-order-test-helper.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'supabase/tests/195_calendar_availability_projection.sql'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make Calendar Time Off stale-job test deterministic'
          git push origin HEAD:agent/calendar-time-off-projection
