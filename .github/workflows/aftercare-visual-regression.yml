name: Aftercare Visual Regression

on:
  pull_request:
    paths:
      - aftercare/index.html
      - assets/css/aftercare-effects.css
      - assets/js/aftercare-effects.js
      - scripts/test-aftercare-visual.mjs

permissions:
  contents: read

jobs:
  aftercare-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test aftercare on mobile and desktop
        run: node scripts/test-aftercare-visual.mjs
      - name: Upload comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aftercare-visual-screenshots
          path: /tmp/aftercare-*.png
          if-no-files-found: ignore
