name: Calendar public OAuth production rollout

on:
  pull_request:
    paths:
      - 'workers/calendar-public-oauth.js'
      - 'workers/calendar-oauth.js'
      - 'workers/lib/calendar-oauth-security.js'
      - 'wrangler.calendar.production.toml'
      - 'scripts/validate-calendar-production.mjs'
      - '.github/workflows/calendar-public-oauth-production-rollout.yml'
  push:
    branches:
      - 'release/private-crm-rc*-calendar-public-oauth-rollout-*'

permissions:
  actions: read
  contents: read

concurrency:
  group: calendar-public-oauth-production-rollout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Calendar public OAuth rollout
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact public OAuth Worker boundary
        run: |
          set -euo pipefail
          npm run validate:calendar-production
          npm run validate:calendar-production:deploy-ready
          node scripts/test-calendar-oauth-hardening.mjs
          node scripts/test-calendar-production-config.mjs
          npm run check:calendar-production-bundle

  rollout-production:
    name: Deploy Calendar public OAuth Worker at exact canonical SHA
    if: >-
      github.event_name == 'push'
      && github.actor == github.repository_owner
      && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crm-production
    env:
      CANONICAL_BRANCH: agent/platform-telegram-self-service
      APPROVED_SHA: ${{ github.event.before }}
      WORKER_NAME: ${{ vars.CRM_PRODUCTION_CALENDAR_WORKER }}
      SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      CALENDAR_ACCESS_AUD: ${{ vars.CRM_PRODUCTION_CALENDAR_ACCESS_AUD }}
      CALENDAR_KV_STATE_ID: ${{ vars.CRM_PRODUCTION_CALENDAR_KV_STATE_ID }}
      CALENDAR_KV_TOKENS_ID: ${{ vars.CRM_PRODUCTION_CALENDAR_KV_TOKENS_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CALENDAR_HOST: calendar.vishartattoo.com
      MARKER_FILE: .github/ops-triggers/calendar-public-oauth-rollout.trigger
      CALENDAR_DEPLOY_CONFIG: ${{ github.workspace }}/.wrangler.calendar.public-oauth.production.toml

    steps:
      - name: Checkout trigger ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable marker, canonical source and exact-head CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-calendar-public-oauth-rollout-*) ;;
            *) echo 'Calendar public OAuth rollout must use its isolated release namespace.' >&2; exit 1 ;;
          esac
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          [ "$WORKER_NAME" = 'vishar-calendar-production' ]
          [ "$SUPABASE_URL" = 'https://vfjexhfdbrjmuxfdvbdx.supabase.co' ]
          [[ "$CALENDAR_ACCESS_AUD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CALENDAR_KV_STATE_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$CALENDAR_KV_TOKENS_ID" =~ ^[0-9a-f]{32}$ ]]
          [ "$CALENDAR_KV_STATE_ID" != "$CALENDAR_KV_TOKENS_ID" ]
          [ -n "$CLOUDFLARE_API_TOKEN" ]

          parent_count="$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF-1}')"
          [ "$parent_count" = '1' ] || { echo 'Trigger must be a single-parent marker commit.' >&2; exit 1; }
          [ "$(git rev-parse "$GITHUB_SHA^")" = "$APPROVED_SHA" ]
          mapfile -t changed_files < <(git diff --name-only "$APPROVED_SHA" "$GITHUB_SHA")
          [ "${#changed_files[@]}" = '1' ]
          [ "${changed_files[0]}" = "$MARKER_FILE" ]
          [ "$(tr -d '\r\n' < "$MARKER_FILE")" = "deploy:$APPROVED_SHA" ]

          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$APPROVED_SHA" ] || { echo 'Canonical moved before Calendar rollout admission.' >&2; exit 1; }
          release_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$release_sha" = "$GITHUB_SHA" ]

          required_workflows=(
            'Static Validation'
            'CRM and booking validation'
            'Gmail production validation'
            'Booking host validation'
            'WhatsApp production onboarding validation'
          )
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/exact-head-runs.json"
          for workflow in "${required_workflows[@]}"; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[]; .name == $name and .head_sha == $sha
                       and .status == "completed" and .conclusion == "success")
            ' "$RUNNER_TEMP/exact-head-runs.json" >/dev/null || {
              echo "Required exact-head workflow is not green: $workflow" >&2
              exit 1
            }
          done

          git checkout --detach "$APPROVED_SHA"
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ -z "$(git status --short)" ]

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate exact Calendar production source
        run: |
          set -euo pipefail
          npm ci
          npm run validate:calendar-production
          npm run validate:calendar-production:deploy-ready
          node scripts/test-calendar-worker.mjs
          node scripts/test-calendar-availability-worker.mjs
          node scripts/test-calendar-oauth-hardening.mjs
          node scripts/test-calendar-production-config.mjs
          node scripts/test-calendar-rate-limit.mjs
          node scripts/test-calendar-oauth-access-bypass-sync.mjs
          npm run check:calendar-production-bundle
          npm run scan:secrets

      - name: Read live Calendar Worker before mutation
        id: live
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          settings="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings")"
          deployments="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments")"
          schedules="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/schedules")"
          domains="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/domains?per_page=100")"
          secrets="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets")"
          for payload in "$settings" "$deployments" "$schedules" "$domains" "$secrets"; do jq -e '.success == true' <<<"$payload" >/dev/null; done
          [ "$(jq -r '.result.bindings[]? | select(.type == "plain_text" and .name == "SUPABASE_URL") | .text' <<<"$settings")" = "$SUPABASE_URL" ]
          [ "$(jq -r '.result.bindings[]? | select(.type == "kv_namespace" and .name == "CALENDAR_OAUTH_STATE") | .namespace_id' <<<"$settings")" = "$CALENDAR_KV_STATE_ID" ]
          [ "$(jq -r '.result.bindings[]? | select(.type == "kv_namespace" and .name == "CALENDAR_OAUTH_TOKENS") | .namespace_id' <<<"$settings")" = "$CALENDAR_KV_TOKENS_ID" ]
          jq -e --arg host "$CALENDAR_HOST" --arg worker "$WORKER_NAME" 'any(.result[]?; .hostname == $host and .service == $worker and .environment == "production")' <<<"$domains" >/dev/null
          SCHEDULES="$schedules" node <<'NODE'
          const payload = JSON.parse(process.env.SCHEDULES || '{}');
          const rows = Array.isArray(payload.result) ? payload.result : payload.result?.schedules || [];
          if (rows.length !== 1 || rows[0]?.cron !== '*/5 * * * *') throw new Error('Calendar cron is not the exact production schedule');
          NODE
          SECRET_LIST="$secrets" node <<'NODE'
          const payload = JSON.parse(process.env.SECRET_LIST || '{}');
          const rows = Array.isArray(payload.result) ? payload.result : payload.result?.secrets || [];
          const names = new Set(rows.map((row) => row?.name).filter(Boolean));
          for (const name of ['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','CALENDAR_TOKEN_ENCRYPTION_KEY','SUPABASE_SECRET_KEY']) {
            if (!names.has(name)) throw new Error(`Missing Calendar secret name: ${name}`);
          }
          NODE
          pre_deployment="$(jq -r 'if (.result|type)=="array" then .result[0].id else .result.deployments[0].id end' <<<"$deployments")"
          [ -n "$pre_deployment" ]
          echo "pre_deployment=$pre_deployment" >> "$GITHUB_OUTPUT"

      - name: Generate exact active Calendar config and dry-run
        run: |
          set -euo pipefail
          node scripts/generate-calendar-production-deploy-config.mjs "$CALENDAR_DEPLOY_CONFIG"
          grep -Fq 'main = "workers/calendar-public-oauth.js"' "$CALENDAR_DEPLOY_CONFIG"
          grep -Fq 'CALENDAR_DRAIN_ENABLED = "true"' "$CALENDAR_DEPLOY_CONFIG"
          grep -Fq 'crons = ["*/5 * * * *"]' "$CALENDAR_DEPLOY_CONFIG"
          XDG_CONFIG_HOME=.wrangler/config WRANGLER_LOG_PATH=.wrangler/calendar-public-oauth-rollout.log WRANGLER_SEND_METRICS=false \
            npx wrangler deploy --config "$CALENDAR_DEPLOY_CONFIG" --name "$WORKER_NAME" --dry-run --outdir .wrangler/calendar-public-oauth-rollout

      - name: Recheck immutable source immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          release_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$APPROVED_SHA" ]
          [ "$release_sha" = "$GITHUB_SHA" ]

      - name: Deploy only Calendar production Worker
        run: |
          set -euo pipefail
          npx wrangler deploy --config "$CALENDAR_DEPLOY_CONFIG" --name "$WORKER_NAME" --strict

      - name: Read back exact Calendar Worker state
        env:
          PRE_DEPLOYMENT_ID: ${{ steps.live.outputs.pre_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          settings="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings")"
          deployments="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments")"
          schedules="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/schedules")"
          domains="$(curl --fail --silent --show-error "${auth[@]}" "$api/workers/domains?per_page=100")"
          for payload in "$settings" "$deployments" "$schedules" "$domains"; do jq -e '.success == true' <<<"$payload" >/dev/null; done
          [ "$(jq -r '.result.bindings[]? | select(.type == "plain_text" and .name == "SUPABASE_URL") | .text' <<<"$settings")" = "$SUPABASE_URL" ]
          [ "$(jq -r '.result.bindings[]? | select(.type == "kv_namespace" and .name == "CALENDAR_OAUTH_STATE") | .namespace_id' <<<"$settings")" = "$CALENDAR_KV_STATE_ID" ]
          [ "$(jq -r '.result.bindings[]? | select(.type == "kv_namespace" and .name == "CALENDAR_OAUTH_TOKENS") | .namespace_id' <<<"$settings")" = "$CALENDAR_KV_TOKENS_ID" ]
          jq -e --arg host "$CALENDAR_HOST" --arg worker "$WORKER_NAME" 'any(.result[]?; .hostname == $host and .service == $worker and .environment == "production")' <<<"$domains" >/dev/null
          SCHEDULES="$schedules" node <<'NODE'
          const payload = JSON.parse(process.env.SCHEDULES || '{}');
          const rows = Array.isArray(payload.result) ? payload.result : payload.result?.schedules || [];
          if (rows.length !== 1 || rows[0]?.cron !== '*/5 * * * *') throw new Error('Calendar cron changed during rollout');
          NODE
          post_deployment="$(jq -r 'if (.result|type)=="array" then .result[0].id else .result.deployments[0].id end' <<<"$deployments")"
          [ -n "$post_deployment" ]
          [ "$post_deployment" != "$PRE_DEPLOYMENT_ID" ]
          echo "Calendar Worker deployment readback passed: $post_deployment"

      - name: Verify Access still gates all Calendar paths before Bypass sync
        run: |
          set -euo pipefail
          for path in /health /oauth/google/start/vladimir '/oauth/google/callback?state=pre-bypass-probe'; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://$CALENDAR_HOST$path" || true)"
            case "$status" in
              302|303|307|401|403) ;;
              *) echo "Calendar path escaped Access before path-specific Bypass sync: $path -> $status" >&2; exit 1 ;;
            esac
          done

      - name: Remove generated config
        if: always()
        run: rm -f "$CALENDAR_DEPLOY_CONFIG"

      - name: Boundary summary
        if: always()
        run: |
          {
            echo '### Calendar public OAuth production rollout'
            echo "- Exact canonical SHA: \`$APPROVED_SHA\`"
            echo '- Worker entrypoint: `workers/calendar-public-oauth.js`'
            echo '- Existing Custom Domain, KV namespaces, secrets and five-minute drain preserved'
            echo '- Access policy mutation: none in this phase'
            echo '- All Calendar paths required to remain Access-gated until the separate path-specific Bypass sync succeeds'
          } >> "$GITHUB_STEP_SUMMARY"
