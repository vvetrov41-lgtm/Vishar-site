name: Deploy private production CRM database

on:
  push:
    branches:
      - 'release/private-crm-rc*-backend-auth-today-database-only'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact release/private-crm-rc branch HEAD SHA approved for this run
        required: true
        type: string
      deploy:
        description: Apply pending migrations after validation. Leave false for dry-run only.
        required: true
        default: false
        type: boolean
      approval_phrase:
        description: Required only for deploy=true
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-private-production-crm-database
  cancel-in-progress: false

jobs:
  production-database:
    name: Private CRM production database gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crm-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      PROJECT_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}

    steps:
      - name: Verify exact release branch and explicit production gate
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.deploy }}
          APPROVAL_PHRASE: ${{ github.event_name == 'push' && 'DEPLOY_PRIVATE_CRM_DATABASE' || inputs.approval_phrase }}
          DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DB_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            [[ "$GITHUB_REF_NAME" =~ ^release/private-crm-rc[0-9]+-backend-auth-today-database-only$ ]]
            [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]
          fi

          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*) ;;
            *)
              echo 'This workflow may run only from an approved release/private-crm-rc* branch.' >&2
              exit 1
              ;;
          esac

          if [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo 'approved_sha must exactly match the workflow source SHA.' >&2
            exit 1
          fi

          if [ "$DEPLOY_REQUESTED" = 'true' ]; then
            if [ "$DEPLOY_ENABLED" != 'true' ]; then
              echo 'CRM_PRODUCTION_DB_DEPLOY_ENABLED is not explicitly enabled.' >&2
              exit 1
            fi
            if [ "$APPROVAL_PHRASE" != 'DEPLOY_PRIVATE_CRM_DATABASE' ]; then
              echo 'The exact production database approval phrase is required for deploy=true.' >&2
              exit 1
            fi
          fi

      - name: Verify production Supabase target
        shell: bash
        run: |
          set -euo pipefail

          RETAINED_STAGING_PROJECT_REF='gwaliusblwrzisrwnsvs'

          if ! [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo 'CRM_PRODUCTION_SUPABASE_PROJECT_REF is missing or malformed.' >&2
            exit 1
          fi

          if [ "$PROJECT_REF" = "$RETAINED_STAGING_PROJECT_REF" ]; then
            echo 'Refusing to target the retained staging Supabase project.' >&2
            exit 1
          fi

          if [ "$PROJECT_URL" != "https://${PROJECT_REF}.supabase.co" ]; then
            echo 'CRM_PRODUCTION_SUPABASE_URL must exactly match the production project ref.' >&2
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo 'Production Supabase deployment credentials are not configured.' >&2
            exit 1
          fi

      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          fetch-depth: 0

      - name: Verify checkout SHA
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$APPROVED_SHA"
          test -z "$(git status --short)"

      - name: Verify automatic database-only exact canonical source and CI
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canonical_sha="$(git ls-remote origin "refs/heads/agent/platform-telegram-self-service" | awk 'NR == 1 {print $1}')"
          operator_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$GITHUB_SHA" ] || {
            echo 'Canonical CRM branch moved or does not match this release SHA.' >&2
            exit 1
          }
          [ "$operator_sha" = "$GITHUB_SHA" ] || {
            echo 'Database-only release ref moved after the workflow started.' >&2
            exit 1
          }

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/database-only-ci.json"
          for workflow in \
            'Static Validation' \
            'CRM and booking validation' \
            'Gmail production validation' \
            'Booking host validation' \
            'WhatsApp production onboarding validation'; do
            jq -e --arg name "$workflow" --arg sha "$GITHUB_SHA" \
              'any(.[]; .name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")' \
              "$RUNNER_TEMP/database-only-ci.json" >/dev/null || {
                echo "Required exact-head workflow is not green: $workflow" >&2
                exit 1
              }
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked root dependencies
        run: npm ci

      - name: Audit root dependencies
        run: |
          node scripts/audit-root-dependencies.mjs --self-test
          node scripts/audit-root-dependencies.mjs --audit-level=moderate

      - name: Scan repository for committed secrets
        run: npm run scan:secrets

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.110.0

      - name: Start clean local Supabase stack
        run: supabase start

      - name: Reset local database without development seed
        run: supabase db reset --local --no-seed

      - name: Run full pgTAP suite
        run: supabase test db

      - name: Lint PostgreSQL functions
        run: supabase db lint --local --schema public,crm_private --level error --fail-on error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

      - name: Link exact production Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show migration state before production dry-run
        run: supabase migration list

      - name: Verify Today production lineage and sole pending migration
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          [ "$PROJECT_REF" = 'vfjexhfdbrjmuxfdvbdx' ]
          supabase migration list > "$RUNNER_TEMP/today-migrations.txt"
          node scripts/verify-today-db-release.mjs "$RUNNER_TEMP/today-migrations.txt"

      - name: Dry-run production migrations without seed
        run: supabase db push --dry-run

      - name: Apply production migrations without seed
        if: github.event_name == 'push' || inputs.deploy
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git ls-remote origin "refs/heads/agent/platform-telegram-self-service" | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA" ]
          [ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA" ]
          supabase db push

      - name: Show migration state after production deploy
        if: github.event_name == 'push' || inputs.deploy
        run: supabase migration list

      - name: Verify no production migrations remain
        if: github.event_name == 'push' || inputs.deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run | tee "$RUNNER_TEMP/database-after.txt"
          grep -Fq 'Remote database is up to date.' "$RUNNER_TEMP/database-after.txt"

      - name: Production database boundary summary
        if: always()
        shell: bash
        env:
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.deploy }}
        run: |
          {
            echo '### Private CRM production database gate'
            echo
            echo "- Exact SHA: \`$GITHUB_SHA\`"
            echo "- Release branch: \`$GITHUB_REF_NAME\`"
            echo "- Deploy requested: \`$DEPLOY_REQUESTED\`"
            echo '- Local validation: clean no-seed reset, pgTAP and PostgreSQL lint'
            echo '- Remote validation: migration list and db push --dry-run'
            echo '- Remote reset command: none'
            echo '- Seed command: none'
          } >> "$GITHUB_STEP_SUMMARY"
