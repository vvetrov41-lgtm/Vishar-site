name: Deploy staging booking preview

on:
  push:
    branches:
      - claude/vishar-crm-booking-infra-c188bx
    paths:
      - .github/workflows/deploy-staging-booking.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging-booking
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved PR #176 commit
        uses: actions/checkout@v4
        with:
          ref: 2961452472d099aab75ca3522a7a2f8c3615e360

      - name: Prepare isolated booking artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _booking_staging
          git archive HEAD | tar -x -C _booking_staging

          rm -rf \
            _booking_staging/.github \
            _booking_staging/admin \
            _booking_staging/docs \
            _booking_staging/scripts \
            _booking_staging/supabase \
            _booking_staging/tests \
            _booking_staging/workers
          rm -f \
            _booking_staging/package.json \
            _booking_staging/package-lock.json \
            _booking_staging/wrangler.toml \
            _booking_staging/TECHNICAL_AUDIT.md

          node <<'NODE'
          const fs = require('fs');
          const path = '_booking_staging/booking/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              '<meta name="robots" content="index, follow">',
              '<meta name="robots" content="noindex, nofollow, noarchive">'
            ],
            [
              '<meta name="vishar-booking-endpoint" content="">',
              '<meta name="vishar-booking-endpoint" content="https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026">'
            ],
            [
              "const productionEndpoint = 'https://tattooai.vvetrov41.workers.dev/';",
              "const productionEndpoint = '';"
            ]
          ];

          for (const [from, to] of replacements) {
            const count = html.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`Expected exactly one staging substitution for: ${from}; found ${count}`);
            }
            html = html.replace(from, to);
          }

          fs.writeFileSync(path, html);

          fs.writeFileSync(
            '_booking_staging/index.html',
            '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="refresh" content="0;url=/booking/"><link rel="canonical" href="https://vishar-booking-staging.pages.dev/booking/"><title>Vishar booking staging</title></head><body><a href="/booking/">Open booking preview</a></body></html>\n'
          );
          NODE

          grep -Fq 'https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026' _booking_staging/booking/index.html
          grep -Fq 'noindex, nofollow, noarchive' _booking_staging/booking/index.html
          if grep -Fq 'https://tattooai.vvetrov41.workers.dev/' _booking_staging/booking/index.html; then
            echo 'Production Worker fallback remains in staging artifact' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Deploy booking artifact to staging Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy _booking_staging
          --project-name vishar-booking-staging
          --branch main
          --commit-dirty=true
