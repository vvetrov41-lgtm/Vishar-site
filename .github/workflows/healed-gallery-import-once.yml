name: Healed gallery one-shot import

on:
  push:
    branches:
      - agent/site-healed-gallery-25

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/agent/site-healed-gallery-25'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prepared healed gallery package
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://at.adobe.com/S4p7qDgD76GPILqC' \
            -o /tmp/healed-site-assets.zip
          echo '0f890586e3782847338b9cc5dbab34ed1abfd1b96b831d22439c0b8d137fc979  /tmp/healed-site-assets.zip' | sha256sum -c -

      - name: Install healed assets
        run: |
          rm -rf /tmp/healed-package
          mkdir -p /tmp/healed-package
          unzip -q /tmp/healed-site-assets.zip -d /tmp/healed-package
          test -f /tmp/healed-package/assets/healed/metadata.json
          rm -f assets/healed/[0-9][0-9].jpg assets/healed/[0-9][0-9].jpeg assets/healed/[0-9][0-9].png assets/healed/[0-9][0-9].webp
          rm -rf assets/healed/thumbs
          cp -R /tmp/healed-package/assets/healed/. assets/healed/

      - name: Verify 25 confirmed healed entries and pairs
        run: |
          node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('assets/healed/metadata.json', 'utf8'));
          const stems = Object.keys(meta).filter(k => /^\d{2}$/.test(k)).sort();
          if (stems.length !== 25) throw new Error(`Expected 25 healed entries, found ${stems.length}`);
          for (let i = 1; i <= 25; i++) {
            const stem = String(i).padStart(2, '0');
            const item = meta[stem];
            if (!item || item.status !== 'healed') throw new Error(`Invalid healed status for ${stem}`);
            if (item.fresh_source_number !== i * 2 - 1 || item.healed_source_number !== i * 2) {
              throw new Error(`Invalid fresh/healed pair mapping for ${stem}`);
            }
            if (!fs.existsSync(`assets/healed/${stem}.webp`)) throw new Error(`Missing source ${stem}.webp`);
            for (const width of [320, 480, 720, 960]) {
              if (!fs.existsSync(`assets/healed/thumbs/${stem}-${width}.webp`)) {
                throw new Error(`Missing thumbnail ${stem}-${width}.webp`);
              }
            }
          }
          if (meta._gallery?.sourceExtension !== '.webp') throw new Error('Healed manifest must use WebP sources');
          NODE

      - name: Update healed page evidence references
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('healed-tattoos/index.html')
          s = p.read_text()

          schema_old = '"contentUrl":"https://vishartattoo.com/assets/gallery/05.jpg","name":"Confirmed healed leg tattoo example","caption":"Vladimir Vishar at a tattoo convention next to a client\'s healed leg tattoo"'
          schema_new = '"contentUrl":"https://vishartattoo.com/assets/healed/01.webp","name":"Confirmed healed realism tattoo example","caption":"Confirmed healed realism tattoo by Vladimir Vishar"'
          if schema_old not in s:
              raise SystemExit('Missing expected healed ImageObject schema')
          s = s.replace(schema_old, schema_new, 1)

          replacements = [
            ('https://vishartattoo.com/assets/gallery/05.jpg', 'https://vishartattoo.com/assets/healed/01.webp'),
            ('More Confirmed Healed Work', 'Confirmed Healed Work'),
            ('Only explicitly confirmed healed photographs are loaded into this gallery.', '25 explicitly confirmed healed photographs are loaded into this gallery.'),
            ('As more confirmed healed photographs are added, they appear in the dedicated gallery below without mixing them with same-day session photos.', 'The dedicated gallery below contains 25 confirmed healed photographs, kept separate from the corresponding fresh-session images.')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected page text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Final checks and commit
        run: |
          git diff --check
          test "$(find assets/healed -maxdepth 1 -type f -name '[0-9][0-9].webp' | wc -l)" -eq 25
          test "$(find assets/healed/thumbs -type f -name '*.webp' | wc -l)" -eq 100
          rm .github/workflows/healed-gallery-import-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/healed healed-tattoos/index.html .github/workflows/healed-gallery-import-once.yml
          git commit -m 'Publish 25 confirmed healed tattoo photos'
          git push origin HEAD:agent/site-healed-gallery-25
