name: GPT production Worker rollout

# Redeploys the production GPT Actions Worker from an approved canonical SHA.
#
# The Communications-domain rollout that preceded this workflow was a one-shot
# topology migration: it only acted while the Worker still had two custom
# domains, so it cannot ship a code change and is pinned to its own release
# branch. This workflow is the general path. It changes no topology, no
# binding, no OAuth client and no database row — it ships Worker code, which is
# what an added or changed GPT Action route needs in order to be served.
#
# Admission is the same two-key mechanism the domain rollout established: the
# release branch must already point at the canonical head, and a same-tree
# no-op child commit is what triggers the run. The parent of the trigger commit
# is the SHA that gets deployed, and it must still be the canonical head with
# green exact-head CI at the moment of admission.
#
# The branch is a pattern rather than one fixed name so this path is reusable
# for every future GPT code change instead of being spent on the first one.

on:
  push:
    branches:
      - 'release/private-crm-rc*-gpt-worker'

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-production-worker-rollout
  cancel-in-progress: false

jobs:
  rollout:
    if: github.actor == github.repository_owner && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: crm-production
    env:
      CANONICAL_BRANCH: agent/platform-telegram-self-service
      APPROVED_SHA: ${{ github.event.before }}
      WORKER_NAME: vishar-gpt-actions-production
      CORE_HOST: gpt-actions.vishartattoo.com
      OPERATIONS_HOST: gpt-operations.vishartattoo.com
      COMMUNICATIONS_HOST: gpt-communications.vishartattoo.com
      SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Verify exact release trigger and production target
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*-gpt-worker) ;;
            *)
              echo 'This workflow may run only from a release/private-crm-rc*-gpt-worker branch.' >&2
              exit 1
              ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" != "$APPROVED_SHA" ]
          [ "$SUPABASE_URL" = 'https://vfjexhfdbrjmuxfdvbdx.supabase.co' ]
          [ "$SUPABASE_PROJECT_REF" = 'vfjexhfdbrjmuxfdvbdx' ]
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
          [ -n "$SUPABASE_ACCESS_TOKEN" ]
          [ -n "$SUPABASE_DB_PASSWORD" ]
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          [ -n "$CLOUDFLARE_API_TOKEN" ]

      - name: Checkout exact approved canonical source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify immutable canonical lineage and exact-head CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "$GITHUB_SHA^")" = "$APPROVED_SHA" ]
          [ "$(git rev-parse "$GITHUB_SHA^{tree}")" = "$(git rev-parse "$APPROVED_SHA^{tree}")" ]
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ -z "$(git status --short)" ]

          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ -n "$canonical_sha" ]
          [ "$canonical_sha" = "$APPROVED_SHA" ] || {
            echo 'Approved SHA is no longer the canonical Vishar CRM head.' >&2
            exit 1
          }

          required_workflows=(
            'Static Validation'
            'CRM and booking validation'
            'Gmail production validation'
            'Booking host validation'
            'WhatsApp production onboarding validation'
          )
          for attempt in $(seq 1 60); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
              --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' \
              | jq -s . > "$RUNNER_TEMP/exact-head-runs.json"
            all_green=true
            for workflow in "${required_workflows[@]}"; do
              if ! jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
                any(.[]; .name == $name and .head_sha == $sha
                         and .status == "completed" and .conclusion == "success")
              ' "$RUNNER_TEMP/exact-head-runs.json" >/dev/null; then
                all_green=false
              fi
            done
            if [ "$all_green" = true ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'Required exact-head CI did not become green within the bounded admission window.' >&2
              jq . "$RUNNER_TEMP/exact-head-runs.json" >&2
              exit 1
            fi
            sleep 15
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate exact three-domain GPT source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run test:gpt-production
          node scripts/test-gpt-gmail-openapi.mjs
          node scripts/test-gpt-operator-parity.mjs
          npm run validate:gpt-actions
          npm run check:gpt-production-bundle
          npm run scan:secrets
          [ "$(grep -c 'custom_domain = true' wrangler.gpt-actions.production.toml)" -eq 3 ]
          grep -Fq "pattern = \"$CORE_HOST\", custom_domain = true" wrangler.gpt-actions.production.toml
          grep -Fq "pattern = \"$OPERATIONS_HOST\", custom_domain = true" wrangler.gpt-actions.production.toml
          grep -Fq "pattern = \"$COMMUNICATIONS_HOST\", custom_domain = true" wrangler.gpt-actions.production.toml

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Verify production database has no pending migration drift
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list
          supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/supabase-dry-run.log"
          if grep -Eiq 'Would push|pending migration|apply these migrations' "$RUNNER_TEMP/supabase-dry-run.log"; then
            echo 'Pending production database migration detected. Refusing GPT edge mutation.' >&2
            exit 1
          fi

      - name: Fresh read-only Cloudflare preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-production-inventory.mjs \
            --output "$RUNNER_TEMP/cloudflare-before.json" \
            --summary "$RUNNER_TEMP/cloudflare-before.md"
          cat "$RUNNER_TEMP/cloudflare-before.md" >> "$GITHUB_STEP_SUMMARY"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cloudflare-before.json', 'utf8'));
          const workerName = process.env.WORKER_NAME;
          const worker = data.workers.find((row) => row.name === workerName);
          if (!worker) throw new Error('Production GPT Worker is missing');
          if (worker.workers_dev_enabled !== false || worker.preview_urls_enabled !== false) throw new Error('Unexpected GPT Worker exposure');
          const bindings = new Map((worker.bindings || []).map((row) => [row.name, row]));
          if (bindings.get('GPT_ACTIONS_ENABLED')?.value !== 'true') throw new Error('GPT_ACTIONS_ENABLED is not true');
          if (bindings.get('GPT_OAUTH_RELAY_ENABLED')?.value !== 'true') throw new Error('GPT_OAUTH_RELAY_ENABLED is not true');
          if (bindings.get('VISHAR_ENVIRONMENT')?.value !== 'production') throw new Error('GPT Worker is not production');
          const gmail = bindings.get('GMAIL_SERVICE');
          if (gmail?.type !== 'service' || gmail?.service !== 'vishar-gmail-production' || gmail?.environment !== 'production') throw new Error('Unexpected Gmail service binding');

          // This workflow ships code onto an already-established topology. Any
          // other domain shape means something else changed and this is not the
          // workflow that should reconcile it.
          const expected = [process.env.CORE_HOST, process.env.OPERATIONS_HOST, process.env.COMMUNICATIONS_HOST].sort();
          const hosts = data.worker_custom_domains
            .filter((row) => row.service === workerName)
            .map((row) => row.hostname)
            .sort();
          if (JSON.stringify(hosts) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected production GPT domain topology: ${hosts.join(', ')}`);
          }
          for (const row of data.worker_custom_domains.filter((r) => r.service === workerName)) {
            if (row.environment !== 'production' || row.zone_name !== 'vishartattoo.com' || row.enabled !== true) {
              throw new Error(`Unexpected domain metadata for ${row.hostname}`);
            }
          }

          // Rollback is a version rollback, so a known previous version is a
          // precondition for mutating anything at all.
          const beforeVersion = worker.active_deployment?.versions?.[0]?.version_id;
          if (typeof beforeVersion !== 'string' || !beforeVersion) {
            throw new Error('Could not read the current Worker version id; refusing to deploy without a rollback target');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `before_version=${beforeVersion}\n`);
          NODE

      - name: Deploy the GPT Worker from the approved canonical source
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.gpt-actions.production.toml --name "$WORKER_NAME" --strict \
            --var SUPABASE_URL:"$SUPABASE_URL" \
            --var SUPABASE_PUBLISHABLE_KEY:"$SUPABASE_PUBLISHABLE_KEY" \
            --var VISHAR_ENVIRONMENT:production \
            --var GPT_OAUTH_RELAY_ENABLED:true \
            --var GPT_ACTIONS_ENABLED:true

      - name: Production readback and acceptance
        id: readback
        shell: bash
        env:
          BEFORE_VERSION: ${{ steps.preflight.outputs.before_version }}
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 20); do
            if node scripts/cloudflare-production-inventory.mjs \
              --output "$RUNNER_TEMP/cloudflare-after.json" \
              --summary "$RUNNER_TEMP/cloudflare-after.md"; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cloudflare-after.json', 'utf8'));
          const worker = data.workers.find((row) => row.name === process.env.WORKER_NAME);
          if (!worker) process.exit(1);
          const expected = [process.env.CORE_HOST, process.env.OPERATIONS_HOST, process.env.COMMUNICATIONS_HOST].sort();
          const hosts = data.worker_custom_domains
            .filter((row) => row.service === process.env.WORKER_NAME)
            .map((row) => row.hostname)
            .sort();
          if (JSON.stringify(hosts) !== JSON.stringify(expected)) process.exit(1);
          if (worker.workers_dev_enabled !== false || worker.preview_urls_enabled !== false) process.exit(1);
          const bindings = new Map((worker.bindings || []).map((row) => [row.name, row]));
          if (bindings.get('GPT_ACTIONS_ENABLED')?.value !== 'true') process.exit(1);
          if (bindings.get('GPT_OAUTH_RELAY_ENABLED')?.value !== 'true') process.exit(1);
          if (bindings.get('VISHAR_ENVIRONMENT')?.value !== 'production') process.exit(1);
          const gmail = bindings.get('GMAIL_SERVICE');
          if (gmail?.service !== 'vishar-gmail-production' || gmail?.environment !== 'production') process.exit(1);
          // A code rollout that left the same active version shipped nothing.
          const afterVersion = worker.active_deployment?.versions?.[0]?.version_id;
          if (!afterVersion || afterVersion === process.env.BEFORE_VERSION) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `after_version=${afterVersion}\n`);
          NODE
              then
                success=true
                break
              fi
            fi
            sleep 6
          done
          [ "$success" = true ] || {
            echo 'Cloudflare readback did not converge on a new Worker version with the expected boundary.' >&2
            exit 1
          }

          # The action edge answers 401 before it routes, so an unauthenticated
          # probe proves the boundary is closed, not which routes exist. Route
          # coverage is proven by the exact-head test suite above and by the
          # version change; authenticated behaviour belongs to GPT acceptance.
          fake='11111111-1111-4111-8111-111111111111'
          probe() {
            expected="$1"
            url="$2"
            actual="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            [ "$actual" = "$expected" ] || {
              echo "GPT boundary mismatch for $url: expected $expected, got $actual" >&2
              return 1
            }
          }
          probe 200 "https://$CORE_HOST/privacy"
          probe 400 "https://$CORE_HOST/oauth/authorize"
          probe 401 "https://$CORE_HOST/v1/clients"
          probe 200 "https://$OPERATIONS_HOST/privacy"
          probe 401 "https://$OPERATIONS_HOST/v1/appointments?from=2026-08-31T00:00:00Z&to=2026-09-01T00:00:00Z"
          probe 200 "https://$COMMUNICATIONS_HOST/privacy"
          probe 401 "https://$COMMUNICATIONS_HOST/v1/enquiries/$fake/whatsapp"
          probe 401 "https://$COMMUNICATIONS_HOST/v1/enquiries/$fake/gmail/history"
          probe 401 "https://$COMMUNICATIONS_HOST/v1/communications/conversations"
          probe 401 "https://$COMMUNICATIONS_HOST/v1/communications/conversations/$fake/messages"
          probe 401 "https://$OPERATIONS_HOST/v1/enquiries/$fake/gmail/history"
          cat "$RUNNER_TEMP/cloudflare-after.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to the previous Worker version if readback fails
        if: failure() && steps.readback.outcome == 'failure'
        shell: bash
        env:
          BEFORE_VERSION: ${{ steps.preflight.outputs.before_version }}
        run: |
          set -euo pipefail
          [ -n "$BEFORE_VERSION" ]
          npx wrangler rollback "$BEFORE_VERSION" --name "$WORKER_NAME" --yes \
            --message "Automatic rollback: GPT Worker readback failed for $APPROVED_SHA"

          node scripts/cloudflare-production-inventory.mjs \
            --output "$RUNNER_TEMP/cloudflare-rollback.json" \
            --summary "$RUNNER_TEMP/cloudflare-rollback.md"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cloudflare-rollback.json', 'utf8'));
          const worker = data.workers.find((row) => row.name === process.env.WORKER_NAME);
          if (!worker) throw new Error('Production GPT Worker is missing after rollback');
          const expected = [process.env.CORE_HOST, process.env.OPERATIONS_HOST, process.env.COMMUNICATIONS_HOST].sort();
          const hosts = data.worker_custom_domains
            .filter((row) => row.service === process.env.WORKER_NAME)
            .map((row) => row.hostname)
            .sort();
          if (JSON.stringify(hosts) !== JSON.stringify(expected)) {
            throw new Error(`Rollback topology is not the exact three-domain baseline: ${hosts.join(', ')}`);
          }
          const active = worker.active_deployment?.versions?.[0]?.version_id;
          if (active !== process.env.BEFORE_VERSION) {
            throw new Error(`Rollback did not restore the previous version: ${active}`);
          }
          NODE
          cat "$RUNNER_TEMP/cloudflare-rollback.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Boundary summary
        if: always()
        shell: bash
        run: |
          {
            echo '### GPT production Worker rollout'
            echo "- Exact canonical SHA: \`$APPROVED_SHA\`"
            echo "- Trigger SHA: \`$GITHUB_SHA\` (same-tree no-op child)"
            echo "- Previous Worker version: \`${{ steps.preflight.outputs.before_version || 'unknown' }}\`"
            echo "- Deployed Worker version: \`${{ steps.readback.outputs.after_version || 'unknown' }}\`"
            echo '- Cloudflare domain topology: unchanged (Core, Operations, Communications)'
            echo '- Worker bindings and secrets: unchanged'
            echo '- OAuth authorization/token origin: unchanged (`gpt-actions.vishartattoo.com`)'
            echo '- Production DB migrations applied: none'
            echo '- GPT OAuth client/binding/capability mutations: none'
            echo '- Legacy artist-bound GPT clients: untouched'
            echo '- Retained staging targeted: no'
          } >> "$GITHUB_STEP_SUMMARY"
