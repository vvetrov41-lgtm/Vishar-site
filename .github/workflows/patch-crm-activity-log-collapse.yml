name: Patch CRM activity log collapse

on:
  push:
    branches:
      - agent/crm-activity-log-collapse

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 91362a579b2bb98a915b959b17b5d1eec41c5b23
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bounded starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/crm-activity-log-collapse'
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          actual="$(git diff --name-only "$BASE_SHA" HEAD)"
          test "$actual" = '.github/workflows/patch-crm-activity-log-collapse.yml'

      - name: Apply activity log UI patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page = Path('admin/src/pages/EnquiryDetailPage.tsx')
          text = page.read_text()

          old_import = "import { EnquiryReferenceActions } from '../components/EnquiryReferenceActions';\n"
          new_import = old_import + "import { CollapsibleActivityLog } from '../components/CollapsibleActivityLog';\n"
          if old_import not in text:
              raise SystemExit('EnquiryReferenceActions import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old_operational = "import { operationalLabel } from '../lib/operational-labels';\n"
          if old_operational not in text:
              raise SystemExit('operationalLabel import anchor missing')
          text = text.replace(old_operational, '', 1)

          old_block = """      {can(role, 'viewActivity') ? (\n        <Section title={t('enquiry.activity')}>\n          {activity.length === 0 ? (\n            <EmptyState title={t('enquiry.noActivity')} />\n          ) : (\n            <ul className=\"timeline\">\n              {activity.map((entry) => (\n                <li key={entry.id}>\n                  <div title={entry.event_type}>\n                    {operationalLabel(language, 'event', entry.event_type)}\n                  </div>\n                  <div className=\"when\">\n                    {formatDateTime(entry.occurred_at, language)} · {label('actor', entry.actor_kind)}\n                  </div>\n                </li>\n              ))}\n            </ul>\n          )}\n        </Section>\n      ) : null}\n"""
          new_block = """      {can(role, 'viewActivity') ? (\n        <Section title={t('enquiry.activity')}>\n          <CollapsibleActivityLog activity={activity} />\n        </Section>\n      ) : null}\n"""
          if old_block not in text:
              raise SystemExit('activity block anchor missing')
          page.write_text(text.replace(old_block, new_block, 1))
          PY

          cat > admin/src/components/CollapsibleActivityLog.tsx <<'EOF'
          import { useState } from 'react';
          import { EmptyState } from './StateViews';
          import { formatDateTime } from '../lib/format';
          import { useLanguage } from '../lib/i18n';
          import { operationalLabel } from '../lib/operational-labels';
          import type { ActivityEntry } from '../lib/types';

          export function CollapsibleActivityLog({ activity }: { activity: ActivityEntry[] }) {
            const [expanded, setExpanded] = useState(false);
            const { t, label, language } = useLanguage();

            if (activity.length === 0) {
              return <EmptyState title={t('enquiry.noActivity')} />;
            }

            const visibleActivity = expanded ? activity : activity.slice(0, 1);
            const actionLabel = expanded
              ? (language === 'ru' ? 'Свернуть' : 'Collapse')
              : (language === 'ru' ? 'Развернуть' : 'Expand');
            const accessibleLabel = expanded
              ? (language === 'ru' ? 'Свернуть журнал действий' : 'Collapse activity log')
              : (language === 'ru' ? 'Развернуть журнал действий' : 'Expand activity log');

            return (
              <>
                <ul className="timeline">
                  {visibleActivity.map((entry) => (
                    <li key={entry.id}>
                      <div title={entry.event_type}>
                        {operationalLabel(language, 'event', entry.event_type)}
                      </div>
                      <div className="when">
                        {formatDateTime(entry.occurred_at, language)} · {label('actor', entry.actor_kind)}
                      </div>
                    </li>
                  ))}
                </ul>
                {activity.length > 1 ? (
                  <div className="actions">
                    <button
                      type="button"
                      aria-expanded={expanded}
                      aria-label={accessibleLabel}
                      onClick={() => setExpanded((value) => !value)}
                    >
                      {actionLabel}
                    </button>
                  </div>
                ) : null}
              </>
            );
          }
          EOF

          cat > admin/src/test/activity-log-collapse.test.tsx <<'EOF'
          import { fireEvent, render, screen } from '@testing-library/react';
          import { describe, expect, it } from 'vitest';
          import { CollapsibleActivityLog } from '../components/CollapsibleActivityLog';
          import type { ActivityEntry } from '../lib/types';

          const ACTIVITY: ActivityEntry[] = [
            {
              id: 'activity-newest',
              artist_id: 'a1111111-1111-4111-8111-111111111111',
              occurred_at: '2026-08-15T09:00:00Z',
              event_type: 'enquiry.reference_uploaded',
              actor_kind: 'profile',
              actor_profile_id: '11111111-1111-4111-8111-111111111111',
              client_id: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              enquiry_id: 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              project_id: null,
              session_id: null,
              metadata: {},
            },
            {
              id: 'activity-middle',
              artist_id: 'a1111111-1111-4111-8111-111111111111',
              occurred_at: '2026-08-15T08:00:00Z',
              event_type: 'note.created',
              actor_kind: 'profile',
              actor_profile_id: '11111111-1111-4111-8111-111111111111',
              client_id: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              enquiry_id: 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              project_id: null,
              session_id: null,
              metadata: {},
            },
            {
              id: 'activity-oldest',
              artist_id: 'a1111111-1111-4111-8111-111111111111',
              occurred_at: '2026-08-15T07:00:00Z',
              event_type: 'enquiry.manual_created',
              actor_kind: 'profile',
              actor_profile_id: '11111111-1111-4111-8111-111111111111',
              client_id: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              enquiry_id: 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              project_id: null,
              session_id: null,
              metadata: {},
            },
          ];

          describe('collapsible activity log', () => {
            it('shows only the newest action until the log is expanded, then collapses again', () => {
              render(<CollapsibleActivityLog activity={ACTIVITY} />);

              expect(screen.getByTitle('enquiry.reference_uploaded')).toBeInTheDocument();
              expect(screen.queryByTitle('note.created')).not.toBeInTheDocument();
              expect(screen.queryByTitle('enquiry.manual_created')).not.toBeInTheDocument();

              const expand = screen.getByRole('button', { name: 'Expand activity log' });
              expect(expand).toHaveAttribute('aria-expanded', 'false');
              fireEvent.click(expand);

              expect(screen.getByTitle('enquiry.reference_uploaded')).toBeInTheDocument();
              expect(screen.getByTitle('note.created')).toBeInTheDocument();
              expect(screen.getByTitle('enquiry.manual_created')).toBeInTheDocument();

              const collapse = screen.getByRole('button', { name: 'Collapse activity log' });
              expect(collapse).toHaveAttribute('aria-expanded', 'true');
              fireEvent.click(collapse);

              expect(screen.getByTitle('enquiry.reference_uploaded')).toBeInTheDocument();
              expect(screen.queryByTitle('note.created')).not.toBeInTheDocument();
              expect(screen.queryByTitle('enquiry.manual_created')).not.toBeInTheDocument();
            });

            it('does not show a toggle for a one-entry log', () => {
              render(<CollapsibleActivityLog activity={ACTIVITY.slice(0, 1)} />);

              expect(screen.getByTitle('enquiry.reference_uploaded')).toBeInTheDocument();
              expect(screen.queryByRole('button')).not.toBeInTheDocument();
            });
          });
          EOF

      - name: Validate private CRM patch
        shell: bash
        run: |
          set -euo pipefail
          cd admin
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Commit bounded patch and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-crm-activity-log-collapse.yml
          git add admin/src/pages/EnquiryDetailPage.tsx admin/src/components/CollapsibleActivityLog.tsx admin/src/test/activity-log-collapse.test.tsx
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/patch-crm-activity-log-collapse.yml' \
            'admin/src/components/CollapsibleActivityLog.tsx' \
            'admin/src/pages/EnquiryDetailPage.tsx' \
            'admin/src/test/activity-log-collapse.test.tsx' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Collapse enquiry activity log by default'
          git push origin HEAD:agent/crm-activity-log-collapse
