name: Google Contacts database rollout

on:
  push:
    branches:
      - 'release/private-crm-rc*-backend-auth-google-contacts-db-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-private-production-crm-database
  cancel-in-progress: false

jobs:
  migration:
    name: Apply exact Google Contacts migration
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crm-production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      PROJECT_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DB_DEPLOY_ENABLED }}
      EXPECTED_PROJECT_REF: vfjexhfdbrjmuxfdvbdx
      EXPECTED_MIGRATION: 20260920095000_google_contacts_claim_e164_requeue.sql

    steps:
      - name: Checkout exact release snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate immutable canonical source and exact-head CI
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" =~ ^release/private-crm-rc[0-9a-z-]+-backend-auth-google-contacts-db-[a-z0-9-]+$ ]]
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]
          [ "$GITHUB_RUN_ATTEMPT" = 1 ]
          [ "$DEPLOY_ENABLED" = 'true' ]
          [ "$PROJECT_REF" = "$EXPECTED_PROJECT_REF" ]
          [ "$PROJECT_URL" = "https://${PROJECT_REF}.supabase.co" ]
          [ -n "$SUPABASE_ACCESS_TOKEN" ]
          [ -n "$SUPABASE_DB_PASSWORD" ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --short)" ]

          release_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          canonical_sha="$(git ls-remote origin refs/heads/agent/platform-telegram-self-service | awk 'NR == 1 {print $1}')"
          [ "$release_sha" = "$GITHUB_SHA" ]
          [ "$canonical_sha" = "$GITHUB_SHA" ] || {
            echo "Canonical CRM moved after release selection; refusing database mutation." >&2
            exit 1
          }

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100"             --jq '.workflow_runs[] | {name,head_sha,status,conclusion}' | jq -s . > "$RUNNER_TEMP/google-contacts-db-ci.json"

          for workflow in 'Static Validation' 'CRM and booking validation' 'WhatsApp production onboarding validation'; do
            jq -e --arg name "$workflow" --arg sha "$GITHUB_SHA"               'any(.[]; .name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")'               "$RUNNER_TEMP/google-contacts-db-ci.json" >/dev/null
          done

      - name: Verify exact repository migration boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f "supabase/migrations/$EXPECTED_MIGRATION"
          mapfile -t newer < <(
            find supabase/migrations -maxdepth 1 -type f -printf '%f\n'               | awk -v expected="$EXPECTED_MIGRATION" '$0 > expected {print}'               | sort
          )
          if [ "${#newer[@]}" -ne 0 ]; then
            printf 'Refusing rollout because newer migrations are present:\n%s\n' "${newer[*]}" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Link exact production Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Read production migration state before mutation
        run: supabase migration list

      - name: Dry-run only approved Google Contacts migration
        shell: bash
        run: |
          set -euo pipefail
          dry_run="$(supabase db push --dry-run 2>&1)"
          printf '%s\n' "$dry_run"
          DRY_RUN="$dry_run" node <<'NODE'
          const output = process.env.DRY_RUN || '';
          const expected = process.env.EXPECTED_MIGRATION;
          const migrations = Array.from(new Set(
            output.match(/\d{14}_[a-z0-9_]+\.sql/g) || []
          ));
          if (!output.includes(expected)) {
            throw new Error(`Expected pending migration was not present in production dry-run: ${expected}`);
          }
          if (migrations.length !== 1 || migrations[0] !== expected) {
            throw new Error(`Dry-run was not isolated to the approved migration: ${migrations.join(', ')}`);
          }
          NODE

      - name: Recheck immutable canonical source immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA" ]
          [ "$(git ls-remote origin refs/heads/agent/platform-telegram-self-service | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA" ]

      - name: Apply approved Google Contacts migration
        run: supabase db push --yes

      - name: Read back migration ledger and require no pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list
          after="$(supabase db push --dry-run 2>&1)"
          printf '%s\n' "$after"
          AFTER="$after" node <<'NODE'
          const output = process.env.AFTER || '';
          const pending = Array.from(new Set(
            output.match(/\d{14}_[a-z0-9_]+\.sql/g) || []
          ));
          if (pending.length) {
            throw new Error(`Production still has pending migrations after rollout: ${pending.join(', ')}`);
          }
          NODE

      - name: Rollout summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Google Contacts database rollout'
            echo
            echo "- Exact canonical SHA: \`$GITHUB_SHA\`"
            echo "- Migration: \`$EXPECTED_MIGRATION\`"
            echo "- Production project ref: \`$PROJECT_REF\`"
            echo '- Gate: current canonical, exact-head CI, production kill switch and exact project'
            echo '- Mutation: Supabase migration only; no CRM Pages or Worker deployment'
            echo '- Readback: migration ledger plus zero pending migrations'
          } >> "$GITHUB_STEP_SUMMARY"
