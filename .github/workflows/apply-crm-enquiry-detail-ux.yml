name: Apply CRM enquiry detail UX patch

on:
  push:
    branches:
      - agent/crm-enquiry-detail-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard temporary-only branch diff
        shell: bash
        run: |
          git merge-base --is-ancestor a9ec37dd5e508ff907e8b2a6d6ae1b884ca5b30e HEAD
          actual="$(git diff --name-only a9ec37dd5e508ff907e8b2a6d6ae1b884ca5b30e...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-crm-enquiry-detail-ux.yml' 'scripts/apply-crm-enquiry-detail-ux.py' 'scripts/fix-navigation-enquiry-ux-test.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply patch
        run: |
          python3 scripts/apply-crm-enquiry-detail-ux.py
          python3 scripts/fix-navigation-enquiry-ux-test.py

      - name: Install private CRM dependencies
        working-directory: admin
        run: npm ci

      - name: Test private CRM
        working-directory: admin
        run: npm test

      - name: Typecheck private CRM
        working-directory: admin
        run: npm run typecheck

      - name: Build private CRM
        working-directory: admin
        run: npm run build

      - name: Remove temporary harness and commit
        shell: bash
        run: |
          rm .github/workflows/apply-crm-enquiry-detail-ux.yml
          rm scripts/apply-crm-enquiry-detail-ux.py
          rm scripts/fix-navigation-enquiry-ux-test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine enquiry client details and reference previews"
          git push origin HEAD:agent/crm-enquiry-detail-ux
