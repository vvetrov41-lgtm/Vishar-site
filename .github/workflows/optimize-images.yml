name: Optimize Images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select target folder to optimize
        required: true
        type: choice
        options:
          - cover-ups
          - portfolio
          - black-and-grey
          - colour-realism
          - hero
          - large-scale
          - portraits
          - healed

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp

      - name: Optimize selected JPG/JPEG images
        env:
          OPTIMIZE_TARGET: ${{ inputs.target }}
        run: node scripts/optimize-images.mjs

      - name: Generate gallery thumbnails
        run: npm run thumbs:galleries

      - name: Validate site
        run: npm run validate:site

      - name: Create pull request with optimized images
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Optimize ${{ inputs.target }} images
          branch: chore/optimize-${{ inputs.target }}-images
          delete-branch: true
          title: Optimize ${{ inputs.target }} images
          body-path: optimize-images-${{ inputs.target }}-report.md
          add-paths: |
            assets/**/*.jpg
            assets/**/*.jpeg
            assets/**/thumbs/*.webp
