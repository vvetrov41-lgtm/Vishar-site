name: Ops RC36 WhatsApp HTTP surface audit

on:
  push:
    branches:
      - release/private-crm-rc36-whatsapp-http-surface-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify operator branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/private-crm-rc36-whatsapp-http-surface-audit'

      - name: Verify private CRM Access boundaries
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://crm.vishartattoo.com/api/whatsapp/embedded-signup/provision' \
            'https://e4465e66.vishar-crm-production.pages.dev/api/whatsapp/embedded-signup/provision'
          do
            status="$(curl --silent --show-error --output /tmp/access.html --write-out '%{http_code}' "$url")"
            echo "ACCESS_PROTECTED_STATUS=$status URL=$url"
            test "$status" = '302'
          done

      - name: Probe exact production webhook callback path with wrong token
        shell: bash
        run: |
          set -euo pipefail
          url='https://whatsapp.vishartattoo.com/webhook?hub.mode=subscribe&hub.verify_token=definitely-wrong-rc36-audit&hub.challenge=rc36-audit'
          status="$(curl --silent --show-error --output /tmp/webhook.txt --write-out '%{http_code}' "$url")"
          echo "WEBHOOK_WRONG_TOKEN_STATUS=$status"
          cat /tmp/webhook.txt || true
          echo
          case "$status" in
            200|201|202|204)
              echo 'Wrong verify token was unexpectedly accepted.' >&2
              exit 1
              ;;
          esac

      - name: Safety summary
        shell: bash
        run: |
          {
            echo '### RC36 WhatsApp HTTP surface audit'
            echo '- Custom CRM domain and deployment-specific Pages URL remain behind Cloudflare Access (302 unauthenticated)'
            echo '- Pages Function bundle deployment is evidenced by the successful deploy run and exact Cloudflare deployment SHA check'
            echo '- Exact /webhook callback path rejects an intentionally wrong verification token'
            echo '- No credentials supplied'
            echo '- No Meta onboarding/provider calls'
            echo '- No Worker, binding, route, cron or database mutation'
          } >> "$GITHUB_STEP_SUMMARY"
