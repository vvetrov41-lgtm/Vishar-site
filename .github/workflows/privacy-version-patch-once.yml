name: Privacy version patch once

on:
  push:
    branches:
      - agent/meta-capi-website-measurement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align booking privacy notice version
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('booking/index.html'); s=p.read_text(); old=\"const PRIVACY_NOTICE_VERSION = '2026-09-09';\"; new=\"const PRIVACY_NOTICE_VERSION = '2026-09-14';\"; assert s.count(old) == 1 or new in s; p.write_text(s.replace(old,new,1)) if old in s else None"

      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booking/index.html
          git commit -m "privacy: align booking notice version"
          git push origin HEAD:agent/meta-capi-website-measurement
