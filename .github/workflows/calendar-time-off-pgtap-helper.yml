# One-shot branch-only canonical test patch. Removes itself after exact edits.
name: Calendar Time Off pgTAP helper

on:
  push:
    branches:
      - agent/calendar-time-off-projection
    paths:
      - .github/workflows/calendar-time-off-pgtap-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendar-time-off-projection
          fetch-depth: 0

      - name: Patch canonical enum expectation and service-role harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('supabase/tests/010_schema_constraints.sql')
          text = schema.read_text()
          old = """  'telegram_notification', 'transactional_email', 'approved_email',
            'calendar_create', 'calendar_update', 'calendar_cancel', 'reconciliation'
          """
          new = """  'telegram_notification', 'transactional_email', 'approved_email',
            'calendar_create', 'calendar_update', 'calendar_cancel', 'reconciliation',
            'calendar_availability_create', 'calendar_availability_update',
            'calendar_availability_cancel'
          """
          if text.count(old) != 1:
              raise SystemExit(f'010: expected one outbox enum target, found {text.count(old)}')
          schema.write_text(text.replace(old, new, 1))

          projection = Path('supabase/tests/195_calendar_availability_projection.sql')
          text = projection.read_text()
          target = "set local role service_role;\n"
          if text.count(target) != 5:
              raise SystemExit(f'195: expected five service_role SETs, found {text.count(target)}')
          # Existing Calendar drain tests exercise backend semantics by setting
          # service_role JWT claims while retaining the privileged pgTAP fixture
          # role for direct postcondition inspection. Do the same here so the
          # test does not require direct table grants to service_role.
          projection.write_text(text.replace(target, ''))
          PY

          git rm .github/workflows/calendar-time-off-pgtap-helper.yml
          git diff --check
          git add supabase/tests/010_schema_constraints.sql supabase/tests/195_calendar_availability_projection.sql

          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/calendar-time-off-pgtap-helper.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'supabase/tests/010_schema_constraints.sql'
          printf '%s\n' "${changed[@]}" | grep -Fx 'supabase/tests/195_calendar_availability_projection.sql'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Calendar Time Off pgTAP harness'
          git push origin HEAD:agent/calendar-time-off-projection
