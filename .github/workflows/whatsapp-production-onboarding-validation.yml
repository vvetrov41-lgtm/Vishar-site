name: WhatsApp production onboarding validation

on:
  push:
    branches:
      - agent/kristina-whatsapp-production-onboarding
      - agent/kristina-self-service-whatsapp-connect
      - release/private-crm-rc*
    paths:
      - .github/workflows/whatsapp-production-onboarding-validation.yml
      - .github/workflows/deploy-private-production-crm.yml
      - admin/public/_headers
      - admin/functions/api/whatsapp/embedded-signup/provision.js
      - admin/src/lib/meta-whatsapp-embedded-signup.ts
      - admin/src/lib/whatsapp-connections-api.ts
      - admin/src/pages/WhatsAppConnectionsPage.tsx
      - admin/src/test/meta-whatsapp-embedded-signup.test.ts
      - admin/src/test/whatsapp-connections.test.ts
      - scripts/check-private-crm-artifact.mjs
      - scripts/test-whatsapp-production-onboarding.mjs
      - scripts/test-private-production-release-workflows.mjs
  pull_request:
    paths:
      - .github/workflows/whatsapp-production-onboarding-validation.yml
      - .github/workflows/deploy-private-production-crm.yml
      - admin/public/_headers
      - admin/functions/api/whatsapp/embedded-signup/provision.js
      - admin/src/lib/meta-whatsapp-embedded-signup.ts
      - admin/src/lib/whatsapp-connections-api.ts
      - admin/src/pages/WhatsAppConnectionsPage.tsx
      - admin/src/test/meta-whatsapp-embedded-signup.test.ts
      - admin/src/test/whatsapp-connections.test.ts
      - scripts/check-private-crm-artifact.mjs
      - scripts/test-whatsapp-production-onboarding.mjs
      - scripts/test-private-production-release-workflows.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Verify bounded branch and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test -n "${GITHUB_HEAD_REF:-}"
          else
            case "$branch" in
              agent/kristina-whatsapp-production-onboarding|agent/kristina-self-service-whatsapp-connect|release/private-crm-rc*) ;;
              *) echo "Unexpected WhatsApp onboarding branch: $branch" >&2; exit 1 ;;
            esac
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
          echo "exact_head=$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked root tooling
        run: npm ci

      - name: Test production onboarding server boundary
        run: node scripts/test-whatsapp-production-onboarding.mjs

      - name: Verify exact Meta browser CSP surface
        shell: bash
        run: |
          set -euo pipefail
          headers=admin/public/_headers
          grep -Fq "script-src 'self' https://connect.facebook.net" "$headers"
          grep -Fq 'https://www.facebook.com' "$headers"
          grep -Fq 'https://web.facebook.com' "$headers"
          grep -Fq 'https://m.facebook.com' "$headers"
          grep -Fq 'https://staticxx.facebook.com' "$headers"
          grep -Fq 'https://graph.facebook.com' "$headers"
          grep -Fq 'Cross-Origin-Opener-Policy: same-origin-allow-popups' "$headers"
          grep -Fq "frame-ancestors 'none'" "$headers"

      - name: Bundle Pages Functions
        working-directory: admin
        run: |
          set -euo pipefail
          ../node_modules/.bin/wrangler pages functions build functions --outfile /tmp/whatsapp-production-onboarding-worker.js
          test -s /tmp/whatsapp-production-onboarding-worker.js
          grep -Fq 'vishar-whatsapp-webhook-production' /tmp/whatsapp-production-onboarding-worker.js
          grep -Fq 'vishar-whatsapp-drain-production' /tmp/whatsapp-production-onboarding-worker.js
          grep -Fq 'ARTIST_WHATSAPP_VLADIMIR_HPRODUCTION' /tmp/whatsapp-production-onboarding-worker.js
          grep -Fq 'ARTIST_WHATSAPP_KRISTINA_HPRODUCTION' /tmp/whatsapp-production-onboarding-worker.js

      - name: Test private CRM
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Secret scan source and built function
        shell: bash
        run: |
          set -euo pipefail
          npm run scan:secrets
          for path in admin/functions /tmp/whatsapp-production-onboarding-worker.js; do
            if grep -R -E -q 'sb_secret_[A-Za-z0-9_-]{20,}' "$path"; then
              echo 'Supabase secret-key-shaped value found in onboarding artifact.' >&2
              exit 1
            fi
            if grep -R -E -q 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}' "$path"; then
              echo 'JWT-shaped value found in onboarding artifact.' >&2
              exit 1
            fi
            if grep -R -E -q 'EA[A-Za-z0-9]{40,}' "$path"; then
              echo 'Meta access-token-shaped value found in onboarding artifact.' >&2
              exit 1
            fi
          done
