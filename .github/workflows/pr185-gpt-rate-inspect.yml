name: PR 185 GPT rate-limit inspection

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr185-gpt-rate-limit-inspection
  cancel-in-progress: false

jobs:
  inspect-rate-limit:
    if: >-
      github.event.pull_request.number == 185 &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, '<!-- INSPECT_PR185_GPT_RATE_LIMIT -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_ZONE: vishartattoo.com
      TARGET_HOST: gpt-actions-staging.vishartattoo.com
      CLOUDFLARE_ZONE_LOOKUP_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EDGE_READ_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_READ_TOKEN }}

    steps:
      - name: Fail-closed PR guard
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$APPROVED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .action == "edited"
            and (.pull_request.body | contains("<!-- INSPECT_PR185_GPT_RATE_LIMIT -->"))
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.number == 185
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == "agent/appointment-five-minute-step"
            and .pull_request.head.ref == "agent/gpt-appointment-actions"
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
          ' "$GITHUB_EVENT_PATH" >/dev/null

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1

      - name: Verify exact head and normal CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in "Static Validation" "CRM and booking validation"; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[]; .name == $name and .head_sha == $sha
                       and .status == "completed" and .conclusion == "success")
            ' "$RUNNER_TEMP/runs.json" >/dev/null
          done

      - name: Inspect current zone plan and rate rules without mutation
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_ZONE_LOOKUP_TOKEN" ]
          [ -n "$CLOUDFLARE_EDGE_READ_TOKEN" ]
          lookup_auth=(-H "Authorization: Bearer $CLOUDFLARE_ZONE_LOOKUP_TOKEN" -H 'Content-Type: application/json')
          edge_auth=(-H "Authorization: Bearer $CLOUDFLARE_EDGE_READ_TOKEN" -H 'Content-Type: application/json')
          zone_json="$RUNNER_TEMP/zone.json"
          rate_json="$RUNNER_TEMP/rate.json"
          safe="$RUNNER_TEMP/rate-evidence.txt"

          zone_status="$(curl --silent --show-error -o "$zone_json" -w '%{http_code}' "${lookup_auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones?name=$TARGET_ZONE" || true)"
          [ "$zone_status" = 200 ] || { echo "Zone lookup failed, HTTP $zone_status." >&2; exit 1; }
          zone_id="$(jq -r --arg name "$TARGET_ZONE" '[.result[] | select(.name == $name)] | if length == 1 then .[0].id else empty end' "$zone_json")"
          [ -n "$zone_id" ] || { echo 'Exact zone not resolved.' >&2; exit 1; }
          plan_name="$(jq -r --arg name "$TARGET_ZONE" '[.result[] | select(.name == $name)] | .[0].plan.name // "unknown"' "$zone_json" | tr '\n\r=' '   ')"
          plan_legacy_id="$(jq -r --arg name "$TARGET_ZONE" '[.result[] | select(.name == $name)] | .[0].plan.legacy_id // "unknown"' "$zone_json" | tr '\n\r=' '   ')"

          rate_status="$(curl --silent --show-error -o "$rate_json" -w '%{http_code}' "${edge_auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_ratelimit/entrypoint" || true)"
          case "$rate_status" in 200|404) ;; *) echo "Rate-limit read failed, HTTP $rate_status." >&2; exit 1 ;; esac

          if [ "$rate_status" = 404 ]; then
            total=0
            target=0
            rules='[]'
          else
            total="$(jq '[.result.rules[]?] | length' "$rate_json")"
            target="$(jq --arg host "$TARGET_HOST" '[.result.rules[]? | select((.expression // "") | contains($host))] | length' "$rate_json")"
            rules="$(jq -c '[.result.rules[]? | {description:(.description // ""),enabled:(.enabled // true),action:(.action // ""),expression:(.expression // ""),ratelimit:{characteristics:(.ratelimit.characteristics // []),period:(.ratelimit.period // null),requests_per_period:(.ratelimit.requests_per_period // null),mitigation_timeout:(.ratelimit.mitigation_timeout // null)}}]' "$rate_json" | tr '\n\r=' '   ')"
          fi

          cat > "$safe" <<EOF
          exact_sha=$APPROVED_SHA
          target_zone=$TARGET_ZONE
          target_host=$TARGET_HOST
          zone_plan_name=$plan_name
          zone_plan_legacy_id=$plan_legacy_id
          rate_limit_read_status=$rate_status
          rate_limit_total_rule_count=$total
          rate_limit_target_rule_count=$target
          rate_limit_rules=$rules
          cloudflare_mutated=false
          production_targeted=false
          EOF
          cat "$safe"

      - name: Upload safe rate-limit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr185-gpt-rate-limit-inspection-${{ env.APPROVED_SHA }}
          path: ${{ runner.temp }}/rate-evidence.txt
          if-no-files-found: warn
          retention-days: 30
