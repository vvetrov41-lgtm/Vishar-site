name: Deploy private production Instagram connector

# This workflow never performs Meta onboarding and never provisions provider
# secrets, token-encryption material, webhook secrets, or KV namespaces. The
# two KV namespaces and the exact encrypted secret names must already exist
# before deploy=true is allowed to touch production. The production Supabase
# Supabase backend key and Instagram app secret are the two exceptions: a
# protected deploy validates their canonical crm-production values, then
# reconciles only those encrypted Worker bindings without printing either one.
#
# The Worker and its Custom Domain are the opposite: on the very first deploy
# they must NOT already exist. `wrangler deploy --strict` compares the
# Worker's remote route state against wrangler.instagram.production.toml; when
# nothing exists yet that comparison is a pure addition and --strict creates
# the Worker and attaches the Custom Domain together. A Custom Domain attached
# by hand ahead of time (dashboard or a direct Cloudflare API call) is not
# adoptable by that first --strict deploy: the Custom Domains API returns
# management fields (zone_name, enabled, previews_enabled) the local `routes`
# entry never declares, so --strict reports them as a conflict and aborts
# before uploading. See docs/crm/instagram-production-runbook.md section 3.
# Once the Custom Domain exists, the tracked route declares the same management
# fields (zone_name, enabled, previews_enabled) the API reports, so every later
# --strict deploy compares cleanly, the same as whatsapp.vishartattoo.com.
#
# Capabilities are activated in order: onboarding first, so the artists can
# connect their accounts, and only then the outbound drain. Enabling the drain
# without onboarding would create a queue that can never obtain a token, so the
# generator refuses that combination rather than documenting it.

on:
  push:
    branches:
      - 'release/private-crm-rc*-instagram-code-only-*'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact release/private-crm-rc branch HEAD SHA approved for this run
        required: true
        type: string
      deploy:
        description: Deploy after validation. Leave false for validation-only runs.
        required: true
        default: false
        type: boolean
      approval_phrase:
        description: Required only for deploy=true
        required: false
        default: ''
        type: string
      enable_oauth:
        description: Allow artists to connect their Instagram account
        required: true
        default: false
        type: boolean
      enable_drain:
        description: Allow queued CRM replies to be delivered to Instagram
        required: true
        default: false
        type: boolean
      enable_enrichment:
        description: Allow participant handles to be resolved outside the webhook path
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-private-production-instagram
  cancel-in-progress: false

jobs:
  instagram:
    if: github.event_name != 'push' || (github.actor == github.repository_owner && github.run_attempt == 1)
    name: Private CRM Instagram connector production gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      WORKER_NAME: vishar-instagram-production
      CONNECTOR_HOSTNAME: instagram.vishartattoo.com

    steps:
      - name: Verify exact release branch and explicit production gate
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.deploy }}
          APPROVAL_PHRASE: ${{ github.event_name == 'push' && 'AUTO_EXACT_HEAD_RELEASE' || inputs.approval_phrase }}
          DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_INSTAGRAM_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            [[ "$GITHUB_REF_NAME" =~ ^release/private-crm-rc[0-9]+-instagram-code-only-[a-z0-9-]+$ ]] || {
              echo 'Automatic Instagram release ref is not tightly scoped.' >&2
              exit 1
            }
            [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ] || {
              echo 'Only the repository owner may start an automatic Instagram release.' >&2
              exit 1
            }
            [ "$GITHUB_RUN_ATTEMPT" = '1' ] || {
              echo 'Automatic Instagram release accepts only the first attempt.' >&2
              exit 1
            }
          fi
          case "$GITHUB_REF_NAME" in
            release/private-crm-rc*) ;;
            *) echo 'This workflow may run only from an approved release/private-crm-rc* branch.' >&2; exit 1 ;;
          esac
          [ "$APPROVED_SHA" = "$GITHUB_SHA" ] || {
            echo 'approved_sha must exactly match the workflow source SHA.' >&2
            exit 1
          }
          if [ "$DEPLOY_REQUESTED" = 'true' ]; then
            if [ "$DEPLOY_ENABLED" != 'true' ]; then
              echo 'CRM_PRODUCTION_INSTAGRAM_DEPLOY_ENABLED is not explicitly enabled.' >&2
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
              [ "$APPROVAL_PHRASE" = 'AUTO_EXACT_HEAD_RELEASE' ] || {
                echo 'Automatic release approval contract invalid.' >&2
                exit 1
              }
            elif [ "$APPROVAL_PHRASE" != 'EXPOSE_PRIVATE_CRM_INSTAGRAM' ]; then
              echo 'The exact Instagram production approval phrase is required for manual deploy=true.' >&2
              exit 1
            fi
          fi

      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          fetch-depth: 0

      - name: Verify exact checkout and public surface
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ -z "$(git status --short)" ]
          grep -Fq 'name = "vishar-instagram-production"' wrangler.instagram.production.toml
          grep -Fq 'pattern = "instagram.vishartattoo.com"' wrangler.instagram.production.toml
          grep -Fq 'custom_domain = true' wrangler.instagram.production.toml
          grep -Fq 'workers_dev = false' wrangler.instagram.production.toml
          grep -Fq 'preview_urls = false' wrangler.instagram.production.toml
          ! grep -Fq 'pattern = "*' wrangler.instagram.production.toml
          # The tracked template must remain inert; the release generates the
          # active configuration rather than committing it.
          ! grep -Eq '^\s*\[triggers\]' wrangler.instagram.production.toml
          ! grep -Eq '^\s*\[\[kv_namespaces\]\]' wrangler.instagram.production.toml

      - name: Verify immutable automatic Instagram source and exact-head CI
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canonical="$(git ls-remote origin refs/heads/agent/platform-telegram-self-service | awk 'NR == 1 {print $1}')"
          release="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          [ "$canonical" = "$GITHUB_SHA" ] || {
            echo 'Canonical CRM branch moved or differs from this release snapshot.' >&2
            exit 1
          }
          [ "$release" = "$GITHUB_SHA" ] || {
            echo 'Instagram release ref moved after the workflow started.' >&2
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --short)" ]
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha,head_branch}' | jq -s . > "$RUNNER_TEMP/instagram-ci.json"
          for workflow in \
            'Static Validation' \
            'CRM and booking validation' \
            'WhatsApp production onboarding validation' \
            'Gmail production validation' \
            'Booking host validation'; do
            jq -e --arg name "$workflow" --arg sha "$GITHUB_SHA" \
              'any(.[]; .name == $name and .head_sha == $sha and .head_branch == "agent/platform-telegram-self-service" and .status == "completed" and .conclusion == "success")' \
              "$RUNNER_TEMP/instagram-ci.json" >/dev/null || {
                echo "Required canonical exact-head workflow is not green: $workflow" >&2
                exit 1
              }
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and audit locked dependencies
        run: |
          npm ci
          # Use the same narrowly scoped fail-closed auditor as the canonical
          # production release. It permits only the two exact Tailwind 3
          # dev-build advisories and blocks every additional advisory.
          node scripts/audit-root-dependencies.mjs --self-test
          node scripts/audit-root-dependencies.mjs --audit-level=moderate

      - name: Re-run Instagram security boundaries at the exact SHA
        run: |
          node scripts/test-instagram-annual-welcome.mjs
          node scripts/test-instagram-webhook.mjs
          node scripts/test-instagram-connector.mjs
          node scripts/test-instagram-webhook-subscription.mjs
          node scripts/test-instagram-production-config.mjs
          npm run check:instagram-production-bundle
          npm run scan:secrets

      - name: Verify exact pre-provisioned production Worker secret names
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --config wrangler.instagram.production.toml --name "$WORKER_NAME" --format json)"
          SECRET_LIST="$secrets_json" node <<'NODE'
          const values = JSON.parse(process.env.SECRET_LIST || '[]');
          const actual = values.map((entry) => entry?.name).filter(Boolean).sort();
          const expected = [
            'INSTAGRAM_APP_SECRET',
            'INSTAGRAM_TOKEN_ENCRYPTION_KEY',
            'INSTAGRAM_WEBHOOK_VERIFY_TOKEN',
            'SUPABASE_SECRET_KEY',
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            // Names only, never values: a bare mismatch gives the operator
            // nothing to act on.
            const missing = expected.filter((name) => !actual.includes(name));
            const unexpected = actual.filter((name) => !expected.includes(name));
            throw new Error(`Production Instagram secret-name set is not exact; expected ${expected.join(', ')}; `
              + `missing: ${missing.join(', ') || 'none'}; unexpected: ${unexpected.join(', ') || 'none'}`);
          }
          NODE

      - name: Verify unchanged live Instagram capability flags before mutation
        if: github.event_name == 'push'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            > "$RUNNER_TEMP/instagram-live-settings.json"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const data = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'instagram-live-settings.json'), 'utf8'));
          if (data.success !== true || !Array.isArray(data.result?.bindings)) {
            throw new Error('Production Instagram Worker settings unavailable');
          }
          const values = new Map(data.result.bindings.filter(b => b.type === 'plain_text').map(b => [b.name, b.text]));
          for (const [name, expected] of [
            ['INSTAGRAM_OAUTH_ENABLED', 'true'],
            ['INSTAGRAM_DRAIN_ENABLED', 'true'],
            ['INSTAGRAM_ENRICHMENT_ENABLED', 'false'],
            ['VISHAR_ENVIRONMENT', 'production'],
          ]) {
            if (values.get(name) !== expected) {
              throw new Error('Production Instagram capability drift: ' + name);
            }
          }
          const requiredSecrets = new Set(['INSTAGRAM_APP_SECRET','INSTAGRAM_TOKEN_ENCRYPTION_KEY','INSTAGRAM_WEBHOOK_VERIFY_TOKEN','SUPABASE_SECRET_KEY']);
          const present = data.result.bindings.filter(b => b.type === 'secret_text').map(b => b.name);
          if (present.length !== requiredSecrets.size || present.some(n => !requiredSecrets.has(n))) {
            throw new Error('Unexpected production Instagram secret name set');
          }
          NODE

      - name: Validate and reconcile production backend secrets
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          CANONICAL_SUPABASE_SECRET_KEY: ${{ secrets.CRM_PRODUCTION_SUPABASE_SECRET_KEY }}
          CANONICAL_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          CANONICAL_INSTAGRAM_APP_ID: ${{ secrets.CRM_PRODUCTION_INSTAGRAM_APP_ID }}
          CANONICAL_INSTAGRAM_APP_SECRET: ${{ secrets.CRM_PRODUCTION_INSTAGRAM_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CANONICAL_SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *) echo 'The canonical production Supabase backend key is absent or malformed.' >&2; exit 1 ;;
          esac
          if ! printf '%s' "$CANONICAL_SUPABASE_SECRET_KEY" \
            | grep -Eq '^sb_secret_[A-Za-z0-9._~-]{16,512}$'; then
            echo 'The canonical production Supabase backend key is not safe as an HTTP header.' >&2
            exit 1
          fi
          if ! printf '%s' "$CANONICAL_SUPABASE_PUBLISHABLE_KEY" \
            | grep -Eq '^sb_publishable_[A-Za-z0-9_-]{16,512}$'; then
            echo 'The canonical production Supabase publishable key is not safe as an HTTP header.' >&2
            exit 1
          fi
          if ! printf '%s' "$CANONICAL_INSTAGRAM_APP_SECRET" \
            | grep -Eq '^[0-9A-Fa-f]{32}$'; then
            echo 'The canonical production Instagram app secret is absent or malformed.' >&2
            exit 1
          fi
          if ! printf '%s' "$CANONICAL_INSTAGRAM_APP_ID" \
            | grep -Eq '^[0-9]{5,40}$'; then
            echo 'The canonical production Instagram app id is absent or is not numeric.' >&2
            exit 1
          fi

          probe_body="$RUNNER_TEMP/instagram-supabase-auth-probe.json"
          probe_status="$(curl --silent --show-error --max-time 20 \
            --output "$probe_body" \
            --write-out '%{http_code}' \
            --header "apikey: $CANONICAL_SUPABASE_SECRET_KEY" \
            --header 'authorization: Bearer synthetic.session.token-abcdefghijklmnop' \
            --header 'accept: application/json' \
            'https://vfjexhfdbrjmuxfdvbdx.supabase.co/auth/v1/user')"
          echo "SUPABASE_AUTH_CANARY_STATUS=$probe_status"
          case "$probe_status" in
            401|403) ;;
            *)
              echo 'The protected Supabase backend key did not reach the expected production Auth project.' >&2
              exit 1
              ;;
          esac

          publishable_probe_body="$RUNNER_TEMP/instagram-supabase-publishable-auth-probe.json"
          publishable_probe_status="$(curl --silent --show-error --max-time 20 \
            --output "$publishable_probe_body" \
            --write-out '%{http_code}' \
            --header "apikey: $CANONICAL_SUPABASE_PUBLISHABLE_KEY" \
            --header 'authorization: Bearer synthetic.session.token-abcdefghijklmnop' \
            --header 'accept: application/json' \
            'https://vfjexhfdbrjmuxfdvbdx.supabase.co/auth/v1/user')"
          echo "SUPABASE_PUBLISHABLE_AUTH_CANARY_STATUS=$publishable_probe_status"
          case "$publishable_probe_status" in
            401|403) ;;
            *)
              echo 'The production Supabase publishable key did not reach the expected Auth project.' >&2
              exit 1
              ;;
          esac

          printf '%s' "$CANONICAL_SUPABASE_SECRET_KEY" \
            | npx wrangler secret put SUPABASE_SECRET_KEY \
                --config wrangler.instagram.production.toml \
                --name "$WORKER_NAME"
          printf '%s' "$CANONICAL_INSTAGRAM_APP_SECRET" \
            | npx wrangler secret put INSTAGRAM_APP_SECRET \
                --config wrangler.instagram.production.toml \
                --name "$WORKER_NAME"

      - name: Generate and deploy only the Instagram connector Worker
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          INSTAGRAM_OAUTH_STATE_ID: ${{ vars.CRM_PRODUCTION_INSTAGRAM_OAUTH_STATE_ID }}
          INSTAGRAM_OAUTH_TOKENS_ID: ${{ vars.CRM_PRODUCTION_INSTAGRAM_OAUTH_TOKENS_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.CRM_PRODUCTION_INSTAGRAM_APP_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          INSTAGRAM_ACCOUNT_VLADIMIR: ${{ vars.CRM_PRODUCTION_INSTAGRAM_ACCOUNT_VLADIMIR }}
          INSTAGRAM_ACCOUNT_KRISTINA: ${{ vars.CRM_PRODUCTION_INSTAGRAM_ACCOUNT_KRISTINA }}
          ENABLE_INSTAGRAM_OAUTH: ${{ github.event_name == 'push' && 'true' || inputs.enable_oauth }}
          ENABLE_INSTAGRAM_DRAIN: ${{ github.event_name == 'push' && 'true' || inputs.enable_drain }}
          ENABLE_INSTAGRAM_ENRICHMENT: ${{ github.event_name == 'push' && 'false' || inputs.enable_enrichment }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_config="$GITHUB_WORKSPACE/.wrangler.instagram.production.deploy.toml"
          deploy_output="$RUNNER_TEMP/instagram-production-wrangler-output.ndjson"
          trap 'rm -f "$deploy_config"' EXIT
          rm -f "$deploy_output"

          node scripts/generate-instagram-production-deploy-config.mjs "$deploy_config"
          grep -Fq 'binding = "INSTAGRAM_OAUTH_STATE"' "$deploy_config"
          grep -Fq 'binding = "INSTAGRAM_OAUTH_TOKENS"' "$deploy_config"

          XDG_CONFIG_HOME=.wrangler/config \
          WRANGLER_LOG_PATH=.wrangler/instagram-production-wrangler.log \
          WRANGLER_SEND_METRICS=false \
            npx wrangler deploy \
              --config "$deploy_config" \
              --name "$WORKER_NAME" \
              --dry-run \
              --outdir .wrangler/instagram-production-generated

          WRANGLER_OUTPUT_FILE_PATH="$deploy_output" \
            npx wrangler deploy \
              --config "$deploy_config" \
              --name "$WORKER_NAME" \
              --strict

          rm -f "$deploy_config"

      - name: Record active connector version and safe evidence
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/instagram-production-evidence"
          npx wrangler versions list --name "$WORKER_NAME" --json > "$RUNNER_TEMP/instagram-production-evidence/versions.json"
          node <<'NODE'
          const fs = require('fs');
          const root = process.env.RUNNER_TEMP + '/instagram-production-evidence';
          const outputPath = process.env.RUNNER_TEMP + '/instagram-production-wrangler-output.ndjson';
          const versions = JSON.parse(fs.readFileSync(root + '/versions.json', 'utf8'));
          const events = fs.readFileSync(outputPath, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const deployEvents = events.filter((entry) => (
            entry?.type === 'deploy'
            && entry?.worker_name === process.env.WORKER_NAME
            && typeof entry?.version_id === 'string'
            && entry.version_id.length > 0
          ));
          if (deployEvents.length !== 1) {
            throw new Error('Unable to resolve exactly one deployed Instagram Worker version from Wrangler structured output');
          }
          const versionId = deployEvents[0].version_id;
          if (!Array.isArray(versions) || !versions.some((entry) => entry?.id === versionId)) {
            throw new Error('Structured deploy version id is not present in the current Worker version list');
          }
          fs.writeFileSync(root + '/safe-summary.json', JSON.stringify({
            worker: process.env.WORKER_NAME,
            version_id: versionId,
            version_source: 'wrangler_deploy_event',
            hostname: process.env.CONNECTOR_HOSTNAME,
            callback_path: '/webhook',
            oauth_callback_path: '/oauth/instagram/callback',
            workers_dev: false,
            preview_urls: false,
            secret_names_only: true,
          }, null, 2));
          console.log(`INSTAGRAM_WORKER_VERSION=${versionId}`);
          NODE

      - name: Verify the deployed Worker can reach Supabase Auth
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/instagram-auth-runtime-canary.json"
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --max-time 20 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Origin: https://crm.vishartattoo.com' \
              --header 'content-type: application/json' \
              --header 'authorization: Bearer synthetic.session.token-abcdefghijklmnop' \
              --data '{"artist_id":"a1111111-1111-4111-8111-111111111111"}' \
              'https://instagram.vishartattoo.com/v1/connections/start')"
            body="$(tr -d '\r\n' < "$body_file")"
            echo "WORKER_AUTH_CANARY_ATTEMPT=$attempt STATUS=$status BODY=$body"
            echo "WORKER_AUTH_CANARY_STATUS=$status"
            echo "WORKER_AUTH_CANARY_BODY=$body"
            if [ "$status" = '401' ] && [ "$body" = '{"error":"session_required"}' ]; then
              exit 0
            fi
            [ "$attempt" = '5' ] || sleep 4
          done
          echo 'The deployed Worker did not reach the expected Supabase Auth rejection.' >&2
          exit 1

      - name: Upload safe Instagram production evidence
        if: ${{ always() && (github.event_name == 'push' || inputs.deploy) }}
        uses: actions/upload-artifact@v4
        with:
          name: instagram-production-${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          path: ${{ runner.temp }}/instagram-production-evidence/safe-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Production Instagram boundary summary
        if: always()
        shell: bash
        env:
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' && 'true' || inputs.deploy }}
          ENABLE_OAUTH: ${{ github.event_name == 'push' && 'true' || inputs.enable_oauth }}
          ENABLE_DRAIN: ${{ github.event_name == 'push' && 'true' || inputs.enable_drain }}
          ENABLE_ENRICHMENT: ${{ github.event_name == 'push' && 'false' || inputs.enable_enrichment }}
        run: |
          {
            echo '### Private CRM Instagram connector production gate'
            echo
            echo "- Exact SHA: \`$GITHUB_SHA\`"
            echo "- Release branch: \`$GITHUB_REF_NAME\`"
            echo "- Deploy requested: \`$DEPLOY_REQUESTED\`"
            echo "- Onboarding enabled: \`$ENABLE_OAUTH\`"
            echo "- Outbound drain enabled: \`$ENABLE_DRAIN\`"
            echo "- Participant enrichment enabled: \`$ENABLE_ENRICHMENT\`"
            echo '- Worker: `vishar-instagram-production` only'
            echo '- Custom Domain: `instagram.vishartattoo.com` (created by this deploy on first run)'
            echo '- Accepted Meta callback path: `/webhook` only'
            echo '- workers.dev disabled; preview URLs disabled'
            echo '- Required secret names: Instagram app secret, token encryption key, webhook verify token, production Supabase backend key'
            echo '- Instagram access tokens live only in the encrypted KV token store; none is written to Postgres or returned to a browser'
            echo '- Secret values are never printed; the protected Supabase backend key and Instagram app secret are validated and reconciled without exposing them'
            echo '- Meta actions not performed: no App Review submission, permission change, account connection or message send'
            echo '- WhatsApp / Database / Pages / Calendar / Telegram / GPT / booking deploy commands: none'
          } >> "$GITHUB_STEP_SUMMARY"
