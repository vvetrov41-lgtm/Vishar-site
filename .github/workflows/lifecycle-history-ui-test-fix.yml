name: One-shot lifecycle history UI test fix

on:
  push:
    branches:
      - agent/lifecycle-execution-history-ui

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lifecycle-execution-history-ui
          fetch-depth: 0
      - name: Apply guarded fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('admin/src/test/lifecycle-automation-page.test.tsx')
          text = test.read_text()
          old = "expect(await screen.findByText('24 hour reminder')).toBeInTheDocument();"
          new = "expect(await screen.findAllByText('24 hour reminder')).toHaveLength(2);"
          if text.count(old) != 1:
              raise SystemExit(f'test guard expected 1 match, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1))

          page = Path('admin/src/pages/LifecycleAutomationPage.tsx')
          text = page.read_text()
          old = "<dt className=\"meta\">{ru ? 'Запланировано' : 'Scheduled for'}</dt>"
          new = "<dt className=\"meta\">{ru ? 'Запланировано на' : 'Scheduled for'}</dt>"
          if text.count(old) != 1:
              raise SystemExit(f'page guard expected 1 match, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/lifecycle-history-ui-test-fix.yml
      - name: Commit bounded fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/src/pages/LifecycleAutomationPage.tsx admin/src/test/lifecycle-automation-page.test.tsx .github/workflows/lifecycle-history-ui-test-fix.yml
          git diff --cached --check
          git commit -m 'Fix lifecycle history UI assertions'
          git push origin HEAD:agent/lifecycle-execution-history-ui
