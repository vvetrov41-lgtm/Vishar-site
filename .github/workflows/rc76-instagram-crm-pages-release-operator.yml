name: RC76 Instagram CRM Pages release operator

on:
  push:
    branches:
      - release/private-crm-rc76-instagram-crm-pages-operator
    paths:
      - .github/workflows/rc76-instagram-crm-pages-release-operator.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  locate-prior-protected-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate prior exact protected CRM Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: acf77918ecf1a6736d469f3c1e40193f54a6f0cb
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/actions/workflows/rc76-instagram-crm-pages-release-operator.yml/runs?branch=release/private-crm-rc76-instagram-crm-pages-operator&event=push&per_page=20")"
          RUN_JSON="$json" node <<'NODE' > "$RUNNER_TEMP/run.txt"
          const payload = JSON.parse(process.env.RUN_JSON || '{}');
          const target = process.env.TARGET_SHA;
          const run = (payload.workflow_runs || []).find((entry) => entry.head_sha === target);
          if (!run) process.exit(2);
          console.log(`${run.html_url}\n${run.status}\n${run.conclusion || 'n/a'}\n${run.id}`);
          NODE
          mapfile -t fields < "$RUNNER_TEMP/run.txt"
          body=$(printf 'RC76 Instagram CSP Pages operator status:\nproduction=%s status=%s conclusion=%s head=%s run_id=%s\n' "${fields[0]}" "${fields[1]}" "${fields[2]}" "$TARGET_SHA" "${fields[3]}")
          gh api -X POST "repos/$REPO/issues/379/comments" -f body="$body" >/dev/null
