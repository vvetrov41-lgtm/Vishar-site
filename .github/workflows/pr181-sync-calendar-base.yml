name: PR181 sync Calendar base

on:
  push:
    branches:
      - agent/calendar-connections-ui

permissions:
  contents: write

concurrency:
  group: pr181-sync-calendar-base
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'vvetrov41-lgtm/Vishar-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendar-connections-ui
          fetch-depth: 0
      - name: Merge the exact PR180 branch and resolve only the known config conflict
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start_sha="$(git rev-parse HEAD)"
          git fetch origin agent/calendar-connections-ui agent/google-calendar-oauth-connector
          test "$(git rev-parse origin/agent/calendar-connections-ui)" = "$start_sha"

          set +e
          git merge --no-ff --no-commit origin/agent/google-calendar-oauth-connector
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v '^wrangler.calendar.staging.toml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
            echo "Merge failed without a resolvable file conflict" >&2
            exit 1
          fi
          if printf '%s\n' "$conflicts" | grep -qx 'wrangler.calendar.staging.toml'; then
            git checkout --ours wrangler.calendar.staging.toml
            git add wrangler.calendar.staging.toml
          fi

          grep -Fq 'CRM_RETURN_URL = "https://vishar-crm-staging.pages.dev/#/integrations/calendar"' wrangler.calendar.staging.toml
          grep -Fq 'CRM_APPOINTMENTS_URL = "https://vishar-crm-staging.pages.dev/#/appointments"' wrangler.calendar.staging.toml
          rm .github/workflows/pr181-sync-calendar-base.yml
          git add .github/workflows/pr181-sync-calendar-base.yml

          git commit -m "Sync Calendar Connections with OAuth hardening"
          git push --force-with-lease=refs/heads/agent/calendar-connections-ui:"$start_sha" origin HEAD:agent/calendar-connections-ui
