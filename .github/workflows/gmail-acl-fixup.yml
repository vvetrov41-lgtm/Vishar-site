name: Gmail ACL harness fixup

on:
  pull_request:
    paths:
      - '.github/workflows/gmail-acl-fixup.yml'

permissions:
  contents: write

jobs:
  fixup:
    if: github.head_ref == 'agent/gmail-crm-production-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gmail-crm-production-integration
          fetch-depth: 0

      - name: Remove Gmail GPT RPCs from historical pre-GPT ACL inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/050_rls_roles.sql')
          text = path.read_text()
          lines = [
              "  ('public.gpt_authorize_gmail_enquiry(uuid)', false, true, false),\n",
              "  ('public.gpt_create_gmail_reply_draft(uuid,uuid,text)', false, true, false),\n",
          ]
          for line in lines:
              if text.count(line) != 1:
                  raise SystemExit(f'expected exactly one ACL line: {line.strip()}')
              text = text.replace(line, '', 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- supabase/tests/050_rls_roles.sql

      - name: Commit bounded harness correction
        run: |
          if git diff --quiet -- supabase/tests/050_rls_roles.sql; then
            echo 'No fixup required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/050_rls_roles.sql
          git commit -m 'Fix Gmail ACL compatibility harness'
          git push origin HEAD:agent/gmail-crm-production-integration
