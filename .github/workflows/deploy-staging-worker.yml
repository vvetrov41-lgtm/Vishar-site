name: Deploy staging Worker

on:
  pull_request:
    paths:
      - .github/workflows/deploy-staging-worker.yml
      - workers/preview.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 176
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved preview-fix commit
        uses: actions/checkout@v4
        with:
          ref: 479fc6c71de06f04e100d15cdb9c1769d33b4a2e

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare preview-only Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler.preview.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wrangler.preview.toml')
          text = path.read_text()
          old = 'main = "workers/tattooai.js"'
          new = 'main = "workers/preview.js"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Worker entrypoint')
          path.write_text(text.replace(old, new))
          PY
          grep -Fq 'main = "workers/preview.js"' wrangler.preview.toml

      - name: Deploy preview Worker without workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: >-
          npx wrangler deploy --config wrangler.preview.toml --env preview
          --var SUPABASE_URL:"$SUPABASE_URL"
          --var ALLOWED_ORIGINS:"https://vishar-booking-staging.pages.dev"

      - name: Upload preview Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --config wrangler.preview.toml --env preview
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.preview.toml --env preview
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID --config wrangler.preview.toml --env preview

      - name: Redeploy preview Worker with final bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: >-
          npx wrangler deploy --config wrangler.preview.toml --env preview
          --var SUPABASE_URL:"$SUPABASE_URL"
          --var ALLOWED_ORIGINS:"https://vishar-booking-staging.pages.dev"
