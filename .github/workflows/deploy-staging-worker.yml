name: Deploy staging Worker

on:
  push:
    branches:
      - claude/vishar-crm-booking-infra-c188bx
    paths:
      - .github/workflows/deploy-staging-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved PR #176 commit
        uses: actions/checkout@v4
        with:
          ref: 2961452472d099aab75ca3522a7a2f8c3615e360

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create preview Worker without a public workers.dev route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: >-
          npx wrangler deploy --env preview
          --var SUPABASE_URL:"$SUPABASE_URL"
          --var ALLOWED_ORIGINS:"https://vishar-booking-staging.pages.dev"

      - name: Upload preview Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --env preview
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --env preview
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID --env preview

      - name: Redeploy preview Worker with final bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: >-
          npx wrangler deploy --env preview
          --var SUPABASE_URL:"$SUPABASE_URL"
          --var ALLOWED_ORIGINS:"https://vishar-booking-staging.pages.dev"
