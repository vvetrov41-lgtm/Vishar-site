name: PR 177 staging preflight

on:
  push:
    branches:
      - agent/multi-artist-payments-foundation
    paths:
      - .github/workflows/pr177-staging-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr177-staging-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR 177 commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authorised commit ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/multi-artist-payments-foundation"
          git merge-base --is-ancestor 0e6b1c2cc4dc8e51d75c7c4df77e483207196b93 "$GITHUB_SHA"
          echo "PR177_PREFLIGHT_SHA=$GITHUB_SHA"

      - name: Verify retained staging credentials are available
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY SUPABASE_ACCESS_TOKEN STAGING_SUPABASE_DB_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "missing staging credential: $name"
              missing=1
            else
              echo "available staging credential: $name"
            fi
          done
          test "$missing" -eq 0

      - name: Install pinned dependencies
        run: npm ci

      - name: Snapshot linked migration history
        id: migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.111.0 link --project-ref gwaliusblwrzisrwnsvs --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.111.0 migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Prepare preview-only Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler.preview.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wrangler.preview.toml')
          text = path.read_text()
          old = 'main = "workers/tattooai.js"'
          new = 'main = "workers/preview.js"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Worker entrypoint')
          path.write_text(text.replace(old, new))
          PY

      - name: Snapshot Worker and Pages deployments
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config wrangler.preview.toml --env preview --json
          npx wrangler secret list --config wrangler.preview.toml --env preview --json
          npx wrangler pages deployment list --project-name vishar-booking-staging --environment production --json
          npx wrangler pages deployment list --project-name vishar-crm-staging --environment production --json

      - name: Snapshot Access, WAF, rate limit and Worker subdomain
        id: edge
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_json="$(curl --fail-with-body -sS "${auth[@]}" "$api/zones?name=vishartattoo.com")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_json")"
          test -n "$zone_id"

          access_json="$(curl --fail-with-body -sS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps")"
          jq -c '[.result[] | select(.domain == "vishar-booking-staging.pages.dev" or .domain == "vishar-crm-staging.pages.dev") | {name,domain,type}]' <<<"$access_json"

          for phase in http_request_firewall_custom http_ratelimit; do
            rules_json="$(curl --fail-with-body -sS "${auth[@]}" "$api/zones/$zone_id/rulesets/phases/$phase/entrypoint")"
            jq -c --arg phase "$phase" '{phase:$phase,rules:[.result.rules[]? | select((.expression // "") | contains("intake-staging.vishartattoo.com")) | {action,enabled,expression}]}' <<<"$rules_json"
          done

          subdomain_json="$(curl --fail-with-body -sS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/tattooai-preview/environments/production/subdomain")"
          jq -c '{workers_dev_enabled:(.result.enabled // null),previews_enabled:(.result.previews_enabled // null)}' <<<"$subdomain_json"

      - name: Record safe preflight result on PR 177
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          CREDENTIAL_STATUS: ${{ steps.credentials.outcome }}
          MIGRATION_STATUS: ${{ steps.migrations.outcome }}
          CLOUDFLARE_STATUS: ${{ steps.cloudflare.outcome }}
          EDGE_STATUS: ${{ steps.edge.outcome }}
        run: |
          gh pr comment 177 --repo "$GH_REPO" --body "<!-- pr177-staging-preflight -->
          ### PR #177 retained staging preflight

          - Exact commit: \`$GITHUB_SHA\`
          - Job: **$JOB_STATUS**
          - Required staging credential presence: \`$CREDENTIAL_STATUS\`
          - Linked migration history snapshot: \`$MIGRATION_STATUS\`
          - Worker and Pages snapshot: \`$CLOUDFLARE_STATUS\`
          - Access, WAF, rate-limit and workers.dev snapshot: \`$EDGE_STATUS\`

          No credential or binding value is included."
