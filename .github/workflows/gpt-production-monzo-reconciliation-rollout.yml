name: GPT production Monzo reconciliation rollout

on:
  push:
    branches:
      - release/private-crm-rc73-gpt-monzo-reconciliation

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: gpt-production-monzo-reconciliation-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crm-production
    env:
      APPROVED_SHA: ${{ github.sha }}
      PRODUCT_BRANCH: agent/gpt-monzo-reconciliation-v2
      EXPECTED_PR: '371'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.CRM_PRODUCTION_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.CRM_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      DB_DEPLOY_ENABLED: ${{ vars.CRM_PRODUCTION_DB_DEPLOY_ENABLED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: vishar-gpt-actions-production
      CORE_HOST: gpt-actions.vishartattoo.com
      OPERATIONS_HOST: gpt-operations.vishartattoo.com
      COMMUNICATIONS_HOST: gpt-communications.vishartattoo.com

    steps:
      - name: Verify exact release operator and production target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/private-crm-rc73-gpt-monzo-reconciliation'
          test "$SUPABASE_PROJECT_REF" = 'vfjexhfdbrjmuxfdvbdx'
          test "$SUPABASE_PROJECT_REF" != 'gwaliusblwrzisrwnsvs'
          test "$SUPABASE_URL" = 'https://vfjexhfdbrjmuxfdvbdx.supabase.co'
          test "$DB_DEPLOY_ENABLED" = true
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 0

      - name: Verify release SHA equals Draft product head and exact-head CI is green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --short)"

          product_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test -n "$product_sha"
          test "$product_sha" = "$APPROVED_SHA"

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR")"
          jq -e --arg branch "$PRODUCT_BRANCH" --arg sha "$APPROVED_SHA" '
            .state == "open"
            and .draft == true
            and .head.ref == $branch
            and .head.sha == $sha
            and .merged_at == null
          ' <<<"$pr_json" >/dev/null

          test -f supabase/migrations/0064_monzo_artist_payment_destinations.sql
          test -f supabase/migrations/0065_monzo_multiple_session_deposits.sql
          test -f supabase/migrations/0066_gpt_monzo_reconciliation.sql

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha,event}' | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in 'Static Validation' 'CRM and booking validation' 'Gmail production validation'; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[]; .name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")
            ' "$RUNNER_TEMP/runs.json" >/dev/null
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate exact GPT and Monzo runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          node scripts/test-gpt-full-actions.mjs
          node scripts/test-gpt-openapi-split.mjs
          node scripts/test-gpt-gmail-openapi.mjs
          node scripts/test-gpt-production-config.mjs
          npm run validate:gpt-actions
          npm run check:gpt-production-bundle
          npm run scan:secrets

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Validate migrations on clean local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          trap 'supabase stop --no-backup || true' EXIT
          supabase db reset --local --no-seed
          supabase test db
          supabase db lint --local --schema public,crm_private --level error --fail-on error
          supabase stop --no-backup
          trap - EXIT

      - name: Link exact production Supabase project and verify remote head 0063
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list | tee "$RUNNER_TEMP/migrations-before.txt"

          awk -F'|' '
            function trim(value) {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              return value
            }
            $0 ~ /\|/ {
              local_version = trim($1)
              remote_version = trim($2)
              if (local_version == "0063" && remote_version == "0063") seen_0063 = 1
              if (local_version == "0064" && remote_version == "") pending_0064 = 1
              if (local_version == "0065" && remote_version == "") pending_0065 = 1
              if (local_version == "0066" && remote_version == "") pending_0066 = 1
              if (remote_version ~ /^[0-9]+$/ && (remote_version + 0) > 63) newer_remote = 1
            }
            END {
              exit (seen_0063 && pending_0064 && pending_0065 && pending_0066 && !newer_remote) ? 0 : 1
            }
          ' "$RUNNER_TEMP/migrations-before.txt"

      - name: Dry-run exact 0064 to 0066 migration chain
        shell: bash
        run: |
          set -euo pipefail
          dry_run="$(supabase db push --dry-run 2>&1)"
          printf '%s\n' "$dry_run" | tee "$RUNNER_TEMP/db-dry-run.txt"
          printf '%s\n' "$dry_run" | grep -Fq '0064_monzo_artist_payment_destinations.sql'
          printf '%s\n' "$dry_run" | grep -Fq '0065_monzo_multiple_session_deposits.sql'
          printf '%s\n' "$dry_run" | grep -Fq '0066_gpt_monzo_reconciliation.sql'

          mapfile -t pending < <(printf '%s\n' "$dry_run" | grep -Eo '[0-9]{4}_[A-Za-z0-9_.-]+\.sql' | sort -u)
          test "${#pending[@]}" -eq 3
          test "${pending[0]}" = '0064_monzo_artist_payment_destinations.sql'
          test "${pending[1]}" = '0065_monzo_multiple_session_deposits.sql'
          test "${pending[2]}" = '0066_gpt_monzo_reconciliation.sql'

      - name: Apply production migrations 0064 then 0065 then 0066
        shell: bash
        run: |
          set -euo pipefail
          supabase db push
          supabase migration list | tee "$RUNNER_TEMP/migrations-after.txt"

          awk -F'|' '
            function trim(value) {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              return value
            }
            $0 ~ /\|/ {
              local_version = trim($1)
              remote_version = trim($2)
              if (local_version == "0064" && remote_version == "0064") deployed_0064 = 1
              if (local_version == "0065" && remote_version == "0065") deployed_0065 = 1
              if (local_version == "0066" && remote_version == "0066") deployed_0066 = 1
            }
            END {
              exit (deployed_0064 && deployed_0065 && deployed_0066) ? 0 : 1
            }
          ' "$RUNNER_TEMP/migrations-after.txt"

          post="$(supabase db push --dry-run 2>&1)"
          printf '%s\n' "$post"
          ! printf '%s\n' "$post" | grep -Eq '006[456]_.*\.sql'

      - name: Fresh-check existing production GPT edge before Worker deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$CORE_HOST/privacy")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$OPERATIONS_HOST/privacy")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$COMMUNICATIONS_HOST/privacy")" = 200

      - name: Deploy existing production GPT Worker with Monzo Operations routes
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.gpt-actions.production.toml --name "$WORKER_NAME" --strict \
            --var SUPABASE_URL:"$SUPABASE_URL" \
            --var SUPABASE_PUBLISHABLE_KEY:"$SUPABASE_PUBLISHABLE_KEY" \
            --var VISHAR_ENVIRONMENT:production \
            --var GPT_OAUTH_RELAY_ENABLED:true \
            --var GPT_ACTIONS_ENABLED:true

      - name: Verify three action domains and Monzo route remain OAuth-gated
        shell: bash
        run: |
          set -euo pipefail
          fake='11111111-1111-4111-8111-111111111111'
          for attempt in $(seq 1 30); do
            core_privacy="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$CORE_HOST/privacy" || true)"
            core_oauth="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$CORE_HOST/oauth/authorize" || true)"
            core_clients="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$CORE_HOST/v1/clients" || true)"
            ops_privacy="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$OPERATIONS_HOST/privacy" || true)"
            ops_activity="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$OPERATIONS_HOST/v1/activity" || true)"
            ops_monzo="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$OPERATIONS_HOST/v1/payments/monzo/reconciliation" || true)"
            comm_privacy="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$COMMUNICATIONS_HOST/privacy" || true)"
            comm_whatsapp="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$COMMUNICATIONS_HOST/v1/enquiries/$fake/whatsapp" || true)"
            comm_gmail="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$COMMUNICATIONS_HOST/v1/enquiries/$fake/gmail/history" || true)"
            legacy_gmail="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$OPERATIONS_HOST/v1/enquiries/$fake/gmail/history" || true)"
            if [ "$core_privacy" = 200 ] \
              && [ "$core_oauth" = 400 ] \
              && [ "$core_clients" = 401 ] \
              && [ "$ops_privacy" = 200 ] \
              && [ "$ops_activity" = 401 ] \
              && [ "$ops_monzo" = 401 ] \
              && [ "$comm_privacy" = 200 ] \
              && [ "$comm_whatsapp" = 401 ] \
              && [ "$comm_gmail" = 401 ] \
              && [ "$legacy_gmail" = 401 ]; then
              exit 0
            fi
            sleep 6
          done
          echo 'Production GPT Monzo rollout did not reach the expected OAuth-gated state.' >&2
          exit 1

      - name: Boundary summary
        if: always()
        shell: bash
        run: |
          {
            echo '### GPT production Monzo reconciliation rollout'
            echo "- Exact SHA: \`$APPROVED_SHA\`"
            echo "- Operator branch: \`$GITHUB_REF_NAME\`"
            echo '- Database migrations: `0064_monzo_artist_payment_destinations`, then `0065_monzo_multiple_session_deposits`, then `0066_gpt_monzo_reconciliation`'
            echo '- Worker: `vishar-gpt-actions-production` (reused)'
            echo '- Operations contract: 24 actions, including Monzo list/match/ignore/confirm'
            echo '- Match settlement: no'
            echo '- Confirm settlement: separate explicit consequential action'
            echo '- Artist routing: OAuth client binding only; no request artist selector'
            echo '- Gmail provider runtime/credentials: unchanged'
            echo '- Retained staging targeted: no'
            echo '- PR merge/Ready mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"
