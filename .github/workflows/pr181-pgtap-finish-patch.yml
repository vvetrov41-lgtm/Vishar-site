name: PR181 pgTAP finish patch

on:
  pull_request:
    types: [edited, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/calendar-connections-ui' &&
      contains(github.event.pull_request.body || '', '[run-pr181-pgtap-finish-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendar-connections-ui
          fetch-depth: 0
      - name: Close the pgTAP stream and remove this temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/181_calendar_connection_status.sql')
          source = path.read_text()
          if 'select * from finish();' not in source:
              anchor = '\nrollback;\n'
              if source.count(anchor) != 1:
                  raise SystemExit('expected rollback anchor was not unique')
              source = source.replace(anchor, '\nselect * from finish();\n\nrollback;\n')
              path.write_text(source)
          PY
          git rm .github/workflows/pr181-pgtap-finish-patch.yml
      - name: Commit the isolated test-harness correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/181_calendar_connection_status.sql
          git commit -m "Close Calendar Connections pgTAP stream"
          git push origin HEAD:agent/calendar-connections-ui
