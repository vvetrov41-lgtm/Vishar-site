name: Booking host validation

on:
  pull_request:
    paths:
      - 'workers/booking-host.js'
      - 'workers/booking-host-production.js'
      - 'wrangler.booking-host.production.toml'
      - 'scripts/test-booking-host-worker.mjs'
      - 'scripts/test-booking-host-production-config.mjs'
      - '.github/workflows/booking-host-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "head=${actual}"
          test "${actual}" = "${expected}"
          test -z "$(git status --porcelain)"

      - name: Test booking host contract
        run: |
          set -euo pipefail
          node scripts/test-booking-host-worker.mjs
          node scripts/test-booking-host-production-config.mjs

      - name: Compile production Worker without deploy
        run: |
          set -euo pipefail
          XDG_CONFIG_HOME=.wrangler/config \
          WRANGLER_LOG_PATH=.wrangler/booking-host-production-wrangler.log \
          WRANGLER_SEND_METRICS=false \
          npx wrangler deploy \
            --config wrangler.booking-host.production.toml \
            --dry-run \
            --outdir .wrangler/booking-host-production-dry-run

      - name: Scan repository for committed secrets
        run: node scripts/scan-secrets.mjs

      - name: Observe booking host RC94 production acceptance
        if: github.head_ref == 'agent/booking-host-rc2-observer'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 60551f599d086c9fbcf3b5cd61c8500d88f07901
          RELEASE_BRANCH: release/private-crm-rc94-booking-host-appointment-actions
          BOOKING_HOST: https://booking.vishartattoo.com
          ACTION_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          booking_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production-booking-host.yml/runs"
          found=''
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error "${headers[@]}" \
              --get \
              --data-urlencode "branch=${RELEASE_BRANCH}" \
              --data-urlencode 'event=push' \
              --data-urlencode 'per_page=20' \
              "$booking_api" > "$RUNNER_TEMP/booking-runs.json"
            found="$(jq -c --arg sha "$EXPECTED_SHA" --arg branch "$RELEASE_BRANCH" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)][0] // empty' "$RUNNER_TEMP/booking-runs.json")"
            if [ -n "$found" ]; then
              status="$(jq -r '.status' <<<"$found")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$found")"
              echo "booking_release_run_id=$(jq -r '.id' <<<"$found")"
              echo "booking_release_status=$status"
              echo "booking_release_conclusion=${conclusion:-pending}"
              if [ "$status" = 'completed' ]; then
                test "$conclusion" = 'success'
                break
              fi
            fi
            sleep 10
          done
          test -n "$found"
          test "$(jq -r '.status' <<<"$found")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$found")" = 'success'
          test "$(jq -r '.head_sha' <<<"$found")" = "$EXPECTED_SHA"
          test "$(jq -r '.head_branch' <<<"$found")" = "$RELEASE_BRANCH"

          private_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/private-production-release.yml/runs"
          curl --fail --silent --show-error "${headers[@]}" \
            --get \
            --data-urlencode "branch=${RELEASE_BRANCH}" \
            --data-urlencode 'event=push' \
            --data-urlencode 'per_page=20' \
            "$private_api" > "$RUNNER_TEMP/private-runs.json"
          private_count="$(jq --arg sha "$EXPECTED_SHA" --arg branch "$RELEASE_BRANCH" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)] | length' "$RUNNER_TEMP/private-runs.json")"
          echo "full_private_release_runs_for_booking_ref=$private_count"
          test "$private_count" = '0'

          root_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/root.html" \
            --write-out '%{http_code}' \
            "${BOOKING_HOST}/?rc94-observer=${EXPECTED_SHA}")"
          test "$root_status" = '200'
          grep -Fq 'https://booking.vishartattoo.com/api/enquiry' "$RUNNER_TEMP/root.html"
          if grep -Fq 'https://tattooai.vvetrov41.workers.dev/' "$RUNNER_TEMP/root.html"; then
            echo 'Direct intake endpoint leaked back into live booking HTML.' >&2
            exit 1
          fi

          action_url="${BOOKING_HOST}/appointments/respond/${ACTION_TOKEN}?rc94-observer=${EXPECTED_SHA}"
          action_status="$(curl --silent --show-error \
            --dump-header "$RUNNER_TEMP/action.headers" \
            --output "$RUNNER_TEMP/action.html" \
            --write-out '%{http_code}' \
            "$action_url")"
          echo "branded_action_status=$action_status"
          test "$action_status" = '404'
          grep -Fq 'This link is unavailable' "$RUNNER_TEMP/action.html"
          grep -Eiq '^content-type: text/html' "$RUNNER_TEMP/action.headers"
          grep -Eiq '^cache-control: no-store, max-age=0' "$RUNNER_TEMP/action.headers"
          grep -Eiq '^referrer-policy: no-referrer' "$RUNNER_TEMP/action.headers"
          grep -Eiq '^x-robots-tag: noindex, nofollow, noarchive' "$RUNNER_TEMP/action.headers"
          if grep -Eiq '^set-cookie:' "$RUNNER_TEMP/action.headers"; then
            echo 'Unexpected Set-Cookie crossed the branded proxy boundary.' >&2
            exit 1
          fi

          echo 'booking_host_rc94_live_acceptance=success'
