# One-shot branch-only canonical test patch. Removes itself after one exact edit.
name: Calendar Time Off worker test helper

on:
  push:
    branches:
      - agent/calendar-time-off-projection
    paths:
      - .github/workflows/calendar-time-off-worker-test-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendar-time-off-projection
          fetch-depth: 0

      - name: Update exact RPC allow-list expectation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-worker-modules.mjs')
          text = path.read_text()
          old = """  assert.deepEqual([...supabase.ALLOWED_RPCS].sort(), [
              'claim_calendar_outbox',
              'claim_telegram_outbox',
          """
          new = """  assert.deepEqual([...supabase.ALLOWED_RPCS].sort(), [
              'claim_calendar_availability_outbox',
              'claim_calendar_outbox',
              'claim_telegram_outbox',
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one claim-list target, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    'mark_enquiry_file_uploaded',
              'record_calendar_outbox_result',
              'record_outbox_attempt',
          """
          new = """    'mark_enquiry_file_uploaded',
              'record_calendar_availability_outbox_result',
              'record_calendar_outbox_result',
              'record_outbox_attempt',
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one record-list target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/calendar-time-off-worker-test-helper.yml
          git diff --check
          git add scripts/test-worker-modules.mjs
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/calendar-time-off-worker-test-helper.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/test-worker-modules.mjs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Calendar Time Off Worker allow-list test'
          git push origin HEAD:agent/calendar-time-off-projection
