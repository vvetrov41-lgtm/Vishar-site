name: PR 185 GPT OAuth relay staging

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr185-gpt-oauth-relay-staging
  cancel-in-progress: false

jobs:
  deploy-oauth-relay:
    if: >-
      github.event.pull_request.number == 185 &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, '<!-- DEPLOY_PR185_GPT_OAUTH_RELAY_STAGING -->')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_ZONE: vishartattoo.com
      TARGET_HOST: gpt-actions-staging.vishartattoo.com
      WORKER_NAME: vishar-gpt-actions-staging
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EDGE_READ_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Fail-closed PR guard
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$APPROVED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .action == "edited"
            and (.pull_request.body | contains("<!-- DEPLOY_PR185_GPT_OAUTH_RELAY_STAGING -->"))
            and .sender.login == "vvetrov41-lgtm"
            and .pull_request.number == 185
            and .pull_request.state == "open"
            and .pull_request.draft == true
            and .pull_request.merged == false
            and .pull_request.base.ref == "agent/appointment-five-minute-step"
            and .pull_request.head.ref == "agent/gpt-appointment-actions"
            and .pull_request.head.sha == $sha
            and .pull_request.head.repo.full_name == $repo
          ' "$GITHUB_EVENT_PATH" >/dev/null

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1

      - name: Verify exact head and normal CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in "Static Validation" "CRM and booking validation"; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[]; .name == $name and .head_sha == $sha
                       and .status == "completed" and .conclusion == "success")
            ' "$RUNNER_TEMP/runs.json" >/dev/null
          done

      - name: Verify relay source remains staging-only and actions disabled
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'name = "vishar-gpt-actions-staging"' wrangler.gpt-actions.staging.toml
          grep -Fx 'main = "workers/gpt-actions-staging.js"' wrangler.gpt-actions.staging.toml
          grep -Fx 'workers_dev = false' wrangler.gpt-actions.staging.toml
          grep -Fx 'GPT_ACTIONS_ENABLED = "false"' wrangler.gpt-actions.staging.toml
          grep -Fx 'GPT_OAUTH_RELAY_ENABLED = "false"' wrangler.gpt-actions.staging.toml
          grep -Fx 'SUPABASE_URL = "https://gwaliusblwrzisrwnsvs.supabase.co"' wrangler.gpt-actions.staging.toml
          grep -Fq "const RETAINED_STAGING_SUPABASE_ORIGIN = 'https://gwaliusblwrzisrwnsvs.supabase.co';" workers/gpt-actions-staging.js
          ! grep -Eq 'service_role|SUPABASE_SECRET|SUPABASE_SERVICE|sb_secret_' workers/gpt-actions-staging.js wrangler.gpt-actions.staging.toml
          ! grep -Eq '(^|[[:space:]])routes[[:space:]]*=|custom_domain[[:space:]]*=' wrangler.gpt-actions.staging.toml

      - name: Verify encrypted staging configuration names
        shell: bash
        run: |
          set -euo pipefail
          for name in STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_EDGE_READ_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name:-}" ] || { echo "Missing staging configuration name: $name" >&2; exit 1; }
          done
          [ "$STAGING_SUPABASE_URL" = "https://gwaliusblwrzisrwnsvs.supabase.co" ]
          case "$STAGING_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo 'Staging browser key is not publishable' >&2; exit 1 ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run relay and Worker tests
        run: npm run test:worker

      - name: Inspect edge and verify safe pre-mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          edge_auth=(-H "Authorization: Bearer $CLOUDFLARE_EDGE_READ_TOKEN" -H 'Content-Type: application/json')
          lookup_auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_json="$RUNNER_TEMP/zone.json"
          routes_json="$RUNNER_TEMP/routes.json"
          domains_json="$RUNNER_TEMP/domains.json"
          waf_json="$RUNNER_TEMP/waf.json"
          rate_json="$RUNNER_TEMP/rate.json"

          curl --fail --silent --show-error "${lookup_auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$TARGET_ZONE" > "$zone_json"
          zone_id="$(jq -r --arg name "$TARGET_ZONE" '[.result[] | select(.name == $name)] | if length == 1 then .[0].id else empty end' "$zone_json")"
          [ -n "$zone_id" ] || { echo 'Exact Cloudflare zone not resolved.' >&2; exit 1; }
          printf '%s' "$zone_id" > "$RUNNER_TEMP/zone-id"

          curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" > "$routes_json"
          curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" > "$domains_json"
          curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_request_firewall_custom/entrypoint" > "$waf_json"
          curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_ratelimit/entrypoint" > "$rate_json"

          worker_routes="$(jq --arg worker "$WORKER_NAME" '[.result[]? | select((.script // "") == $worker)] | length' "$routes_json")"
          target_routes="$(jq --arg host "$TARGET_HOST" '[.result[]? | select((.pattern // "") | contains($host))] | length' "$routes_json")"
          target_domains="$(jq --arg host "$TARGET_HOST" '[.result[]? | select(.hostname == $host)] | length' "$domains_json")"
          waf_target="$(jq '[.result.rules[]? | select(.description == "Vishar GPT OAuth staging path boundary")] | length' "$waf_json")"
          rate_target="$(jq '[.result.rules[]? | select(.description == "Vishar GPT OAuth staging rate limit")] | length' "$rate_json")"

          [ "$worker_routes" = 0 ] || { echo 'Worker already has route bindings.' >&2; exit 1; }
          [ "$target_routes" = 0 ] || { echo 'Target host already appears in a Worker route.' >&2; exit 1; }
          [ "$target_domains" = 0 ] || { echo 'Target host already has a custom domain.' >&2; exit 1; }
          [ "$waf_target" = 0 ] || { echo 'Target WAF rule already exists; refusing ambiguous first activation.' >&2; exit 1; }
          [ "$rate_target" = 0 ] || { echo 'Target rate rule already exists; refusing ambiguous first activation.' >&2; exit 1; }

          jq -r '.result.id' "$waf_json" > "$RUNNER_TEMP/waf-ruleset-id"
          jq -r '.result.id' "$rate_json" > "$RUNNER_TEMP/rate-ruleset-id"
          test -s "$RUNNER_TEMP/waf-ruleset-id"
          test -s "$RUNNER_TEMP/rate-ruleset-id"

          cat > "$RUNNER_TEMP/relay-evidence.txt" <<EOF
          exact_sha=$APPROVED_SHA
          worker=$WORKER_NAME
          target_host=$TARGET_HOST
          pre_worker_route_binding_count=$worker_routes
          pre_target_route_count=$target_routes
          pre_target_custom_domain_count=$target_domains
          pre_target_waf_rule_count=$waf_target
          pre_target_rate_rule_count=$rate_target
          production_targeted=false
          EOF

      - name: Deploy protected staging OAuth relay
        shell: bash
        run: |
          set -euo pipefail
          zone_id="$(cat "$RUNNER_TEMP/zone-id")"
          waf_ruleset_id="$(cat "$RUNNER_TEMP/waf-ruleset-id")"
          rate_ruleset_id="$(cat "$RUNNER_TEMP/rate-ruleset-id")"
          write_auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          edge_auth=(-H "Authorization: Bearer $CLOUDFLARE_EDGE_READ_TOKEN" -H 'Content-Type: application/json')
          waf_rule_id=''
          rate_rule_id=''
          domain_id=''
          worker_changed=false
          complete=false

          cleanup() {
            status=$?
            if [ "$complete" = true ]; then return "$status"; fi
            set +e
            if [ -n "$domain_id" ]; then
              curl --silent --show-error "${write_auth[@]}" -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$domain_id" >/dev/null
            fi
            if [ "$worker_changed" = true ]; then
              npx wrangler deploy --config wrangler.gpt-actions.staging.toml \
                --var SUPABASE_URL:"$STAGING_SUPABASE_URL" \
                --var SUPABASE_PUBLISHABLE_KEY:"$STAGING_SUPABASE_PUBLISHABLE_KEY" \
                --var GPT_ACTIONS_ENABLED:false \
                --var GPT_OAUTH_RELAY_ENABLED:false >/dev/null 2>&1
            fi
            if [ -n "$rate_rule_id" ]; then
              curl --silent --show-error "${write_auth[@]}" -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$rate_ruleset_id/rules/$rate_rule_id" >/dev/null
            fi
            if [ -n "$waf_rule_id" ]; then
              curl --silent --show-error "${write_auth[@]}" -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$waf_ruleset_id/rules/$waf_rule_id" >/dev/null
            fi
            return "$status"
          }
          trap cleanup EXIT

          waf_expression='(http.host eq "gpt-actions-staging.vishartattoo.com" and not ((http.request.method eq "GET" and (http.request.uri.path eq "/oauth/authorize" or http.request.uri.path eq "/oauth/authorize/" or http.request.uri.path eq "/privacy" or http.request.uri.path eq "/privacy/")) or (http.request.method eq "HEAD" and (http.request.uri.path eq "/privacy" or http.request.uri.path eq "/privacy/")) or (http.request.method eq "POST" and (http.request.uri.path eq "/oauth/token" or http.request.uri.path eq "/oauth/token/"))))'
          jq -n --arg expression "$waf_expression" '{description:"Vishar GPT OAuth staging path boundary",expression:$expression,action:"block",enabled:true}' > "$RUNNER_TEMP/waf-create.json"
          waf_response="$RUNNER_TEMP/waf-create-response.json"
          waf_status="$(curl --silent --show-error -o "$waf_response" -w '%{http_code}' "${write_auth[@]}" -X POST \
            --data-binary @"$RUNNER_TEMP/waf-create.json" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$waf_ruleset_id/rules" || true)"
          [ "$waf_status" = 200 ] || { echo "Unable to create staging WAF rule, HTTP $waf_status." >&2; exit 1; }
          waf_rule_id="$(jq -r '.result.id // empty' "$waf_response")"
          [ -n "$waf_rule_id" ] || { echo 'WAF mutation returned no rule ID.' >&2; exit 1; }

          rate_expression='(http.host eq "gpt-actions-staging.vishartattoo.com" and (http.request.uri.path eq "/oauth/authorize" or http.request.uri.path eq "/oauth/authorize/" or http.request.uri.path eq "/oauth/token" or http.request.uri.path eq "/oauth/token/"))'
          jq -n --arg expression "$rate_expression" '{description:"Vishar GPT OAuth staging rate limit",expression:$expression,action:"block",enabled:true,ratelimit:{characteristics:["cf.colo.id","ip.src"],period:60,requests_per_period:30,mitigation_timeout:60}}' > "$RUNNER_TEMP/rate-create.json"
          rate_response="$RUNNER_TEMP/rate-create-response.json"
          rate_status="$(curl --silent --show-error -o "$rate_response" -w '%{http_code}' "${write_auth[@]}" -X POST \
            --data-binary @"$RUNNER_TEMP/rate-create.json" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$rate_ruleset_id/rules" || true)"
          [ "$rate_status" = 200 ] || { echo "Unable to create staging rate-limit rule, HTTP $rate_status." >&2; exit 1; }
          rate_rule_id="$(jq -r '.result.id // empty' "$rate_response")"
          [ -n "$rate_rule_id" ] || { echo 'Rate-limit mutation returned no rule ID.' >&2; exit 1; }

          dry_run_dir="$RUNNER_TEMP/gpt-oauth-relay-dry-run"
          npx wrangler deploy --config wrangler.gpt-actions.staging.toml --dry-run --outdir "$dry_run_dir" \
            --var SUPABASE_URL:"$STAGING_SUPABASE_URL" \
            --var SUPABASE_PUBLISHABLE_KEY:"$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --var GPT_ACTIONS_ENABLED:false \
            --var GPT_OAUTH_RELAY_ENABLED:true >/dev/null

          npx wrangler deploy --config wrangler.gpt-actions.staging.toml \
            --var SUPABASE_URL:"$STAGING_SUPABASE_URL" \
            --var SUPABASE_PUBLISHABLE_KEY:"$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --var GPT_ACTIONS_ENABLED:false \
            --var GPT_OAUTH_RELAY_ENABLED:true
          worker_changed=true

          jq -n --arg host "$TARGET_HOST" --arg service "$WORKER_NAME" --arg zone_id "$zone_id" --arg zone_name "$TARGET_ZONE" \
            '{hostname:$host,service:$service,zone_id:$zone_id,zone_name:$zone_name}' > "$RUNNER_TEMP/domain-create.json"
          domain_response="$RUNNER_TEMP/domain-create-response.json"
          domain_status="$(curl --silent --show-error -o "$domain_response" -w '%{http_code}' "${write_auth[@]}" -X PUT \
            --data-binary @"$RUNNER_TEMP/domain-create.json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" || true)"
          [ "$domain_status" = 200 ] || { echo "Unable to attach staging Worker custom domain, HTTP $domain_status." >&2; exit 1; }
          domain_id="$(jq -r '.result.id // empty' "$domain_response")"
          [ -n "$domain_id" ] || { echo 'Custom-domain mutation returned no domain ID.' >&2; exit 1; }

          ready=false
          for attempt in $(seq 1 36); do
            domains="$RUNNER_TEMP/domains-after.json"
            if curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" > "$domains"; then
              count="$(jq --arg host "$TARGET_HOST" --arg service "$WORKER_NAME" '[.result[]? | select(.hostname == $host and .service == $service)] | length' "$domains")"
              if [ "$count" = 1 ]; then ready=true; break; fi
            fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'Custom domain did not become visible through read API.' >&2; exit 1; }

          privacy_status='000'
          for attempt in $(seq 1 36); do
            privacy_status="$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/privacy.html" -w '%{http_code}' "https://$TARGET_HOST/privacy" || true)"
            [ "$privacy_status" = 200 ] && break
            sleep 5
          done
          [ "$privacy_status" = 200 ] || { echo "Privacy endpoint not ready, HTTP $privacy_status." >&2; exit 1; }

          authorize_headers="$RUNNER_TEMP/authorize-headers.txt"
          authorize_status="$(curl --silent --show-error --max-time 10 --max-redirs 0 -D "$authorize_headers" -o /dev/null -w '%{http_code}' \
            "https://$TARGET_HOST/oauth/authorize?client_id=synthetic-client&redirect_uri=https%3A%2F%2Fexample.invalid%2Fcallback&state=synthetic-state&code_challenge=synthetic-challenge&code_challenge_method=S256" || true)"
          [ "$authorize_status" = 302 ] || { echo "OAuth authorize relay did not return 302, HTTP $authorize_status." >&2; exit 1; }
          grep -Fqi 'location: https://gwaliusblwrzisrwnsvs.supabase.co/auth/v1/oauth/authorize?' "$authorize_headers"

          token_guard_status="$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/token-guard.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' "https://$TARGET_HOST/oauth/token" || true)"
          [ "$token_guard_status" = 415 ] || { echo "OAuth token content-type guard failed, HTTP $token_guard_status." >&2; exit 1; }

          action_status="$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/action-disabled.json" -w '%{http_code}' \
            "https://$TARGET_HOST/v1/appointments?from=2026-08-10T00%3A00%3A00Z&to=2026-08-11T00%3A00%3A00Z" || true)"
          [ "$action_status" = 403 ] || { echo "WAF must block disabled appointment action paths, HTTP $action_status." >&2; exit 1; }

          routes="$RUNNER_TEMP/routes-after.json"
          waf_after="$RUNNER_TEMP/waf-after.json"
          rate_after="$RUNNER_TEMP/rate-after.json"
          curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" > "$routes"
          curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_request_firewall_custom/entrypoint" > "$waf_after"
          curl --fail --silent --show-error "${edge_auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_ratelimit/entrypoint" > "$rate_after"
          test "$(jq --arg worker "$WORKER_NAME" '[.result[]? | select((.script // "") == $worker)] | length' "$routes")" = 0
          test "$(jq '[.result.rules[]? | select(.description == "Vishar GPT OAuth staging path boundary" and .enabled == true)] | length' "$waf_after")" = 1
          test "$(jq '[.result.rules[]? | select(.description == "Vishar GPT OAuth staging rate limit" and .enabled == true)] | length' "$rate_after")" = 1

          cat >> "$RUNNER_TEMP/relay-evidence.txt" <<EOF
          oauth_relay_enabled=true
          gpt_actions_enabled=false
          post_worker_route_binding_count=0
          post_target_custom_domain_count=1
          post_target_waf_rule_count=1
          post_target_rate_rule_count=1
          privacy_status=$privacy_status
          authorize_status=$authorize_status
          token_content_type_guard_status=$token_guard_status
          disabled_action_waf_status=$action_status
          cloudflare_mutated=true
          production_targeted=false
          EOF

          complete=true
          trap - EXIT

      - name: Upload safe relay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr185-gpt-oauth-relay-staging-${{ env.APPROVED_SHA }}
          path: ${{ runner.temp }}/relay-evidence.txt
          if-no-files-found: ignore
          retention-days: 7
