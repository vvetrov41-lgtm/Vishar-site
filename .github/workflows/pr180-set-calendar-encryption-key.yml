name: PR 180 set calendar encryption key

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  set-secret:
    if: >-
      github.event.pull_request.number == 180 &&
      github.event.pull_request.head.ref == 'agent/google-calendar-oauth-connector' &&
      github.event.pull_request.base.ref == 'agent/google-calendar-foundation' &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, '<!-- SET_PR180_CALENDAR_ENCRYPTION_KEY -->')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify deployment target
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'name = "vishar-calendar-staging"' wrangler.calendar.staging.toml
          grep -Fx 'workers_dev = false' wrangler.calendar.staging.toml

      - name: Generate and upload encrypted secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          key="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          test "$(printf '%s' "$key" | wc -c)" -ge 43
          printf '%s' "$key" | npx --yes wrangler@4 secret put CALENDAR_TOKEN_ENCRYPTION_KEY --name vishar-calendar-staging
          unset key

      - name: Confirm secret presence without reading value
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --name vishar-calendar-staging | grep -F 'CALENDAR_TOKEN_ENCRYPTION_KEY'
