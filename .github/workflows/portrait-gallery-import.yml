name: Portrait gallery one-shot import

on:
  push:
    branches:
      - agent/site-portrait-gallery-images
    paths:
      - .github/workflows/portrait-gallery-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "agent/site-portrait-gallery-images" ]

      - name: Download prepared Portrait archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://at.adobe.com/NrlRf2LPhUa4dSVY' \
            -o /tmp/portrait-source-only.zip
          echo '55645f554d3cf4b6d16a257aef3ba90599879a9ce060f9a821818969c6e0f73b  /tmp/portrait-source-only.zip' | sha256sum -c -

      - name: Validate and install sources
        run: |
          set -euo pipefail
          rm -rf /tmp/portrait-import
          mkdir -p /tmp/portrait-import
          unzip -q /tmp/portrait-source-only.zip -d /tmp/portrait-import

          test -f /tmp/portrait-import/metadata.json
          for n in $(seq -w 1 25); do
            test -f "/tmp/portrait-import/${n}.webp"
          done
          [ "$(find /tmp/portrait-import -maxdepth 1 -type f -name '[0-9][0-9].webp' | wc -l | tr -d ' ')" = "25" ]

          mkdir -p assets/portraits
          rm -f assets/portraits/[0-9][0-9].jpg assets/portraits/[0-9][0-9].webp
          rm -rf assets/portraits/thumbs
          cp /tmp/portrait-import/[0-9][0-9].webp assets/portraits/
          cp /tmp/portrait-import/metadata.json assets/portraits/metadata.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate responsive Portrait thumbnails
        run: |
          set -euo pipefail
          npm ci
          node scripts/generate-gallery-thumbs.mjs --force --gallery=portraits
          [ "$(find assets/portraits/thumbs -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" = "100" ]

      - name: Commit imported gallery and remove importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits assets/js/speciality-gallery.js scripts/generate-gallery-thumbs.mjs
          git rm .github/workflows/portrait-gallery-import.yml
          git commit -m "Import Portrait gallery images"
          git push origin HEAD:"$GITHUB_REF_NAME"
