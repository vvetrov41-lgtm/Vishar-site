name: Ops RC31 WhatsApp drain Supabase secret

on:
  push:
    branches:
      - release/private-crm-rc31-whatsapp-production-runtime-operator
    paths:
      - .github/workflows/ops-rc31-whatsapp-drain-supabase-secret.yml

permissions:
  contents: read

concurrency:
  group: ops-rc31-whatsapp-drain-supabase-secret
  cancel-in-progress: false

jobs:
  provision:
    name: Provision existing production Supabase key to inert WhatsApp drain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      RELEASE_SHA: 75fd09ee8bdbe12dfff2faf6b5fb034b6683e2a0
      WORKER_NAME: vishar-whatsapp-drain-production
      PROJECT_REF: vfjexhfdbrjmuxfdvbdx
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact RC31 ancestry and operator-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          unexpected="$(git diff --name-only "$RELEASE_SHA"...HEAD | grep -vE '^\.github/workflows/ops-rc31-whatsapp-(production-drain-bootstrap-release|drain-supabase-secret)\.yml$' || true)"
          [ -z "$unexpected" ] || { echo 'Unexpected non-operator changes.' >&2; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]
          [ -n "$SUPABASE_ACCESS_TOKEN" ]
          [ "$PROJECT_REF" = 'vfjexhfdbrjmuxfdvbdx' ]

      - name: Checkout exact approved release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify exact inert source state
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          [ -z "$(git status --short)" ]
          grep -Fq 'WHATSAPP_DRAIN_ENABLED = "false"' wrangler.whatsapp-drain.production.toml
          ! grep -Eq '^\s*\[triggers\]\s*$' wrangler.whatsapp-drain.production.toml
          ! grep -Eq '^\s*crons\s*=' wrangler.whatsapp-drain.production.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Re-run exact release safety checks
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run test:whatsapp-production
          npm run check:whatsapp-production-bundle
          npm run scan:secrets

      - name: Verify Worker is inert and has no secrets
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${auth[@]}" "$base")"
          [ "$status" = '200' ]
          secrets="$(curl --fail --silent --show-error "${auth[@]}" "$base/secrets")"
          schedules="$(curl --fail --silent --show-error "${auth[@]}" "$base/schedules")"
          settings="$(curl --fail --silent --show-error "${auth[@]}" "$base/settings")"
          SECRETS="$secrets" SCHEDULES="$schedules" SETTINGS="$settings" node <<'NODE'
          const secrets = JSON.parse(process.env.SECRETS || '{}');
          const schedules = JSON.parse(process.env.SCHEDULES || '{}');
          const settings = JSON.parse(process.env.SETTINGS || '{}');
          const names = Array.isArray(secrets.result) ? secrets.result.map((x) => x?.name).filter(Boolean) : [];
          if (names.length) throw new Error(`Refusing to overwrite existing drain secrets: ${names.sort().join(', ')}`);
          const cron = Array.isArray(schedules.result) ? schedules.result : [];
          if (cron.length) throw new Error('Drain Worker is already scheduled');
          const bindings = Array.isArray(settings?.result?.bindings) ? settings.result.bindings : [];
          const enabled = bindings.find((x) => x?.name === 'WHATSAPP_DRAIN_ENABLED');
          if (!enabled || enabled.text !== 'false') throw new Error('Drain enable flag is not false');
          NODE

      - name: Copy existing modern Supabase secret directly into Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          secret_file="$RUNNER_TEMP/supabase-backend-key.txt"
          cleanup() { rm -f "$keys_file" "$secret_file"; }
          trap cleanup EXIT
          umask 077
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true" > "$keys_file"
          KEYS_FILE="$keys_file" SECRET_FILE="$secret_file" node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.env.KEYS_FILE, 'utf8'));
          if (!Array.isArray(rows)) throw new Error('Supabase API-key response was not an array');
          const modern = rows.filter((row) => row && typeof row === 'object' && typeof row.api_key === 'string' && row.api_key.startsWith('sb_secret_'));
          const defaults = modern.filter((row) => row.name === 'default');
          const selected = defaults.length === 1 ? defaults[0] : (modern.length === 1 ? modern[0] : null);
          if (!selected) throw new Error('No unambiguous existing modern Supabase secret key is available; no key was created');
          if (selected.api_key.length < 20 || selected.api_key.length > 1024) throw new Error('Selected Supabase secret key has an unexpected format');
          fs.writeFileSync(process.env.SECRET_FILE, selected.api_key, { mode: 0o600 });
          console.log('EXISTING_MODERN_SUPABASE_SECRET_SELECTED=true');
          NODE
          npx wrangler secret put SUPABASE_SECRET_KEY --config wrangler.whatsapp-drain.production.toml --name "$WORKER_NAME" < "$secret_file" >/dev/null
          cleanup
          trap - EXIT

      - name: Verify secret name only and drain remains inert
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          secrets="$(curl --fail --silent --show-error "${auth[@]}" "$base/secrets")"
          schedules="$(curl --fail --silent --show-error "${auth[@]}" "$base/schedules")"
          settings="$(curl --fail --silent --show-error "${auth[@]}" "$base/settings")"
          SECRETS="$secrets" SCHEDULES="$schedules" SETTINGS="$settings" node <<'NODE'
          const secrets = JSON.parse(process.env.SECRETS || '{}');
          const schedules = JSON.parse(process.env.SCHEDULES || '{}');
          const settings = JSON.parse(process.env.SETTINGS || '{}');
          const names = Array.isArray(secrets.result) ? secrets.result.map((x) => x?.name).filter(Boolean).sort() : [];
          if (JSON.stringify(names) !== JSON.stringify(['SUPABASE_SECRET_KEY'])) throw new Error(`Unexpected drain secret-name set: ${names.join(', ')}`);
          const cron = Array.isArray(schedules.result) ? schedules.result : [];
          if (cron.length) throw new Error('Drain unexpectedly became scheduled');
          const bindings = Array.isArray(settings?.result?.bindings) ? settings.result.bindings : [];
          const enabled = bindings.find((x) => x?.name === 'WHATSAPP_DRAIN_ENABLED');
          if (!enabled || enabled.text !== 'false') throw new Error('Drain enable flag is not false after secret provisioning');
          console.log('DRAIN_SECRET_NAMES=["SUPABASE_SECRET_KEY"]');
          console.log('DRAIN_SCHEDULES=[]');
          NODE

      - name: Safe production summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RC31 production WhatsApp drain Supabase secret provisioning'
            echo
            echo "- Exact release SHA: \`$RELEASE_SHA\`"
            echo '- Existing modern production Supabase backend key copied directly; no key created or rotated'
            echo '- Secret value was never printed, committed or uploaded'
            echo '- Worker remains disabled and unscheduled'
            echo '- Meta calls/messages/database writes: none'
            echo '- Retained staging: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
