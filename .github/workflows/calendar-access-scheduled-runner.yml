name: Calendar Access scheduled runner

# The production half of the scheduled projection. It is dispatch-only, and it
# is dispatched by `calendar-access-scheduler.yml`, which runs on the default
# branch where cron fires but holds no production credential.
#
# Why the split: scheduled runs always carry the default branch ref, and the
# `crm-production` environment admits only the `release/private-crm-rc*`
# namespace. Rather than widen that environment to `main`, the scheduler moves
# an isolated ref in the already-admitted namespace to the canonical head and
# dispatches this workflow on it. Everything with access to a production
# secret therefore still executes with `github.ref` inside that namespace, and
# `main` never gains access to one.
#
# This file must exist on the default branch to be dispatchable at all, and the
# copy that actually executes is the one at the dispatched ref. The two are
# required to be byte-identical below, so the code being run is always the code
# published on the default branch.

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact canonical CRM SHA this run is approved for'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: calendar-access-scheduled-runner
  cancel-in-progress: false

jobs:
  sync:
    name: Project the CRM capability graph onto Calendar Access
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      CANONICAL_BRANCH: agent/platform-telegram-self-service
      RELEASE_REF: release/private-crm-rc-inventory-calendar-access-scheduled
      APPROVED_SHA: ${{ inputs.approved_sha }}
      RUNNER_WORKFLOW: .github/workflows/calendar-access-scheduled-runner.yml
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.CRM_PRODUCTION_SUPABASE_SECRET_KEY }}
      CALENDAR_HOST: calendar.vishartattoo.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Everything the dispatcher asserted is re-derived here, from this job's
      # own view, immediately before anything is read or written.
      - name: Verify release ref identity, canonical source and exact-head CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$RELEASE_REF" ] || {
            echo "This runner may only execute on $RELEASE_REF, not $GITHUB_REF_NAME." >&2
            exit 1
          }
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$SUPABASE_SECRET_KEY" ]
          [ "$SUPABASE_URL" = 'https://vfjexhfdbrjmuxfdvbdx.supabase.co' ]

          # The dispatched ref must be exactly the canonical head it claims to
          # be, and canonical must still be there.
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]
          [ -z "$(git status --short)" ]
          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$APPROVED_SHA" ] || {
            echo 'Canonical moved between dispatch and execution.' >&2
            exit 1
          }
          release_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk 'NR == 1 {print $1}')"
          [ "$release_sha" = "$APPROVED_SHA" ] || {
            echo 'The release ref no longer points at the approved canonical head.' >&2
            exit 1
          }

          # The executing definition is the one at this ref; require it to match
          # the definition published on the default branch, so a dispatchable
          # workflow can never diverge from what review saw.
          git fetch --depth=1 origin main
          git show "FETCH_HEAD:$RUNNER_WORKFLOW" > "$RUNNER_TEMP/runner-on-default.yml"
          cmp -s "$RUNNER_TEMP/runner-on-default.yml" "$RUNNER_WORKFLOW" || {
            echo 'This runner differs from the definition on the default branch.' >&2
            exit 1
          }

          required_workflows=(
            'Static Validation'
            'CRM and booking validation'
            'Gmail production validation'
            'Booking host validation'
            'WhatsApp production onboarding validation'
          )
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APPROVED_SHA&per_page=100" \
            --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/runs.json"
          for workflow in "${required_workflows[@]}"; do
            jq -e --arg name "$workflow" --arg sha "$APPROVED_SHA" '
              any(.[]; .name == $name and .head_sha == $sha
                       and .status == "completed" and .conclusion == "success")
            ' "$RUNNER_TEMP/runs.json" >/dev/null || {
              echo "Required exact-head workflow is not green: $workflow" >&2
              exit 1
            }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate fail-closed sync implementation
        run: |
          set -euo pipefail
          node --check scripts/calendar-access-sync.mjs
          node scripts/test-calendar-access-sync.mjs

      - name: Read the boundary before mutation
        run: |
          set -euo pipefail
          node scripts/calendar-access-sync.mjs inspect --output "$RUNNER_TEMP/calendar-access-before.json"

      - name: Project the capability graph onto Calendar Access
        run: |
          set -euo pipefail
          node scripts/calendar-access-sync.mjs sync --output "$RUNNER_TEMP/calendar-access-sync.json"

      - name: Independent readback
        run: |
          set -euo pipefail
          node scripts/calendar-access-sync.mjs inspect --output "$RUNNER_TEMP/calendar-access-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/calendar-access-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/calendar-access-after.json', 'utf8'));
          if (after.source_kind !== 'supabase_operator_directory') throw new Error('unexpected Access source of truth');
          if (after.target_host !== 'calendar.vishartattoo.com') throw new Error('unexpected Calendar Access host');
          if (after.in_sync !== true) throw new Error('Calendar Access policy does not match the CRM capability graph');
          if (after.source_policy_digest !== after.target_policy_digest) throw new Error('Calendar Access fingerprint mismatch');
          if (!Number.isInteger(after.target_email_rule_count) || after.target_email_rule_count < 1) throw new Error('Calendar policy has no named emails');
          if (before.source_policy_digest !== after.source_policy_digest) throw new Error('the operator directory changed during the run');
          NODE

      - name: Verify Calendar hostname remains Access-gated
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://$CALENDAR_HOST/health" || true)"
            case "$status" in
              302|303|307|401|403) exit 0 ;;
              200) echo 'Calendar hostname became public after the projection.' >&2; exit 1 ;;
            esac
            sleep 6
          done
          echo 'Calendar Access boundary did not converge to a gated response.' >&2
          exit 1

      - name: Upload sanitized Access evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-access-scheduled-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/calendar-access-before.json
            ${{ runner.temp }}/calendar-access-sync.json
            ${{ runner.temp }}/calendar-access-after.json
          if-no-files-found: error
          retention-days: 7

      - name: Boundary summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Calendar Access scheduled projection'
            echo "- Approved canonical SHA: \`$APPROVED_SHA\`"
            echo "- Executed on: \`$GITHUB_REF_NAME\`"
            echo '- Source of truth: Supabase manage-integrations capability graph'
            echo '- Mutation scope: the Calendar Access allow policy only'
            echo '- Email values and credentials: not printed or uploaded'
          } >> "$GITHUB_STEP_SUMMARY"
