name: Dispatch RC76 Instagram auth Worker rollout

on:
  push:
    branches:
      - ops/rc76-instagram-oauth-dispatch
    paths:
      - .github/workflows/dispatch-rc76-instagram-oauth.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: rc76-instagram-auth-worker-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BRANCH: release/private-crm-rc76-instagram-communications
      RELEASE_SHA: 0b9b71a0a995611308e72ea3251249362699adec
    steps:
      - name: Checkout ops branch
        uses: actions/checkout@v4

      - name: Verify exact release branch and dispatch once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test "$remote" = "$RELEASE_SHA"

          runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-private-production-instagram.yml \
            --branch "$RELEASE_BRANCH" \
            --event workflow_dispatch \
            --limit 30 \
            --json databaseId,url,status,conclusion,headSha,createdAt)"

          exists="$(RUNS="$runs" node <<'NODE'
          const runs = JSON.parse(process.env.RUNS || '[]');
          console.log(runs.some((r) => r.headSha === process.env.RELEASE_SHA) ? 'true' : 'false');
          NODE
          )"

          if [ "$exists" != 'true' ]; then
            gh workflow run deploy-private-production-instagram.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$RELEASE_BRANCH" \
              -f approved_sha="$RELEASE_SHA" \
              -f deploy=true \
              -f approval_phrase=EXPOSE_PRIVATE_CRM_INSTAGRAM \
              -f enable_oauth=true \
              -f enable_drain=false \
              -f enable_enrichment=false
            sleep 5
          fi

          runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-private-production-instagram.yml \
            --branch "$RELEASE_BRANCH" \
            --event workflow_dispatch \
            --limit 30 \
            --json databaseId,url,status,conclusion,headSha,createdAt)"

          RUNS="$runs" node <<'NODE' > "$RUNNER_TEMP/result.txt"
          const runs = JSON.parse(process.env.RUNS || '[]');
          const matches = runs.filter((r) => r.headSha === process.env.RELEASE_SHA)
            .sort((a,b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
          const run = matches[0];
          if (!run) {
            console.log(`found=false\nrelease_sha=${process.env.RELEASE_SHA}`);
            process.exit(2);
          }
          console.log('found=true');
          console.log(`run_id=${run.databaseId}`);
          console.log(`url=${run.url}`);
          console.log(`status=${run.status}`);
          console.log(`conclusion=${run.conclusion || 'n/a'}`);
          console.log(`created_at=${run.createdAt}`);
          console.log(`release_sha=${process.env.RELEASE_SHA}`);
          console.log('oauth=true');
          console.log('drain=false');
          console.log('enrichment=false');
          NODE

          mkdir -p .operator-status
          cp "$RUNNER_TEMP/result.txt" .operator-status/instagram-auth-worker.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .operator-status/instagram-auth-worker.txt
          git commit -m 'Record RC76 Instagram auth Worker rollout status'
          git push
