name: Locate RC76 Instagram auth database rollout

on:
  push:
    branches:
      - ops/rc76-instagram-oauth-dispatch
    paths:
      - .github/workflows/dispatch-rc76-instagram-oauth.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BRANCH: release/private-crm-rc76-instagram-communications
      RELEASE_SHA: 0b9b71a0a995611308e72ea3251249362699adec
    steps:
      - name: Locate protected database rollout without dispatching
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-private-production-database.yml \
            --branch "$RELEASE_BRANCH" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,url,status,conclusion,headSha,createdAt)"
          RUN_JSON="$run_json" node <<'NODE' > "$RUNNER_TEMP/result.txt"
          const runs = JSON.parse(process.env.RUN_JSON || '[]');
          const run = runs.find((r) => r.headSha === process.env.RELEASE_SHA);
          if (!run) {
            console.log('none');
            process.exit(0);
          }
          console.log(run.databaseId);
          console.log(run.url);
          console.log(run.status);
          console.log(run.conclusion || 'n/a');
          console.log(run.createdAt);
          NODE
          mapfile -t result < "$RUNNER_TEMP/result.txt"
          if [ "${result[0]}" = none ]; then
            body=$(printf 'RC76 Instagram auth DB locator: no production database run found for release_sha=%s\n' "$RELEASE_SHA")
          else
            body=$(printf 'RC76 Instagram auth DB locator:\nrun=%s\nstatus=%s conclusion=%s created=%s\nrelease_sha=%s\n' "${result[1]}" "${result[2]}" "${result[3]}" "${result[4]}" "$RELEASE_SHA")
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/379/comments" -f body="$body" >/dev/null
