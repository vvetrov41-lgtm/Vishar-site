name: Locate RC76 Instagram auth database rollout

on:
  push:
    branches:
      - ops/rc76-instagram-oauth-dispatch
    paths:
      - .github/workflows/dispatch-rc76-instagram-oauth.yml

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BRANCH: release/private-crm-rc76-instagram-communications
      RELEASE_SHA: 0b9b71a0a995611308e72ea3251249362699adec
    steps:
      - name: Checkout ops branch
        uses: actions/checkout@v4

      - name: Locate protected database rollout without dispatching
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-private-production-database.yml \
            --branch "$RELEASE_BRANCH" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,url,status,conclusion,headSha,createdAt)"
          RUN_JSON="$run_json" node <<'NODE' > "$RUNNER_TEMP/result.txt"
          const runs = JSON.parse(process.env.RUN_JSON || '[]');
          const run = runs.find((r) => r.headSha === process.env.RELEASE_SHA);
          if (!run) {
            console.log(`found=false\nrelease_sha=${process.env.RELEASE_SHA}`);
            process.exit(0);
          }
          console.log('found=true');
          console.log(`run_id=${run.databaseId}`);
          console.log(`url=${run.url}`);
          console.log(`status=${run.status}`);
          console.log(`conclusion=${run.conclusion || 'n/a'}`);
          console.log(`created_at=${run.createdAt}`);
          console.log(`release_sha=${process.env.RELEASE_SHA}`);
          NODE
          mkdir -p .operator-status
          cp "$RUNNER_TEMP/result.txt" .operator-status/instagram-auth-db.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .operator-status/instagram-auth-db.txt
          git commit -m 'Record RC76 Instagram auth DB rollout status'
          git push
