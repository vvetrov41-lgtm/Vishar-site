name: Dispatch RC76 Instagram OAuth activation

on:
  push:
    branches:
      - ops/rc76-instagram-oauth-dispatch
    paths:
      - .github/workflows/dispatch-rc76-instagram-oauth.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch standard protected Instagram production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-private-production-instagram.yml \
            --repo "$REPO" \
            --ref release/private-crm-rc76-instagram-communications \
            -f approved_sha=bf5159e5a07e4cca285112611d1faf8935b48f24 \
            -f deploy=true \
            -f approval_phrase=EXPOSE_PRIVATE_CRM_INSTAGRAM \
            -f enable_oauth=true \
            -f enable_drain=false \
            -f enable_enrichment=false
