name: Temporary Gmail Calendar operator-boundary patch

on:
  push:
    branches:
      - agent/gmail-calendar-operator-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANONICAL_BRANCH: agent/platform-telegram-self-service
      BASE_SHA: d94bc119cc6c48d7f7421ab657a70bf47a7378cc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gmail-calendar-operator-boundary
          fetch-depth: 0

      - name: Verify bounded source
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]
          canonical_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk 'NR == 1 {print $1}')"
          [ "$canonical_sha" = "$BASE_SHA" ]
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          [ -z "$(git status --short)" ]

      - name: Apply bounded patch
        run: python scripts/ops-temp-gmail-calendar-boundary-patch.py

      - name: Validate bounded patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-private-production-release-orchestrator.mjs
          node scripts/test-gmail-rollout-phases.mjs
          git diff --check

      - name: Commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/private-production-release.yml
            .github/workflows/private-production-release-observer.yml
            .github/workflows/gmail-production-rollout.yml
            scripts/test-private-production-release-orchestrator.mjs
            scripts/test-gmail-rollout-phases.mjs
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Bounded patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Harden Gmail and Calendar operator release boundaries'
          git push origin HEAD:agent/gmail-calendar-operator-boundary
