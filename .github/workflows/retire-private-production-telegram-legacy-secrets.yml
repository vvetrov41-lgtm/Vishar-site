name: Retire private production Telegram legacy Artist secrets

on:
  push:
    branches:
      - 'release/private-crm-retire-telegram-legacy-secrets*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-production-telegram-legacy-secret-retirement
  cancel-in-progress: false

env:
  REQUIRED_RETIREMENT_FOUNDATION_SHA: 8a251eeae5c6000d2f7850cfacf643c6c4cea430
  WORKER_NAME: vishar-telegram-drain-production

jobs:
  validate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact retirement candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable retirement lineage
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == release/private-crm-retire-telegram-legacy-secrets* ]]
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$REQUIRED_RETIREMENT_FOUNDATION_SHA" "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          [ -n "$remote_sha" ]
          [ "$remote_sha" = "$GITHUB_SHA" ]

      - name: Validate retirement production contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-telegram-production-preflight.mjs
          node scripts/test-telegram-production-config.mjs
          node scripts/test-private-production-release-orchestrator.mjs
          if git grep -n 'ARTIST_TELEGRAM_' -- \
            scripts/preflight-telegram-production.mjs \
            scripts/generate-telegram-production-deploy-config.mjs \
            .github/workflows/private-production-release.yml \
            .github/workflows/deploy-private-production-telegram.yml; then
            echo 'Production contract still depends on an Artist-specific Telegram secret' >&2
            exit 1
          fi

  retire:
    if: github.actor == github.repository_owner
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.CRM_PRODUCTION_SUPABASE_PROJECT_REF }}
      PROJECT_URL: ${{ vars.CRM_PRODUCTION_SUPABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact retirement candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate exact production target and immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == release/private-crm-retire-telegram-legacy-secrets* ]]
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git merge-base --is-ancestor "$REQUIRED_RETIREMENT_FOUNDATION_SHA" "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          [ "$remote_sha" = "$GITHUB_SHA" ]
          [ "$PROJECT_REF" = 'vfjexhfdbrjmuxfdvbdx' ]
          [ "$PROJECT_URL" = 'https://vfjexhfdbrjmuxfdvbdx.supabase.co' ]
          [ -n "$SUPABASE_ACCESS_TOKEN" ]
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Recheck post-cutover DB delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          with probes as (
            select
              count(*) = 2 as probes_present,
              bool_and(o.status = 'succeeded'::public.outbox_status) as probes_succeeded,
              bool_and(o.attempt_count = 1) as probes_single_attempt,
              bool_and(o.last_error_code is null) as probes_error_free
            from public.integration_outbox o
            where o.dedupe_key in (
              'telegram:acceptance:registry_post_cutover_v2:enq-2026-0002:20260824',
              'telegram:acceptance:registry_post_cutover_v2:enq-2026-0003:20260824'
            )
          ), destinations as (
            select
              count(*) = 2 as destinations_present,
              bool_and(d.last_success_at >= timestamptz '2026-08-24 13:15:00+00') as destinations_post_cutover,
              bool_and(d.last_error_at is null) as destinations_error_free
            from crm_private.telegram_destinations d
            join public.artists a on a.id = d.artist_id
            where d.destination_kind = 'artist'
              and d.is_active
              and a.slug in ('vladimir', 'kristina')
          )
          select p.probes_present, p.probes_succeeded, p.probes_single_attempt,
                 p.probes_error_free, d.destinations_present,
                 d.destinations_post_cutover, d.destinations_error_free
          from probes p cross join destinations d;
          SQL
          )
          QUERY="$query" node <<'NODE' > "$RUNNER_TEMP/supabase-query.json"
          const body = { query: process.env.QUERY, read_only: true };
          process.stdout.write(JSON.stringify(body));
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/supabase-query.json" \
            > "$RUNNER_TEMP/supabase-evidence.json"
          node - "$RUNNER_TEMP/supabase-evidence.json" <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(raw) ? raw : Array.isArray(raw?.result) ? raw.result : [];
          const row = rows[0];
          const required = [
            'probes_present', 'probes_succeeded', 'probes_single_attempt',
            'probes_error_free', 'destinations_present',
            'destinations_post_cutover', 'destinations_error_free',
          ];
          if (!row || required.some((key) => row[key] !== true)) {
            throw new Error('Post-cutover Telegram registry evidence is incomplete; refusing secret retirement');
          }
          console.log('Post-cutover registry delivery evidence verified for both legacy Artist scopes.');
          NODE

      - name: Inspect exact live secret inventory
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list \
            --config wrangler.telegram-drain.production.toml \
            --name "$WORKER_NAME" \
            --format json > "$RUNNER_TEMP/secrets-before.json"
          BEFORE="$RUNNER_TEMP/secrets-before.json" node <<'NODE'
          const fs = require('fs');
          const values = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
          const actual = values.map((entry) => entry?.name).filter(Boolean).sort();
          const shared = ['SUPABASE_SECRET_KEY', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_WEBHOOK_SECRET'].sort();
          const legacy = [
            'ARTIST_TELEGRAM_KRISTINA_HPRODUCTION',
            'ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION',
          ];
          const transitional = [...shared, ...legacy].sort();
          if (JSON.stringify(actual) === JSON.stringify(shared)) {
            console.log('RETIREMENT_ALREADY_APPLIED=true');
            process.exit(0);
          }
          if (JSON.stringify(actual) !== JSON.stringify(transitional)) {
            throw new Error(`Unexpected pre-retirement secret inventory: ${actual.join(', ')}`);
          }
          console.log('RETIREMENT_ALREADY_APPLIED=false');
          NODE

      - name: Generate registry-only production config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-telegram-production-deploy-config.mjs \
            "$RUNNER_TEMP/wrangler.telegram.retirement.toml" --enable-linking

      - name: Fail closed on all live drift except the two secrets being retired
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/preflight-telegram-production.mjs \
            "$RUNNER_TEMP/wrangler.telegram.retirement.toml" \
            --allow-linking --report-only \
            > "$RUNNER_TEMP/preflight-before.txt" 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 0 ]
          BEFORE="$RUNNER_TEMP/secrets-before.json" REPORT="$RUNNER_TEMP/preflight-before.txt" node <<'NODE'
          const fs = require('fs');
          const secrets = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'))
            .map((entry) => entry?.name).filter(Boolean).sort();
          const shared = ['SUPABASE_SECRET_KEY', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_WEBHOOK_SECRET'].sort();
          const report = fs.readFileSync(process.env.REPORT, 'utf8');
          const blockers = report.split(/\r?\n/).filter((line) => line.startsWith('NOT READY:'));
          if (JSON.stringify(secrets) === JSON.stringify(shared)) {
            if (blockers.length !== 0) throw new Error(`Unexpected live preflight blocker after prior retirement: ${blockers.join(' | ')}`);
          } else {
            if (blockers.length !== 1
                || !blockers[0].includes('unexpected production secret names provisioned')
                || !blockers[0].includes('ARTIST_TELEGRAM_KRISTINA_HPRODUCTION')
                || !blockers[0].includes('ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION')) {
              throw new Error(`Unexpected live drift before retirement: ${blockers.join(' | ')}`);
            }
          }
          console.log('All non-retirement Cloudflare preflight boundaries are clean.');
          NODE

      - name: Retire both legacy Artist secrets in one Worker version
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$RUNNER_TEMP/secrets-before.json" node <<'NODE' > "$RUNNER_TEMP/retire-secrets.json"
          const fs = require('fs');
          const values = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
          const names = values.map((entry) => entry?.name).filter(Boolean);
          const legacy = [
            'ARTIST_TELEGRAM_KRISTINA_HPRODUCTION',
            'ARTIST_TELEGRAM_VLADIMIR_HPRODUCTION',
          ];
          if (!legacy.every((name) => names.includes(name))) {
            process.stdout.write('{}');
          } else {
            process.stdout.write(JSON.stringify(Object.fromEntries(legacy.map((name) => [name, null]))));
          }
          NODE
          if [ "$(cat "$RUNNER_TEMP/retire-secrets.json")" != '{}' ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/retire-secrets.json" \
              --config wrangler.telegram-drain.production.toml \
              --name "$WORKER_NAME"
          else
            echo 'Legacy Artist secrets already absent; deletion is idempotently skipped.'
          fi
          rm -f "$RUNNER_TEMP/retire-secrets.json"

      - name: Require exact final three-secret inventory
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list \
            --config wrangler.telegram-drain.production.toml \
            --name "$WORKER_NAME" \
            --format json > "$RUNNER_TEMP/secrets-after.json"
          AFTER="$RUNNER_TEMP/secrets-after.json" node <<'NODE'
          const fs = require('fs');
          const values = JSON.parse(fs.readFileSync(process.env.AFTER, 'utf8'));
          const actual = values.map((entry) => entry?.name).filter(Boolean).sort();
          const expected = ['SUPABASE_SECRET_KEY', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_WEBHOOK_SECRET'].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Post-retirement secret inventory mismatch: ${actual.join(', ')}`);
          }
          console.log('Exact final Telegram secret inventory verified: 3 names.');
          NODE

      - name: Full post-retirement Cloudflare preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preflight-telegram-production.mjs \
            "$RUNNER_TEMP/wrangler.telegram.retirement.toml" --allow-linking

      - name: Verify live Telegram HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          origin='https://telegram.vishartattoo.com'
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "$origin/")" = '404' ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "$origin/anything")" = '404' ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "$origin/webhook")" = '405' ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$origin/webhook")" = '401' ]

      - name: Queue bounded post-retirement Artist probes
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_SHA:0:12}"
          QUERY_SUFFIX="$suffix" node <<'NODE' > "$RUNNER_TEMP/probe-query.json"
          const suffix = process.env.QUERY_SUFFIX;
          const query = `
            select crm_private.enqueue_outbox(
              'telegram_notification'::public.outbox_kind,
              'telegram:acceptance:legacy_secret_retirement:enq-2026-0002:${suffix}',
              '{}'::jsonb,
              null,
              '67c152db-3970-472b-8ca0-a1e7a97e8f3f'::uuid,
              null, null, null
            ) as vladimir_probe_id,
            crm_private.enqueue_outbox(
              'telegram_notification'::public.outbox_kind,
              'telegram:acceptance:legacy_secret_retirement:enq-2026-0003:${suffix}',
              '{}'::jsonb,
              null,
              'cc465e77-a927-4fbe-b59e-6d9859eed189'::uuid,
              null, null, null
            ) as kristina_probe_id;
          `;
          process.stdout.write(JSON.stringify({ query, read_only: false }));
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/probe-query.json" \
            > "$RUNNER_TEMP/probe-enqueue-result.json"
          echo 'Post-retirement probes queued through crm_private.enqueue_outbox.'

      - name: Wait for both post-retirement deliveries
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_SHA:0:12}"
          for attempt in $(seq 1 32); do
            QUERY_SUFFIX="$suffix" node <<'NODE' > "$RUNNER_TEMP/probe-status-query.json"
            const suffix = process.env.QUERY_SUFFIX;
            const query = `
              select a.slug as artist_slug, o.status::text as status,
                     o.attempt_count, o.last_error_code, o.updated_at
              from public.integration_outbox o
              join public.artists a on a.id = o.artist_id
              where o.dedupe_key in (
                'telegram:acceptance:legacy_secret_retirement:enq-2026-0002:${suffix}',
                'telegram:acceptance:legacy_secret_retirement:enq-2026-0003:${suffix}'
              )
              order by a.slug;
            `;
            process.stdout.write(JSON.stringify({ query, read_only: true }));
            NODE
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/probe-status-query.json" \
              > "$RUNNER_TEMP/probe-status.json"
            if STATUS_FILE="$RUNNER_TEMP/probe-status.json" node <<'NODE'
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync(process.env.STATUS_FILE, 'utf8'));
            const rows = Array.isArray(raw) ? raw : Array.isArray(raw?.result) ? raw.result : [];
            if (rows.length !== 2) process.exit(1);
            if (!rows.every((row) => row.status === 'succeeded'
              && Number(row.attempt_count) === 1
              && row.last_error_code == null)) process.exit(1);
            const slugs = rows.map((row) => row.artist_slug).sort();
            if (JSON.stringify(slugs) !== JSON.stringify(['kristina', 'vladimir'])) process.exit(1);
            console.log('Both post-retirement registry-only deliveries succeeded in one attempt.');
            NODE
            then
              exit 0
            fi
            sleep 15
          done
          echo 'Timed out waiting for post-retirement Telegram acceptance' >&2
          cat "$RUNNER_TEMP/probe-status.json" >&2
          exit 1

      - name: Final destination evidence readback
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select a.slug as artist_slug, d.last_success_at, d.last_error_at
          from crm_private.telegram_destinations d
          join public.artists a on a.id = d.artist_id
          where d.destination_kind = 'artist'
            and d.is_active
            and a.slug in ('vladimir', 'kristina')
          order by a.slug;
          SQL
          )
          QUERY="$query" node <<'NODE' > "$RUNNER_TEMP/final-query.json"
          process.stdout.write(JSON.stringify({ query: process.env.QUERY, read_only: true }));
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/final-query.json" \
            > "$RUNNER_TEMP/final-evidence.json"
          FINAL="$RUNNER_TEMP/final-evidence.json" node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.env.FINAL, 'utf8'));
          const rows = Array.isArray(raw) ? raw : Array.isArray(raw?.result) ? raw.result : [];
          if (rows.length !== 2 || rows.some((row) => row.last_success_at == null || row.last_error_at != null)) {
            throw new Error('Final Artist destination evidence is incomplete');
          }
          console.log('Final Artist destination evidence is healthy after legacy-secret retirement.');
          NODE
