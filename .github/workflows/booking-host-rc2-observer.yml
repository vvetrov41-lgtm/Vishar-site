name: Booking host RC2 observer

on:
  pull_request:
    paths:
      - '.github/workflows/booking-host-rc2-observer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 970fb0a2c7719b2613e3a36404115feb7ca03f7b
      RELEASE_BRANCH: release/booking-host-rc2-appointment-actions
    steps:
      - name: Inspect booking-host release history and environment policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          runs_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production-booking-host.yml/runs"
          curl --fail --silent --show-error "${headers[@]}" \
            --get --data-urlencode 'event=push' --data-urlencode 'per_page=20' \
            "$runs_api" > "$RUNNER_TEMP/runs.json"

          echo 'recent_booking_host_runs:'
          jq -r '.workflow_runs[] | [.id, .head_branch, .head_sha, .status, (.conclusion // "pending"), .created_at] | @tsv' \
            "$RUNNER_TEMP/runs.json"

          exact="$(jq -c --arg sha "$EXPECTED_SHA" --arg branch "$RELEASE_BRANCH" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)][0] // empty' \
            "$RUNNER_TEMP/runs.json")"
          test -n "$exact"
          echo "exact_rc2_run_id=$(jq -r '.id' <<<"$exact")"
          echo "exact_rc2_status=$(jq -r '.status' <<<"$exact")"
          echo "exact_rc2_conclusion=$(jq -r '.conclusion // "pending"' <<<"$exact")"

          env_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/crm-production"
          env_status="$(curl --silent --show-error "${headers[@]}" \
            --output "$RUNNER_TEMP/environment.json" --write-out '%{http_code}' "$env_api")"
          echo "environment_read_status=${env_status}"
          if [ "$env_status" = '200' ]; then
            jq '{name, protection_rules, deployment_branch_policy}' "$RUNNER_TEMP/environment.json"
            policy_api="${env_api}/deployment-branch-policies?per_page=100"
            policy_status="$(curl --silent --show-error "${headers[@]}" \
              --output "$RUNNER_TEMP/policies.json" --write-out '%{http_code}' "$policy_api")"
            echo "deployment_branch_policies_status=${policy_status}"
            if [ "$policy_status" = '200' ]; then
              jq -r '.branch_policies[]? | [.id, .name, .type] | @tsv' "$RUNNER_TEMP/policies.json"
            fi
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Booking host RC2 diagnostic observer'
            echo "- Expected exact SHA: \`$EXPECTED_SHA\`"
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo '- Production mutation: none'
            echo '- Production environment/secrets consumed: none'
          } >> "$GITHUB_STEP_SUMMARY"
