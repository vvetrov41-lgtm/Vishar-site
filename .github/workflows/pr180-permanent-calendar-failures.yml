name: PR180 permanent Calendar failure semantics

on:
  push:
    branches:
      - agent/google-calendar-oauth-connector

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-calendar-oauth-connector
          fetch-depth: 0
      - run: python scripts/patch-pr180-permanent-calendar-failures.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/0029_calendar_outbox_drain.sql supabase/tests/180_calendar_outbox_drain.sql .github/workflows/pr180-permanent-calendar-failures.yml scripts/patch-pr180-permanent-calendar-failures.py
          git commit -m "Separate permanent Calendar failures from retries"
          git push origin HEAD:agent/google-calendar-oauth-connector
