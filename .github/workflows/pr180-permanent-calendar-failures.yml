name: PR180 permanent Calendar failure semantics

on:
  push:
    branches:
      - agent/google-calendar-oauth-connector

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'vvetrov41-lgtm/Vishar-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-calendar-oauth-connector
          fetch-depth: 0

      - name: Separate permanent and transient Calendar failures
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/0029_calendar_outbox_drain.sql')
          source = migration.read_text()
          old_status = """    v_status := case
      when v_attempt_count >= v_job.max_attempts then 'dead'::public.outbox_status
      else 'failed'::public.outbox_status
    end;"""
          new_status = """    v_status := case
      when p_error_code in (
        'artist_route_unconfigured',
        'calendar_encryption_key_invalid',
        'calendar_event_missing',
        'calendar_oauth_expired',
        'calendar_provider_rejected',
        'calendar_scope_missing',
        'calendar_token_invalid',
        'google_account_mismatch',
        'provider_route_invalid'
      ) then 'dead'::public.outbox_status
      when v_attempt_count >= v_job.max_attempts then 'dead'::public.outbox_status
      else 'failed'::public.outbox_status
    end;"""
          if source.count(old_status) != 1:
              raise SystemExit(f'expected one status classification anchor, found {source.count(old_status)}')
          source = source.replace(old_status, new_status, 1)

          old_backoff = """      next_attempt_at = case
        when p_succeeded then o.next_attempt_at
        else now() + make_interval("""
          new_backoff = """      next_attempt_at = case
        when p_succeeded or v_status = 'dead' then o.next_attempt_at
        else now() + make_interval("""
          if source.count(old_backoff) != 1:
              raise SystemExit(f'expected one retry scheduling anchor, found {source.count(old_backoff)}')
          migration.write_text(source.replace(old_backoff, new_backoff, 1))

          tests = Path('supabase/tests/180_calendar_outbox_drain.sql')
          test_source = tests.read_text()
          finish_anchor = """select * from finish(true);
rollback;
"""
          permanent_tests = """select set_config(
  'request.jwt.claims',
  '{\"sub\":\"d8111111-1111-4111-8111-111111111111\",\"role\":\"authenticated\"}',
  true
);
create temporary table permanent_appointment as
select (public.schedule_appointment(
  'a1111111-1111-4111-8111-111111111111',
  'd8311111-1111-4111-8111-111111111111',
  'tattoo_session',
  '2026-11-20T09:00:00Z',
  '2026-11-20T16:00:00Z',
  'confirmed',
  'd8411111-1111-4111-8111-111111111111',
  'd8611111-1111-4111-8111-111111111111',
  'Synthetic permanent Calendar failure test'
) ->> 'appointment_id')::uuid as id;

select set_config('request.jwt.claims', '{\"role\":\"service_role\"}', true);
create temporary table permanent_claim as
select * from public.claim_calendar_outbox('calendar-worker-permanent', 10, 120);

select is((select count(*)::int from permanent_claim), 1,
          'the permanent-failure fixture leases one current Calendar job');
select is(
  (public.record_calendar_outbox_result(
    (select outbox_id from permanent_claim),
    'calendar-worker-permanent',
    0,
    false,
    null,
    'calendar_oauth_expired'
  ) ->> 'status'),
  'dead',
  'an expired OAuth grant is dead-lettered after the first proved attempt'
);
select is(
  (select attempt_count from public.integration_outbox
   where id = (select outbox_id from permanent_claim)),
  1,
  'a permanent failure records exactly one provider attempt'
);
select is(
  (select calendar_last_error_code from public.sessions
   where id = (select id from permanent_appointment)),
  'calendar_oauth_expired',
  'the CRM retains the safe reconnect-required error code'
);
select is(
  (select count(*)::int
   from public.claim_calendar_outbox('calendar-worker-no-permanent-retry', 10, 120)),
  0,
  'a permanent Calendar failure is never leased again automatically'
);

select * from finish(true);
rollback;
"""
          if test_source.count(finish_anchor) != 1:
              raise SystemExit(f'expected one pgTAP finish anchor, found {test_source.count(finish_anchor)}')
          tests.write_text(test_source.replace(finish_anchor, permanent_tests, 1))

          Path('.github/workflows/pr180-permanent-calendar-failures.yml').unlink()
          PY

      - name: Commit the isolated retry-semantics correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/0029_calendar_outbox_drain.sql supabase/tests/180_calendar_outbox_drain.sql .github/workflows/pr180-permanent-calendar-failures.yml
          git commit -m "Separate permanent Calendar failures from retries"
          git push origin HEAD:agent/google-calendar-oauth-connector
