name: Monzo reconciliation review production operator

# Release-only operator for PR #322. It owns no production credentials and can
# only dispatch the repository's canonical protected database and private CRM
# workflows, in that order, for this exact release SHA.

on:
  push:
    branches:
      - release/private-crm-rc42-monzo-reconciliation-review

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: write

concurrency:
  group: monzo-reconciliation-review-production-operator
  cancel-in-progress: false

env:
  OPERATOR_PR: '323'
  PRODUCT_PR: '322'
  PRODUCT_HEAD_BRANCH: agent/monzo-reconciliation-crm-review
  PRODUCT_BASE_BRANCH: agent/monzo-reconciliation-production-activation
  PRODUCT_BASE_SHA: b63c7a73a8a8e3e8a1b23eb29661daf4aca5fc9a
  OPERATOR_RELEASE_BRANCH: release/private-crm-rc42-monzo-reconciliation-review
  OPERATOR_BASE_BRANCH: agent/monzo-reconciliation-crm-review
  OPERATOR_WORKFLOW_PATH: .github/workflows/monzo-reconciliation-review-production-operator.yml
  DATABASE_WORKFLOW: deploy-private-production-database.yml
  CRM_WORKFLOW: deploy-private-production-crm.yml

jobs:
  authorize:
    name: Authorize reconciliation review rollout
    if: >-
      github.actor == 'vvetrov41-lgtm' &&
      github.ref == 'refs/heads/release/private-crm-rc42-monzo-reconciliation-review' &&
      contains(github.event.head_commit.message, '[RUN_MONZO_RECONCILIATION_REVIEW_ROLLOUT]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      approved_sha: ${{ github.sha }}
      product_sha: ${{ steps.lineage.outputs.product_sha }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release branch and stacked PR lineage
        id: lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --short)"

          release_tip="$(git ls-remote --heads origin "refs/heads/${OPERATOR_RELEASE_BRANCH}" | awk '{print $1}')"
          test "$release_tip" = "$APPROVED_SHA"

          operator="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${OPERATOR_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref] | @tsv')"
          IFS=$'\t' read -r op_state op_draft op_merged op_head_ref op_head_sha op_base_ref <<< "$operator"
          test "$op_state" = open
          test "$op_draft" = true
          test "$op_merged" = false
          test "$op_head_ref" = "$OPERATOR_RELEASE_BRANCH"
          test "$op_head_sha" = "$APPROVED_SHA"
          test "$op_base_ref" = "$OPERATOR_BASE_BRANCH"

          product="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref, .base.sha] | @tsv')"
          IFS=$'\t' read -r state draft merged head_ref product_sha base_ref base_sha <<< "$product"
          test "$state" = open
          test "$draft" = true
          test "$merged" = false
          test "$head_ref" = "$PRODUCT_HEAD_BRANCH"
          test "$base_ref" = "$PRODUCT_BASE_BRANCH"
          test "$base_sha" = "$PRODUCT_BASE_SHA"

          git cat-file -e "${product_sha}^{commit}"
          git merge-base --is-ancestor "$product_sha" "$APPROVED_SHA"

          mapfile -t release_delta < <(git diff --name-only "$product_sha" "$APPROVED_SHA")
          if [ "${#release_delta[@]}" -ne 1 ] || [ "${release_delta[0]}" != "$OPERATOR_WORKFLOW_PATH" ]; then
            echo 'Release-only delta is not confined to the operator workflow:' >&2
            printf '  %s\n' "${release_delta[@]}" >&2
            exit 1
          fi

          mapfile -t product_delta < <(git diff --name-only "$PRODUCT_BASE_SHA" "$product_sha")
          allowed=(
            admin/src/lib/payment-api.ts
            admin/src/pages/PaymentsPage.tsx
            admin/src/test/payment-reconciliation-api.test.ts
            supabase/migrations/0058_monzo_reconciliation_crm_review.sql
            supabase/tests/050_rls_roles.sql
            supabase/tests/208_monzo_reconciliation_crm_review.sql
          )
          if [ "${#product_delta[@]}" -ne "${#allowed[@]}" ]; then
            echo 'Unexpected product delta size.' >&2
            printf '  %s\n' "${product_delta[@]}" >&2
            exit 1
          fi
          for path in "${product_delta[@]}"; do
            ok=''
            for expected in "${allowed[@]}"; do
              if [ "$path" = "$expected" ]; then ok=yes; break; fi
            done
            if [ "$ok" != yes ]; then
              echo "Unexpected product path: $path" >&2
              exit 1
            fi
          done

          test -f supabase/migrations/0058_monzo_reconciliation_crm_review.sql
          test -f supabase/tests/208_monzo_reconciliation_crm_review.sql
          grep -Fq 'list_monzo_reconciliation_candidates' admin/src/lib/payment-api.ts
          grep -Fq 'Confirm payment' admin/src/pages/PaymentsPage.tsx
          grep -Fq 'Match does not mark anything paid' admin/src/pages/PaymentsPage.tsx

          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "Release ${APPROVED_SHA} is product ${product_sha} plus one operator-only workflow."

      - name: Wait for normal exact-head CI to be green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs_file="$(mktemp)"
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${APPROVED_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "none"), .started_at] | @tsv' \
              > "$runs_file"
            waiting=''; failed=''
            while IFS= read -r required; do
              latest="$(awk -F'\t' -v name="$required" '$1 == name { print $4 "\t" $2 "\t" $3 }' "$runs_file" | sort -r | head -1)"
              if [ -z "$latest" ]; then waiting="${waiting}${required}: absent; "; continue; fi
              status="$(printf '%s' "$latest" | cut -f2)"
              conclusion="$(printf '%s' "$latest" | cut -f3)"
              if [ "$status" != completed ]; then waiting="${waiting}${required}: ${status}; "
              elif [ "$conclusion" != success ]; then failed="${failed}${required}: ${conclusion}; "; fi
            done <<'REQUIRED'
          static-validation
          Private CRM
          Supabase migrations and pgTAP
          Public site and Worker
          REQUIRED
            rm -f "$runs_file"
            if [ -n "$failed" ]; then echo "Normal exact-head CI failed: ${failed}" >&2; exit 1; fi
            if [ -z "$waiting" ]; then echo "All required exact-head CI checks are green for ${APPROVED_SHA}."; exit 0; fi
            echo "Waiting for exact-head CI: ${waiting}"
            sleep 10
          done
          echo 'Timed out waiting for exact-head CI.' >&2
          exit 1

      - name: Authorisation summary
        if: always()
        shell: bash
        env:
          APPROVED_SHA: ${{ github.sha }}
          PRODUCT_SHA: ${{ steps.lineage.outputs.product_sha }}
        run: |
          {
            echo '### Monzo reconciliation review production operator'
            echo
            echo "- Operator PR: #${OPERATOR_PR} (draft, never merge)"
            echo "- Product PR: #${PRODUCT_PR} (verified open/draft/unmerged)"
            echo "- Product SHA: \`${PRODUCT_SHA:-unresolved}\`"
            echo "- Release SHA: \`${APPROVED_SHA}\`"
            echo '- Production effect before canonical crm-production approvals: none'
          } >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Dispatch and verify production database migration
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Dispatch canonical production database workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -n \
            --arg ref "$OPERATOR_RELEASE_BRANCH" \
            --arg sha "$APPROVED_SHA" \
            '{ref:$ref,inputs:{approved_sha:$sha,deploy:"true",approval_phrase:"DEPLOY_PRIVATE_CRM_DATABASE"}}')"
          printf '%s' "$payload" | gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${DATABASE_WORKFLOW}/dispatches" \
            --input -
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "Dispatched ${DATABASE_WORKFLOW} for ${APPROVED_SHA}."

      - name: Wait for canonical database workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9600))
          run_id=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            candidate="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${DATABASE_WORKFLOW}/runs?branch=${OPERATOR_RELEASE_BRANCH}&event=workflow_dispatch&per_page=20" \
              | jq -r --arg sha "$APPROVED_SHA" --arg started "$STARTED_AT" \
                '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | reverse | .[0].id // empty')"
            if [ -n "$candidate" ]; then run_id="$candidate"; break; fi
            sleep 3
          done
          if [ -z "$run_id" ]; then echo 'Could not resolve dispatched database workflow run.' >&2; exit 1; fi
          echo "Database workflow run: ${run_id}"
          while [ "$SECONDS" -lt "$deadline" ]; do
            row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status, (.conclusion // "none")] | @tsv')"
            status="$(printf '%s' "$row" | cut -f1)"
            conclusion="$(printf '%s' "$row" | cut -f2)"
            echo "Database ${run_id}: ${status}/${conclusion}"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 15
          done
          echo 'Timed out waiting for protected database rollout.' >&2
          exit 1

  crm:
    name: Dispatch and verify private CRM production deployment
    needs:
      - authorize
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Dispatch canonical private CRM workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -n \
            --arg ref "$OPERATOR_RELEASE_BRANCH" \
            --arg sha "$APPROVED_SHA" \
            '{ref:$ref,inputs:{approved_sha:$sha,deploy:"true",approval_phrase:"DEPLOY_PRIVATE_CRM_ONLY"}}')"
          printf '%s' "$payload" | gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${CRM_WORKFLOW}/dispatches" \
            --input -
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "Dispatched ${CRM_WORKFLOW} for ${APPROVED_SHA}."

      - name: Wait for canonical private CRM workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9600))
          run_id=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            candidate="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${CRM_WORKFLOW}/runs?branch=${OPERATOR_RELEASE_BRANCH}&event=workflow_dispatch&per_page=20" \
              | jq -r --arg sha "$APPROVED_SHA" --arg started "$STARTED_AT" \
                '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | reverse | .[0].id // empty')"
            if [ -n "$candidate" ]; then run_id="$candidate"; break; fi
            sleep 3
          done
          if [ -z "$run_id" ]; then echo 'Could not resolve dispatched private CRM workflow run.' >&2; exit 1; fi
          echo "Private CRM workflow run: ${run_id}"
          while [ "$SECONDS" -lt "$deadline" ]; do
            row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status, (.conclusion // "none")] | @tsv')"
            status="$(printf '%s' "$row" | cut -f1)"
            conclusion="$(printf '%s' "$row" | cut -f2)"
            echo "CRM ${run_id}: ${status}/${conclusion}"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 15
          done
          echo 'Timed out waiting for protected private CRM rollout.' >&2
          exit 1

      - name: Rollout summary
        if: always()
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          {
            echo '### Monzo reconciliation review rollout'
            echo
            echo "- Exact release SHA: \`${APPROVED_SHA}\`"
            echo '- Database migration: canonical protected production DB workflow, completed before CRM dispatch'
            echo '- Private CRM: canonical protected Pages workflow'
            echo '- Monzo Worker/public site/booking/Calendar/Telegram/WhatsApp/GPT deploy: none'
            echo '- Automatic settlement: absent; Confirm payment remains an explicit human CRM action'
          } >> "$GITHUB_STEP_SUMMARY"
