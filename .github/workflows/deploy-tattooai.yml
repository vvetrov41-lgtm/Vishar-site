name: Deploy tattooai Worker

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY TATTOOAI PRODUCTION to confirm'
        required: true
        type: string
      confirm_backend_ready:
        description: 'Type DATABASE AND STORAGE READY after the production gate is verified'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tattooai-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_production == 'DEPLOY TATTOOAI PRODUCTION' &&
      inputs.confirm_backend_ready == 'DATABASE AND STORAGE READY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci

      - name: Preflight validation
        run: |
          npm run test:worker
          npm run check:worker-bundle

      # Runtime secrets and SUPABASE_URL must already be configured on the
      # existing top-level `tattooai` Worker. --keep-vars preserves dashboard-
      # managed plain variables; secrets are never changed by this workflow.
      # The main-only condition and protected production environment are
      # independent gates.
      - name: Deploy tattooai Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          command: deploy --env="" --strict --keep-vars
