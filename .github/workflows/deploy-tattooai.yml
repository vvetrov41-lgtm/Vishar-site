name: Deploy tattooai Worker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/deploy-tattooai.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout production rollback state
        uses: actions/checkout@v4
        with:
          ref: 1454355d3efb308e5f19c14c873f1760e93d4b3d

      - name: Preflight syntax check
        run: node --check workers/tattooai.js

      - name: Deploy pre-London Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
