name: Deploy tattooai Worker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
    paths:
      - .github/workflows/deploy-tattooai.yml

permissions:
  contents: read

jobs:
  inspect-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect vishar-site deployments
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deployment list --project-name=vishar-site
