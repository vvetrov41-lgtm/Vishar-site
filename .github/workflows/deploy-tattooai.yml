name: Deploy tattooai Worker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
    paths:
      - .github/workflows/deploy-tattooai.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail
          cache_buster="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 5 --retry-delay 2 -H "Cache-Control: no-cache" "https://vishartattoo.com/?verify=${cache_buster}" -o /tmp/home.html
          curl -fsSL --retry 5 --retry-delay 2 -H "Cache-Control: no-cache" "https://vishartattoo.com/booking/?verify=${cache_buster}" -o /tmp/booking.html
          grep -F "London enquiries are now open" /tmp/home.html
          grep -F 'id="tattoo-enquiry-form"' /tmp/booking.html
          grep -F "imageWarning" /tmp/booking.html
