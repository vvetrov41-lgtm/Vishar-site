name: Deploy tattooai Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight syntax check
        run: node --check workers/tattooai.js

      # WARNING: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID must already be configured
      # as Cloudflare Worker secrets/runtime settings. Do not commit secrets to this repo.
      - name: Deploy tattooai Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
