name: Deploy tattooai Worker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/deploy-tattooai.yml

permissions:
  contents: read
  deployments: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy vishar-site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy . --project-name=vishar-site --branch=main --commit-hash=f82db15788af90a6487ee7014f6a6a0b5c941b29 --commit-message="Prepare London booking transition"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
