name: Refresh PR 177 undici lockfile

on:
  push:
    branches:
      - agent/multi-artist-payments-foundation
    paths:
      - package.json
      - .github/workflows/refresh-pr177-undici-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-pr177-undici-lock
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/multi-artist-payments-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify narrow override
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg = require('./package.json');
          if (pkg.overrides?.undici !== '7.29.0') {
            throw new Error('Expected the reviewed undici 7.29.0 override');
          }
          NODE

      - name: Regenerate lockfile without install scripts
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/package-lock.before.json"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify only the undici lock entry changed
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/package-lock.before.json" <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const key = 'node_modules/undici';
          const oldUndici = before.packages?.[key];
          const newUndici = after.packages?.[key];
          delete before.packages[key];
          delete after.packages[key];
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            throw new Error('Lockfile changed outside the undici package entry');
          }
          if (oldUndici?.version !== '7.28.0') {
            throw new Error(`Unexpected previous undici version: ${oldUndici?.version}`);
          }
          if (newUndici?.version !== '7.29.0') {
            throw new Error(`Unexpected regenerated undici version: ${newUndici?.version}`);
          }
          NODE

      - name: Verify clean install and audit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=moderate

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git diff --quiet -- package-lock.json && {
            echo 'Expected package-lock.json to change' >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "Refresh lockfile for undici security override"
          git push origin HEAD:agent/multi-artist-payments-foundation
