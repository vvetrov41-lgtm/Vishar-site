name: Promote verified RC25 WhatsApp secret-only version v2

on:
  push:
    branches:
      - release/private-crm-rc25-whatsapp-webhook-operator
    paths:
      - .github/workflows/promote-rc25-whatsapp-secret-version-v2.yml

permissions:
  contents: read

concurrency:
  group: promote-rc25-whatsapp-secret-version-v2
  cancel-in-progress: false

jobs:
  promote:
    name: Verify runtime bindings and promote secret-only Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crm-production
    env:
      RELEASE_SHA: 2729bf08ed206a0d6d42f6d055ded8489d0858e4
      WORKER_NAME: vishar-whatsapp-webhook-production
      WEBHOOK_URL: https://whatsapp.vishartattoo.com/webhook
      MIN_VERSION_CREATED_AT: 2026-08-16T06:04:20Z
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact RC25 ancestry and operator-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          unexpected="$(git diff --name-only "$RELEASE_SHA"...HEAD | grep -vE '^\.github/workflows/(bootstrap-rc25-whatsapp-webhook|inspect-rc25-whatsapp-production|verify-rc25-whatsapp-public|diagnose-rc25-whatsapp-secret|provision-rc25-whatsapp-supabase-secret|promote-rc25-whatsapp-secret-version|promote-rc25-whatsapp-secret-version-v2)\.yml$' || true)"
          [ -z "$unexpected" ] || { echo 'Unexpected non-operator changes.' >&2; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Inspect and compare runtime-equivalent versions
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          versions_file="$RUNNER_TEMP/versions.json"
          deployments_file="$RUNNER_TEMP/deployments.json"
          active_file="$RUNNER_TEMP/active-version.json"
          latest_file="$RUNNER_TEMP/latest-version.json"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl --fail --silent --show-error -H "$auth" "$api/versions?deployable=true&per_page=10" > "$versions_file"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" > "$deployments_file"

          VERSIONS_FILE="$versions_file" DEPLOYMENTS_FILE="$deployments_file" GITHUB_OUTPUT="$GITHUB_OUTPUT" MIN_VERSION_CREATED_AT="$MIN_VERSION_CREATED_AT" node <<'NODE'
          const fs = require('fs');
          const versionsDoc = JSON.parse(fs.readFileSync(process.env.VERSIONS_FILE, 'utf8'));
          const deploymentsDoc = JSON.parse(fs.readFileSync(process.env.DEPLOYMENTS_FILE, 'utf8'));
          if (!versionsDoc.success || !deploymentsDoc.success) throw new Error('Cloudflare inventory request failed');
          const versions = Array.isArray(versionsDoc.result?.items) ? versionsDoc.result.items : [];
          const deployments = deploymentsDoc.result?.deployments || [];
          const latest = versions[0];
          const activeDeployment = deployments[0];
          if (!latest?.id) throw new Error('No latest deployable Worker version found');
          if (!activeDeployment || !Array.isArray(activeDeployment.versions) || activeDeployment.versions.length !== 1) throw new Error('Expected one active Worker version');
          const active = activeDeployment.versions[0];
          if (Number(active.percentage) !== 100 || !active.version_id) throw new Error('Active Worker deployment is not a single 100 percent version');
          const created = latest.metadata?.created_on;
          if (!created || Date.parse(created) < Date.parse(process.env.MIN_VERSION_CREATED_AT)) throw new Error('Latest Worker version predates approved secret updates');
          if (latest.metadata?.source !== 'wrangler') throw new Error('Latest Worker version source is not wrangler');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `latest_id=${latest.id}\nactive_id=${active.version_id}\n`);
          console.log(`LATEST_VERSION_CREATED_ON=${created}`);
          console.log(`LATEST_EQUALS_ACTIVE=${latest.id === active.version_id}`);
          NODE

          latest_id="$(grep '^latest_id=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          active_id="$(grep '^active_id=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          curl --fail --silent --show-error -H "$auth" "$api/versions/$active_id" > "$active_file"
          curl --fail --silent --show-error -H "$auth" "$api/versions/$latest_id" > "$latest_file"

          ACTIVE_FILE="$active_file" LATEST_FILE="$latest_file" node <<'NODE'
          const fs = require('fs');
          const activeDoc = JSON.parse(fs.readFileSync(process.env.ACTIVE_FILE, 'utf8'));
          const latestDoc = JSON.parse(fs.readFileSync(process.env.LATEST_FILE, 'utf8'));
          if (!activeDoc.success || !latestDoc.success) throw new Error('Cloudflare version detail request failed');
          const active = activeDoc.result;
          const latest = latestDoc.result;
          const activeEtag = active?.resources?.script?.etag;
          const latestEtag = latest?.resources?.script?.etag;
          if (!activeEtag || !latestEtag || activeEtag !== latestEtag) throw new Error('Worker code etag differs; refusing promotion');

          const activeBindings = Array.isArray(active?.resources?.bindings) ? active.resources.bindings : [];
          const latestBindings = Array.isArray(latest?.resources?.bindings) ? latest.resources.bindings : [];
          const expectedTextNames = [
            'SUPABASE_URL',
            'VISHAR_ENVIRONMENT',
            'WHATSAPP_KRISTINA_ARTIST_ID',
            'WHATSAPP_VLADIMIR_ARTIST_ID',
          ].sort();
          const textMap = (list) => {
            const out = new Map();
            for (const b of list) {
              if (b?.type === 'plain_text') out.set(b.name, b.text);
            }
            return out;
          };
          const activeText = textMap(activeBindings);
          const latestText = textMap(latestBindings);
          const activeNames = [...activeText.keys()].sort();
          const latestNames = [...latestText.keys()].sort();
          if (JSON.stringify(activeNames) !== JSON.stringify(expectedTextNames)) throw new Error(`Unexpected active plain_text binding names: ${activeNames.join(',')}`);
          if (JSON.stringify(latestNames) !== JSON.stringify(expectedTextNames)) throw new Error(`Unexpected latest plain_text binding names: ${latestNames.join(',')}`);
          const differing = expectedTextNames.filter((name) => activeText.get(name) !== latestText.get(name));
          if (differing.length) throw new Error(`Runtime text binding values differ for: ${differing.join(',')}`);

          const isSecret = (b) => b?.type === 'secret_text' || b?.type === 'secret_key';
          const secretNames = (list) => list.filter(isSecret).map((b) => b.name).filter(Boolean).sort();
          const latestSecrets = secretNames(latestBindings);
          const required = ['ARTIST_WHATSAPP_VLADIMIR_HPRODUCTION','SUPABASE_SECRET_KEY','WHATSAPP_WEBHOOK_VERIFY_TOKEN'];
          for (const name of required) if (!latestSecrets.includes(name)) throw new Error(`Latest version missing required encrypted binding: ${name}`);
          const allowedSecrets = new Set(['ARTIST_WHATSAPP_VLADIMIR_HPRODUCTION','ARTIST_WHATSAPP_KRISTINA_HPRODUCTION','SUPABASE_SECRET_KEY','WHATSAPP_WEBHOOK_VERIFY_TOKEN']);
          const unexpectedSecrets = latestSecrets.filter((name) => !allowedSecrets.has(name));
          if (unexpectedSecrets.length) throw new Error(`Unexpected secret binding names: ${unexpectedSecrets.join(',')}`);
          for (const forbidden of ['SUPABASE_SERVICE_ROLE_KEY','WHATSAPP_ACCESS_TOKEN','WHATSAPP_PHONE_NUMBER_ID','WHATSAPP_WABA_ID']) {
            if (latestSecrets.includes(forbidden)) throw new Error(`Forbidden legacy/global secret present: ${forbidden}`);
          }

          const allowedNonRuntimeTypes = new Set(['plain_text','secret_text','secret_key','version_metadata']);
          const unexpectedTypes = latestBindings.filter((b) => !allowedNonRuntimeTypes.has(b?.type)).map((b) => `${b?.name || '?'}:${b?.type || '?'}`);
          if (unexpectedTypes.length) throw new Error(`Unexpected binding types in latest version: ${unexpectedTypes.join(',')}`);
          console.log(`ACTIVE_SECRET_NAMES=${JSON.stringify(secretNames(activeBindings))}`);
          console.log(`LATEST_SECRET_NAMES=${JSON.stringify(latestSecrets)}`);
          console.log('CODE_ETAG_MATCH=true');
          console.log('RUNTIME_TEXT_BINDINGS_MATCH=true');
          NODE

      - name: Promote verified latest version to 100 percent
        if: steps.inspect.outputs.latest_id != steps.inspect.outputs.active_id
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions deploy "${{ steps.inspect.outputs.latest_id }}@100%" --name "$WORKER_NAME" --message 'Activate verified RC25 WhatsApp secret-only version' -y >/dev/null

      - name: Verify active deployment and public fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          deployments_file="$RUNNER_TEMP/deployments-after.json"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" > "$deployments_file"
          DEPLOYMENTS_FILE="$deployments_file" EXPECTED_VERSION="${{ steps.inspect.outputs.latest_id }}" node <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync(process.env.DEPLOYMENTS_FILE, 'utf8'));
          const versions = doc.result?.deployments?.[0]?.versions || [];
          if (!doc.success || versions.length !== 1 || versions[0].version_id !== process.env.EXPECTED_VERSION || Number(versions[0].percentage) !== 100) throw new Error('Verified version is not active at 100 percent');
          console.log('LATEST_VERSION_ACTIVE_100_PERCENT=true');
          NODE
          base="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$WEBHOOK_URL" || true)"
          wrong="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$WEBHOOK_URL?hub.mode=subscribe&hub.verify_token=definitely-wrong-operator-token&hub.challenge=123456" || true)"
          [ "$base" = '403' ]
          [ "$wrong" = '403' ]
          echo "WEBHOOK_HTTP_NO_QUERY=$base"
          echo "WEBHOOK_HTTP_WRONG_TOKEN=$wrong"

      - name: Safe summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RC25 WhatsApp secret-only version promotion v2'
            echo
            echo "- Exact RC25 ancestor: \`$RELEASE_SHA\`"
            echo '- Code etag must match the active version exactly'
            echo '- Four runtime plain-text bindings must match by name and value exactly'
            echo '- Cloudflare version_metadata is ignored as non-runtime metadata'
            echo '- Required encrypted bindings are checked by name only; secret values are never printed'
            echo '- No database mutation, Meta API call, message send, billing action or outbox drain activation exists in this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
