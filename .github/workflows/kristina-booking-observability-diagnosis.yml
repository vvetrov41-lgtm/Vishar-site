name: Kristina booking observability diagnosis

on:
  push:
    branches:
      - 'release/private-crm-rc812-inventory-kristina-logs-20260919'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: crm-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query sanitized kisa booking telemetry
        id: telemetry
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          to_ms="$(date +%s%3N)"
          from_ms="$((to_ms - 7 * 24 * 60 * 60 * 1000))"
          cat > "$RUNNER_TEMP/query.json" <<JSON
          {
            "queryId": "kristina-booking-diagnosis",
            "timeframe": {"from": $from_ms, "to": $to_ms},
            "view": "events",
            "limit": 500,
            "parameters": {
              "datasets": [],
              "filterCombination": "and",
              "filters": [
                {"key":"\$metadata.service","operation":"eq","type":"string","value":"kisa"},
                {"key":"\$metadata.trigger","operation":"includes","type":"string","value":"POST /api/booking"},
                {"key":"\$metadata.type","operation":"eq","type":"string","value":"cf-worker-event"}
              ]
            }
          }
          JSON
          status="$(curl -sS -o "$RUNNER_TEMP/query-response.json" -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/query.json")"
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 200 ]; then
            code="$(jq -r '.errors[0].code // "none"' "$RUNNER_TEMP/query-response.json" 2>/dev/null || printf none)"
            message="$(jq -r '.errors[0].message // "query failed"' "$RUNNER_TEMP/query-response.json" 2>/dev/null | tr '\n' ' ' | cut -c1-120)"
            echo "error_code=$code" >> "$GITHUB_OUTPUT"
            echo "safe_error=$message" >> "$GITHUB_OUTPUT"
            echo "Telemetry API HTTP $status, code $code, error $message"
            exit 1
          fi
          RESPONSE="$RUNNER_TEMP/query-response.json" node <<'NODE' | tee "$RUNNER_TEMP/sanitized.txt"
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          const rows = body?.result?.events?.events || [];
          const count = body?.result?.events?.count ?? rows.length;
          const statuses = {}, days = {}, recent = [];
          for (const row of rows) {
            const m = row?.['$metadata'] || {};
            const sc = String(m.statusCode ?? 'unknown');
            statuses[sc] = (statuses[sc] || 0) + 1;
            const ts = Number(row?.timestamp ?? m.startTime ?? m.endTime ?? 0);
            const day = ts ? new Date(ts).toISOString().slice(0, 10) : 'unknown';
            days[day] = (days[day] || 0) + 1;
            recent.push({
              time: ts ? new Date(ts).toISOString() : null,
              status: m.statusCode ?? null,
              outcome: row?.$workers?.outcome ?? null,
              trigger: m.trigger ?? null
            });
          }
          recent.sort((a,b)=>String(b.time).localeCompare(String(a.time)));
          console.log(JSON.stringify({count, returned: rows.length, statuses, days, recent: recent.slice(0, 30)}, null, 2));
          NODE
          total="$(jq -r '.result.events.count // (.result.events.events | length) // 0' "$RUNNER_TEMP/query-response.json")"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized telemetry status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HTTP_STATUS: ${{ steps.telemetry.outputs.http_status }}
          TOTAL: ${{ steps.telemetry.outputs.total }}
        run: |
          set -euo pipefail
          state=success
          [ "$HTTP_STATUS" = 200 ] || state=failure
          desc="telemetry_http=$HTTP_STATUS booking_events=${TOTAL:-unknown}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='kristina-booking-telemetry-diagnosis' \
            -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
