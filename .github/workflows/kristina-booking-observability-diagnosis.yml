name: Kristina booking production diagnosis

on:
  push:
    branches:
      - 'release/private-crm-rc812-inventory-kristina-logs-20260919'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: crm-production
    steps:
      - name: Inspect live page and public booking JavaScript
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          page_status="$(curl -sS -L -o "$RUNNER_TEMP/booking.html" -w '%{http_code}' 'https://www.kristinavishar.com/booking/')"
          js_status="$(curl -sS -L -o "$RUNNER_TEMP/site.js" -w '%{http_code}' 'https://www.kristinavishar.com/site.js')"

          PAGE="$RUNNER_TEMP/booking.html" JS="$RUNNER_TEMP/site.js" node <<'NODE' | tee "$RUNNER_TEMP/browser-contract.json"
          const fs = require('fs');
          const html = fs.readFileSync(process.env.PAGE, 'utf8');
          const js = fs.readFileSync(process.env.JS, 'utf8');
          const controls = [...html.matchAll(/<(?:input|select|textarea)\b[^>]*\bname=["']([^"']+)["']/gi)]
            .map(m => m[1]).filter(Boolean);
          const required = [
            'name','email','preferredReply','travellingFrom','projectType','placement',
            'size','coverUp','timing','idea','consent','references'
          ];
          const unique = [...new Set(controls)].sort();
          const bookingFetchMatches = [...js.matchAll(/fetch\s*\(\s*([^,\n]+)/g)].map(m => m[1].trim()).slice(0, 20);
          const report = {
            pageHasForm: /<form\b/i.test(html),
            scriptLoadedFromSiteJs: /<script\b[^>]*src=["']\/site\.js["']/i.test(html),
            jsSyntaxLooksValid: true,
            jsUsesFormData: /new\s+FormData\s*\(/.test(js),
            jsHasSubmitHandler: /addEventListener\s*\(\s*["']submit["']/.test(js),
            jsReferencesApiBooking: /\/api\/booking/.test(js),
            jsHasFetch: /\bfetch\s*\(/.test(js),
            jsHasResponseOkCheck: /\.ok\b|response\.ok|res\.ok/.test(js),
            jsHasErrorDisplay: /error|status|message/i.test(js),
            jsReferencesFiles: /references|files|FileList/.test(js),
            jsReferencesDiscoverySource: /discoverySource/.test(js),
            jsReferencesDiscoverySourceDetail: /discoverySourceDetail/.test(js),
            namedControls: unique,
            missingRequiredControls: required.filter(name => !unique.includes(name)),
            bookingFetchExpressions: bookingFetchMatches
          };
          console.log(JSON.stringify(report, null, 2));
          NODE

          syntax_ok=true
          node --check "$RUNNER_TEMP/site.js" >/dev/null 2>&1 || syntax_ok=false
          printf 'not an image' > "$RUNNER_TEMP/not-an-image.txt"
          api_status="$(curl -sS -o "$RUNNER_TEMP/api.json" -w '%{http_code}' \
            -X POST 'https://www.kristinavishar.com/api/booking' \
            -H 'Origin: https://www.kristinavishar.com' \
            -H 'Accept: application/json' \
            -F 'name=Production route probe' \
            -F 'email=route-probe@example.invalid' \
            -F 'phone=' \
            -F 'instagram=' \
            -F 'preferredReply=Email' \
            -F 'travellingFrom=London' \
            -F 'projectType=Custom colour' \
            -F 'placement=Forearm' \
            -F 'size=10 cm' \
            -F 'coverUp=No' \
            -F 'timing=Flexible' \
            -F 'discoverySource=google' \
            -F 'discoverySourceDetail=' \
            -F 'idea=Production route contract probe' \
            -F 'website=' \
            -F 'consent=yes' \
            -F "references=@$RUNNER_TEMP/not-an-image.txt;type=image/png")"
          api_code="$(jq -r '.code // "non_json"' "$RUNNER_TEMP/api.json" 2>/dev/null || printf 'non_json')"

          contract_ok=false
          if [ "$page_status" = 200 ] \
             && [ "$js_status" = 200 ] \
             && [ "$syntax_ok" = true ] \
             && [ "$(jq -r '.pageHasForm' "$RUNNER_TEMP/browser-contract.json")" = true ] \
             && [ "$(jq -r '.scriptLoadedFromSiteJs' "$RUNNER_TEMP/browser-contract.json")" = true ] \
             && [ "$(jq -r '.jsUsesFormData' "$RUNNER_TEMP/browser-contract.json")" = true ] \
             && [ "$(jq -r '.jsHasSubmitHandler' "$RUNNER_TEMP/browser-contract.json")" = true ] \
             && [ "$(jq -r '.jsReferencesApiBooking' "$RUNNER_TEMP/browser-contract.json")" = true ] \
             && [ "$(jq -r '.missingRequiredControls | length' "$RUNNER_TEMP/browser-contract.json")" = 0 ] \
             && [ "$api_status" = 400 ] \
             && [ "$api_code" = invalid_file_extension ]; then
            contract_ok=true
          fi

          {
            echo "page_status=$page_status"
            echo "js_status=$js_status"
            echo "syntax_ok=$syntax_ok"
            echo "api_status=$api_status"
            echo "api_code=$api_code"
            echo "contract_ok=$contract_ok"
          } >> "$GITHUB_OUTPUT"

          echo "RESULT page=$page_status js=$js_status syntax=$syntax_ok api=$api_status code=$api_code contract=$contract_ok"
          echo 'RELEVANT_PUBLIC_JS_LINES'
          grep -nEi 'api/booking|FormData|addEventListener\(.submit|discoverySource|references|response\.ok|res\.ok' "$RUNNER_TEMP/site.js" | head -n 120 || true

      - name: Publish sanitized diagnosis status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_STATUS: ${{ steps.probe.outputs.page_status }}
          JS_STATUS: ${{ steps.probe.outputs.js_status }}
          SYNTAX_OK: ${{ steps.probe.outputs.syntax_ok }}
          API_STATUS: ${{ steps.probe.outputs.api_status }}
          API_CODE: ${{ steps.probe.outputs.api_code }}
          CONTRACT_OK: ${{ steps.probe.outputs.contract_ok }}
        run: |
          set -euo pipefail
          state=failure
          [ "$CONTRACT_OK" = true ] && state=success
          desc="page=$PAGE_STATUS js=$JS_STATUS syntax=$SYNTAX_OK api=$API_STATUS/$API_CODE contract=$CONTRACT_OK"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='kristina-production-form-diagnosis' \
            -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail if production contract is broken
        if: steps.probe.outputs.contract_ok != 'true'
        run: exit 1
