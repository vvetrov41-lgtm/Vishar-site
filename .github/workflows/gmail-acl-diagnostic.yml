name: Gmail ACL context diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/gmail-acl-diagnostic.yml'
      - 'supabase/migrations/0059_gmail_production_integration.sql'
      - 'supabase/tests/000_legacy_appointment_fixture_compat.sql'
      - 'supabase/tests/050_rls_roles.sql'
      - 'supabase/tests/210_gmail_acl_inventory.sql'
      - 'supabase/tests/212_function_acl_mismatch_diagnostic.sql'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Inject runner-only ACL diagnostics into canonical test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/050_rls_roles.sql')
          text = path.read_text()
          marker = "select is(\n  (select count(*)::int\n   from expected_function_acl e\n   where has_function_privilege('anon', e.signature, 'EXECUTE') = e.anon_allowed"
          if marker not in text:
              raise SystemExit('canonical ACL aggregate marker not found')
          diagnostic = r"""
          select diag(format(
            '%s expected[a=%s,u=%s,s=%s] actual[a=%s,u=%s,s=%s]',
            e.signature, e.anon_allowed, e.authenticated_allowed, e.service_role_allowed,
            has_function_privilege('anon', e.signature, 'EXECUTE'),
            has_function_privilege('authenticated', e.signature, 'EXECUTE'),
            has_function_privilege('service_role', e.signature, 'EXECUTE')
          ))
          from expected_function_acl e
          where has_function_privilege('anon', e.signature, 'EXECUTE') is distinct from e.anon_allowed
             or has_function_privilege('authenticated', e.signature, 'EXECUTE') is distinct from e.authenticated_allowed
             or has_function_privilege('service_role', e.signature, 'EXECUTE') is distinct from e.service_role_allowed
          order by e.signature;

          """
          path.write_text(text.replace(marker, diagnostic + marker, 1))
          PY

      - name: Start clean local Supabase stack
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase start

      - name: Reset canonical database
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase db reset --local --no-seed

      - name: Keep only fixture compatibility and canonical ACL tests
        run: |
          find supabase/tests -maxdepth 1 -type f -name '*.sql' \
            ! -name '000_legacy_appointment_fixture_compat.sql' \
            ! -name '050_rls_roles.sql' -delete

      - name: Run canonical ACL test with diagnostics
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
