name: Roll out Kristina production booking recovery

on:
  pull_request:
    branches:
      - agent/kristina-production-booking-recovery
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: kristina-production-booking-recovery
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact Kristina booking recovery
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/run-kristina-production-booking-recovery' &&
      github.event.pull_request.base.ref == 'agent/kristina-production-booking-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WORKER_NAME: tattooai
      WORKER_ENDPOINT: https://tattooai.vvetrov41.workers.dev/
      ALLOWED_ORIGINS: https://vishartattoo.com,https://booking.vishartattoo.com,https://www.kristinavishar.com
      SUPABASE_URL: https://vfjexhfdbrjmuxfdvbdx.supabase.co

    steps:
      - name: Verify exact same-repository rollout marker
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$BASE_SHA" != "$HEAD_SHA" ]
          [ "${{ github.event.pull_request.changed_files }}" = '1' ]

      - name: Checkout exact approved recovery base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and recovery boundary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]
          [ -z "$(git status --short)" ]
          git merge-base --is-ancestor 2729bf08ed206a0d6d42f6d055ded8489d0858e4 HEAD
          test -f workers/lib/production-booking-routing.js
          test -f scripts/test-production-booking-routing.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and audit locked dependencies
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Re-run focused production boundaries
        run: |
          node scripts/test-production-booking-routing.mjs
          node scripts/test-booking-flow.mjs
          node scripts/test-worker-modules.mjs
          npm run check:worker-bundle
          npm run scan:secrets

      - name: Verify production credentials and current Worker bindings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DIRECT_SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_LEGACY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRISTINA_TELEGRAM_BOT_TOKEN: ${{ secrets.KRISTINA_TELEGRAM_BOT_TOKEN }}
          KRISTINA_TELEGRAM_CHAT_ID: ${{ secrets.KRISTINA_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN; do
            [ -n "${!name:-}" ] || { echo "Missing encrypted configuration name: $name" >&2; exit 1; }
          done

          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > "$RUNNER_TEMP/deployments-before.json"
          jq -e '.success == true' "$RUNNER_TEMP/deployments-before.json" >/dev/null
          prior_version="$(jq -r '(.result.deployments // .result)[0].versions[]? | select(.percentage == 100) | .version_id' "$RUNNER_TEMP/deployments-before.json" | head -n1)"
          [[ "$prior_version" =~ ^[0-9a-f-]{36}$ ]]

          secret_list="$(npx wrangler secret list --name "$WORKER_NAME" --format json)"
          supabase_secret_count="$(printf '%s' "$secret_list" | jq -er '
            [.[]? | .name | select(. == "SUPABASE_SECRET_KEY" or . == "SUPABASE_SERVICE_ROLE_KEY")]
            | if length <= 1 then length else error("Conflicting production Supabase secret bindings") end
          ')"
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            printf '%s' "$secret_list" | jq -e --arg name "$name" 'any(.[]?; .name == $name)' >/dev/null || {
              echo "Missing required production secret binding: $name" >&2
              exit 1
            }
          done

          if [ "$supabase_secret_count" = '0' ]; then
            umask 077
            secret_key="${SUPABASE_LEGACY_SECRET:-${SUPABASE_DIRECT_SECRET:-}}"
            if [ -z "$secret_key" ]; then
              key_file="$RUNNER_TEMP/supabase-api-keys.json"
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/vfjexhfdbrjmuxfdvbdx/api-keys?reveal=true" > "$key_file"
              secret_key="$(jq -er '
                [.[]?
                  | select((.disabled // false) == false)
                  | select(.type == "secret")
                  | .api_key
                  | select(type == "string" and startswith("sb_secret_"))]
                | unique
                | if length == 1 then .[0] else error("Expected exactly one enabled Supabase secret API key") end
              ' "$key_file")"
              rm -f "$key_file"
            fi
            echo "::add-mask::$secret_key"
            printf '%s' "$secret_key" | npx wrangler secret put SUPABASE_SECRET_KEY --name "$WORKER_NAME"
            unset secret_key

            secret_list="$(npx wrangler secret list --name "$WORKER_NAME" --format json)"
            printf '%s' "$secret_list" | jq -e '
              ([.[]? | .name | select(. == "SUPABASE_SECRET_KEY")] | length) == 1
              and ([.[]? | .name | select(. == "SUPABASE_SERVICE_ROLE_KEY")] | length) == 0
            ' >/dev/null || {
              echo 'Production Supabase secret binding was not provisioned exactly once' >&2
              exit 1
            }
          fi
          probe_key="${SUPABASE_LEGACY_SECRET:-${SUPABASE_DIRECT_SECRET:-}}"
          if [ -n "$probe_key" ]; then
            probe_status="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-probe.json" --write-out '%{http_code}' \
              -X POST \
              -H "apikey: $probe_key" \
              -H 'Content-Type: application/json' \
              --data '{"p_source_key":"kristina-website","p_origin":"https://www.kristinavishar.com","p_form_version":"booking-v1"}' \
              "$SUPABASE_URL/rest/v1/rpc/resolve_booking_source")"
            echo "Supabase service-role probe HTTP status: $probe_status"
            if [ "$probe_status" != '200' ]; then
              echo 'Configured GitHub Supabase key was rejected; retrieving a backend secret through the masked Management API handoff.'
              umask 077
              key_file="$RUNNER_TEMP/supabase-api-keys-recovery.json"
              inventory_status="$(curl --silent --show-error --output "$key_file" --write-out '%{http_code}' \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/vfjexhfdbrjmuxfdvbdx/api-keys?reveal=true")"
              echo "Supabase key inventory HTTP status: $inventory_status"
              if [ "$inventory_status" = '200' ]; then
                echo "Supabase key inventory metadata: $(jq -c '[.[]? | {name,type,disabled,has_api_key:((.api_key // .key // .token) | type == "string" and length > 0)}]' "$key_file")"
              fi
              secret_key="$(if [ "$inventory_status" = '200' ]; then jq -er '
                [.[]?
                  | select((.disabled // false) == false)
                  | select(.name == "tattooai_service")
                  | (.api_key // .key // .token)
                  | select(type == "string" and startswith("sb_secret_"))]
                | if length == 1 then .[0] else "" end
              ' "$key_file"; else printf ''; fi)"
              if [ -z "$secret_key" ]; then
                create_status="$(curl --silent --show-error --output "$key_file" --write-out '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H 'Content-Type: application/json' \
                  --data '{"type":"secret","name":"tattooai_service_2","secret_jwt_template":{"role":"service_role"}}' \
                  "https://api.supabase.com/v1/projects/vfjexhfdbrjmuxfdvbdx/api-keys?reveal=true")"
                echo "Supabase service-role secret creation HTTP status: $create_status"
                [ "$create_status" = '201' ] || {
                  echo "Supabase secret creation response: $(jq -r 'if type == "object" then (.message // .error // .code // "unknown") else "non_object" end' "$key_file")" >&2
                  exit 1
                }
                secret_key="$(jq -er '(.api_key // .key // .token) | select(type == "string" and startswith("sb_secret_"))' "$key_file")"
              fi
              rm -f "$key_file"
              echo "::add-mask::$secret_key"
              printf '%s' "$secret_key" | npx wrangler secret put SUPABASE_SECRET_KEY --name "$WORKER_NAME"
              probe_key="$secret_key"
              unset secret_key
              probe_status="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-probe.json" --write-out '%{http_code}' \
                -X POST \
                -H "apikey: $probe_key" \
                -H 'Content-Type: application/json' \
                --data '{"p_source_key":"kristina-website","p_origin":"https://www.kristinavishar.com","p_form_version":"booking-v1"}' \
                "$SUPABASE_URL/rest/v1/rpc/resolve_booking_source")"
              echo "Supabase Management API replacement probe HTTP status: $probe_status"
            fi
            [ "$probe_status" = '200' ] || { echo 'Supabase service-role probe failed' >&2; exit 1; }
            rm -f "$RUNNER_TEMP/supabase-probe.json"
          fi
          unset probe_key
          [ -n "$KRISTINA_TELEGRAM_BOT_TOKEN" ] || { echo 'Missing encrypted configuration name: KRISTINA_TELEGRAM_BOT_TOKEN' >&2; exit 1; }
          [ -n "$KRISTINA_TELEGRAM_CHAT_ID" ] || { echo 'Missing encrypted configuration name: KRISTINA_TELEGRAM_CHAT_ID' >&2; exit 1; }
          jq -n --arg bot "$KRISTINA_TELEGRAM_BOT_TOKEN" --arg chat "$KRISTINA_TELEGRAM_CHAT_ID" \
            '{botToken:$bot,chatId:$chat}' \
            | npx wrangler secret put ARTIST_TELEGRAM_KRISTINA_HPRODUCTION --name "$WORKER_NAME"
          unset KRISTINA_TELEGRAM_BOT_TOKEN KRISTINA_TELEGRAM_CHAT_ID
          echo "PRIOR_WORKER_VERSION=$prior_version" >> "$GITHUB_ENV"

      - name: Dry-run exact production Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy
          --env=""
          --name "$WORKER_NAME"
          --strict
          --keep-vars
          --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS"
          --var "SUPABASE_URL:$SUPABASE_URL"
          --dry-run
          --outdir .wrangler/kristina-production-recovery

      - name: Deploy only the tattooai production Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deploy_output="$RUNNER_TEMP/tattooai-production-output.ndjson"
          rm -f "$deploy_output"
          WRANGLER_OUTPUT_FILE_PATH="$deploy_output" \
            npx wrangler deploy \
              --env="" \
              --name "$WORKER_NAME" \
              --strict \
              --keep-vars \
              --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS" \
              --var "SUPABASE_URL:$SUPABASE_URL"

          DEPLOY_OUTPUT="$deploy_output" node <<'NODE'
          const fs = require('fs');
          const events = fs.readFileSync(process.env.DEPLOY_OUTPUT, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const deploys = events.filter((entry) => (
            entry?.type === 'deploy'
            && entry?.worker_name === process.env.WORKER_NAME
            && typeof entry?.version_id === 'string'
          ));
          if (deploys.length !== 1) throw new Error('Unable to resolve exactly one deployed tattooai version');
          fs.appendFileSync(process.env.GITHUB_ENV, `DEPLOYED_WORKER_VERSION=${deploys[0].version_id}\n`);
          NODE

      - name: Verify deployed bindings and edge behaviour
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_WORKER_VERSION" =~ ^[0-9a-f-]{36}$ ]]
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/versions/$DEPLOYED_WORKER_VERSION" \
            > "$RUNNER_TEMP/deployed-version.json"
          jq -e '.success == true' "$RUNNER_TEMP/deployed-version.json" >/dev/null
          while IFS='|' read -r name expected; do
            jq -e --arg name "$name" --arg expected "$expected" '
              [.result.resources.bindings[]?
                | select(.name == $name and .type == "plain_text")
                | .text] == [$expected]
            ' "$RUNNER_TEMP/deployed-version.json" >/dev/null || {
              echo "Unexpected production plain-text binding: $name" >&2
              exit 1
            }
          done <<EOF
          ALLOWED_ORIGINS|$ALLOWED_ORIGINS
          VISHAR_ENVIRONMENT|production
          SUPABASE_URL|$SUPABASE_URL
          EOF
          for name in AI SUPABASE_SECRET_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ARTIST_TELEGRAM_KRISTINA_HPRODUCTION; do
            jq -e --arg name "$name" 'any(.result.resources.bindings[]?; .name == $name)' \
              "$RUNNER_TEMP/deployed-version.json" >/dev/null || {
              echo "Missing required deployed binding: $name" >&2
              exit 1
            }
          done

          IFS=',' read -r -a origins <<< "$ALLOWED_ORIGINS"
          for origin in "${origins[@]}"; do
            headers="$RUNNER_TEMP/headers-$(printf '%s' "$origin" | sha256sum | cut -c1-12).txt"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
              -X OPTIONS -H "Origin: $origin" "$WORKER_ENDPOINT")"
            [ "$status" = '204' ] || { echo "Unexpected preflight status for $origin: $status" >&2; exit 1; }
            tr -d '\r' < "$headers" | grep -Fqi "Access-Control-Allow-Origin: $origin" || {
              echo "Missing exact preflight allow-origin for $origin" >&2
              exit 1
            }
          done

          rejected="$RUNNER_TEMP/rejected.json"
          status="$(curl --silent --show-error --output "$rejected" --write-out '%{http_code}' \
            -H 'Origin: https://www.kristinavishar.com.attacker.invalid' \
            -F 'probe=1' "$WORKER_ENDPOINT")"
          [ "$status" = '403' ] || { echo "Unexpected hostile-origin status: $status" >&2; exit 1; }
          jq -e '.code == "origin_not_allowed"' "$rejected" >/dev/null || {
            echo 'Hostile-origin response did not contain the expected safe error code' >&2
            exit 1
          }

      - name: Record safe rollback evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### Kristina production booking recovery'
            echo
            echo "- Source SHA: \`${{ github.event.pull_request.base.sha }}\`"
            echo "- Worker: \`$WORKER_NAME\`"
            echo "- Prior version: \`${PRIOR_WORKER_VERSION:-not changed}\`"
            echo "- Deployed version: \`${DEPLOYED_WORKER_VERSION:-not deployed}\`"
            echo "- Allowed origins: \`$ALLOWED_ORIGINS\`"
            echo '- Existing secrets were checked by name. A missing Supabase backend secret was provisioned through a masked direct API handoff.'
            echo '- Rollback: redeploy the prior Worker version and disable `kristina-website`.'
          } >> "$GITHUB_STEP_SUMMARY"
