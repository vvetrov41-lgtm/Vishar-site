name: Secure RC25 Vladimir WhatsApp binding

on:
  push:
    branches:
      - release/private-crm-rc25-whatsapp-webhook-operator
    paths:
      - .github/workflows/secure-rc25-vladimir-whatsapp-binding.yml

permissions:
  contents: read

concurrency:
  group: secure-rc25-vladimir-whatsapp-binding
  cancel-in-progress: false

jobs:
  secure:
    name: Convert plaintext binding to encrypted secret and activate verified version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crm-production
    env:
      RELEASE_SHA: 2729bf08ed206a0d6d42f6d055ded8489d0858e4
      WORKER_NAME: vishar-whatsapp-webhook-production
      WEBHOOK_URL: https://whatsapp.vishartattoo.com/webhook
      TARGET_BINDING: ARTIST_WHATSAPP_VLADIMIR_HPRODUCTION
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact RC25 ancestry and operator-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          unexpected="$(git diff --name-only "$RELEASE_SHA"...HEAD | grep -vE '^\.github/workflows/(bootstrap-rc25-whatsapp-webhook|inspect-rc25-whatsapp-production|verify-rc25-whatsapp-public|diagnose-rc25-whatsapp-secret|provision-rc25-whatsapp-supabase-secret|promote-rc25-whatsapp-secret-version|promote-rc25-whatsapp-secret-version-v2|secure-rc25-vladimir-whatsapp-binding)\.yml$' || true)"
          [ -z "$unexpected" ] || { echo 'Unexpected non-operator changes.' >&2; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ]
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Inventory Worker versions and extract plaintext value without logging it
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          versions_file="$RUNNER_TEMP/versions.json"
          deployments_file="$RUNNER_TEMP/deployments.json"
          source_file="$RUNNER_TEMP/source-version.json"
          active_file="$RUNNER_TEMP/active-version.json"
          secret_file="$RUNNER_TEMP/vladimir-binding.txt"
          insecure_ids_file="$RUNNER_TEMP/insecure-version-ids.txt"

          curl --fail --silent --show-error -H "$auth" "$api/versions?deployable=true&per_page=100" > "$versions_file"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" > "$deployments_file"

          VERSIONS_FILE="$versions_file" DEPLOYMENTS_FILE="$deployments_file" GITHUB_OUTPUT="$GITHUB_OUTPUT" node <<'NODE'
          const fs = require('fs');
          const versionsDoc = JSON.parse(fs.readFileSync(process.env.VERSIONS_FILE, 'utf8'));
          const deploymentsDoc = JSON.parse(fs.readFileSync(process.env.DEPLOYMENTS_FILE, 'utf8'));
          if (!versionsDoc.success || !deploymentsDoc.success) throw new Error('Cloudflare inventory request failed');
          const versions = Array.isArray(versionsDoc.result?.items) ? versionsDoc.result.items : [];
          if (!versions.length) throw new Error('No deployable Worker versions found');
          if (versions.length >= 100) throw new Error('Version inventory may be paginated; refusing partial cleanup');
          const deployment = deploymentsDoc.result?.deployments?.[0];
          const active = deployment?.versions || [];
          if (active.length !== 1 || Number(active[0].percentage) !== 100 || !active[0].version_id) throw new Error('Expected exactly one active Worker version at 100 percent');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active_id=${active[0].version_id}\nlatest_id=${versions[0].id}\n`);
          console.log(`VERSION_COUNT=${versions.length}`);
          console.log('ACTIVE_DEPLOYMENT_SINGLE_100_PERCENT=true');
          NODE

          active_id="$(grep '^active_id=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          latest_id="$(grep '^latest_id=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          curl --fail --silent --show-error -H "$auth" "$api/versions/$active_id" > "$active_file"
          curl --fail --silent --show-error -H "$auth" "$api/versions/$latest_id" > "$source_file"

          ACTIVE_FILE="$active_file" SOURCE_FILE="$source_file" TARGET_BINDING="$TARGET_BINDING" SECRET_FILE="$secret_file" node <<'NODE'
          const fs = require('fs');
          const activeDoc = JSON.parse(fs.readFileSync(process.env.ACTIVE_FILE, 'utf8'));
          const sourceDoc = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (!activeDoc.success || !sourceDoc.success) throw new Error('Could not inspect Worker versions');
          const active = activeDoc.result;
          const source = sourceDoc.result;
          if (!active?.resources?.script?.etag || active.resources.script.etag !== source?.resources?.script?.etag) throw new Error('Latest code differs from active code');
          const activeBindings = Array.isArray(active?.resources?.bindings) ? active.resources.bindings : [];
          const sourceBindings = Array.isArray(source?.resources?.bindings) ? source.resources.bindings : [];
          const target = sourceBindings.find((b) => b?.name === process.env.TARGET_BINDING);
          if (!target || target.type !== 'plain_text' || typeof target.text !== 'string' || !target.text) throw new Error('Expected latest Vladimir binding to be plaintext before repair');
          if (activeBindings.some((b) => b?.name === process.env.TARGET_BINDING)) throw new Error('Refusing repair because plaintext binding may already be active');

          const expectedText = ['SUPABASE_URL','VISHAR_ENVIRONMENT','WHATSAPP_KRISTINA_ARTIST_ID','WHATSAPP_VLADIMIR_ARTIST_ID'];
          const mapText = (list) => new Map(list.filter((b) => b?.type === 'plain_text' && expectedText.includes(b.name)).map((b) => [b.name, b.text]));
          const activeText = mapText(activeBindings);
          const sourceText = mapText(sourceBindings);
          for (const name of expectedText) {
            if (!activeText.has(name) || !sourceText.has(name) || activeText.get(name) !== sourceText.get(name)) throw new Error(`Runtime text binding mismatch for ${name}`);
          }

          const secretNames = sourceBindings.filter((b) => b?.type === 'secret_text' || b?.type === 'secret_key').map((b) => b.name);
          for (const required of ['SUPABASE_SECRET_KEY','WHATSAPP_WEBHOOK_VERIFY_TOKEN']) {
            if (!secretNames.includes(required)) throw new Error(`Latest version missing required encrypted binding: ${required}`);
          }
          if (secretNames.includes(process.env.TARGET_BINDING)) throw new Error('Target binding is ambiguously present as both plaintext and secret');

          let parsed;
          try { parsed = JSON.parse(target.text); } catch { throw new Error('Vladimir binding JSON is invalid'); }
          const keys = Object.keys(parsed || {}).sort();
          const expectedKeys = ['appSecret','phoneNumberId','wabaId'].sort();
          if (JSON.stringify(keys) !== JSON.stringify(expectedKeys)) throw new Error('Vladimir binding has unexpected fields');
          if (!/^[0-9]{5,32}$/.test(parsed.phoneNumberId || '') || !/^[0-9]{5,32}$/.test(parsed.wabaId || '')) throw new Error('Vladimir binding provider ids are invalid');
          if (typeof parsed.appSecret !== 'string' || parsed.appSecret.length < 16 || parsed.appSecret.length > 512) throw new Error('Vladimir binding app secret is invalid');
          fs.writeFileSync(process.env.SECRET_FILE, target.text, { mode: 0o600 });
          console.log('LATEST_CODE_MATCHES_ACTIVE=true');
          console.log('RUNTIME_TEXT_BINDINGS_MATCH=true');
          console.log('PLAINTEXT_BINDING_STRUCTURE_VALID=true');
          NODE

          : > "$insecure_ids_file"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const v of d.result.items) console.log(v.id)' "$versions_file" | while read -r id; do
            detail="$RUNNER_TEMP/version-$id.json"
            curl --fail --silent --show-error -H "$auth" "$api/versions/$id" > "$detail"
            VERSION_FILE="$detail" TARGET_BINDING="$TARGET_BINDING" ACTIVE_ID="$active_id" INSECURE_IDS_FILE="$insecure_ids_file" node <<'NODE'
            const fs = require('fs');
            const doc = JSON.parse(fs.readFileSync(process.env.VERSION_FILE, 'utf8'));
            if (!doc.success) throw new Error('Version detail request failed');
            const id = doc.result?.id;
            const bindings = Array.isArray(doc.result?.resources?.bindings) ? doc.result.resources.bindings : [];
            const target = bindings.find((b) => b?.name === process.env.TARGET_BINDING);
            if (target?.type === 'plain_text') {
              if (id === process.env.ACTIVE_ID) throw new Error('Plaintext target binding is active; refusing automated repair');
              fs.appendFileSync(process.env.INSECURE_IDS_FILE, `${id}\n`);
            }
            NODE
          done
          insecure_count="$(grep -c . "$insecure_ids_file" || true)"
          [ "$insecure_count" -ge 1 ]
          echo "INSECURE_VERSION_COUNT=$insecure_count"

      - name: Create encrypted-secret version
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/vladimir-binding.txt"
          [ -s "$secret_file" ]
          npx wrangler versions secret put "$TARGET_BINDING" --name "$WORKER_NAME" --message 'Convert Vladimir WhatsApp binding to encrypted secret' < "$secret_file" >/dev/null
          rm -f "$secret_file"
          echo 'ENCRYPTED_SECRET_VERSION_CREATED=true'

      - name: Verify secure version then remove only inactive plaintext versions
        id: secure
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          beta_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          versions_file="$RUNNER_TEMP/versions-after-secret.json"
          secure_file="$RUNNER_TEMP/secure-version.json"
          active_file="$RUNNER_TEMP/active-version-before-promotion.json"
          active_id="${{ steps.inventory.outputs.active_id }}"

          curl --fail --silent --show-error -H "$auth" "$api/versions?deployable=true&per_page=100" > "$versions_file"
          secure_id="$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const a=d.result?.items||[];if(!a[0]?.id)process.exit(2);process.stdout.write(a[0].id)' "$versions_file")"
          curl --fail --silent --show-error -H "$auth" "$api/versions/$secure_id" > "$secure_file"
          curl --fail --silent --show-error -H "$auth" "$api/versions/$active_id" > "$active_file"

          SECURE_FILE="$secure_file" ACTIVE_FILE="$active_file" TARGET_BINDING="$TARGET_BINDING" node <<'NODE'
          const fs = require('fs');
          const secureDoc = JSON.parse(fs.readFileSync(process.env.SECURE_FILE, 'utf8'));
          const activeDoc = JSON.parse(fs.readFileSync(process.env.ACTIVE_FILE, 'utf8'));
          if (!secureDoc.success || !activeDoc.success) throw new Error('Secure version verification failed');
          const secure = secureDoc.result;
          const active = activeDoc.result;
          if (!secure?.resources?.script?.etag || secure.resources.script.etag !== active?.resources?.script?.etag) throw new Error('Secure version code differs from active code');
          const bindings = Array.isArray(secure?.resources?.bindings) ? secure.resources.bindings : [];
          const target = bindings.find((b) => b?.name === process.env.TARGET_BINDING);
          if (!target || !['secret_text','secret_key'].includes(target.type)) throw new Error('Vladimir binding is not encrypted in secure version');
          if (bindings.some((b) => b?.name === process.env.TARGET_BINDING && b?.type === 'plain_text')) throw new Error('Secure version still contains plaintext Vladimir binding');
          const secrets = bindings.filter((b) => ['secret_text','secret_key'].includes(b?.type)).map((b) => b.name);
          for (const required of [process.env.TARGET_BINDING,'SUPABASE_SECRET_KEY','WHATSAPP_WEBHOOK_VERIFY_TOKEN']) {
            if (!secrets.includes(required)) throw new Error(`Secure version missing encrypted binding: ${required}`);
          }
          console.log('SECURE_VERSION_BINDINGS_VERIFIED=true');
          NODE

          while read -r id; do
            [ -n "$id" ] || continue
            [ "$id" != "$active_id" ] || { echo 'Refusing to delete active version.' >&2; exit 1; }
            response="$RUNNER_TEMP/delete-$id.json"
            curl --fail --silent --show-error -X DELETE -H "$auth" "$beta_api/$id" > "$response"
            DELETE_RESPONSE="$response" node <<'NODE'
            const fs = require('fs');
            const doc = JSON.parse(fs.readFileSync(process.env.DELETE_RESPONSE, 'utf8'));
            if (!doc.success) throw new Error('Cloudflare version deletion failed');
            NODE
          done < "$RUNNER_TEMP/insecure-version-ids.txt"

          verify_versions="$RUNNER_TEMP/versions-after-cleanup.json"
          curl --fail --silent --show-error -H "$auth" "$api/versions?deployable=true&per_page=100" > "$verify_versions"
          [ "$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String((d.result?.items||[]).length))' "$verify_versions")" -lt 100 ]
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const v of d.result.items) console.log(v.id)' "$verify_versions" | while read -r id; do
            detail="$RUNNER_TEMP/postcleanup-$id.json"
            curl --fail --silent --show-error -H "$auth" "$api/versions/$id" > "$detail"
            VERSION_FILE="$detail" TARGET_BINDING="$TARGET_BINDING" node <<'NODE'
            const fs = require('fs');
            const doc = JSON.parse(fs.readFileSync(process.env.VERSION_FILE, 'utf8'));
            const bindings = Array.isArray(doc.result?.resources?.bindings) ? doc.result.resources.bindings : [];
            if (bindings.some((b) => b?.name === process.env.TARGET_BINDING && b?.type === 'plain_text')) throw new Error('Plaintext Vladimir binding still exists in Worker version history');
            NODE
          done
          echo "secure_id=$secure_id" >> "$GITHUB_OUTPUT"
          echo 'PLAINTEXT_VERSIONS_REMOVED=true'

      - name: Promote verified secure version to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions deploy "${{ steps.secure.outputs.secure_id }}@100%" --name "$WORKER_NAME" --message 'Activate secured RC25 WhatsApp webhook bindings' -y >/dev/null
          echo 'SECURE_VERSION_PROMOTED=true'

      - name: Verify active deployment and public fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          deployments_file="$RUNNER_TEMP/deployments-after.json"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" > "$deployments_file"
          DEPLOYMENTS_FILE="$deployments_file" EXPECTED_VERSION="${{ steps.secure.outputs.secure_id }}" node <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync(process.env.DEPLOYMENTS_FILE, 'utf8'));
          const versions = doc.result?.deployments?.[0]?.versions || [];
          if (!doc.success || versions.length !== 1 || versions[0].version_id !== process.env.EXPECTED_VERSION || Number(versions[0].percentage) !== 100) throw new Error('Secure version is not active at 100 percent');
          console.log('SECURE_VERSION_ACTIVE_100_PERCENT=true');
          NODE
          base="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$WEBHOOK_URL" || true)"
          wrong="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$WEBHOOK_URL?hub.mode=subscribe&hub.verify_token=definitely-wrong-operator-token&hub.challenge=123456" || true)"
          [ "$base" = '403' ]
          [ "$wrong" = '403' ]
          echo "WEBHOOK_HTTP_NO_QUERY=$base"
          echo "WEBHOOK_HTTP_WRONG_TOKEN=$wrong"

      - name: Safe summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RC25 Vladimir WhatsApp binding security repair'
            echo
            echo "- Exact RC25 ancestor: \`$RELEASE_SHA\`"
            echo '- Plaintext credential values are never printed or written to artifacts'
            echo '- Only inactive Worker versions containing the Vladimir binding as plain_text may be deleted'
            echo '- Secure version must preserve the exact active code etag and required runtime bindings'
            echo '- No database mutation, Meta API call, outbound message, billing action or automatic drain exists in this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
