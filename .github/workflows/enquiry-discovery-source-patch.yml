name: Enquiry discovery source patch

on:
  push:
    branches:
      - agent/enquiry-discovery-source-ui

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/enquiry-discovery-source-ui
          fetch-depth: 0

      - name: Apply fail-closed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'admin/src/lib/types.ts',
              "  source: string | null;\n  utm_source: string | null;",
              "  source: string | null;\n  /** Normalised client-reported acquisition source, present on detail reads. */\n  discovery_source?: string | null;\n  discovery_source_detail?: string | null;\n  utm_source: string | null;",
          )

          replace_once(
              'admin/src/lib/api.ts',
              ".select('id, artist_id, client_id, reference_number, status, intake_state, intake_error_code, client_identifier_conflict, assigned_to, submitted_full_name, submitted_email, submitted_phone, submitted_instagram, submitted_preferred_contact, submitted_travelling_from, project_type, placement, approximate_size, cover_up, preferred_timing, idea, source, utm_source, created_at, last_action_at, archived_at')",
              ".select('id, artist_id, client_id, reference_number, status, intake_state, intake_error_code, client_identifier_conflict, assigned_to, submitted_full_name, submitted_email, submitted_phone, submitted_instagram, submitted_preferred_contact, submitted_travelling_from, project_type, placement, approximate_size, cover_up, preferred_timing, idea, source, discovery_source, discovery_source_detail, utm_source, created_at, last_action_at, archived_at')",
          )

          replace_once(
              'admin/src/lib/i18n.tsx',
              "  'enquiry.received': 'Received',",
              "  'enquiry.discoverySource': 'How they found you',\n  'enquiry.received': 'Received',",
          )
          replace_once(
              'admin/src/lib/i18n.tsx',
              "  'enquiry.received': 'Получена',",
              "  'enquiry.discoverySource': 'Откуда пришёл клиент',\n  'enquiry.received': 'Получена',",
          )

          replace_once(
              'admin/src/lib/format.ts',
              "      false: 'No',\n    },\n    ru: {",
              "      false: 'No',\n      instagram: 'Instagram',\n      google: 'Google',\n      ai: 'ChatGPT / AI',\n      referral: 'Recommendation / Friend',\n      convention: 'Tattoo convention',\n      returning_client: 'Returning client',\n      other: 'Other',\n    },\n    ru: {",
          )
          replace_once(
              'admin/src/lib/format.ts',
              "      false: 'Нет',\n    },\n  };",
              "      false: 'Нет',\n      instagram: 'Instagram',\n      google: 'Google',\n      ai: 'ChatGPT / AI',\n      referral: 'Рекомендация / знакомые',\n      convention: 'Тату-конвенция',\n      returning_client: 'Повторный клиент',\n      other: 'Другое',\n    },\n  };",
          )

          replace_once(
              'admin/src/pages/EnquiryDetailPage.tsx',
              "          <dt>{t('enquiry.type')}</dt>\n          <dd>{enquiry.project_type ?? '—'}</dd>\n          <dt>{t('enquiry.received')}</dt>",
              "          <dt>{t('enquiry.type')}</dt>\n          <dd>{enquiry.project_type ?? '—'}</dd>\n          {enquiry.discovery_source || enquiry.discovery_source_detail ? (\n            <>\n              <dt>{t('enquiry.discoverySource')}</dt>\n              <dd>\n                {[\n                  enquiry.discovery_source ? localiseKnownValue(enquiry.discovery_source, language) : null,\n                  enquiry.discovery_source_detail,\n                ].filter(Boolean).join(' · ')}\n              </dd>\n            </>\n          ) : null}\n          <dt>{t('enquiry.received')}</dt>",
          )

          test = Path('admin/src/test/enquiry-discovery-source.test.tsx')
          if test.exists():
              raise SystemExit(f'{test}: file already exists')
          test.write_text("""import { afterEach, describe, expect, it } from 'vitest';
          import { screen } from '@testing-library/react';
          import { App } from '../App';
          import { ENQUIRY, ENQUIRY_ID, renderWithSession } from './fixtures';

          type DiscoveryFixture = typeof ENQUIRY & {
            discovery_source?: string | null;
            discovery_source_detail?: string | null;
          };

          const enquiry = ENQUIRY as DiscoveryFixture;
          const initialSource = enquiry.discovery_source;
          const initialDetail = enquiry.discovery_source_detail;

          afterEach(() => {
            enquiry.discovery_source = initialSource;
            enquiry.discovery_source_detail = initialDetail;
          });

          describe('enquiry discovery source', () => {
            it('shows the client-reported acquisition source in the enquiry summary', async () => {
              enquiry.discovery_source = 'instagram';
              enquiry.discovery_source_detail = null;

              renderWithSession(<App />, { role: 'owner', path: `/enquiries/${ENQUIRY_ID}` });

              const sourceLabel = await screen.findByText('How they found you');
              expect(sourceLabel.nextElementSibling).toHaveTextContent('Instagram');
            });

            it('shows the optional source detail next to the normalised category', async () => {
              enquiry.discovery_source = 'referral';
              enquiry.discovery_source_detail = 'Sarah';

              renderWithSession(<App />, { role: 'owner', path: `/enquiries/${ENQUIRY_ID}` });

              expect(await screen.findByText('Recommendation / Friend · Sarah')).toBeInTheDocument();
            });
          });
          """)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Validate private CRM
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Commit validated patch and remove patch runner
        shell: bash
        run: |
          rm .github/workflows/enquiry-discovery-source-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/src/lib/types.ts admin/src/lib/api.ts admin/src/lib/i18n.tsx admin/src/lib/format.ts admin/src/pages/EnquiryDetailPage.tsx admin/src/test/enquiry-discovery-source.test.tsx .github/workflows/enquiry-discovery-source-patch.yml
          git diff --cached --check
          git commit -m 'Show discovery source on enquiry details'
          git push origin HEAD:agent/enquiry-discovery-source-ui
