name: Repair Healed 05 Binary

on:
  push:
    branches:
      - agent/fix-healed-05-binary
    paths:
      - .github/workflows/repair-healed-05.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify WebP
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/healed05/part-*.b64 | tr -d '\n\r' | base64 --decode > assets/healed/05.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/healed/05.webp')
          data = p.read_bytes()
          assert len(data) == 33514, len(data)
          assert data[:4] == b'RIFF', data[:4]
          assert data[8:12] == b'WEBP', data[8:12]
          print(f'validated {len(data)} bytes')
          PY
          actual="$(sha256sum assets/healed/05.webp | awk '{print $1}')"
          expected="27f6d79095b31db9cfda837f7c55fd59c1d6d5e9ea072be3bcb901d82afb354b"
          test "$actual" = "$expected"
          echo "sha256=$actual"

      - name: Commit repaired image and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair/healed05
          rm -f .github/workflows/repair-healed-05.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair healed comparison image 05 binary"
          git push origin HEAD:agent/fix-healed-05-binary
