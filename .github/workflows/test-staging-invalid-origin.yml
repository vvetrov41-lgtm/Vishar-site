name: Test staging network controls
# Final hosted invalid-origin and rate-limit validation after browser CRM E2E.

on:
  push:
    branches:
      - claude/vishar-crm-booking-infra-c188bx
    paths:
      - .github/workflows/test-staging-invalid-origin.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-network-controls
  cancel-in-progress: false

jobs:
  network-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Test invalid Origin rejection
        id: invalid
        shell: bash
        run: |
          set -u
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output "$body" \
            --dump-header "$headers" \
            --request OPTIONS \
            --header 'Origin: https://invalid-origin.example' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            --write-out '%{http_code}' \
            'https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026')"

          tr -d '\r' < "$headers" > invalid-headers.txt
          allow_origin="$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2; exit}' invalid-headers.txt)"
          server="$(awk -F': ' 'tolower($1)=="server" {print $2; exit}' invalid-headers.txt)"
          ray="$(awk -F': ' 'tolower($1)=="cf-ray" {print $2; exit}' invalid-headers.txt)"
          safe_code="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("code", ""))' "$body" 2>/dev/null || true)"

          result=FAIL
          if [ "$status" = '403' ] && [ -z "$allow_origin" ]; then
            result=PASS
          fi

          {
            echo '<!-- staging-invalid-origin-test -->'
            echo '### Staging invalid-Origin OPTIONS'
            echo
            echo "- Result: **${result}**"
            echo "- HTTP status: \`${status}\`"
            echo "- Server: \`${server:-missing}\`"
            echo "- CF-Ray: \`${ray:-missing}\`"
            echo "- Access-Control-Allow-Origin: \`${allow_origin:-missing}\`"
            echo "- Safe error code: \`${safe_code:-none}\`"
          } > invalid-result.md

          cat invalid-result.md >> "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Clear the 10-second rate window
        run: sleep 12

      - name: Test rate limiting and recovery
        id: rate
        shell: bash
        run: |
          set -u
          endpoint='https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026'
          origin='https://vishar-booking-staging.pages.dev'
          statuses=()

          for i in 1 2 3 4 5 6 7; do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              --output /dev/null \
              --request OPTIONS \
              --header "Origin: ${origin}" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --write-out '%{http_code}' \
              "$endpoint")"
            statuses+=("$status")
          done

          joined="$(IFS=,; echo "${statuses[*]}")"
          served=0
          blocked=0
          for status in "${statuses[@]}"; do
            if [ "$status" = '204' ]; then
              served=$((served + 1))
            elif [ "$status" = '429' ] || [ "$status" = '403' ]; then
              blocked=$((blocked + 1))
            fi
          done

          sleep 12
          recovery="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null \
            --request OPTIONS \
            --header "Origin: ${origin}" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            --write-out '%{http_code}' \
            "$endpoint")"

          result=FAIL
          if [ "${statuses[0]}" = '204' ] \
            && [ "$served" -ge 1 ] \
            && [ "$blocked" -ge 1 ] \
            && [ "$recovery" = '204' ]; then
            result=PASS
          fi

          {
            echo '<!-- staging-rate-limit-test -->'
            echo '### Staging rate-limit validation'
            echo
            echo "- Result: **${result}**"
            echo "- Burst statuses: \`${joined}\`"
            echo "- Served during burst: \`${served}\`"
            echo "- Blocked during burst: \`${blocked}\`"
            echo "- Status after 12-second recovery: \`${recovery}\`"
            echo '- Requests used OPTIONS only; no enquiry or file was created.'
          } > rate-result.md

          cat rate-result.md >> "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Post results to PR #176
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 176 --body-file invalid-result.md
          gh pr comment 176 --body-file rate-result.md

      - name: Enforce both checks
        if: always()
        shell: bash
        run: |
          test '${{ steps.invalid.outputs.result }}' = 'PASS'
          test '${{ steps.rate.outputs.result }}' = 'PASS'
