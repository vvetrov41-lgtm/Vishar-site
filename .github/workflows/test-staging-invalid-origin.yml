name: Test staging invalid Origin

on:
  push:
    branches:
      - claude/vishar-crm-booking-infra-c188bx
    paths:
      - .github/workflows/test-staging-invalid-origin.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  invalid-origin:
    runs-on: ubuntu-latest
    steps:
      - name: Send one invalid-origin OPTIONS request
        shell: bash
        run: |
          set -u
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output "$body" \
            --dump-header "$headers" \
            --request OPTIONS \
            --header 'Origin: https://invalid-origin.example' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            --write-out '%{http_code}' \
            'https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026')"

          tr -d '\r' < "$headers" > headers-clean.txt
          allow_origin="$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2; exit}' headers-clean.txt)"
          allow_methods="$(awk -F': ' 'tolower($1)=="access-control-allow-methods" {print $2; exit}' headers-clean.txt)"
          server="$(awk -F': ' 'tolower($1)=="server" {print $2; exit}' headers-clean.txt)"
          ray="$(awk -F': ' 'tolower($1)=="cf-ray" {print $2; exit}' headers-clean.txt)"
          safe_code="$(python3 -c 'import json; d=json.load(open("'"$body"'")); print(d.get("code", ""))' 2>/dev/null || true)"

          result=FAIL
          if [ "$status" = '403' ] && [ -z "$allow_origin" ]; then
            result=PASS
          fi

          {
            echo '<!-- staging-invalid-origin-test -->'
            echo '### Staging invalid-Origin OPTIONS'
            echo
            echo "- Result: **${result}**"
            echo "- HTTP status: \`${status}\`"
            echo "- Server: \`${server:-missing}\`"
            echo "- CF-Ray: \`${ray:-missing}\`"
            echo "- Access-Control-Allow-Origin: \`${allow_origin:-missing}\`"
            echo "- Access-Control-Allow-Methods: \`${allow_methods:-missing}\`"
            echo "- Safe error code: \`${safe_code:-none}\`"
          } > result.md

          cat result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post result to PR #176
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 176 --body-file result.md
