name: PR 228 tattooai production inspection

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr228-tattooai-production-inspection
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect tattooai production boundary
    if: >-
      github.event.pull_request.number == 228 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/production-booking-host'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TATTOOAI_URL: https://tattooai.vvetrov41.workers.dev/

    steps:
      - name: Verify read credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --short)"

      - name: Read deployed tattooai script and report safe fingerprint only
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/tattooai"
          curl --fail-with-body --silent --show-error "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/tattooai-deployed.bin

          echo "DEPLOYED_SCRIPT_SHA256=$(sha256sum /tmp/tattooai-deployed.bin | awk '{print $1}')"
          SCRIPT=/tmp/tattooai-deployed.bin node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.env.SCRIPT).toString('latin1');
          const markers = [
            'handleEnquiryIntake',
            'create_trusted_enquiry_intake',
            'create_public_enquiry_for_source',
            'BOOKING_SOURCE_KEY',
            'BOOKING_FORM_VERSION',
            'SUPABASE_SECRET_KEY',
            'SUPABASE_URL',
            'origin_not_allowed',
            'multipart_required',
            'vladimir-booking-host',
            'production-booking-routing',
            'TELEGRAM_BOT_TOKEN',
          ];
          for (const marker of markers) {
            console.log(`DEPLOYED_HAS_${marker.replace(/[^A-Za-z0-9]+/g, '_').toUpperCase()}=${text.includes(marker)}`);
          }
          console.log(`DEPLOYED_SCRIPT_BYTES=${fs.statSync(process.env.SCRIPT).size}`);
          NODE

      - name: Read safe binding names and types
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/tattooai/settings"
          settings="$(curl --fail-with-body --silent --show-error "$api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          SETTINGS="$settings" node <<'NODE'
          const payload = JSON.parse(process.env.SETTINGS || '{}');
          if (!payload.success || !payload.result) throw new Error('Could not read tattooai settings');
          const bindings = Array.isArray(payload.result.bindings) ? payload.result.bindings : [];
          console.log('DEPLOYED_BINDING_NAMES_TYPES=' + JSON.stringify(bindings.map((x) => ({name:x?.name,type:x?.type}))));
          NODE

      - name: Probe CORS headers for existing and new booking origins
        shell: bash
        run: |
          set -euo pipefail
          for origin in 'https://vishartattoo.com' 'https://booking.vishartattoo.com' 'https://booking.vishartattoo.com.evil.example'; do
            safe="$(echo "$origin" | tr -c 'A-Za-z0-9' '_')"
            status="$(curl --silent --show-error --dump-header "/tmp/${safe}.headers" --output /dev/null --write-out '%{http_code}' --max-time 15 \
              -X OPTIONS "$TATTOOAI_URL" \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST')"
            allow="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "/tmp/${safe}.headers")"
            echo "CORS_ORIGIN=$origin HTTP=$status ALLOW_ORIGIN=${allow:-<absent>}"
          done

      - name: Send non-persisting malformed multipart probes
        shell: bash
        run: |
          set -euo pipefail
          for origin in 'https://vishartattoo.com' 'https://booking.vishartattoo.com' 'https://booking.vishartattoo.com.evil.example'; do
            safe="$(echo "$origin" | tr -c 'A-Za-z0-9' '_')"
            status="$(curl --silent --show-error --output "/tmp/${safe}.body" --write-out '%{http_code}' --max-time 15 \
              -X POST "$TATTOOAI_URL" \
              -H "Origin: $origin" \
              -F 'inspection_probe=1')"
            summary="$(head -c 300 "/tmp/${safe}.body" | tr '\n' ' ' | tr '\r' ' ')"
            echo "MALFORMED_ORIGIN=$origin HTTP=$status BODY=$summary"
          done

      - name: Inspection summary
        if: always()
        shell: bash
        run: |
          {
            echo '### tattooai production inspection'
            echo
            echo "- PR head: \`$EXPECTED_HEAD_SHA\`"
            echo '- Cloudflare operations: GET plus public HTTP probes only'
            echo '- Probe body: intentionally incomplete multipart; cannot pass booking validation'
            echo '- Production mutations: none'
            echo '- Supabase operations: none'
          } >> "$GITHUB_STEP_SUMMARY"
