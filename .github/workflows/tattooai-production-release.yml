name: TattooAI production release

on:
  push:
    branches:
      - 'release/private-crm-rc*-tattooai-worker'

permissions:
  actions: read
  contents: read

concurrency:
  group: tattooai-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable canonical release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in release/private-crm-rc*-tattooai-worker) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/agent/platform-telegram-self-service | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs[] | {name,status,conclusion,head_sha}' | jq -s . > "$RUNNER_TEMP/tattooai-ci.json"
          for workflow in 'Static Validation' 'CRM and booking validation'; do
            jq -e --arg name "$workflow" --arg sha "$GITHUB_SHA" 'any(.[]; .name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/tattooai-ci.json" >/dev/null
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate code and no standalone TattooAI cron
        run: |
          npm audit --audit-level=moderate
          npm run test:worker
          npm run test:enquiry-ai
          node scripts/test-public-booking-slugs.mjs
          npm run check:worker-bundle
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.toml', 'utf8').replace(/^\s*#.*$/gm, '');
          if (/^\s*\[triggers\]\s*$/m.test(text) || /^\s*crons\s*=/m.test(text)) throw new Error('TattooAI must not own a standalone Cron Trigger');
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crm-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-verify immutable target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/agent/platform-telegram-self-service | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
          grep -Fxq 'name = "tattooai"' wrangler.toml
          grep -Fxq 'main = "workers/tattooai-entry.js"' wrangler.toml
          ! grep -Eq '^\s*\[triggers\]\s*$|^\s*crons\s*=' wrangler.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Snapshot live state
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tattooai"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/settings" > "$RUNNER_TEMP/tattooai-settings-before.json"
          jq -e '.success == true and any(.result.bindings[]?; .name == "AI" and .type == "ai")' "$RUNNER_TEMP/tattooai-settings-before.json" >/dev/null
      - name: Deploy exact code snapshot
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CRM_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy --config wrangler.toml --env="" --strict --keep-vars --tag ${{ github.sha }}
      - name: Remove legacy standalone TattooAI schedules
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tattooai/schedules"
          curl -fsS -X PUT "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '[]' > "$RUNNER_TEMP/tattooai-schedules-write.json"
          jq -e '.success == true' "$RUNNER_TEMP/tattooai-schedules-write.json" >/dev/null
      - name: Read back exact production state
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tattooai"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl -fsS "${auth[@]}" "$api/deployments" > "$RUNNER_TEMP/tattooai-after.json"
          version="$(jq -r 'if (.result|type)=="array" then .result[0].versions[0].version_id else .result.deployments[0].versions[0].version_id end' "$RUNNER_TEMP/tattooai-after.json")"
          curl -fsS "${auth[@]}" "$api/versions/$version" | jq -e --arg sha "$GITHUB_SHA" '.success == true and .result.annotations["workers/tag"] == $sha' >/dev/null
          curl -fsS "${auth[@]}" "$api/settings" > "$RUNNER_TEMP/tattooai-settings-after.json"
          curl -fsS "${auth[@]}" "$api/schedules" > "$RUNNER_TEMP/tattooai-schedules-after.json"
          jq -e '.success == true and any(.result.bindings[]?; .name == "AI" and .type == "ai") and any(.result.bindings[]?; .name == "CRM_AI_IMAGES_ENABLED" and .text == "false")' "$RUNNER_TEMP/tattooai-settings-after.json" >/dev/null
          jq -e '.success == true and ((if (.result|type)=="array" then .result else .result.schedules end) | length == 0)' "$RUNNER_TEMP/tattooai-schedules-after.json" >/dev/null
          echo "TattooAI exact source $GITHUB_SHA is active with zero standalone schedules."
      - name: Read back live HTTP boundary without persistence
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://tattooai.vvetrov41.workers.dev/'
          test "$(curl -sS -o /tmp/tattooai-get.txt -w '%{http_code}' "$endpoint")" = '405'
          grep -Fq 'Use POST request' /tmp/tattooai-get.txt
          test "$(curl -sS -o /tmp/tattooai-json.txt -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' --data '{"type":"tattoo-enquiry"}')" = '415'
          grep -Fq 'multipart_required' /tmp/tattooai-json.txt
