name: TattooAI production release

on:
  push:
    branches:
      - 'release/tattooai-production-*'

permissions:
  contents: read

concurrency:
  group: tattooai-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable release snapshot and lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$GITHUB_SHA"
          git fetch origin agent/platform-telegram-self-service --no-tags
          git merge-base --is-ancestor origin/agent/platform-telegram-self-service "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Worker bundle and booking boundaries
        run: |
          npm audit --audit-level=moderate
          npm run test:worker
          node scripts/test-public-booking-slugs.mjs
          npm run check:worker-bundle

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout exact release snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-verify immutable release snapshot and target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$GITHUB_SHA"
          test "$(sed -n 's/^name = "\([^"]*\)"/\1/p' wrangler.toml | head -n1)" = "tattooai"
          grep -Fxq 'main = "workers/tattooai-entry.js"' wrangler.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked deployment tooling
        run: npm ci

      - name: Deploy exact tattooai Worker snapshot
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          command: deploy --env="" --strict --keep-vars

      - name: Read back live Worker boundary
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://tattooai.vvetrov41.workers.dev/'

          get_status="$(curl -sS -o /tmp/tattooai-get.txt -w '%{http_code}' "$endpoint")"
          test "$get_status" = '405'
          grep -Fq 'Use POST request' /tmp/tattooai-get.txt

          post_status="$(curl -sS -o /tmp/tattooai-json.txt -w '%{http_code}' \
            -X POST "$endpoint" \
            -H 'content-type: application/json' \
            --data '{"type":"tattoo-enquiry"}')"
          test "$post_status" = '415'
          grep -Fq 'multipart_required' /tmp/tattooai-json.txt

          # Vladimir's personal form talks directly to the Worker root. This
          # incomplete multipart request must resolve the trusted production
          # source and then fail at field validation, before any persistence.
          vladimir_probe_id="$(cat /proc/sys/kernel/random/uuid)"
          vladimir_probe_status="$(curl -sS -o /tmp/tattooai-vladimir-probe.json -w '%{http_code}' \
            -X POST "$endpoint" \
            -H 'Origin: https://vishartattoo.com' \
            -F "idempotencyKey=${vladimir_probe_id}" \
            -F 'name=Production route probe')"
          test "$vladimir_probe_status" = '400'
          grep -Fq 'missing_required_field' /tmp/tattooai-vladimir-probe.json

          # Mirror the fields that Kristina's live browser form actually sends.
          # The same-origin /api/booking adapter must add its trusted routing,
          # idempotency and privacy metadata. With all text fields valid but no
          # image attached, the shared Worker must reach file validation and
          # return invalid_file_count. That stage is still before persistence,
          # so this proves the live form contract without creating customer data.
          kristina_probe_status="$(curl -sS -o /tmp/tattooai-kristina-probe.json -w '%{http_code}' \
            -X POST 'https://www.kristinavishar.com/api/booking' \
            -H 'Origin: https://www.kristinavishar.com' \
            -H 'Accept: application/json' \
            -F 'name=Production route probe' \
            -F 'email=route-probe@example.invalid' \
            -F 'phone=' \
            -F 'instagram=' \
            -F 'preferredReply=Email' \
            -F 'travellingFrom=London' \
            -F 'projectType=Custom colour' \
            -F 'placement=Forearm' \
            -F 'size=10 cm' \
            -F 'coverUp=No' \
            -F 'timing=Flexible' \
            -F 'discoverySource=google' \
            -F 'discoverySourceDetail=' \
            -F 'idea=Production route contract probe' \
            -F 'website=' \
            -F 'consent=yes')"
          test "$kristina_probe_status" = '400'
          grep -Fq 'invalid_file_count' /tmp/tattooai-kristina-probe.json

          malformed_status="$(curl -sS -o /tmp/tattooai-forms-malformed.html -w '%{http_code}' \
            "${endpoint}forms/not-a-uuid")"
          test "$malformed_status" = '404'
          grep -Fq 'Booking form unavailable' /tmp/tattooai-forms-malformed.html
          if grep -Fq 'Use POST request' /tmp/tattooai-forms-malformed.html; then
            echo 'The hosted form namespace still reaches the POST-only intake boundary.' >&2
            exit 1
          fi

          unknown_status="$(curl -sS -o /tmp/tattooai-forms-unknown.html -w '%{http_code}' \
            "${endpoint}forms/00000000-0000-4000-8000-000000000000")"
          test "$unknown_status" = '404'
          grep -Fq 'Booking form unavailable' /tmp/tattooai-forms-unknown.html

          # Database migration 0141 must already be live before this release.
          # These are read-only public-form probes and create no customer data.
          for slug in vladimir kristina; do
            status="$(curl -sS -o "/tmp/tattooai-book-${slug}.html" -w '%{http_code}' "${endpoint}book/${slug}")"
            test "$status" = '200'
            grep -Fq '<form' "/tmp/tattooai-book-${slug}.html"
          done
          unknown_slug_status="$(curl -sS -o /tmp/tattooai-book-unknown.html -w '%{http_code}' \
            "${endpoint}book/no-such-artist")"
          test "$unknown_slug_status" = '404'
          grep -Fq 'Booking form unavailable' /tmp/tattooai-book-unknown.html

          echo "Live tattooai boundary matches the canonical public booking Worker at $GITHUB_SHA"
