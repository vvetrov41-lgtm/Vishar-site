name: Monzo reconciliation recovery production operator

# Release-only operator for incident fix PR #329. It owns no production
# credentials. Production mutations remain in the canonical protected DB and
# Monzo workflows and run strictly DB first, Worker second.

on:
  push:
    branches:
      - release/private-crm-rc46-monzo-reconciliation-recovery

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: write

concurrency:
  group: monzo-reconciliation-recovery-production-operator-rc46
  cancel-in-progress: false

env:
  OPERATOR_PR: '0'
  PRODUCT_PR: '329'
  PRODUCT_HEAD_BRANCH: agent/monzo-reconciliation-route-recovery-v2
  PRODUCT_BASE_BRANCH: agent/gmail-crm-production-integration
  PRODUCT_BASE_SHA: 9b467d2c7701660681bc34a0cd6df708b2e1f96f
  OPERATOR_RELEASE_BRANCH: release/private-crm-rc46-monzo-reconciliation-recovery
  OPERATOR_BASE_BRANCH: agent/monzo-reconciliation-route-recovery-v2
  OPERATOR_WORKFLOW_PATH: .github/workflows/monzo-reconciliation-recovery-production-operator.yml
  DATABASE_WORKFLOW: deploy-private-production-database.yml

jobs:
  authorize:
    name: Authorize Monzo reconciliation recovery rollout
    if: >-
      github.actor == 'vvetrov41-lgtm' &&
      github.ref == 'refs/heads/release/private-crm-rc46-monzo-reconciliation-recovery' &&
      contains(github.event.head_commit.message, '[RUN_MONZO_RECONCILIATION_RECOVERY]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      approved_sha: ${{ github.sha }}
      product_sha: ${{ steps.lineage.outputs.product_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact release and product lineage
        id: lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --short)"
          release_tip="$(git ls-remote --heads origin "refs/heads/${OPERATOR_RELEASE_BRANCH}" | awk '{print $1}')"
          test "$release_tip" = "$APPROVED_SHA"

          operator="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${OPERATOR_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref] | @tsv')"
          IFS=$'\t' read -r os od om oh ohs ob <<< "$operator"
          test "$os" = open && test "$od" = true && test "$om" = false
          test "$oh" = "$OPERATOR_RELEASE_BRANCH" && test "$ohs" = "$APPROVED_SHA"
          test "$ob" = "$OPERATOR_BASE_BRANCH"

          product="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}" --jq '[.state, (.draft|tostring), (.merged|tostring), .head.ref, .head.sha, .base.ref, .base.sha] | @tsv')"
          IFS=$'\t' read -r ps pd pm ph product_sha pb pbs <<< "$product"
          test "$ps" = open && test "$pd" = true && test "$pm" = false
          test "$ph" = "$PRODUCT_HEAD_BRANCH"
          test "$pb" = "$PRODUCT_BASE_BRANCH" && test "$pbs" = "$PRODUCT_BASE_SHA"
          git cat-file -e "${product_sha}^{commit}"
          git merge-base --is-ancestor "$product_sha" "$APPROVED_SHA"

          mapfile -t release_delta < <(git diff --name-only "$product_sha" "$APPROVED_SHA")
          test "${#release_delta[@]}" -eq 1
          test "${release_delta[0]}" = "$OPERATOR_WORKFLOW_PATH"

          mapfile -t product_delta < <(git diff --name-only "$PRODUCT_BASE_SHA" "$product_sha")
          allowed=(
            package.json
            scripts/test-monzo-reconciliation-sync.mjs
            supabase/migrations/0060_monzo_reconciliation_route_recovery.sql
            supabase/tests/211_monzo_reconciliation_route_recovery.sql
            workers/lib/monzo-reconciliation-sync.js
            workers/lib/monzo-setup-flow.js
          )
          test "${#product_delta[@]}" -eq "${#allowed[@]}"
          for path in "${product_delta[@]}"; do
            ok=''
            for expected in "${allowed[@]}"; do
              if [ "$path" = "$expected" ]; then ok=yes; break; fi
            done
            test "$ok" = yes
          done

          test -f supabase/migrations/0059_gmail_production_integration.sql
          test -f supabase/migrations/0060_monzo_reconciliation_route_recovery.sql
          test ! -e supabase/migrations/0059_monzo_reconciliation_route_recovery.sql
          grep -Fxq 'MONZO_RECONCILIATION_ENABLED = "true"' wrangler.monzo-api.production.toml
          grep -Fq 'resolve_monzo_reconciliation_owner' supabase/migrations/0060_monzo_reconciliation_route_recovery.sql
          grep -Fq 'Sync recent transfers' workers/lib/monzo-setup-flow.js
          grep -Fq "MONZO_RECONCILIATION_ENABLED !== 'true'" workers/lib/monzo-reconciliation-sync.js
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"

      - name: Require green normal CI on this exact release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            checks="$(mktemp)"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${APPROVED_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name,.status,(.conclusion // "none"),.started_at] | @tsv' > "$checks"
            waiting=''; failed=''
            while IFS= read -r required; do
              latest="$(awk -F'\t' -v n="$required" '$1==n {print $4"\t"$2"\t"$3}' "$checks" | sort -r | head -1)"
              if [ -z "$latest" ]; then waiting="${waiting}${required}:absent;"; continue; fi
              status="$(printf '%s' "$latest" | cut -f2)"
              conclusion="$(printf '%s' "$latest" | cut -f3)"
              if [ "$status" != completed ]; then waiting="${waiting}${required}:${status};"
              elif [ "$conclusion" != success ]; then failed="${failed}${required}:${conclusion};"; fi
            done <<'REQUIRED'
          static-validation
          Private CRM
          Supabase migrations and pgTAP
          Public site and Worker
          REQUIRED
            rm -f "$checks"
            test -z "$failed" || { echo "Exact-head CI failed: $failed" >&2; exit 1; }
            if [ -z "$waiting" ]; then exit 0; fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head CI.' >&2
          exit 1

      - name: Authorization summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Monzo reconciliation recovery operator'
            echo "- Release SHA: \`${GITHUB_SHA}\`"
            echo '- Production before protected approvals: unchanged'
            echo '- Ordered scope: database migration 0060, then Monzo Worker only'
          } >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Dispatch and verify production reconciliation DB fix
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Dispatch canonical production database workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg ref "$OPERATOR_RELEASE_BRANCH" --arg sha "$APPROVED_SHA" \
            '{ref:$ref,inputs:{approved_sha:$sha,deploy:"true",approval_phrase:"DEPLOY_PRIVATE_CRM_DATABASE"}}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${DATABASE_WORKFLOW}/dispatches" --input -
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Wait for canonical database workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.approved_sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9600)); run_id=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DATABASE_WORKFLOW}/runs?branch=${OPERATOR_RELEASE_BRANCH}&event=workflow_dispatch&per_page=20" \
              | jq -r --arg sha "$APPROVED_SHA" --arg started "$STARTED_AT" '[.workflow_runs[] | select(.head_sha==$sha and .created_at >= $started)] | sort_by(.created_at) | reverse | .[0].id // empty')"
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"
          echo "Database workflow run: $run_id"
          while [ "$SECONDS" -lt "$deadline" ]; do
            row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status,(.conclusion // "none")] | @tsv')"
            status="$(printf '%s' "$row" | cut -f1)"; conclusion="$(printf '%s' "$row" | cut -f2)"
            if [ "$status" = completed ]; then test "$conclusion" = success; exit 0; fi
            sleep 15
          done
          exit 1

  monzo:
    name: Deploy recovered Monzo reconciliation Worker
    needs: [authorize, database]
    uses: ./.github/workflows/deploy-private-production-monzo.yml
    with:
      approved_sha: ${{ needs.authorize.outputs.approved_sha }}
      deploy: true
      approval_phrase: DEPLOY_PRIVATE_CRM_MONZO_ONLY
