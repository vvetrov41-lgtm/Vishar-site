name: Diagnose staging intake E2E

on:
  push:
    branches:
      - claude/vishar-crm-booking-infra-c188bx
    paths:
      - .github/workflows/diagnose-staging-intake.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diagnose-staging-intake-e2e
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Send one allowed-origin OPTIONS request
        shell: bash
        run: |
          set -u
          headers="$(mktemp)"
          body="$(mktemp)"

          status="$({
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "$body" \
              --dump-header "$headers" \
              --request OPTIONS \
              --header 'Origin: https://vishar-booking-staging.pages.dev' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --write-out '%{http_code}' \
              'https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026'
          } 2>options-curl-error.txt)"
          curl_exit=$?

          tr -d '\r' < "$headers" > options-headers-clean.txt
          allow_origin="$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2; exit}' options-headers-clean.txt)"
          allow_methods="$(awk -F': ' 'tolower($1)=="access-control-allow-methods" {print $2; exit}' options-headers-clean.txt)"
          allow_headers="$(awk -F': ' 'tolower($1)=="access-control-allow-headers" {print $2; exit}' options-headers-clean.txt)"
          server="$(awk -F': ' 'tolower($1)=="server" {print $2; exit}' options-headers-clean.txt)"
          ray="$(awk -F': ' 'tolower($1)=="cf-ray" {print $2; exit}' options-headers-clean.txt)"

          result=FAIL
          if [ "$curl_exit" -eq 0 ] \
            && [ "$status" -ge 200 ] 2>/dev/null \
            && [ "$status" -lt 300 ] 2>/dev/null \
            && [ "$allow_origin" = 'https://vishar-booking-staging.pages.dev' ] \
            && printf '%s' "$allow_methods" | grep -qi 'POST' \
            && printf '%s' "$allow_methods" | grep -qi 'OPTIONS' \
            && printf '%s' "$allow_headers" | grep -qi 'Content-Type'; then
            result=PASS
          fi

          {
            echo '<!-- staging-intake-options-diagnostic -->'
            echo '### Staging intake OPTIONS diagnostic'
            echo
            echo "- Result: **${result}**"
            echo "- curl exit: \`${curl_exit}\`"
            echo "- HTTP status: \`${status:-none}\`"
            echo "- Server: \`${server:-missing}\`"
            echo "- CF-Ray: \`${ray:-missing}\`"
            echo "- Access-Control-Allow-Origin: \`${allow_origin:-missing}\`"
            echo "- Access-Control-Allow-Methods: \`${allow_methods:-missing}\`"
            echo "- Access-Control-Allow-Headers: \`${allow_headers:-missing}\`"
            if [ -s options-curl-error.txt ]; then
              echo "- curl error: \`$(tr '\n' ' ' < options-curl-error.txt | sed 's/`//g' | cut -c1-300)\`"
            fi
          } > options-result.md

          cat options-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send one valid synthetic multipart POST
        shell: bash
        run: |
          set -u

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl4bZ8AAAAASUVORK5CYII=' \
            | base64 --decode > synthetic-reference.png

          headers="$(mktemp)"
          body="post-body.json"

          status="$({
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 45 \
              --output "$body" \
              --dump-header "$headers" \
              --request POST \
              --header 'Origin: https://vishar-booking-staging.pages.dev' \
              --form-string 'name=Synthetic E2E 2026-08-02' \
              --form-string 'email=vishar-staging-e2e-20260802@example.com' \
              --form-string 'phone=' \
              --form-string 'instagram=' \
              --form-string 'preferredReply=Email' \
              --form-string 'travellingFrom=Manchester' \
              --form-string 'projectType=Black and grey realism' \
              --form-string 'placement=Outer forearm' \
              --form-string 'size=20 cm' \
              --form-string 'coverUp=No' \
              --form-string 'timing=Synthetic staging test only' \
              --form-string 'idea=Synthetic authorised staging E2E test. This is not a real booking.' \
              --form-string 'website=' \
              --form-string 'idempotencyKey=11111111-2222-4333-8444-555555555555' \
              --form-string 'privacyAcknowledged=true' \
              --form-string 'privacyNoticeVersion=2026-07-29' \
              --form-string 'source=/booking/' \
              --form-string 'landingPage=https://vishar-booking-staging.pages.dev/booking/' \
              --form-string 'referrer=' \
              --form-string 'utmSource=hosted-e2e' \
              --form-string 'utmMedium=github-actions' \
              --form-string 'utmCampaign=pr-176-staging' \
              --form-string 'utmContent=' \
              --form-string 'utmTerm=' \
              --form-string 'elapsedMs=60000' \
              --form 'references=@synthetic-reference.png;type=image/png;filename=synthetic-reference.png' \
              --write-out '%{http_code}' \
              'https://intake-staging.vishartattoo.com/__vishar-staging-intake-2026'
          } 2>post-curl-error.txt)"
          curl_exit=$?

          tr -d '\r' < "$headers" > post-headers-clean.txt
          allow_origin="$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2; exit}' post-headers-clean.txt)"
          server="$(awk -F': ' 'tolower($1)=="server" {print $2; exit}' post-headers-clean.txt)"
          ray="$(awk -F': ' 'tolower($1)=="cf-ray" {print $2; exit}' post-headers-clean.txt)"

          post_ok="$(python3 -c 'import json; d=json.load(open("post-body.json")); print(str(d.get("ok", "")).lower())' 2>/dev/null || true)"
          reference="$(python3 -c 'import json; d=json.load(open("post-body.json")); print(d.get("reference", ""))' 2>/dev/null || true)"
          replayed="$(python3 -c 'import json; d=json.load(open("post-body.json")); print(str(d.get("replayed", False)).lower())' 2>/dev/null || true)"
          error_code="$(python3 -c 'import json; d=json.load(open("post-body.json")); print(d.get("code", ""))' 2>/dev/null || true)"

          result=FAIL
          if [ "$curl_exit" -eq 0 ] \
            && [ "$status" = '200' ] \
            && [ "$allow_origin" = 'https://vishar-booking-staging.pages.dev' ] \
            && [ "$post_ok" = 'true' ] \
            && [ -n "$reference" ]; then
            result=PASS
          fi

          {
            echo '<!-- staging-intake-post-diagnostic -->'
            echo '### Staging intake valid multipart POST'
            echo
            echo "- Result: **${result}**"
            echo "- curl exit: \`${curl_exit}\`"
            echo "- HTTP status: \`${status:-none}\`"
            echo "- Server: \`${server:-missing}\`"
            echo "- CF-Ray: \`${ray:-missing}\`"
            echo "- Access-Control-Allow-Origin: \`${allow_origin:-missing}\`"
            echo "- Response ok: \`${post_ok:-missing}\`"
            echo "- Reference: \`${reference:-missing}\`"
            echo "- Replayed: \`${replayed:-missing}\`"
            echo "- Safe error code: \`${error_code:-none}\`"
            if [ -s post-curl-error.txt ]; then
              echo "- curl error: \`$(tr '\n' ' ' < post-curl-error.txt | sed 's/`//g' | cut -c1-300)\`"
            fi
          } > post-result.md

          cat post-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post diagnostic results to PR #176
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 176 --body-file options-result.md
          gh pr comment 176 --body-file post-result.md
