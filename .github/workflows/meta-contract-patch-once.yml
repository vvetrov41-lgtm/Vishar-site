name: Meta contract patch once

on:
  push:
    branches:
      - agent/meta-capi-crm-conversions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact database test contracts
        run: python3 scripts/apply-meta-test-contract-patch.py

      - name: Commit contract updates if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/010_schema_constraints.sql supabase/tests/050_rls_roles.sql supabase/tests/100_booking_sources_integrations.sql
          git commit -m "test: align Meta database contracts"
          git push origin HEAD:agent/meta-capi-crm-conversions
