name = "vishar-whatsapp-webhook-production"
main = "workers/whatsapp-webhook-worker.js"
compatibility_date = "2026-05-25"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "whatsapp.vishartattoo.com", zone_name = "vishartattoo.com", custom_domain = true, enabled = true, previews_enabled = false }
]

# Public Meta callback Worker. The production Custom Domain must be
# pre-provisioned once outside the deploy workflow before activation. Keeping
# the exact route and route flags here lets `wrangler deploy --strict` verify
# that a release cannot widen, replace or silently delete that public surface.
#
# Cloudflare Access must not be placed in front of this Meta callback;
# authenticity is enforced by Meta's signed webhook contract plus the exact
# WABA + phone-number route mapping in the Worker. The Worker itself accepts
# only the exact /webhook path.

[vars]
VISHAR_ENVIRONMENT = "production"
SUPABASE_URL = "https://vfjexhfdbrjmuxfdvbdx.supabase.co"
WHATSAPP_VLADIMIR_ARTIST_ID = "a1111111-1111-4111-8111-111111111111"
WHATSAPP_KRISTINA_ARTIST_ID = "a2222222-2222-4222-8222-222222222222"

# Required encrypted secrets, intentionally absent from this tracked file:
#   SUPABASE_SECRET_KEY
#   WHATSAPP_WEBHOOK_VERIFY_TOKEN
#   ARTIST_WHATSAPP_<ROUTE_ENCODED>_HPRODUCTION (one or more)
#
# Each ARTIST_* binding is the same artist-scoped envelope used by outbound
# delivery and supplies that artist's phoneNumberId, wabaId and appSecret.
# Access tokens remain isolated inside their own artist binding. There is no
# global WhatsApp token, phone-number fallback or browser-selectable route.
